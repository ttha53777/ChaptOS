<script>
'use strict';
const paths={plus:'M12 5v14M5 12h14',doc:'M14 3H6a1 1 0 0 0-1 1v16h14V8l-5-5zM14 3v5h5M8 12h8M8 16h6',layers:'M8 3h11v14M5 7h10v14H5z',search:'M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zm5-1 5 5',arrow:'M5 12h14m-5-5 5 5-5 5',chevron:'m9 5 7 7-7 7',back:'m14 6-6 6 6 6M8 12h12',check:'m5 12 4 4L19 6',edit:'m4 16 11-11 4 4L8 20H4v-4zm9-9 4 4',copy:'M9 8h11v13H9zM15 8V3H4v13h5',home:'m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10',calendar:'M4 5h16v16H4zM4 10h16M8 3v4M16 3v4',chapter:'m9 4 7 7m-9-5 7-3 5 5-3 7-9-9zm5 7-8 8M12 21h9',people:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-3a7 7 0 0 1 14 0v3m1-17a4 4 0 0 1 0 8m2 3a5 5 0 0 1 3 5',folder:'M3 6h7l2 3h9v11H3V6z',wallet:'M3 5h16v15H3zM15 10h7v6h-7zM18 13h1',heart:'M12 21 3 12a5 5 0 0 1 9-5 5 5 0 0 1 9 5l-9 9',info:'M12 8h.01M12 11v6M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',pin:'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',req:'M9 11l2.5 2.5L16 9M7.5 3.5h9a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4z',star:'m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',flag:'M5 21V4h12l-2.5 4L17 12H5',updown:'m8 9 4-4 4 4M8 15l4 4 4-4',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'};
const icon=name=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[name]||paths.doc}"/></svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seeds=[
{id:'chapter',name:'Weekly chapter meeting',description:'The standing agenda, from roll call to adjournment.',category:'Meetings',updated:'Oct 5',by:'Jamie Sullivan',uses:14,body:'## Roll call\nDate: {{meeting_date}} · {{meeting_time}} · Location: {{location}}\nPresent / Absent / Excused:\n\n## Officer reports\nPresident · Treasurer · Secretary · Committee chairs\n\n## Old business\nReview action items from the previous meeting.\n\n## New business\nDiscussion items, motions, and votes.\n\n## Action items\n[ ] Task — owner — due date\n\n## Adjournment\nNext meeting / time adjourned:'},
{id:'exec',name:'Executive board check-in',description:'A little structure for the decisions that move us forward.',category:'Leadership',updated:'Oct 2',by:'Marcus Reyes',uses:6,body:'## Opening\n{{meeting_title}} · {{meeting_date}}\n\n## Officer updates\nWins, blockers, and support needed.\n\n## Decisions to make\nProposal / discussion / decision\n\n## Budget & priorities\n• Upcoming spending\n• Chapter priorities\n\n## Before we meet again\n[ ] Action — owner — due date'},
{id:'committee',name:'Committee working session',description:'Keep projects, people, and next steps on the same page.',category:'Committees',updated:'Sep 28',by:'Priya Nair',uses:3,body:'## Session details\n{{meeting_title}} · {{meeting_date}}\nLocation: {{location}}\n\n## What we’re working toward\nGoal for this session:\n\n## Project updates\nProgress / blockers / help needed\n\n## Working notes\nIdeas and decisions:\n\n## Next steps\n[ ] Task — owner — due date'},
{id:'townhall',name:'Chapter town hall',description:'Space for open questions and a clear record of answers.',category:'Meetings',updated:'Sep 24',by:'Jamie Sullivan',uses:1,body:'## Welcome\n{{meeting_title}} · {{meeting_date}}\n\n## Chapter updates\nAnnouncements and upcoming dates.\n\n## Open floor\nQuestion / discussion / response\n\n## Follow-ups\n[ ] Question to follow up — owner\n\n## Closing\nWhat we heard and what happens next.'}
];
// The fields a template may leave blank. Labels are what readers see; the {{key}} is what the copy fills from the meeting form.
const FIELDS={meeting_title:'Meeting title',meeting_date:'Date',meeting_time:'Time',location:'Location'};
const CATS=['Meetings','Leadership','Committees'];
const ME='Jamie Sullivan';
const storageKey='chaptos-paper-template-mock-v2';
let templates=structuredClone(seeds),meetings=[],defaultId='chapter',selected='chapter',filter='All',query='',editing=null,draft=null,editorMode='',toastTimer,lastDeleted=null;
try{const stored=JSON.parse(localStorage.getItem(storageKey)||'null');if(stored&&Array.isArray(stored.templates)&&stored.templates.every(t=>['id','name','description','category','body','updated'].every(k=>typeof t[k]==='string'))){templates=stored.templates;meetings=Array.isArray(stored.meetings)?stored.meetings:[];defaultId=templates.some(t=>t.id===stored.defaultId)?stored.defaultId:'';selected=templates[0]?.id||''}}catch{}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({templates,meetings,defaultId}));return true}catch{toast('Browser storage unavailable. Changes will last for this session.');return false}}
function toast(message,undo){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.innerHTML=esc(message)+(undo?'<button class="toast-undo" data-action="undo">Undo</button>':'');toastTimer=setTimeout(()=>{el.innerHTML='';lastDeleted=null},undo?7000:4200)}
const actions=onTemplates=>`<div class="actions">${onTemplates?'':`<button class="btn secondary" data-action="templates">${icon('layers')}Templates</button>`}<button class="btn" data-action="add">${icon('plus')}Add meeting</button></div>`;
function breadcrumbs(last){return `<div class="crumbs"><button data-action="chapter">Chapter</button>${icon('chevron')}${last==='Templates'||last==='Meetings'?`<span>${last}</span>`:`<button data-action="templates">Templates</button>${icon('chevron')}<span>${esc(last)}</span>`}<span class="prototype">INTERACTIVE MOCK</span></div>`}
const FIELD_RE=/\{\{\s*([\w-]+)\s*\}\}/g;
const sectionCount=body=>(body.match(/^## /gm)||[]).length;
const usesLabel=t=>t.uses?`Used for ${t.uses} meeting${t.uses===1?'':'s'}`:'Not used yet';
const unknownFields=body=>[...new Set([...body.matchAll(FIELD_RE)].map(m=>m[1]).filter(f=>!FIELDS[f]))];
const TONE={Meetings:'sky',Leadership:'lilac',Committees:'mint'};
const tone=t=>'k-'+(TONE[t.category]||'sky');
const heads=body=>[...body.matchAll(/^## (.*)$/gm)].map(m=>m[1].trim());
// What the next meeting (Mon Oct 12, the Add meeting defaults) would write into the blanks.
const sampleFor=t=>({meeting_title:t.name,meeting_date:'Mon, Oct 12',meeting_time:'7:30 – 9:00 PM',location:'Chapter room'});
const fieldsIn=body=>[...new Set([...body.matchAll(FIELD_RE)].map(m=>m[1]).filter(f=>FIELDS[f]))];
let view='blank';
const fieldChip=(f,vals)=>FIELDS[f]?(vals?`<mark class="fill" title="${esc(FIELDS[f])}, from the meeting form">${esc(vals[f])}</mark>`:`<span class="chip" title="Fills in from the meeting form">${esc(FIELDS[f])}</span>`):`<span class="chip bad" title="Not a field the meeting form can fill">{{${esc(f)}}}</span>`;
function formatLine(line,vals){const check=line.match(/^\[( |x)\]\s?(.*)$/i),bullet=line.match(/^[•-]\s(.*)$/);const html=esc(check?check[2]:bullet?bullet[1]:line).replace(FIELD_RE,(_,f)=>fieldChip(f,vals));if(check)return `<div class="ln check-line"><span class="box ${check[1]===' '?'':'on'}"></span><span>${html}</span></div>`;if(bullet)return `<div class="ln bullet-line"><span>${html}</span></div>`;return `<div class="ln${line.trim()?'':' gap'}">${html}</div>`}
// The pad: one ruled line per row, sections numbered down the red margin.
function formatBody(body,vals){const sections=body.split(/(?=^## )/m).filter(s=>s.trim());if(!sections.length)return '<p class="ln muted">Nothing written yet. Start with a heading — <b>## Roll call</b>, say.</p>';let n=0;return sections.map(section=>{const lines=section.trim().split('\n');const heading=lines[0].startsWith('## ')?lines.shift().slice(3):'';const rest=lines.join('\n').trim();return `<section class="ps">${heading?`<h3><span class="n">${String(++n).padStart(2,'0')}</span>${esc(heading)}</h3>`:''}${rest?rest.split('\n').map(l=>formatLine(l,vals)).join(''):''}</section>`}).join('')}
function sheetMarkup(t){const h=heads(t.body),on=t.id===selected,rows=h.slice(0,4).map((x,i)=>`<span><i>${i+1}</i>${esc(x)}</span>`);rows.push(h.length>4?`<span class="more">+ ${h.length-4} more</span>`:'<span></span>');while(rows.length<5)rows.push('<span></span>');return `<button class="sheet ${tone(t)} ${on?'on':''}" aria-pressed="${on}" data-select="${esc(t.id)}"><span class="tape" aria-hidden="true"></span><span class="sh-head"><span class="sh-cat">${esc(t.category)}</span>${t.id===defaultId?`<span class="star" title="New meetings start from this">${icon('star')}Default</span>`:''}</span><strong class="sh-name">${esc(t.name)}</strong><span class="sh-lines" aria-hidden="true">${rows.join('')}</span><span class="sh-foot"><span>${h.length} section${h.length===1?'':'s'}</span><span>${t.uses?`used ${t.uses}×`:'not used yet'}</span></span></button>`}
const kick=(label,back,where)=>`<div class="kick"><button class="kpill" data-action="${where}">${icon('back')}${back}</button><span class="lbl" id="kick-lbl">${label}</span></div>`;
function render(){editing=null;draft=null;editorMode='';document.title=(location.hash==='#chapter'?'Chapter meetings':'Chapter templates')+' · Paper';if(location.hash==='#chapter'){renderChapter();return}const def=templates.find(t=>t.id===defaultId),n=templates.length;const digest=!n?'The drawer is empty. Write your standing agenda once, and every meeting can start from it.':`<b>${n} template${n===1?'':'s'}</b> in the drawer. `+(def?`New meetings start from <b>${esc(def.name)}</b>${def.uses?` — used ${def.uses} time${def.uses===1?'':'s'} so far`:''}.`:'New meetings start blank — make one the default to save the minute-taker some typing.');
document.querySelector('#main').innerHTML=`<span class="mock-tag">INTERACTIVE MOCK</span><div class="page"><header class="brief"><div>${kick('Agenda templates','Meetings','chapter')}<h1>Start every meeting<br><em>on the same page.</em></h1><p class="digest"><span class="dg">✦ DIGEST</span><span>${digest}</span></p></div><div class="acts"><button class="btn" data-action="new">${icon('plus')}New template</button><button class="btn ghost" data-action="add">${icon('calendar')}Add meeting</button></div></header>
<div class="sec"><h2>The drawer</h2><span class="rule"></span><span class="cnt">Pick one to read it</span></div><div class="tools"><label class="find">${icon('search')}<input id="search" aria-label="Search templates" placeholder="Find a template, or a word inside one…" value="${esc(query)}"></label><div class="tabs" role="group" aria-label="Filter by category">${['All',...CATS].map(c=>`<button class="tab ${c==='All'?'':'k-'+TONE[c]} ${filter===c?'on':''}" aria-pressed="${filter===c}" data-filter="${c}">${c==='All'?'':'<span class="sw"></span>'}${c}<span class="n">${c==='All'?n:templates.filter(t=>t.category===c).length}</span></button>`).join('')}</div></div><div class="shelf" id="template-list"></div>
<div class="sec" id="desk-head"><h2>On the desk</h2><span class="rule"></span><span class="cnt">The original stays put — using it makes a copy</span></div><section id="preview" aria-label="Template preview"></section></div>`;renderList();renderPreview()}
function renderList(){const q=query.trim().toLowerCase();const matches=templates.filter(t=>(filter==='All'||t.category===filter)&&(t.name+' '+t.description+' '+t.body).toLowerCase().includes(q));document.querySelector('#template-list').innerHTML=(matches.length?matches.map(sheetMarkup).join(''):templates.length?`<div class="shelf-empty"><span>Nothing in ${filter==='All'?'the drawer':esc(filter)} mentions “${esc(query)}”.</span><button class="link-btn" data-action="clear-find">Clear the search</button></div>`:'')+`<button class="sheet blank" data-action="new"><span class="plus">${icon('plus')}</span><strong>Blank sheet</strong><small>Write a new template</small></button>`}
function renderPreview(){const box=document.querySelector('#preview');if(!templates.some(t=>t.id===selected))selected=templates[0]?.id||'';const t=templates.find(t=>t.id===selected);if(!t){box.innerHTML=`<div class="desk-empty"><h3>Nothing on the desk.</h3><p>Write your chapter’s standing agenda once — roll call to adjournment — and every new meeting can start from it.</p><button class="btn" data-action="new">${icon('plus')}Write the first one</button></div>`;return}
const isDef=t.id===defaultId,def=templates.find(x=>x.id===defaultId),s=sampleFor(t),used=fieldsIn(t.body),secs=heads(t.body).length;
box.innerHTML=`<div class="desk ${tone(t)}"><div class="desk-main"><article class="pad"><header class="pad-head"><div class="pad-kick"><span class="lbl">${esc(t.category)} · template</span><div class="seg2" role="group" aria-label="Show the blanks or a filled-in copy"><button data-view="blank" aria-pressed="${view==='blank'}">With blanks</button><button data-view="filled" aria-pressed="${view==='filled'}">Filled for Oct 12</button></div></div><h2>${esc(t.name)}</h2><p class="desc">${esc(t.description)}</p></header><div class="pad-body">${formatBody(t.body,view==='filled'?s:null)}</div></article></div>
<aside class="margin" aria-label="About this template"><div class="use-card"><button class="btn" data-use="${esc(t.id)}">Use for a new meeting${icon('arrow')}</button><p>Copies this agenda into the meeting’s notes${used.length?', with the blanks filled in from the form':''}. The original stays as it is.</p></div>
<div class="note-stuck ${isDef?'on':''}">${isDef?`<h4>${icon('star')}New meetings start here.</h4><p>Add meeting picks this agenda for you. Anyone can still switch.</p><button class="link-btn" data-action="default">Start new meetings blank instead</button>`:`<h4>Make it the go-to?</h4><p>Add meeting will pick this agenda for you${def?` instead of <b>${esc(def.name)}</b>`:''}.</p><button class="btn small" data-action="default">${icon('star')}Make default</button>`}</div>
<div class="mcard"><div class="mh">Fills in by itself</div>${used.length?`<ul class="fills">${used.map(f=>`<li><span class="chip">${esc(FIELDS[f])}</span><span class="v">${esc(s[f])}</span></li>`).join('')}</ul><p class="mnote">Shown with the next meeting’s details. Each meeting brings its own.</p>`:'<p class="mnote" style="margin:0">No blanks — this one reads the same every time.</p>'}</div>
<div class="mcard"><div class="mh">On file</div><dl class="rec"><dt>Sections</dt><dd>${secs}</dd><dt>Used</dt><dd>${t.uses?`${t.uses} meeting${t.uses===1?'':'s'}`:'Not yet'}</dd><dt>Edited</dt><dd>${esc(t.updated)}${t.by?` <small>· ${esc(t.by)}</small>`:''}</dd><dt>Shared</dt><dd>All of Oozma Kappa</dd></dl><p class="mnote edit-note">${icon('info')}<span>Editing changes new meetings only.${t.uses?` The ${t.uses} that already used it keep their notes as written.`:''}</span></p><div class="mcard-acts"><button class="text-btn" data-action="edit">${icon('edit')}Edit</button><button class="text-btn" data-action="duplicate">${icon('copy')}Duplicate</button><button class="text-btn danger" data-action="delete">${icon('trash')}Delete</button></div></div></aside></div>`}
function navigate(where){if(draft&&isDraftDirty()&&!confirm('Discard your unsaved template changes?'))return;if(location.hash===where)render();else location.hash=where}
function isDraftDirty(){return JSON.stringify(draft)!==editing}
function startEditor(mode){const source=templates.find(t=>t.id===selected);const original=mode==='edit'?source:mode==='copy'?{...source,id:'template-'+crypto.randomUUID(),name:source.name+' (copy)',updated:'Just now',by:ME,uses:0}:{id:'template-'+crypto.randomUUID(),name:'',description:'',body:'',category:CATS.includes(filter)?filter:'Meetings',updated:'Just now',by:ME,uses:0};editorMode=mode;draft=structuredClone(original);editing=JSON.stringify(draft);const status=mode==='edit'?'Saved original':mode==='copy'?'Unsaved copy':'New draft';const lede=mode==='edit'?`You’re editing the <b>shared original</b>. Changes apply to new meetings only${draft.uses?` — the <b>${draft.uses} meeting${draft.uses===1?'':'s'}</b> that already used it keep their notes exactly as written`:''}.`:mode==='copy'?`A copy of <b>${esc(source.name)}</b>. It joins the drawer when you add it — the original isn’t touched.`:'A blank sheet. Write the agenda your chapter actually runs, top to bottom.';const impact=mode==='edit'&&draft.uses?`Past meetings aren’t changed. The ${draft.uses} meeting${draft.uses===1?'':'s'} that used this got their own copy, and keep it as written. Your edits show up from the next meeting on.`:'Changes apply the next time someone uses this template. Meetings that already used it keep their own copy.';
document.querySelector('#main').innerHTML=`<span class="mock-tag">INTERACTIVE MOCK</span><div class="page"><header class="brief"><div>${kick(status,'Templates','cancel-edit')}<h1>${mode==='new'?'Write it <em>once.</em>':'Make it <em>your own.</em>'}</h1><p class="digest"><span class="dg">✦ ${mode==='edit'?'EDITING':mode==='copy'?'COPY':'NEW'}</span><span>${lede}</span></p></div><div class="acts"><button class="btn quiet" data-action="cancel-edit">Cancel</button><button class="btn" data-action="save" title="Save (⌘S)">${icon('check')}${mode==='copy'?'Add to drawer':'Save template'}</button></div></header>
<div class="sec"><h2>On the desk</h2><span class="rule"></span><span class="cnt">⌘S saves</span></div><div class="desk editing-desk ${tone(draft)}" id="edit-desk"><div class="desk-main"><article class="pad"><header class="pad-head"><div class="pad-kick"><label class="lbl" for="template-name">Template name</label></div><input id="template-name" class="title-input" placeholder="Name it…" value="${esc(draft.name)}" maxlength="100"><label class="sr-only" for="template-description">Short description</label><input id="template-description" class="desc-input" placeholder="One line on when to reach for it" value="${esc(draft.description)}" maxlength="160"></header><div class="pad-tools"><div class="seg2" role="tablist" aria-label="Editor view"><button role="tab" data-tab="write" aria-selected="true" aria-pressed="true">${icon('edit')}Write</button><button role="tab" data-tab="preview" aria-selected="false" aria-pressed="false">${icon('eye')}Preview</button></div><button class="blk" data-block="## ">Heading</button><button class="blk" data-block="[ ] ">Checklist</button><button class="blk" data-block="• ">Bullet</button><small>## heading · [ ] checklist · • bullet</small></div><textarea id="template-body" class="pad-text" aria-label="Template content" placeholder="## Roll call&#10;Who’s here, who’s excused…&#10;&#10;## Officer reports">${esc(draft.body)}</textarea><div class="pad-body" id="editor-preview" hidden></div></article><p class="field-warning" id="field-warning" role="alert"></p></div>
<aside class="margin"><div class="mcard"><div class="mh">File under</div><div class="cats" role="radiogroup" aria-label="Category">${CATS.map(c=>`<label class="cat k-${TONE[c]}"><input type="radio" name="cat" value="${c}" ${draft.category===c?'checked':''}><span class="sw"></span>${c}</label>`).join('')}</div></div><div class="mcard"><div class="mh">Leave a blank</div><div class="ins">${Object.entries(FIELDS).map(([k,label])=>`<button class="chip" data-insert="{{${k}}}" title="Inserts {{${k}}}">+ ${label}</button>`).join('')}</div><p class="mnote">Drops in where you’re writing. Each meeting fills it from its own form.</p></div><div class="note-stuck"><h4>Write once. Pass it on.</h4><p style="margin-bottom:0">${impact}</p></div></aside></div></div>`;syncDraft();const name=document.querySelector('#template-name');name.focus();if(mode==='copy')name.select()}
function setEditorTab(tab){const area=document.querySelector('#template-body'),view=document.querySelector('#editor-preview');document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.setAttribute('aria-pressed',String(b.dataset.tab===tab))});document.querySelectorAll('[data-block]').forEach(b=>b.disabled=tab==='preview');area.hidden=tab==='preview';view.hidden=tab!=='preview';if(tab==='preview')view.innerHTML=formatBody(draft.body);else area.focus()}
function insertBlock(prefix){const area=document.querySelector('#template-body');if(area.hidden)setEditorTab('write');const caret=area.selectionStart,start=area.value.lastIndexOf('\n',caret-1)+1;if(!area.value.startsWith(prefix,start)){area.setRangeText(prefix,start,start,'preserve');area.setSelectionRange(caret+prefix.length,caret+prefix.length)}area.focus();syncDraft()}
function syncDraft(){if(!draft)return;draft.name=document.querySelector('#template-name').value;draft.description=document.querySelector('#template-description').value;draft.body=document.querySelector('#template-body').value;draft.category=document.querySelector('[name=cat]:checked')?.value||draft.category;document.querySelector('#edit-desk').className=`desk editing-desk ${tone(draft)}`;const dirty=isDraftDirty();document.querySelector('#kick-lbl').textContent=editorMode==='edit'?(dirty?'Unsaved changes':'Saved original'):editorMode==='copy'?'Unsaved copy':'New draft';const bad=unknownFields(draft.body);document.querySelector('#field-warning').innerHTML=bad.length?`${icon('info')}<span><b>${bad.map(f=>`{{${esc(f)}}}`).join(', ')}</b> ${bad.length===1?'isn’t a blank':'aren’t blanks'} the meeting form can fill. Use ${Object.values(FIELDS).join(', ')} from the margin.</span>`:''}
function saveTemplate(){syncDraft();if(!draft.name.trim()||!draft.body.trim()){toast('Add a template name and some content before saving.');document.querySelector(!draft.name.trim()?'#template-name':'#template-body').focus();return}if(unknownFields(draft.body).length){toast('Fix the highlighted field before saving — it would show up unfilled in every meeting.');setEditorTab('preview');document.querySelector('#editor-preview .chip.bad')?.scrollIntoView({block:'center'});return}draft.name=draft.name.trim();draft.description=draft.description.trim()||'A shared starting point for your chapter.';draft.updated='Just now';draft.by=ME;const index=templates.findIndex(t=>t.id===draft.id);if(index<0)templates.unshift(draft);else templates[index]=draft;const added=index<0;selected=draft.id;query='';filter='All';const saved=persist();render();if(saved)toast(added?'Added to the drawer. Ready for your next meeting.':'Template saved. Past meetings keep their notes as written.')}
function toggleDefault(){const t=templates.find(t=>t.id===selected);defaultId=defaultId===t.id?'':t.id;const saved=persist();render();if(saved)toast(defaultId?`New meetings will start from “${t.name}”.`:'New meetings will start blank.')}
function deleteTemplate(){const i=templates.findIndex(t=>t.id===selected),t=templates[i];if(!t||!confirm(`Delete “${t.name}”?\n\n${t.uses?`The ${t.uses} meeting${t.uses===1?'':'s'} that used it keep their notes.`:'No meetings have used it yet.'}`))return;templates.splice(i,1);lastDeleted={t,i,wasDefault:defaultId===t.id};if(defaultId===t.id)defaultId='';selected=(templates[i]||templates[i-1])?.id||'';const saved=persist();render();if(saved)toast(`Deleted “${t.name}”${lastDeleted.wasDefault?' — new meetings will start blank':''}.`,true)}
function undoDelete(){if(!lastDeleted)return;const{t,i,wasDefault}=lastDeleted;templates.splice(Math.min(i,templates.length),0,t);if(wasDefault)defaultId=t.id;selected=t.id;lastDeleted=null;persist();render();toast('Template restored.')}
function formatDate(value){return value?new Date(value+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'[Meeting date]'}
function formatTime(value){if(!value)return '[Time]';const[h,m]=value.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
// ── Add meeting: the real app's MeetingForm (title · when · where · required) plus an Agenda row.
const $=s=>document.querySelector(s);
let mt={tpl:'',titleTouched:false};
const toMin=v=>{const[h,m]=v.split(':').map(Number);return h*60+m};
const durLabel=m=>`${Math.floor(m/60)?Math.floor(m/60)+'h':''}${m%60?(Math.floor(m/60)?' ':'')+m%60+'m':''}`;
function meetingValues(){const allDay=$('#meeting-allday').checked,s=$('#meeting-time').value,e=$('#meeting-end').value;return{meeting_title:$('#meeting-title').value.trim(),meeting_date:$('#meeting-date').value?formatDate($('#meeting-date').value):'',meeting_time:allDay?'All day':s?formatTime(s)+(e?` – ${formatTime(e)}`:''):'',location:$('#meeting-location').value.trim()}}
const fillText=(body,v)=>body.replace(FIELD_RE,(m,k)=>k in FIELDS?(v[k]||`[${FIELDS[k]}]`):m);
const mtTemplate=()=>templates.find(t=>t.id===mt.tpl);
function syncTitle(){if(mt.titleTouched)return;const t=mtTemplate();$('#meeting-title').value=t?t.name:'Chapter meeting'}
function syncSchedule(){const allDay=$('#meeting-allday').checked,s=$('#meeting-time').value,e=$('#meeting-end').value;$('#time-pair').hidden=allDay;let txt;if(allDay)txt='<b>All day</b>';else if(!s)txt='Pick a start time';else if(!e)txt=`Starts <b>${formatTime(s)}</b> · no end time`;else{const m=(toMin(e)-toMin(s)+1440)%1440;txt=m?`<b>${durLabel(m)}</b>${toMin(e)<toMin(s)?' · ends next day':''}`:'End matches start'}$('#sched-dur').innerHTML=txt+(allDay?'':' · <span class="sched-zone" title="Change time zone">Central time</span>')}
function syncReq(){$('#req-sub').textContent=$('#meeting-required').checked?'Counts toward standing; excuses go to review.':'Optional: no roll is taken and it doesn’t touch anyone’s standing.'}
function renderTplSelect(){$('#tpl-select').innerHTML=templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}${t.id===defaultId?' ★ default':''}</option>`).join('')+'<option value="">Blank — start the notes empty</option>';$('#tpl-select').value=mt.tpl}
function renderAgenda(){const t=mtTemplate();$('#agenda-hint').textContent=t?`${t.description} ${sectionCount(t.body)} sections, copied into this meeting’s notes — the date, time and location fill in from above.`:'The notes start empty. Whoever takes minutes writes from scratch.'}
function pickTemplate(id){mt.tpl=id;syncTitle();renderAgenda()}
function closeMeeting(){$('#meeting-dialog').close()}
function openMeeting(id=defaultId){if(draft&&isDraftDirty()&&!confirm('Discard your unsaved template changes?'))return;$('#meeting-form').reset();mt={tpl:templates.some(t=>t.id===id)?id:'',titleTouched:false};
 // Mirrors the real addDefaults: the next open Monday, last meeting's time and room, required.
 $('#meeting-date').value='2026-10-12';$('#meeting-time').value='19:30';$('#meeting-end').value='21:00';$('#meeting-location').value='Chapter room';$('#meeting-required').checked=true;
 syncTitle();syncSchedule();syncReq();renderTplSelect();renderAgenda();$('#meeting-dialog').showModal();$('#meeting-dialog .cef-scroll').scrollTop=0;const title=$('#meeting-title');title.focus();title.select()}
function submitMeeting(){const title=$('#meeting-title');if(!title.value.trim()){title.focus();toast('Give the meeting a name.');return}if(!$('#meeting-date').value){$('#meeting-date').focus();return}const t=mtTemplate(),v=meetingValues();const notes=t?fillText(t.body,v):'';if(t)t.uses=(t.uses||0)+1;meetings.unshift({title:title.value.trim(),date:$('#meeting-date').value,time:v.meeting_time,location:v.location,required:$('#meeting-required').checked,template:t?t.name:'',notes});const saved=persist();$('#meeting-dialog').close();navigate('#chapter');if(saved)toast(`Meeting added for ${formatDate($('#meeting-date').value)} — it’s on the Timeline too.`)}
function renderChapter(){document.querySelector('#main').innerHTML=breadcrumbs('Meetings')+`<header class="hero"><div><div class="eyebrow">TUE · OCT 6 / CHAPTER MEETINGS</div><h1>The <span class="highlight" style="--mint:var(--sky)">minutes.</span></h1><p>A place for every meeting, and a record of what comes next.</p></div>${actions(false)}</header><div class="library-bar"><h2>On deck</h2><span class="count">Your next conversation</span></div><article class="meeting-card"><div class="calendar"><small>OCT</small><b>12</b></div><div><span class="tag" style="background:var(--sky)">Chapter meeting</span><h2>Weekly chapter meeting</h2><p>Monday · 7:30 PM · Chapter room</p><button class="btn secondary small" data-use="chapter">${icon('layers')}Plan a similar meeting</button></div></article>${meetings.length?`<div class="library-bar"><h2>Created in this mock</h2><span class="count">${meetings.length} meetings</span></div>`:''}${meetings.map((m,i)=>`<button class="meeting-row" style="width:100%;text-align:left" data-meeting="${i}"><small>${esc(formatDate(m.date))}</small><strong>${esc(m.title)}</strong><span>Open notes →</span></button>`).join('')}<div class="library-bar"><h2>Past meetings</h2><span class="count">Fall ’26</span></div><div class="meeting-row"><small>SEP 28</small><strong>Weekly chapter meeting</strong><span>Minutes filed</span></div><div class="meeting-row"><small>SEP 21</small><strong>Weekly chapter meeting</strong><span>Minutes filed</span></div>`}
// Delegation keeps each mock view small and supports keyboard-native controls.
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;if(el.dataset.select){selected=el.dataset.select;renderList();renderPreview();if(matchMedia('(max-width:820px)').matches)document.querySelector('#desk-head').scrollIntoView({block:'start'});return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.dataset.use){openMeeting(el.dataset.use);return}if(el.dataset.view){view=el.dataset.view;renderPreview();return}if(el.dataset.tab){setEditorTab(el.dataset.tab);return}if(el.dataset.block){insertBlock(el.dataset.block);return}if(el.dataset.insert!==undefined){const area=document.querySelector('#template-body');if(area.hidden)setEditorTab('write');area.setRangeText(el.dataset.insert,area.selectionStart,area.selectionEnd,'end');area.focus();syncDraft();return}if(el.dataset.meeting!==undefined){const m=meetings[+el.dataset.meeting];document.querySelector('#notes-heading').textContent=m.title;document.querySelector('#saved-notes').textContent=m.notes||'No notes yet.';document.querySelector('#notes-dialog').showModal();return}switch(el.dataset.action){case'templates':navigate('#templates');break;case'chapter':navigate('#chapter');break;case'new':startEditor('new');break;case'edit':startEditor('edit');break;case'duplicate':startEditor('copy');break;case'save':saveTemplate();break;case'cancel-edit':if(!isDraftDirty()||confirm('Discard your unsaved template changes?'))render();break;case'default':toggleDefault();break;case'delete':deleteTemplate();break;case'undo':undoDelete();break;case'clear-find':query='';render();document.querySelector('#search').focus();break;case'add':openMeeting();break;case'close-modal':closeMeeting();break;case'manage-templates':$('#meeting-dialog').close();navigate('#templates');break;case'close-notes':document.querySelector('#notes-dialog').close();break}});
document.addEventListener('input',event=>{const id=event.target.id;if(id==='search'){query=event.target.value;renderList()}if(['template-name','template-description','template-body'].includes(id))syncDraft();if(id==='meeting-title')mt.titleTouched=true;if(['meeting-date','meeting-time','meeting-end','meeting-location','meeting-allday'].includes(id))syncSchedule();if(id==='meeting-required')syncReq()});
document.addEventListener('change',event=>{if(event.target.name==='cat')syncDraft();if(event.target.id==='tpl-select')pickTemplate(event.target.value)});
document.addEventListener('keydown',event=>{if(draft&&(event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();saveTemplate()}if($('#meeting-dialog').open&&(event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();submitMeeting()}});
document.querySelector('#meeting-form').addEventListener('submit',event=>{event.preventDefault();submitMeeting()});
document.querySelector('#meeting-dialog').addEventListener('cancel',event=>{event.preventDefault();closeMeeting()});
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',event=>{if(draft&&isDraftDirty()){event.preventDefault();event.returnValue=''}});
document.querySelectorAll('[data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon)));
render();
</script>
</body>
