<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Centre Rewrite</title>
<!--
  /help, rewritten against the code as it stands on 2026-11-01.

  Same look as the shipped help centre (app/help/help.css on top of landing.css): cream paper,
  brown ink, pastel chips, 1.5px hairlines, hard pastel offset shadows. Same block vocabulary as
  app/help/content.ts (p / h / steps / list / note / table / where), so the ARTICLES array below
  can be ported into content.ts nearly verbatim.

  Every article carries:
    status  — new | rewritten | updated | kept
    review  — what changed vs the shipped article, and the files each claim was checked against.
  The MOCK bar (bottom left) toggles those review marks and opens the full change list, which
  also lists app bugs and stale copy found OUTSIDE the help centre while verifying.

  Routing is hash-based: #/ is the index, #/a/<slug> an article. Links to other public pages
  (/contact, /trust, /create) are inert in the mock.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --paper-2:#FBF5EA; --paper-3:#F4ECDD; --card:#FFFFFF;
  --ink:#26211B; --ink-2:#544A3F; --ink-3:#8A7F71;
  --line:#EBE1CF; --line-2:#DCD0B9;
  --peach:#FFD5C4; --peach-soft:#FFEDE5; --peach-ink:#C9542D;
  --sky:#CFE2FF;   --sky-soft:#EAF2FF;   --sky-ink:#2A66C7;
  --mint:#C7EFDA;  --mint-soft:#E6F8EF;  --mint-ink:#1B815B;
  --butter:#FFE5A0;--butter-soft:#FFF6DC;--butter-ink:#9C6B08;
  --lilac:#E1D8FF; --lilac-soft:#F1EDFF; --lilac-ink:#6244CC;
  --rose:#FFD6E6;  --rose-soft:#FFEDF4;  --rose-ink:#C23C77;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(38,33,27,.05), 0 3px 10px rgba(38,33,27,.045);
  --sh-2:0 1px 2px rgba(38,33,27,.05), 0 10px 26px -8px rgba(38,33,27,.14);
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --spring:cubic-bezier(.16,.9,.3,1.02);
  --wrap:1180px; --nav-h:64px;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:auto}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
ul,ol{list-style:none}
a{color:inherit}
h1,h2,h3,h4,h5{font-family:var(--display); font-weight:600; letter-spacing:-.02em; font-variation-settings:"opsz" 48}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 clamp(16px,4vw,40px)}

/* nav */
.nav{position:sticky; top:0; z-index:20; height:var(--nav-h); background:rgba(255,252,246,.92); backdrop-filter:blur(8px); border-bottom:1.5px solid var(--line)}
.nav .wrap{height:100%; display:flex; align-items:center; gap:24px}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:700; font-size:1.12rem; text-decoration:none}
.brand i{width:26px; height:26px; border-radius:8px; background:var(--ink); display:grid; place-items:center; color:var(--paper); font-style:normal; font-size:.8rem; box-shadow:2px 2px 0 var(--lilac)}
.nav nav{display:flex; gap:4px; margin-left:auto}
.nav nav a{padding:8px 13px; border-radius:var(--r-pill); font-size:.9rem; font-weight:500; color:var(--ink-2); text-decoration:none}
.nav nav a.on{background:var(--paper-2); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line)}

/* page head */
.hero{padding:clamp(40px,6vw,76px) 0 0}
.eyebrow{display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:var(--r-pill); font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:var(--mint-soft); border:1.5px solid var(--mint); color:var(--mint-ink)}
.hero h1{margin-top:18px; font-size:clamp(2.1rem,4.6vw,3.4rem); line-height:1.04; letter-spacing:-.035em; max-width:17ch; font-variation-settings:"opsz" 96}
.lede{margin-top:16px; max-width:62ch; font-size:1.08rem; line-height:1.6; color:var(--ink-2)}
.crumbs{display:flex; flex-wrap:wrap; gap:8px; font-size:.86rem; color:var(--ink-3)}
.crumbs a{color:var(--ink-3); text-decoration:none}
.crumbs a:hover{color:var(--ink); text-decoration:underline}
.crumbs a + a::before{content:'/'; margin-right:8px; color:var(--line-2)}

/* search */
.searchwrap{margin-top:clamp(28px,3.6vw,42px); max-width:680px}
.search{display:flex; align-items:center; gap:12px; padding:5px 6px 5px 18px; background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r-pill); box-shadow:4px 4px 0 var(--sky); transition:transform .18s var(--spring), box-shadow .18s var(--spring)}
.search:focus-within{transform:translate(-1.5px,-1.5px); box-shadow:6px 6px 0 var(--sky)}
.search svg{flex:none; color:var(--ink-3)}
.search input{flex:1; min-width:0; border:0; outline:0; background:transparent; padding:12px 0; font:inherit; font-size:1.02rem; color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search button{flex:none; border:1.5px solid var(--line); background:var(--paper-2); color:var(--ink-2); font:inherit; font-size:.83rem; font-weight:600; padding:8px 15px; border-radius:var(--r-pill); cursor:pointer}
.searchnote{margin-top:12px; padding-left:4px; font-size:.87rem; color:var(--ink-3)}

/* quick paths */
.paths{margin-top:clamp(36px,4.6vw,56px); display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.path{display:block; padding:22px; text-decoration:none; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); transition:transform .18s var(--spring), box-shadow .18s var(--spring), border-color .18s}
.path:hover{transform:translateY(-3px); border-color:var(--line-2); box-shadow:var(--sh-2)}
.path h4{margin-top:14px; font-size:1.08rem}
.path p{margin-top:7px; font-size:.9rem; line-height:1.5; color:var(--ink-2)}
.go{margin-top:14px; display:inline-flex; gap:7px; font-size:.85rem; font-weight:600}
.ic{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; flex:none; background:var(--g); border:1.5px solid var(--gb); color:var(--gi); font-size:1.05rem}

/* categories */
.cats{margin-top:clamp(48px,6vw,80px); padding-bottom:clamp(30px,4vw,56px); display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(30px,3.6vw,48px)}
.cat{min-width:0; scroll-margin-top:calc(var(--nav-h) + 24px)}
.cathead{display:flex; gap:14px; align-items:flex-start}
.cathead h3{font-size:1.28rem}
.cathead p{margin-top:6px; font-size:.9rem; line-height:1.5; color:var(--ink-3)}
.arts{margin-top:18px; display:grid; gap:2px}
.arts a{display:block; padding:11px 14px; border-radius:var(--r-md); text-decoration:none}
.arts a:hover{background:var(--paper-2)}
.arts .t{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:600; font-size:.96rem; letter-spacing:-.012em}
.arts .b{display:block; margin-top:3px; font-size:.86rem; line-height:1.45; color:var(--ink-3)}

/* results */
.results{margin-top:clamp(28px,3.6vw,40px); display:grid; gap:8px; max-width:820px; padding-bottom:48px}
.results a{display:block; padding:16px 18px; text-decoration:none; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-md); transition:border-color .16s, transform .16s var(--spring)}
.results a:hover{border-color:var(--ink); transform:translateX(3px)}
.rcat{font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink-3)}
.rt{display:flex; gap:8px; align-items:center; margin-top:6px; font-family:var(--display); font-weight:600; font-size:1.06rem}
.rb{display:block; margin-top:5px; font-size:.89rem; line-height:1.5; color:var(--ink-2)}
.empty{margin:32px 0 48px; max-width:560px; padding:28px; background:var(--paper-2); border:1.5px dashed var(--line-2); border-radius:var(--r-lg)}
.empty p{margin-top:10px; color:var(--ink-2)}

/* article */
.artwrap{padding:clamp(34px,4.6vw,56px) 0 clamp(40px,5vw,72px)}
.artgrid{display:grid; grid-template-columns:minmax(0,1fr) 268px; gap:clamp(34px,5vw,72px); align-items:start}
.body{max-width:70ch; min-width:0}
.body > *:first-child{margin-top:0 !important}
.body > h2{margin-top:42px; font-size:1.3rem; line-height:1.22}
.body > p{margin-top:16px; color:var(--ink-2); line-height:1.68}
.body b,.body strong{color:var(--ink); font-weight:600}
.body a{color:var(--sky-ink); text-decoration:underline; text-decoration-color:#BBD3F5; text-underline-offset:2.5px}
.body a.ext{color:var(--ink-2); text-decoration-style:dotted}
.body code{font-family:var(--mono); font-size:.86em; padding:1.5px 5px; background:var(--paper-3); border-radius:5px; color:var(--ink-2); overflow-wrap:anywhere}
.steps{margin-top:20px; display:grid; gap:14px; counter-reset:s}
.steps > li{position:relative; padding-left:38px; color:var(--ink-2); line-height:1.62}
.steps > li::before{counter-increment:s; content:counter(s); position:absolute; left:0; top:-1px; width:26px; height:26px; display:grid; place-items:center; font-family:var(--mono); font-size:.8rem; color:var(--ink-2); background:var(--paper-2); border:1.5px solid var(--line); border-radius:50%}
.list{margin-top:18px; display:grid; gap:11px}
.list > li{position:relative; padding-left:20px; color:var(--ink-2); line-height:1.62}
.list > li::before{content:''; position:absolute; left:0; top:.72em; width:10px; height:2px; border-radius:2px; background:var(--line-2)}
.list.check > li::before{content:'✓'; width:auto; height:auto; background:none; top:0; color:var(--mint-ink); font-weight:700}
.list.no > li::before{content:'✕'; width:auto; height:auto; background:none; top:0; color:var(--peach-ink); font-weight:700; font-size:.88em}
.note{margin-top:22px; padding:17px 19px; border-radius:var(--r-md); background:var(--n-bg,var(--sky-soft)); border:1.5px solid var(--n-bd,#CCDFFB)}
.note h5{font-family:var(--sans); font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--n-fg,var(--sky-ink)); margin-bottom:8px}
.note p{color:var(--ink-2); font-size:.93rem; line-height:1.6}
.note.warn{--n-bg:var(--butter-soft); --n-bd:#F4DFA6; --n-fg:var(--butter-ink)}
.note.good{--n-bg:var(--mint-soft); --n-bd:#BDE7D2; --n-fg:var(--mint-ink)}
.note.flag{--n-bg:var(--peach-soft); --n-bd:#F8D2C2; --n-fg:var(--peach-ink)}
.tw{margin-top:20px; overflow-x:auto; border:1.5px solid var(--line); border-radius:var(--r-md); background:var(--card)}
table{width:100%; border-collapse:collapse; font-size:.9rem; min-width:460px}
th,td{text-align:left; padding:11px 14px; vertical-align:top; line-height:1.55; border-bottom:1px solid var(--line)}
thead th{background:var(--paper-2); font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; white-space:nowrap}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
tbody th{font-weight:600; color:var(--ink); width:28%; min-width:120px}
td{color:var(--ink-2)}
.where{margin-top:20px; padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; background:var(--paper-2); border:1.5px solid var(--line); border-radius:var(--r-md)}
.where-l{font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink-3)}
.where-p{display:flex; flex-wrap:wrap; gap:3px 9px; font-family:var(--mono); font-size:.86rem; color:var(--ink-2)}
.where-p > span + span::before{content:'→'; margin-right:9px; color:var(--line-2)}
.where-p .last{color:var(--ink); font-weight:500}

.rail{position:sticky; top:calc(var(--nav-h) + 24px)}
.railcat{display:flex; align-items:center; gap:11px; font-size:.86rem; font-weight:600; color:var(--ink-2)}
.railcat .ic{width:30px; height:30px; border-radius:10px; font-size:.9rem}
.rail h5{margin:26px 0 10px; font-family:var(--sans); font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.railnav{display:grid; gap:1px}
.railnav a{display:flex; gap:7px; align-items:center; padding:8px 11px; border-radius:var(--r-sm); text-decoration:none; color:var(--ink-2); font-size:.885rem; line-height:1.4}
.railnav a:hover{background:var(--paper-2); color:var(--ink)}
.railask{margin-top:24px; padding:16px; display:block; text-decoration:none; background:var(--lilac-soft); border:1.5px solid #DCD2FB; border-radius:var(--r-md)}
.railask b{display:block; font-size:.9rem}
.railask span{font-size:.83rem; line-height:1.5; color:var(--ink-2)}

.ask{padding:0 0 clamp(50px,6vw,80px)}
.askcard{display:flex; gap:24px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:clamp(22px,3vw,34px); background:var(--butter-soft); border:1.5px solid var(--ink); border-radius:var(--r-lg); box-shadow:5px 5px 0 var(--butter)}
.askcard h3{font-size:1.36rem}
.askcard p{margin-top:8px; max-width:56ch; color:var(--ink-2); font-size:.95rem}
.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:var(--r-pill); background:var(--ink); color:var(--paper); font-weight:600; font-size:.93rem; text-decoration:none; box-shadow:3px 3px 0 var(--lilac); border:0; cursor:pointer}
.btn.ghost{background:var(--card); color:var(--ink); box-shadow:none; border:1.5px solid var(--line-2)}
footer{border-top:1.5px solid var(--line); padding:28px 0 90px; font-size:.85rem; color:var(--ink-3)}

/* ---------- review layer (mock only) ---------- */
.badge{display:none; font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:var(--r-pill); border:1.2px solid; white-space:nowrap; line-height:1.4}
body.rv .badge{display:inline-block}
.badge.new{background:var(--mint-soft); border-color:var(--mint); color:var(--mint-ink)}
.badge.rewritten{background:var(--peach-soft); border-color:var(--peach); color:var(--peach-ink)}
.badge.updated{background:var(--butter-soft); border-color:var(--butter); color:var(--butter-ink)}
.badge.kept{background:var(--paper-2); border-color:var(--line-2); color:var(--ink-3)}
.review{display:none; margin-top:28px; padding:18px 20px; border:1.5px dashed var(--lilac-ink); border-radius:var(--r-md); background:#FBFAFF}
body.rv .review{display:block}
.review h6{font-family:var(--mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--lilac-ink); margin-bottom:10px; font-weight:600}
.review ul{display:grid; gap:7px; font-size:.87rem; color:var(--ink-2); line-height:1.5}
.review ul li{padding-left:16px; position:relative}
.review ul li::before{content:'›'; position:absolute; left:2px; color:var(--lilac-ink)}
.review .src{margin-top:14px; display:flex; flex-wrap:wrap; gap:6px}
.review .src code{font-family:var(--mono); font-size:.74rem; padding:2px 7px; background:var(--lilac-soft); border-radius:6px; color:var(--lilac-ink)}

.mock{position:fixed; left:16px; bottom:16px; z-index:50; display:flex; gap:6px; align-items:center; padding:6px; background:var(--ink); color:var(--paper); border-radius:var(--r-pill); box-shadow:0 10px 30px -10px rgba(0,0,0,.4); font-size:.8rem}
.mock b{font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; padding:0 8px 0 10px; color:var(--butter)}
.mock button{border:0; font:inherit; font-weight:600; padding:7px 13px; border-radius:var(--r-pill); background:rgba(255,255,255,.1); color:var(--paper); cursor:pointer}
.mock button[aria-pressed="true"]{background:var(--paper); color:var(--ink)}

.sheet{position:fixed; inset:0; z-index:60; display:none; background:rgba(38,33,27,.35); padding:clamp(12px,4vw,48px); overflow:auto}
.sheet.open{display:block}
.sheet .pane{max-width:860px; margin:0 auto; background:var(--paper); border:1.5px solid var(--ink); border-radius:var(--r-lg); box-shadow:6px 6px 0 var(--lilac); padding:clamp(20px,3.5vw,36px)}
.sheet .x{float:right}
.sheet h2{font-size:1.6rem}
.sheet h3{margin-top:28px; font-size:1.1rem}
.sheet p{margin-top:8px; color:var(--ink-2); font-size:.94rem}
.sheet .tally{margin-top:16px; display:flex; flex-wrap:wrap; gap:8px}
.sheet .tally span{display:inline-flex; gap:6px; align-items:center; font-size:.85rem; padding:6px 12px; border-radius:var(--r-pill); background:var(--card); border:1.5px solid var(--line)}
.sheet ol{margin-top:12px; display:grid; gap:10px; counter-reset:i}
.sheet ol li{position:relative; padding:12px 14px 12px 44px; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-md); font-size:.9rem; color:var(--ink-2); line-height:1.55}
.sheet ol li::before{counter-increment:i; content:counter(i); position:absolute; left:14px; top:12px; font-family:var(--mono); font-size:.78rem; color:var(--ink-3)}
.sheet ol li b{color:var(--ink)}
.sheet ol li code{font-family:var(--mono); font-size:.78rem; background:var(--paper-3); padding:1px 5px; border-radius:5px}

@media (max-width:1080px){
  .artgrid{grid-template-columns:minmax(0,1fr); gap:40px}
  .rail{position:static; padding:20px; background:var(--paper-2); border:1.5px solid var(--line); border-radius:var(--r-lg)}
  .railnav{grid-template-columns:1fr 1fr; gap:2px 16px}
  .body{max-width:none}
}
@media (max-width:900px){
  .cats{grid-template-columns:minmax(0,1fr)}
  .paths{grid-template-columns:1fr 1fr}
  .path:last-child{grid-column:1/-1}
}
@media (max-width:620px){
  .nav nav a:not(.on){display:none}
  .paths{grid-template-columns:minmax(0,1fr)}
  .path:last-child{grid-column:auto}
  .railnav{grid-template-columns:minmax(0,1fr)}
  table{min-width:380px}
  th,td{padding:10px 12px}
  .mock b{display:none}
}
</style>
</head>
<body class="rv">
<header class="nav">
  <div class="wrap">
    <a class="brand" href="#/"><i>C</i>ChaptOS</a>
    <nav><a href="#ext">Pricing</a><a href="#/" class="on">Help</a><a href="#ext">Trust</a><a href="#ext">Contact</a></nav>
  </div>
</header>
<main id="app"></main>
<footer><div class="wrap">ChaptOS · help centre mock · content verified against the codebase on 1 Nov 2026</div></footer>

<div class="mock" role="toolbar" aria-label="Mock controls">
  <b>MOCK</b>
  <button id="tg-rv" aria-pressed="true">Review marks</button>
  <button id="tg-ch">What changed</button>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="What changed"><div class="pane" id="sheet-pane"></div></div>

<script>
/* =========================================================================
   CONTENT — same Block schema as app/help/content.ts.
   Inline markup: **bold** *italic* `code` [label](/href)
   ========================================================================= */
const CATEGORIES = [
  { id:"start",   title:"Getting started",      icon:"✦", tint:"butter", blurb:"Making an org, joining one, and the term everything is filed under." },
  { id:"members", title:"Members & roles",      icon:"☺", tint:"sky",    blurb:"Getting people in, deciding what each of them can touch, and what you track about them." },
  { id:"money",   title:"Money",                icon:"$", tint:"mint",   blurb:"The ledger, dues, reimbursements, categories, and getting the numbers back out." },
  { id:"week",    title:"The week",             icon:"▦", tint:"lilac",  blurb:"Events, meetings and minutes, attendance, excuses, tasks and polls." },
  { id:"pages",   title:"Optional pages",       icon:"◧", tint:"peach",  blurb:"Service, Programming, Parties, Instagram and Fundraisers — the pages only some orgs turn on." },
  { id:"ask",     title:"Ask Chapt",            icon:"✶", tint:"rose",   blurb:"What the assistant can see, what it can change, and what to do when it's wrong." },
  { id:"record",  title:"Docs & the record",    icon:"▤", tint:"peach",  blurb:"The library, the activity log, and how a term ends without taking the org with it." },
  { id:"account", title:"Your account & orgs",  icon:"⚿", tint:"sky",    blurb:"Signing in, more than one org, the dashboard and pages, and leaving cleanly." },
  { id:"billing", title:"What this costs",      icon:"◫", tint:"butter", blurb:"The price, what counts toward it, and what happens when you outgrow the free plan." },
];

const ARTICLES = [
/* ─────────────────────────── Getting started ─────────────────────────── */
{
  slug:"set-up-your-org", status:"rewritten", categoryId:"start",

  butter:["var(--butter-soft)","var(--butter)","var(--butter-ink)"], sky:["var(--sky-soft)","var(--sky)","var(--sky-ink)"],
  mint:["var(--mint-soft)","var(--mint)","var(--mint-ink)"], lilac:["var(--lilac-soft)","var(--lilac)","var(--lilac-ink)"],

const BY_SLUG = new Map(ARTICLES.map(a => [a.slug, a]));

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
    const m = href.match(/^\/help\/([a-z0-9-]+)/);
    if (m) return `<a href="#/a/${m[1]}">${label}</a>`;
    return `<a class="ext" href="#ext" title="${href} — outside the mock">${label}</a>`;
  });
  return h;
}
const ic = (sym, tint, cls="ic") => { const t = TINT[tint]; return `<span class="${cls}" style="--g:${t[0]};--gb:${t[1]};--gi:${t[2]}" aria-hidden="true">${sym}</span>`; };
const badge = st => `<span class="badge ${st}">${st}</span>`;

function block(b){
  switch (b.k){
    case "p": return `<p>${inline(b.t)}</p>`;
    case "h": return `<h2>${inline(b.t)}</h2>`;
    case "steps": return `<ol class="steps">${b.items.map(i=>`<li>${inline(i)}</li>`).join("")}</ol>`;
    case "list": return `<ul class="list ${b.tone||""}">${b.items.map(i=>`<li>${inline(i)}</li>`).join("")}</ul>`;
    case "note": return `<div class="note ${b.tone||""}"><h5>${inline(b.h)}</h5><p>${inline(b.t)}</p></div>`;
    case "table": return `<div class="tw"><table><thead><tr><th>${esc(b.head[0])}</th><th>${esc(b.head[1])}</th></tr></thead><tbody>${b.rows.map(r=>`<tr><th>${inline(r[0])}</th><td>${inline(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
    case "where": return `<div class="where"><span class="where-l">Where</span><span class="where-p">${b.path.map((p,i)=>`<span class="${i===b.path.length-1?"last":""}">${esc(p)}</span>`).join("")}</span></div>`;
  }
  return "";
}

function blockText(b){
  if (b.k==="p"||b.k==="h") return b.t;
  if (b.k==="steps"||b.k==="list") return b.items.join(" ");
  if (b.k==="note") return b.h+" "+b.t;
  if (b.k==="table") return [...b.head, ...b.rows.flat()].join(" ");
  if (b.k==="where") return b.path.join(" ");
  return "";
}
const INDEX = ARTICLES.map(a => ({
  a, head:[a.title,a.blurb,a.keywords.join(" "),CAT.get(a.categoryId).title].join(" ").toLowerCase(),
  body:[a.lede, ...a.body.map(blockText)].join(" ").toLowerCase(),
}));

let query = "";
function renderIndex(){
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <span class="eyebrow">Help centre</span>
    <h1>Everything it does, in the order you'll need it.</h1>
    <p class="lede">${ARTICLES.length} articles, all of them about something that exists in the product today. Where a thing is half-built or has a sharp edge, the article says so — you should never go looking for a button that isn't there.</p>

        <input id="q" type="search" placeholder="Search — “dues”, “join request”, “check-in”…" value="${esc(query)}" autocomplete="off" aria-label="Search the help centre">
        <button id="qc" type="button" ${query?"":"hidden"}>Clear</button>
      </label>

  </div></section>
  ${askBand("Still stuck?", "There's no ticket queue and no bot on the other end — it's one person, and that person reads everything. Tell them what you were doing and what happened instead.")}`;
  const q = document.getElementById("q"), qc = document.getElementById("qc");
  q.addEventListener("input", () => { query = q.value; qc.hidden = !query; renderResults(); });
  qc.addEventListener("click", () => { query = ""; q.value = ""; qc.hidden = true; renderResults(); q.focus(); });
  renderResults();
}
function renderResults(){
  const el = document.getElementById("results");
  const t = query.trim().toLowerCase();
  if (!t){
    el.innerHTML = `
      <div class="paths">${QUICK_PATHS.map(p=>`<a class="path" href="#/a/${p.slug}">${ic(p.icon,p.tint)}<h4>${p.label}</h4><p>${p.hint}</p><span class="go">Read it →</span></a>`).join("")}</div>
      <div class="cats">${CATEGORIES.map(c=>`
        <section class="cat" id="${c.id}">
          <div class="cathead">${ic(c.icon,c.tint)}<div><h3>${c.title}</h3><p>${c.blurb}</p></div></div>
          <div class="arts">${ARTICLES.filter(a=>a.categoryId===c.id).map(a=>`<a href="#/a/${a.slug}"><span class="t">${esc(a.title)} ${badge(a.status)}</span><span class="b">${esc(a.blurb)}</span></a>`).join("")}</div>
        </section>`).join("")}</div>`;
    return;
  }
  const words = t.split(/\s+/).filter(Boolean);
  const hits = INDEX.map(r => {
    let score = 0;
    for (const w of words){ if (r.head.includes(w)) score += 3; else if (r.body.includes(w)) score += 1; else return null; }
    return { r, score };
  }).filter(Boolean).sort((x,y)=>y.score-x.score);
  el.innerHTML = hits.length
    ? `<div class="results">${hits.map(({r})=>`<a href="#/a/${r.a.slug}"><span class="rcat">${CAT.get(r.a.categoryId).title}</span><span class="rt">${esc(r.a.title)} ${badge(r.a.status)}</span><span class="rb">${esc(r.a.blurb)}</span></a>`).join("")}</div>`
    : `<div class="empty"><h3>Nothing matches “${esc(query)}”</h3><p>If it isn't here, it probably isn't written yet — and that's worth telling us.</p><a class="btn" href="#ext" style="margin-top:18px">Talk to a human →</a></div>`;
}

}

function renderArticle(slug){
  const a = BY_SLUG.get(slug);
  if (!a){ location.hash = "#/"; return; }
  const c = CAT.get(a.categoryId);

      <a class="railask" href="#ext"><b>This didn't answer it</b><span>Write to a person, with this page already named in the draft.</span></a>
    </aside>
  </div></section>
  ${askBand("Didn't find it?", "Search covers the full text of every article — if it isn't there, it probably isn't written yet, and that's worth telling us.")}`;
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash || "#/";
  let m;
  if ((m = h.match(/^#\/a\/([a-z0-9-]+)/))) return renderArticle(m[1]);
  if ((m = h.match(/^#\/c\/([a-z0-9-]+)/))){ renderIndex(); const el = document.getElementById(m[1]); if (el) el.scrollIntoView(); return; }
  if (h === "#ext") { history.back(); return; }
  renderIndex(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

const tgRv = document.getElementById("tg-rv");
tgRv.addEventListener("click", () => {
  const on = !document.body.classList.toggle("rv") ? false : true;
  tgRv.setAttribute("aria-pressed", String(document.body.classList.contains("rv")));
});
const sheet = document.getElementById("sheet");
document.getElementById("tg-ch").addEventListener("click", () => {
  const n = s => ARTICLES.filter(a => a.status === s);
  const list = s => n(s).map(a => `<li><b><a href="#/a/${a.slug}" data-close>${esc(a.title)}</a></b> — ${esc(a.review.changes[0])}</li>`).join("");
  document.getElementById("sheet-pane").innerHTML = `
    <button class="btn ghost x" data-close>Close</button>
    <h2>What changed</h2>
    <p>Every claim was checked against the code on 1 Nov 2026. Each article page lists its own changes and the files behind them.</p>
    <div class="tally">
      <span>${badge("new")} ${n("new").length} new</span><span>${badge("rewritten")} ${n("rewritten").length} rewritten</span>
      <span>${badge("updated")} ${n("updated").length} updated</span><span>${badge("kept")} ${n("kept").length} kept</span>
      <span>✕ ${REMOVED.length} removed</span><span>+1 category: Optional pages</span>
    </div>
    <h3>Rewritten — the old article was wrong</h3><ol>${list("rewritten")}</ol>
    <h3>New — the blind spots</h3><ol>${list("new")}</ol>
    <h3>Updated</h3><ol>${list("updated")}</ol>
    <h3>Removed</h3><ol>${REMOVED.map(r=>`<li><b>${esc(r.title)}</b> (<code>/help/${r.slug}</code>) — ${esc(r.why)}</li>`).join("")}</ol>
    <h3>Found in the app while verifying — not help-centre fixes</h3>
    <p>These are why some articles carry a flag note. Fixing any of them means updating the article in the same PR.</p>
    <ol>${APP_ISSUES.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  document.body.classList.add("rv"); tgRv.setAttribute("aria-pressed","true");
  sheet.classList.add("open");
});
sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest("[data-close]")) sheet.classList.remove("open"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") sheet.classList.remove("open"); });
</script>
</body>
</html>
