<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundraisers · Simple</title>
<!--
  Fundraising, the easy version. An EXPLORATION, separate from Fundraising Events Paper Mock.html
  (cash boxes, shifts, causes). This one has exactly three numbers per fundraiser:
    supplies (what you spent)  ·  came in (one total)  ·  made (came in − supplies)
  1. Shopping list: a taped notepad page. Type a supply + cost, or tap a "usually on a bake sale
     list" chip. Running total is double-ruled at the bottom.
  2. Wrap up: a money jar with a dashed SUPPLIES line. Type the total that came in and the jar fills: butter
     up to the line (paying supplies back), mint above it (what you made). Short of the line =
     rose hatch. The sentence underneath does the math out loud.
  3. Made: the jar gets a WRAPPED stamp, the number gets a highlighter, and the card on the index
     grows a price tag with what it made. Goal line optional.
  This term / Day one + Night on the MOCK bar. Same tokens as the dashboard mock. All records
  fictional. No backend.
-->
<script>
  (function () {
    var t = "light"; try { t = localStorage.getItem("fs-mock-theme") || "light"; } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --pct{syntax:'<number>'; inherits:false; initial-value:0}

/* ---------- tokens ------------------------------------------------------- */
:root{
  --paper:#FFFCF6; --paper-2:#FBF5EA; --paper-3:#F4ECDD; --card:#FFFFFF;
  --ink:#26211B; --ink-2:#544A3F; --ink-3:#8A7F71;
  --line:#EBE1CF; --line-2:#DCD0B9;

  --peach:#FFD5C4;  --peach-soft:#FFEDE5;  --peach-ink:#C9542D;  --peach-bd:#F8D2C2;
  --sky:#CFE2FF;    --sky-soft:#EAF2FF;    --sky-ink:#2A66C7;    --sky-bd:#CCDFFB;
  --mint:#C7EFDA;   --mint-soft:#E6F8EF;   --mint-ink:#1B815B;   --mint-bd:#BDE7D2;
  --butter:#FFE5A0; --butter-soft:#FFF6DC; --butter-ink:#9C6B08; --butter-bd:#F4DFA6;
  --lilac:#E1D8FF;  --lilac-soft:#F1EDFF;  --lilac-ink:#6244CC;  --lilac-bd:#DCD2FB;
  --rose:#FFD6E6;   --rose-soft:#FFEDF4;   --rose-ink:#C23C77;   --rose-bd:#F8CEE0;

  /* sticky notes are physical paper: same pastel and dark ink in both themes */
  --note-ink:#26211B; --note-filter:none;
  --mark-op:.85;
  --wash-op:.55;
  --av-ink:rgba(38,33,27,.72);

  --sh-1:0 1px 2px rgba(38,33,27,.05), 0 3px 10px rgba(38,33,27,.045);
  --sh-2:0 1px 2px rgba(38,33,27,.05), 0 10px 26px -8px rgba(38,33,27,.14);
  --sh-3:0 2px 4px rgba(38,33,27,.05), 0 26px 60px -18px rgba(38,33,27,.22);
  --scrim:rgba(38,33,27,.28);

  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease-out:cubic-bezier(.22,.72,.24,1);
  --ease-spring:cubic-bezier(.16,.9,.3,1.02);
  color-scheme:light;
}
/* Night paper: a warm desk under a lamp, not a black UI. Pastels become low-alpha tints with
   lifted inks; hard shadows keep their colour so ink-bordered things still "sit up". */
html[data-theme="dark"]{
  --paper:#15110D; --paper-2:#1B1712; --paper-3:#25201A; --card:#1F1A15;
  --ink:#F2EADC; --ink-2:#CDBFAB; --ink-3:#948876;
  --line:#2F271E; --line-2:#43382B;

  --peach:#E5A28A;  --peach-soft:rgba(255,178,148,.085); --peach-ink:#FFB49A; --peach-bd:rgba(255,178,148,.22);
  --sky:#8DB2EC;    --sky-soft:rgba(150,190,255,.085);   --sky-ink:#AACBFF;   --sky-bd:rgba(150,190,255,.22);
  --mint:#80CBA4;   --mint-soft:rgba(140,220,180,.08);   --mint-ink:#8FDDB6;  --mint-bd:rgba(140,220,180,.22);
  --butter:#E3BF66; --butter-soft:rgba(255,214,120,.08); --butter-ink:#F0CC72;--butter-bd:rgba(255,214,120,.22);
  --lilac:#A593EE;  --lilac-soft:rgba(180,160,255,.10);  --lilac-ink:#C4B6FF; --lilac-bd:rgba(180,160,255,.26);
  --rose:#E598B7;   --rose-soft:rgba(255,160,200,.08);   --rose-ink:#FFAACB;  --rose-bd:rgba(255,160,200,.22);

  --note-filter:brightness(.93) saturate(.85);
  --mark-op:.42;
  --wash-op:.9;
  --av-ink:rgba(22,18,14,.78);
  --sh-1:0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25);
  --sh-2:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -10px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.4), 0 26px 60px -18px rgba(0,0,0,.75);
  --scrim:rgba(5,4,2,.6);
  color-scheme:dark;
}

/* ---------- base ---------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .35s var(--ease-out), color .35s var(--ease-out);
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0; list-style:none}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--lilac-ink); outline-offset:2px; border-radius:6px}


.ic{width:18px; height:18px; flex:none}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.display{font-family:var(--display); font-weight:600; letter-spacing:-.028em}

/* highlighter behind a word — hand-drawn, slightly off-register */
.hi{position:relative; white-space:nowrap; z-index:0}
.hi::before{
  content:''; position:absolute; z-index:-1; left:-.12em; right:-.12em; bottom:.04em; height:.5em;
  background:var(--mark, var(--butter)); border-radius:.4em .55em .38em .6em;
  transform:rotate(-.8deg) scaleX(var(--mx,1)); transform-origin:left center; opacity:var(--mark-op);
  transition:transform .8s var(--ease-spring) .35s;
}
.boot .hi::before{--mx:0}

.eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:.7rem; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.eyebrow::before{content:''; width:18px; height:2px; border-radius:2px; background:var(--eb, var(--peach))}

/* buttons: ink pill with a hard pastel shadow that lifts on hover, presses on click */
.btn{
  --bg:var(--ink); --fg:var(--paper); --hs:var(--lilac);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 17px; border-radius:999px; border:1.5px solid var(--ink);
  background:var(--bg); color:var(--fg); font-weight:600; font-size:.88rem; letter-spacing:-.01em;
  box-shadow:2.5px 2.5px 0 var(--hs); white-space:nowrap; text-decoration:none;
  transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), background .2s, color .2s;
}
.btn:hover{transform:translate(-1.5px,-1.5px); box-shadow:4.5px 4.5px 0 var(--hs)}
.btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--hs)}
.btn .ic{width:15px; height:15px}
.btn--ghost{--bg:var(--card); --fg:var(--ink); --hs:var(--peach)}
.btn--soft{--bg:transparent; --fg:var(--ink-2); border-color:var(--line-2); box-shadow:none}
.btn--soft:hover{border-color:var(--ink-3); color:var(--ink); box-shadow:none; transform:translateY(-1px)}
.btn--sm{padding:6px 12px; font-size:.8rem; box-shadow:2px 2px 0 var(--hs)}
.btn--sm.btn--soft{box-shadow:none}

.pill{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
  font-size:.74rem; font-weight:600; white-space:nowrap;
  background:var(--p-bg, var(--paper-2)); color:var(--p-fg, var(--ink-2)); border:1px solid var(--p-bd, var(--line));
}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.t-peach{--p-bg:var(--peach-soft); --p-fg:var(--peach-ink); --p-bd:var(--peach-bd)}
.t-sky{--p-bg:var(--sky-soft); --p-fg:var(--sky-ink); --p-bd:var(--sky-bd)}
.t-mint{--p-bg:var(--mint-soft); --p-fg:var(--mint-ink); --p-bd:var(--mint-bd)}
.t-butter{--p-bg:var(--butter-soft); --p-fg:var(--butter-ink); --p-bd:var(--butter-bd)}
.t-lilac{--p-bg:var(--lilac-soft); --p-fg:var(--lilac-ink); --p-bd:var(--lilac-bd)}
.t-rose{--p-bg:var(--rose-soft); --p-fg:var(--rose-ink); --p-bd:var(--rose-bd)}

.avatar{
  width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-size:.68rem; font-weight:700; letter-spacing:-.02em; font-style:normal;
  background:var(--av, var(--lilac)); color:var(--av-ink); border:1.5px solid rgba(38,33,27,.08);
}
.avatar--sm{width:24px; height:24px; font-size:.6rem}
.avatar--ghost{background:transparent; border:1.5px dashed var(--line-2); color:var(--ink-3)}

kbd{font-family:var(--mono); font-size:.68rem; border:1px solid var(--line-2); border-radius:6px; padding:1px 6px; background:var(--paper-2); color:var(--ink-3)}
.iconbtn{width:34px; height:34px; flex:none; display:grid; place-items:center; border-radius:10px; border:1.5px solid transparent; background:none; color:var(--ink-3); transition:background .16s, color .16s, border-color .16s}
.iconbtn:hover{background:var(--card); color:var(--ink); border-color:var(--line)}
.iconbtn .ic{width:17px; height:17px; transition:transform .25s var(--ease-spring)}
/* briefing */
.brief{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:clamp(20px,4vw,56px); align-items:start}
.kick{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.kick .chip{padding:2px 9px; border-radius:999px; background:var(--card); border:1.5px solid var(--line-2); color:var(--ink-2)}
.greet{font-family:var(--display); font-weight:600; letter-spacing:-.032em; line-height:1.04; font-size:clamp(2.05rem,3.7vw,3.05rem); margin-top:14px; display:flex; flex-wrap:wrap; align-items:center; gap:0 .28em}
.wave{display:inline-block; width:.82em; height:.82em; color:var(--butter-ink); transform-origin:70% 85%}
.wave svg{width:100%; height:100%}
.boot .wave{animation:wave 1.6s var(--ease-out) .55s 1 both}
@keyframes wave{0%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(9deg)}100%{transform:rotate(0)}}
.digest{margin-top:14px; display:flex; gap:10px; align-items:flex-start; font-size:1.02rem; line-height:1.55; color:var(--ink-2); max-width:62ch}
.aichip{flex:none; display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--lilac-soft); border:1px solid var(--lilac-bd); color:var(--lilac-ink); font-size:.64rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; margin-top:3px}
.aichip .ic{width:9px; height:9px}
.toast{position:fixed; left:50%; bottom:76px; transform:translate(-50%,10px); z-index:80; padding:9px 15px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); box-shadow:3px 3px 0 var(--mint); font-size:.84rem; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s, transform .3s var(--ease-spring); display:flex; gap:8px; align-items:center}
.toast.on{opacity:1; transform:translate(-50%,0)}
.toast .ic{width:15px; height:15px; color:var(--mint-ink)}

/* paper burst */
.bit{position:fixed; z-index:90; width:9px; height:12px; border-radius:2px; pointer-events:none; animation:bit .9s var(--ease-out) forwards}
@keyframes bit{to{transform:translate(var(--x),var(--y)) rotate(var(--r)); opacity:0}}

/* entrance: reveal-and-swap, nothing perpetual */
[data-r]{opacity:1; transform:none; transition:opacity .6s var(--ease-out) var(--d,0ms), transform .8s var(--ease-spring) var(--d,0ms)}
.boot [data-r]{opacity:0; transform:translate3d(0,16px,0)}

/* composer: the form a quick action opens */
.cm-shade{position:fixed; inset:0; z-index:78; background:var(--scrim); display:grid; place-items:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s}
.cm-shade.open{opacity:1; pointer-events:auto}
.cm{
  width:min(480px,100%); max-height:calc(100vh - 32px); overflow:auto; background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r-lg);
  box-shadow:6px 6px 0 var(--tone, var(--lilac)); transform:translateY(12px) scale(.98); transition:transform .32s var(--ease-spring);
}
.cm-shade.open .cm{transform:none}
.cm-h{display:flex; align-items:center; gap:13px; padding:18px 20px 4px}
.cm-h .tile{width:42px; height:42px; border-radius:13px; transform:rotate(-4deg)}
.cm-h .tile .ic{width:20px; height:20px}
.cm-h p{font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.cm-h h3{font-family:var(--display); font-weight:600; font-size:1.3rem; letter-spacing:-.025em; line-height:1.15}
.cm-h .iconbtn{margin-left:auto; align-self:flex-start}
.cm-b{padding:14px 20px 4px; display:grid; gap:13px}
.cm-b > *{min-width:0}
.prov > span:last-child{min-width:0}
.cm-f{display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:16px 20px 18px}
.cm-f .note{margin-right:auto; font-size:.74rem; color:var(--ink-3); max-width:24ch; line-height:1.35}
.fld > span{display:block; font-size:.74rem; font-weight:600; color:var(--ink-2); margin-bottom:5px}
.inp{
  width:100%; padding:10px 13px; border-radius:var(--r-sm); border:1.5px solid var(--line-2); background:var(--paper);
  outline:none; font-size:.9rem; color:var(--ink); transition:border-color .15s, box-shadow .15s;
}
.inp:focus{border-color:var(--ink); box-shadow:2px 2px 0 var(--tone, var(--lilac))}
textarea.inp{resize:vertical; min-height:72px; line-height:1.45}
select.inp{appearance:none; -webkit-appearance:none; padding-right:34px; cursor:pointer;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size:5px 5px; background-repeat:no-repeat}
.amt-inp{position:relative}
.amt-inp::before{content:'$'; position:absolute; left:13px; top:50%; transform:translateY(-50%); font-family:var(--display); font-weight:600; color:var(--ink-3)}
.amt-inp .inp{padding-left:26px; font-family:var(--display); font-weight:600; font-size:1.05rem}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg span{display:inline-flex; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line-2); font-size:.8rem; font-weight:550; color:var(--ink-2); transition:background .15s, border-color .15s, color .15s}
.seg input:checked + span{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.seg input:focus-visible + span{outline:2px solid var(--lilac-ink); outline-offset:2px}
@keyframes fresh{0%,30%{background:var(--butter-soft); box-shadow:0 0 0 6px var(--butter-soft)} 100%{background:transparent; box-shadow:0 0 0 6px transparent}}
.cef.is-allday .t-only{display:none}
.cef.is-allday .a-only{display:contents}
.sw{display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-size:.82rem; font-weight:550; color:var(--ink-2)}
.sw input{position:absolute; opacity:0; pointer-events:none}
.sw .track{width:36px; height:21px; border-radius:999px; background:var(--paper-3); border:1.5px solid var(--line-2); position:relative; transition:background .2s, border-color .2s; flex:none}
.sw .track::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .25s var(--ease-spring)}
.mockbar{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:70; display:flex; align-items:center; gap:4px; padding:5px; border-radius:999px; background:var(--ink); box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.mockbar .lab{padding:0 8px 0 10px; font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; color:rgba(255,255,255,.55)}
html[data-theme="dark"] .mockbar .lab{color:rgba(0,0,0,.5)}
.mockbar button{border:0; background:none; color:var(--paper); padding:7px 12px; border-radius:999px; font-size:.8rem; font-weight:600; opacity:.75}
.mockbar button[aria-pressed="true"]{background:var(--butter); color:var(--note-ink); opacity:1}
.mockbar .sep{width:1px; height:18px; background:rgba(255,255,255,.2); margin:0 2px}
html[data-theme="dark"] .mockbar .sep{background:rgba(0,0,0,.2)}

/* ---------- page frame --------------------------------------------------- */
.wrap{max-width:1140px; margin:0 auto; padding:clamp(26px,3.4vw,44px) clamp(16px,3vw,44px) 140px}
.brief{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end}
.sec{display:flex; align-items:baseline; gap:12px; margin:44px 0 16px}
.sec h2{font-family:var(--display); font-weight:600; font-size:1.35rem; letter-spacing:-.025em; white-space:nowrap}
.sec .rule{flex:1; height:1.5px; background:var(--line); min-width:20px; align-self:center}
.sec .cnt{font-family:var(--mono); font-size:.72rem; color:var(--ink-3); white-space:nowrap}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:600; background:var(--p-bg, var(--paper-2)); color:var(--p-fg, var(--ink-2)); border:1px solid var(--p-bd, var(--line)); white-space:nowrap}
.chip .ic{width:12px; height:12px}
.tile{width:32px; height:32px; flex:none; border-radius:10px; display:grid; place-items:center; background:var(--p-bg); border:1.5px solid var(--p-bd); color:var(--p-fg)}
.greet .amt{font-variant-numeric:tabular-nums}
.sub{margin-top:12px; color:var(--ink-2); font-size:1rem; max-width:60ch}
.sub b{color:var(--ink); font-weight:600}

/* the three-step promise: same strip on day one, in the composer and on every detail page */
.how{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:26px}
.how li{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:14px; background:var(--card); border:1.5px dashed var(--line-2)}
.how .n{flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:.9rem; background:var(--p-bg); color:var(--p-fg); border:1.5px solid var(--p-bd)}
.how b{display:block; font-family:var(--display); font-weight:600; font-size:1rem; letter-spacing:-.02em}
.how span{font-size:.82rem; color:var(--ink-3); line-height:1.4}

/* ---------- ready-to-wrap hero ------------------------------------------- */
.hero{margin-top:28px; display:grid; grid-template-columns:150px minmax(0,1fr) auto; gap:28px; align-items:center; padding:22px 28px; background:var(--card); border:1.5px solid var(--ink); border-radius:8px 18px 10px 16px; box-shadow:5px 5px 0 var(--peach)}
.hero .tag{font-family:var(--mono); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--peach-ink)}
.hero h2{margin-top:6px; font-family:var(--display); font-weight:600; font-size:clamp(1.35rem,2.4vw,1.75rem); letter-spacing:-.03em; line-height:1.15}
.hero p{margin-top:8px; color:var(--ink-2); font-size:.92rem; max-width:52ch}
.hero p b{color:var(--ink)}
.hero .jar{max-width:150px}
.hero.first{box-shadow:5px 5px 0 var(--lilac)}
.hero.first .tag{color:var(--lilac-ink)}

/* ---------- fundraiser cards (index) ------------------------------------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap:18px}
.fr{position:relative; display:flex; flex-direction:column; text-align:left; padding:18px 18px 16px; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); min-width:0; min-height:178px; transition:transform .2s var(--ease-spring), box-shadow .2s, border-color .2s}
.fr:hover{transform:translateY(-3px); border-color:var(--ink); box-shadow:4px 4px 0 var(--hs, var(--lilac))}
.fr-top{display:grid; grid-template-columns:50px minmax(0,1fr); gap:13px; align-items:start; padding-right:96px}
.cal{display:block; text-align:center; border:1.5px solid var(--ink); border-radius:11px; overflow:hidden; background:var(--card); line-height:1.05; transform:rotate(-2deg); box-shadow:2px 2px 0 var(--cl, var(--butter))}
.cal small{display:block; padding:3px 0 2px; background:var(--cl, var(--butter)); color:var(--note-ink); filter:var(--note-filter); font-family:var(--mono); font-size:.56rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase}
.cal b{display:block; padding:4px 0 4px; font-family:var(--display); font-weight:600; font-size:1.3rem; letter-spacing:-.03em}
.fr h3{font-family:var(--display); font-weight:600; font-size:1.1rem; letter-spacing:-.024em; line-height:1.2}
.fr .meta{margin-top:5px; display:flex; flex-wrap:wrap; gap:6px}
.fr-foot{margin-top:auto; padding-top:16px; display:flex; align-items:center; gap:10px; font-size:.82rem; color:var(--ink-2)}
.fr-foot .mono{color:var(--ink)}
.fr-foot .go{margin-left:auto; color:var(--ink-3); display:inline-flex; align-items:center; gap:4px; font-weight:600}
.fr-foot .go .ic{width:14px; height:14px; transition:transform .2s var(--ease-spring)}
.fr:hover .go .ic{transform:translateX(3px)}
.fr.ready{border-color:var(--ink); --hs:var(--peach); box-shadow:4px 4px 0 var(--peach)}
.fr.ready .cal{--cl:var(--peach)}
.fr.wrapped .cal{--cl:var(--mint)}
.fr.wrapped{--hs:var(--mint)}
.fr.fresh{animation:fresh 2.4s var(--ease-out)}

/* mini progress: three dots = the three steps */
.dots{display:inline-flex; gap:4px}
.dots i{width:22px; height:5px; border-radius:3px; background:var(--paper-3); border:1px solid var(--line-2)}
.dots i.on{background:var(--ink); border-color:var(--ink)}

/* the price tag that hangs off a card — length of string is fixed, the number is the point */
.ptag{position:absolute; top:-10px; right:16px; width:104px; transform-origin:50% 0; transform:rotate(var(--rt,6deg)); transition:transform .5s var(--ease-spring); pointer-events:none}
.fr:hover .ptag{transform:rotate(calc(var(--rt,6deg) * -.6))}
.ptag svg{width:100%; height:auto; overflow:visible}
.ptag .str{fill:none; stroke:var(--ink-3); stroke-width:1.4}
.ptag .body{fill:var(--tg, var(--mint)); stroke:var(--ink); stroke-width:1.6; filter:var(--note-filter)}
.ptag .hole{fill:var(--card); stroke:var(--ink); stroke-width:1.4}
.ptag .k{font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.12em; fill:var(--note-ink); opacity:.7}
.ptag .v{font-family:var(--display); font-weight:700; font-size:21px; letter-spacing:-.03em; fill:var(--note-ink)}
.ptag.loss{--tg:var(--rose)}
.ptag.ghost .body{fill:var(--paper-2); stroke:var(--line-2); stroke-dasharray:4 3; filter:none}
.ptag.ghost .k,.ptag.ghost .v{fill:var(--ink-3)}

/* ---------- detail ------------------------------------------------------- */
.back{display:inline-flex; align-items:center; gap:6px; border:0; background:none; padding:4px 0; color:var(--ink-3); font-weight:600; font-size:.86rem}
.back .ic{width:15px; height:15px; transform:scaleX(-1)}
.back:hover{color:var(--ink)}
.d-head{margin-top:18px; display:grid; grid-template-columns:62px minmax(0,1fr) auto; gap:18px; align-items:center}
.d-head .cal b{font-size:1.6rem}
.d-head h1{font-family:var(--display); font-weight:600; font-size:clamp(1.8rem,3.4vw,2.6rem); letter-spacing:-.035em; line-height:1.05}
.d-head .meta{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px}

/* steps tracker */
.steps{margin-top:26px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; border:1.5px solid var(--line-2); border-radius:14px; background:var(--card); overflow:hidden}
.steps li{display:flex; align-items:center; gap:11px; padding:12px 16px; position:relative; min-width:0}
.steps li + li{border-left:1.5px dashed var(--line-2)}
.steps .n{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:.82rem; border:1.5px solid var(--line-2); color:var(--ink-3); background:var(--paper)}
.steps .n .ic{width:13px; height:13px}
.steps b{display:block; font-size:.86rem; font-weight:600; color:var(--ink-3); white-space:nowrap}
.steps small{display:block; font-family:var(--mono); font-size:.72rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.steps li.done .n{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.steps li.done b{color:var(--ink)}
.steps li.now{background:var(--butter-soft)}
.steps li.now .n{border-color:var(--ink); color:var(--ink); background:var(--butter)}
.steps li.now b{color:var(--ink)}
.steps li.win{background:var(--mint-soft)}
.steps li.win .n{background:var(--mint); border-color:var(--ink); color:var(--note-ink)}
.steps li.win b{color:var(--ink)}

.d-grid{margin-top:22px; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:26px; align-items:start}

/* ---------- 1. the shopping list: a notepad page -------------------------- */
.pad{position:relative; background:var(--card); border:1.5px solid var(--ink); border-radius:6px 6px 14px 14px; box-shadow:5px 5px 0 var(--butter); padding:0 0 16px}
.pad::before{content:''; position:absolute; left:50%; top:-10px; width:84px; height:20px; transform:translateX(-50%) rotate(-2.5deg); background:rgba(255,255,255,.62); border:1px solid rgba(38,33,27,.1); z-index:2}
html[data-theme="dark"] .pad::before{background:rgba(255,255,255,.1)}
.pad-h{display:flex; align-items:center; gap:12px; padding:20px 20px 12px; border-bottom:2px solid var(--rose-bd)}
.pad-h .tile{transform:rotate(-4deg)}
.pad-h h2{font-family:var(--display); font-weight:600; font-size:1.25rem; letter-spacing:-.025em}
.pad-h p{font-size:.8rem; color:var(--ink-3)}
.lines{--lh:46px; background:repeating-linear-gradient(to bottom, transparent 0 calc(var(--lh) - 1px), var(--sky-bd) calc(var(--lh) - 1px) var(--lh)); position:relative}
.lines::before{content:''; position:absolute; top:0; bottom:0; left:44px; width:1.5px; background:var(--rose-bd)}
.it{display:grid; grid-template-columns:44px minmax(0,1fr) 108px 34px; align-items:center; height:46px; padding-right:10px}
.it .no{text-align:center; font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.it input{border:0; background:transparent; outline:none; padding:6px 10px; border-radius:7px; min-width:0; width:100%; transition:background .15s, box-shadow .15s}
.it input:hover{background:var(--paper-2)}
.it input:focus{background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--ink)}
.it .nm{font-size:.95rem; font-weight:500}
.it .cost{position:relative}
.it .cost::before{content:'$'; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-family:var(--mono); color:var(--ink-3); font-size:.86rem; pointer-events:none}
.it .cost input{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:.92rem; font-weight:500; padding-left:20px}
.it .x{width:28px; height:28px; border-radius:8px; border:0; background:none; color:var(--ink-3); display:grid; place-items:center; opacity:0; transition:opacity .15s, background .15s, color .15s}
.it:hover .x,.it .x:focus-visible{opacity:1}
.it .x:hover{background:var(--rose-soft); color:var(--rose-ink)}
.it .x .ic{width:15px; height:15px}
.it.new{animation:fresh 1.8s var(--ease-out)}
.it.add input{background:var(--paper-2); border:1.5px dashed var(--line-2)}
.it.add input:focus{border-style:solid; border-color:var(--ink); box-shadow:none}
.it.add .x{opacity:1; background:var(--ink); color:var(--paper); border-radius:50%}
.it.add .x:hover{background:var(--ink); color:var(--paper); transform:scale(1.08)}
.it .est{font-family:var(--mono); font-size:.62rem; color:var(--ink-3); margin-left:6px}
.sugg{padding:14px 20px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.sugg > span{font-size:.76rem; color:var(--ink-3); margin-right:4px}
.sugg button{display:inline-flex; align-items:center; gap:5px; padding:4px 10px 4px 7px; border-radius:999px; border:1.5px dashed var(--line-2); background:transparent; font-size:.78rem; font-weight:550; color:var(--ink-2); transition:border-color .15s, background .15s, transform .18s var(--ease-spring)}
.sugg button .ic{width:12px; height:12px}
.sugg button i{font-style:normal; font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.sugg button:hover{border-style:solid; border-color:var(--ink); background:var(--card); transform:translateY(-1px)}
.pad-total{margin:16px 20px 0; padding-top:10px; border-top:1.5px solid var(--ink); display:flex; align-items:baseline; gap:10px; position:relative}
.pad-total::after{content:''; position:absolute; left:0; right:0; top:3px; border-top:1.5px solid var(--ink)}
.pad-total b{font-family:var(--display); font-weight:600; font-size:1.02rem}
.pad-total small{font-size:.78rem; color:var(--ink-3)}
.pad-total .mono{margin-left:auto; font-size:1.3rem; font-weight:600}
.pad-empty{padding:18px 20px 4px 58px; color:var(--ink-3); font-size:.88rem; line-height:1.5}
.pad.locked .it input{pointer-events:none}
.pad.locked .x{display:none}
.pad.locked .it{grid-template-columns:44px minmax(0,1fr) 108px 10px}

/* ---------- 2. the jar ---------------------------------------------------- */
.jarcard{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-2); padding:20px 22px 22px; position:relative}
.jarcard.won{border-color:var(--ink); box-shadow:5px 5px 0 var(--mint)}
.jarcard.lost{border-color:var(--ink); box-shadow:5px 5px 0 var(--rose)}
.jarcard h2{font-family:var(--display); font-weight:600; font-size:1.25rem; letter-spacing:-.025em}
.jarcard > p.lede{margin-top:4px; font-size:.86rem; color:var(--ink-3)}
.jar-row{margin-top:14px; display:grid; grid-template-columns:minmax(0,190px) minmax(0,1fr); gap:20px; align-items:end}
.jar{display:block; width:100%; height:auto; overflow:visible}
.jar .glass{fill:var(--paper-2)}
.jar .body{fill:none; stroke:var(--ink); stroke-width:2.2}
.jar .lid{fill:var(--paper-3); stroke:var(--ink); stroke-width:2.2}
.jar .lidl{stroke:var(--ink); stroke-width:1.4; opacity:.35}
.jar .glare{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; opacity:.55}
html[data-theme="dark"] .jar .glare{opacity:.12}
.jar .lay{transition:transform .9s var(--ease-spring)}
.jar .f-sup{fill:var(--butter)} .jar .f-made{fill:var(--mint)} .jar .f-short{fill:url(#hatch)}
.jar .coins circle{fill:none; stroke:var(--note-ink); stroke-width:1; opacity:.18}
.jar .ln{stroke:var(--ink); stroke-width:1.6; stroke-dasharray:5 4; transition:transform .9s var(--ease-spring)}
.jar .ln.goal{stroke:var(--lilac-ink)}
.jar .lt{font-family:var(--mono); font-size:10.5px; font-weight:600; fill:var(--ink-2)}
.jar .lt.goal{fill:var(--lilac-ink)}
.jar .stamp{color:var(--mint-ink); transform-box:fill-box; transform-origin:center; opacity:.92}
.jar .stamp.loss{color:var(--rose-ink)}
.jar .stamp rect{fill:var(--card); fill-opacity:.88; stroke:currentColor; stroke-width:3}
.jar .stamp text{fill:currentColor; font-family:var(--mono); font-weight:700; font-size:15px; letter-spacing:.14em}
.jar .stamp.slam{animation:slam .55s var(--ease-spring) both}
@keyframes slam{0%{transform:scale(1.9) rotate(-16deg); opacity:0} 60%{opacity:1} 100%{transform:scale(1) rotate(-9deg); opacity:.92}}
.jar .stamp:not(.slam){transform:rotate(-9deg)}
.legend{display:grid; gap:7px; font-size:.82rem; color:var(--ink-2)}
.legend li{display:flex; align-items:center; gap:8px}
.legend i{width:13px; height:13px; border-radius:4px; border:1.2px solid var(--ink); flex:none}
.legend .mono{margin-left:auto; color:var(--ink)}

/* wrap-up inputs */
.inn{margin-top:16px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
#cm-form{width:min(660px,100%); position:relative; overflow:visible; box-shadow:6px 6px 0 var(--butter); border-radius:10px 22px 14px 20px}
#cm-form::before{content:''; position:absolute; left:50%; top:-11px; width:96px; height:22px; transform:translateX(-50%) rotate(-2deg); background:rgba(255,255,255,.66); border:1px solid rgba(38,33,27,.1); z-index:2}
html[data-theme="dark"] #cm-form::before{background:rgba(255,255,255,.1)}
.nf-x{position:absolute; top:12px; right:12px; z-index:3}
.nf-h{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:start; padding:30px 30px 20px; background:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.4px) 0 0/14px 14px; border-bottom:1.5px dashed var(--line-2); border-radius:10px 22px 0 0}
.nf-eb{font-family:var(--mono); font-size:.66rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--butter-ink)}
.nf-name{display:block; width:100%; margin-top:6px; padding:2px 0 6px; border:0; border-bottom:2px dashed var(--line-2); background:transparent; outline:none; font-family:var(--display); font-weight:600; font-size:clamp(1.45rem,4.6vw,1.8rem); letter-spacing:-.03em; line-height:1.15; color:var(--ink); transition:border-color .2s}
.nf-name::placeholder{color:var(--ink-3); opacity:.6}
.nf-name:focus{border-bottom-style:solid; border-bottom-color:var(--ink)}
.nf-kind{margin-top:10px; min-height:1.5em; font-size:.8rem; line-height:1.5; color:var(--ink-3)}
.nf-kind .chip{margin-right:4px; vertical-align:1px}
.nf-cal{width:64px; margin-top:4px; margin-right:26px; transform:rotate(3deg); box-shadow:3px 3px 0 var(--butter)}
.nf-cal b{font-size:1.65rem; padding:5px 0 0}
.nf-cal i{display:block; padding:0 0 6px; font-style:normal; font-family:var(--mono); font-size:.6rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.08em}
.nf-cal.flip{animation:flip .45s var(--ease-spring)}
@keyframes flip{0%{transform:rotate(3deg) rotateX(0)} 45%{transform:rotate(-2deg) rotateX(70deg) translateY(-3px)} 100%{transform:rotate(3deg) rotateX(0)}}
.nf-rows{margin:20px 30px 0; border:1.5px solid var(--line-2); border-radius:16px; background:var(--paper); overflow:hidden}
.nf-row{display:grid; grid-template-columns:34px 96px minmax(0,1fr); gap:14px; align-items:center; padding:9px 12px 9px 14px; cursor:text; transition:background .15s}
.nf-row + .nf-row{border-top:1.5px dashed var(--line)}
.nf-row:focus-within{background:var(--card)}
.nf-row .tile{transition:transform .25s var(--ease-spring)}
.nf-row:focus-within .tile{transform:rotate(-8deg) scale(1.06)}
.nf-l{font-size:.86rem; font-weight:600; color:var(--ink-2); line-height:1.2}
.nf-l small{display:block; font-size:.68rem; font-weight:500; color:var(--ink-3)}
.nf-c{display:flex; align-items:center; gap:8px; min-width:0}
.nf-in{width:100%; min-width:0; padding:8px 10px; border-radius:10px; border:1.5px solid transparent; background:transparent; outline:none; font-size:.94rem; font-weight:500; color:var(--ink); transition:border-color .15s, background .15s, box-shadow .15s}
.nf-in::placeholder{color:var(--ink-3); font-weight:400}
.nf-in:hover{background:var(--paper-2)}
.nf-in:focus{border-color:var(--ink); background:var(--card); box-shadow:2px 2px 0 var(--butter)}
.nf-tm{width:auto; flex:none}
.nf-end{display:inline-flex; align-items:center; gap:8px; max-width:0; opacity:0; overflow:hidden; transform:translateX(-8px); transition:max-width .4s var(--ease-out), opacity .25s, transform .4s var(--ease-spring)}
.nf-end i{font-style:normal; font-size:.82rem; color:var(--ink-3)}
.has-start .nf-end{max-width:200px; opacity:1; transform:none; overflow:visible}
.nf-amt{position:relative}
.nf-amt::before{content:'$'; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-family:var(--display); font-weight:600; color:var(--ink-3); pointer-events:none}
.nf-amt .nf-in{padding-left:24px; font-family:var(--display); font-weight:600}
#cm-form .cm-f{padding:20px 30px 26px}
#cm-form .cm-f .note{max-width:none}
.nf-amt:has(.nf-in:placeholder-shown)::before{opacity:0}
.nf-amt:has(.nf-in:placeholder-shown) .nf-in{padding-left:10px}
.inn.one{grid-template-columns:minmax(0,1fr)}
.fld > span{display:flex; align-items:center; gap:6px}
.fld > span .ic{width:13px; height:13px; color:var(--ink-3)}
.amt-inp .inp{font-size:1.25rem; padding-top:11px; padding-bottom:11px}
.math{margin-top:16px; padding:13px 15px; border-radius:12px; background:var(--paper-2); border:1.5px dashed var(--line-2); font-size:.98rem; line-height:1.7; color:var(--ink-2)}
.math .mono{color:var(--ink); font-weight:600}
.math .eq{display:inline-block; padding:0 4px; color:var(--ink-3)}
.math .res{display:inline-flex; align-items:baseline; gap:6px; padding:1px 10px; border-radius:999px; background:var(--mint); color:var(--note-ink); border:1.5px solid var(--ink); font-weight:600}
.math .res.loss{background:var(--rose)}
.math .res.none{background:var(--paper-3); color:var(--ink-3); border-color:var(--line-2)}
.wrap-f{margin-top:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.wrap-f .note{font-size:.78rem; color:var(--ink-3); max-width:32ch; line-height:1.4}
.btn[disabled]{opacity:.4; pointer-events:none}

/* ---------- 3. the result ------------------------------------------------- */
.res-big{margin-top:6px; font-family:var(--display); font-weight:700; font-size:clamp(2.6rem,5.4vw,3.6rem); letter-spacing:-.045em; line-height:1}
.res-big .hi{--mark:var(--mint)}
.lost .res-big .hi{--mark:var(--rose)}
.rcpt{margin-top:4px; font-family:var(--mono); font-size:.86rem; display:grid; gap:2px}
.rcpt li{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dotted var(--line-2)}
.rcpt li span:first-child{color:var(--ink-2)}
.rcpt li.tot{border-bottom:0; border-top:1.5px solid var(--ink); margin-top:4px; padding-top:8px; font-weight:600; position:relative}
.rcpt li.tot::before{content:''; position:absolute; left:0; right:0; top:2px; border-top:1.5px solid var(--ink)}
.rcpt li.tot span:first-child{color:var(--ink)}
.goalbar{margin-top:14px; display:flex; align-items:center; gap:9px; font-size:.84rem; color:var(--ink-2)}
.goalbar .ic{width:16px; height:16px; color:var(--lilac-ink)}
.goalbar b{color:var(--ink); font-weight:600}
.steps li.miss{background:var(--rose-soft)}
.steps li.miss .n{background:var(--rose); border-color:var(--ink); color:var(--note-ink)}
.steps li.miss b{color:var(--ink)}
.jar .lt{paint-order:stroke; stroke:var(--card); stroke-width:3.5px; stroke-linejoin:round}
.after{margin-top:18px; padding-top:14px; border-top:1.5px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.after .tr{flex:1 1 100%; display:flex; gap:8px; align-items:center; font-size:.8rem; color:var(--ink-3)}
.after .tr .ic{width:14px; height:14px; color:var(--mint-ink)}
.link{border:0; background:none; padding:4px 2px; font-size:.8rem; font-weight:600; color:var(--ink-3); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* ---------- composer ----------------------------------------------------- */
.kinds{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px}
.kinds label{cursor:pointer; position:relative}
.kinds input{position:absolute; opacity:0; pointer-events:none}
.kinds span{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 10px; border-radius:12px; border:1.5px solid var(--line-2); font-size:.78rem; font-weight:600; color:var(--ink-2); text-align:center; transition:border-color .15s, background .15s, transform .18s var(--ease-spring), box-shadow .18s}
.kinds span .tile{width:34px; height:34px}
.kinds span .tile .ic{width:17px; height:17px}
.kinds label:hover span{border-color:var(--ink-3); transform:translateY(-1px)}
.kinds input:checked + span{border-color:var(--ink); background:var(--paper); box-shadow:2.5px 2.5px 0 var(--butter); color:var(--ink)}
.kinds input:focus-visible + span{outline:2px solid var(--lilac-ink); outline-offset:2px}
.preview{font-size:.78rem; color:var(--ink-3); line-height:1.45; padding:10px 12px; border-radius:10px; background:var(--paper-2)}
.preview b{color:var(--ink-2)}
.opt{font-weight:500; color:var(--ink-3)}

/* ---------- day one ------------------------------------------------------- */
.d1{margin-top:28px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap:0; align-items:end; padding:30px 28px 26px; background:var(--card); border:1.5px dashed var(--line-2); border-radius:var(--r-xl)}
.d1 figure{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; padding:0 10px}
.d1 figure > div{height:150px; display:flex; align-items:flex-end; justify-content:center; width:100%}
.d1 figcaption b{display:block; font-family:var(--display); font-weight:600; font-size:1.05rem}
.d1 figcaption span{font-size:.82rem; color:var(--ink-3)}
.minipad{width:150px; background:var(--card); border:1.5px solid var(--ink); border-radius:4px 4px 10px 10px; box-shadow:3px 3px 0 var(--butter); padding:10px 12px; font-family:var(--mono); font-size:.68rem; text-align:left; transform:rotate(-2deg)}
.minipad div{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--sky-bd)}
.minipad div:last-child{border-bottom:0; border-top:1.5px solid var(--ink); font-weight:600; margin-top:2px}
.d1 .jar{width:110px}
.d1 .ptag{position:static; width:130px; transform:rotate(-4deg)}
.d1-cta{margin-top:20px; display:flex; justify-content:center}

@keyframes fresh{0%,30%{background:var(--butter-soft)} 100%{background:transparent}}

/* ---------- responsive --------------------------------------------------- */
@media (max-width:940px){
  .d-grid{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:110px minmax(0,1fr)}
  .hero .acts{grid-column:1 / -1}
}
@media (max-width:720px){
  .brief{grid-template-columns:minmax(0,1fr)}
  .how,.d1{grid-template-columns:minmax(0,1fr)}
  .d1{gap:26px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .steps li + li{border-left:0; border-top:1.5px dashed var(--line-2)}
  .d-head{grid-template-columns:52px minmax(0,1fr)}
  .d-head .acts{grid-column:1 / -1}
  .jar-row{grid-template-columns:120px minmax(0,1fr)}
}
@media (max-width:480px){
  .hero{grid-template-columns:minmax(0,1fr); padding:20px}
  .hero .jar{max-width:110px}
  .inn{grid-template-columns:minmax(0,1fr)}
  .nf-h{padding:24px 18px 16px; gap:12px}
  .nf-cal{width:54px; margin-right:24px}
  .nf-rows{margin:16px 16px 0}
  .nf-row{grid-template-columns:30px minmax(0,1fr); grid-template-areas:"ic lab" "ic ctl"; row-gap:2px; padding:10px 12px}
  .nf-row .tile{grid-area:ic; align-self:start; margin-top:2px}
  .nf-l{grid-area:lab; padding-left:10px} .nf-l small{display:inline; margin-left:6px}
  .nf-c{grid-area:ctl; gap:2px; flex-wrap:wrap}
  .nf-tm{padding-left:6px; padding-right:4px; font-size:.9rem}
  .nf-end{gap:2px}
  #cm-form .cm-f{padding:16px 16px 18px; flex-wrap:wrap}
  #cm-form .cm-f .note{flex:1 1 100%; max-width:none}
  .it{grid-template-columns:34px minmax(0,1fr) 92px 30px}
  .lines::before{left:34px}
  .pad-empty{padding-left:46px}
  .mockbar .lab{display:none}
  .sec .cnt{display:none}
}
</style>

    setTimeout(function () { form.name.focus(); }, 80);
  }
  function closeCm() { $("#cm").classList.remove("open"); $("#cm").setAttribute("aria-hidden", "true"); }
  $("#cm").addEventListener("click", function (e) { if (e.target.id === "cm" || e.target.closest("[data-close]")) closeCm(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCm(); });

  /* ---------- clicks -------------------------------------------------------------------- */
  document.addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-new]"))) return openNew();
    if ((t = e.target.closest("[data-open]"))) { S.view = t.dataset.open; render(!!t.hasAttribute("data-focus") || stage(byId(S.view)) === "ready"); scrollTo(0, 0); return; }
    if (e.target.closest("[data-back]")) { S.fresh = S.view; S.view = null; render(); S.fresh = null; scrollTo(0, 0); return; }
    var f = S.view && byId(S.view);
    if ((t = e.target.closest("[data-del]")) && f) { var gone = f.supplies.splice(+t.dataset.del, 1)[0]; renderDetail(); toast("Removed " + gone.n); return; }
    if ((t = e.target.closest("[data-sugg]")) && f) { addSupply(f, t.dataset.sugg, t.dataset.c); toast("Added " + t.dataset.sugg + ". Change the price if it’s off."); return; }
    if (e.target.closest("[data-reopen]") && f) { var keep = f.wrap; f.wrap = null; renderDetail(); $("#w-total").value = inV(keep.total); $("#w-total").dispatchEvent(new Event("input")); return; }
    if (e.target.closest("[data-copy]") && f) {
      var m = made(f), txt = f.name + " wrap-up: " + $m(cameIn(f)) + " came in, " + $m(spent(f)) + " on supplies, " + (m < 0 ? $m(-m) + " short" : $m(m) + " made") + ".";
      try { navigator.clipboard.writeText(txt); } catch (err) {}
      toast("Copied: " + txt); return;
    }
  });

  /* ---------- bits ---------------------------------------------------------------------- */
  var tt;
  function toast(msg) { var t = $("#toast"); $("span", t).textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("on"); }, 2600); }
  function burst(el) {
    if (!el || reduce.matches) return;
    var r = el.getBoundingClientRect(), cx = r.left + Math.min(r.width, 260) / 2, cy = r.top + r.height / 2;
    var cols = ["--mint", "--butter", "--peach", "--sky", "--lilac", "--rose"];
    for (var i = 0; i < 34; i++) {
      var b = document.createElement("i"); b.className = "bit";
      var a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 150;
      b.style.cssText = "left:" + cx + "px;top:" + cy + "px;background:var(" + cols[i % cols.length] + ");--x:" + Math.cos(a) * d + "px;--y:" + (Math.sin(a) * d - 40) + "px;--r:" + (Math.random() * 540 - 270) + "deg";
      document.body.appendChild(b); setTimeout(b.remove.bind(b), 950);
    }
  }
  function countUp() {
    $$("[data-count]").forEach(function (el) {
      var to = +el.dataset.count; if (reduce.matches || !to) return;
      var t0 = performance.now(), dur = 900;
      (function step(t) { var k = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3); el.textContent = $m(Math.round(to * e * 100) / 100 === to ? to : Math.round(to * e)); if (k < 1) requestAnimationFrame(step); else el.textContent = $m(to); })(t0);
    });
  }

  function render(focus) {
    document.body.classList.add("boot");
    if (S.view) renderDetail(focus); else renderIndex();
    $$(".mockbar [data-mock]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.mock === S.mode); });
    requestAnimationFrame(function () { requestAnimationFrame(function () { document.body.classList.remove("boot"); }); });
  }
  $$(".mockbar [data-mock]").forEach(function (b) {
    b.addEventListener("click", function () { S.mode = b.dataset.mock; S.view = null; try { localStorage.setItem("fs-mock-mode", S.mode); } catch (e) {} render(); });
  });
  $("[data-theme-btn]").addEventListener("click", function () {
    var t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t; try { localStorage.setItem("fs-mock-theme", t); } catch (e) {}
  });
  render();
})();
</script>
