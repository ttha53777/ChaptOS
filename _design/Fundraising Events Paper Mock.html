<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundraising · Events</title>
<!--
  Fundraising, event-first — an EXPLORATION, isolated from Dashboard Paper Mock.html (whose
  #fundraising page is the campaign version). No campaigns: each fundraiser event is the unit,
  and every number on the page is built from events.
    1. Needs you — the cash box, lid open, empty tray + "Count me" note; fills + gets stamped
       when counted.
    2. Coming up — every event card carries its shift strip: time slots, avatars, dashed "+"
       seats you can take (peach inside 48h).
    3. This term — till receipts hanging off one rail, length = net, dashed term average.
    4. What pays — net per hour members worked, by kind of fundraiser, with stick-figure crews.
    5. Giving by cause — one jar per cause, stacked in layers (one per event), target line.
    6. Who worked — a punch card per member, one hole per shift.
    7. Count the box — the paper count sheet (denominations, red-pen subtractions, double rule)
       beside a cash box that fills as you type, cross-checked against the phone tally.
    8. Run the table — the day-of phone: ticket stubs you tear onto a spike, running total.
  Plus Plan a fundraiser (shift slots preview live). Full term / Day one + light/dark on the
  MOCK bar. Same tokens as the dashboard mock. All records fictional. No backend.
-->

<style>
@property --pct{syntax:'<number>'; inherits:false; initial-value:0}

/* ---------- tokens ------------------------------------------------------- */
:root{
  --paper:#FFFCF6; --paper-2:#FBF5EA; --paper-3:#F4ECDD; --card:#FFFFFF;
  --ink:#26211B; --ink-2:#544A3F; --ink-3:#8A7F71;
  --line:#EBE1CF; --line-2:#DCD0B9;

  --peach:#FFD5C4;  --peach-soft:#FFEDE5;  --peach-ink:#C9542D;  --peach-bd:#F8D2C2;
  --sky:#CFE2FF;    --sky-soft:#EAF2FF;    --sky-ink:#2A66C7;    --sky-bd:#CCDFFB;
  --mint:#C7EFDA;   --mint-soft:#E6F8EF;   --mint-ink:#1B815B;   --mint-bd:#BDE7D2;
  --butter:#FFE5A0; --butter-soft:#FFF6DC; --butter-ink:#9C6B08; --butter-bd:#F4DFA6;
  --lilac:#E1D8FF;  --lilac-soft:#F1EDFF;  --lilac-ink:#6244CC;  --lilac-bd:#DCD2FB;
  --rose:#FFD6E6;   --rose-soft:#FFEDF4;   --rose-ink:#C23C77;   --rose-bd:#F8CEE0;

  /* sticky notes are physical paper: same pastel and dark ink in both themes */
  --note-ink:#26211B; --note-filter:none;
  --mark-op:.85;
  --wash-op:.55;
  --av-ink:rgba(38,33,27,.72);

  --sh-1:0 1px 2px rgba(38,33,27,.05), 0 3px 10px rgba(38,33,27,.045);
  --sh-2:0 1px 2px rgba(38,33,27,.05), 0 10px 26px -8px rgba(38,33,27,.14);
  --sh-3:0 2px 4px rgba(38,33,27,.05), 0 26px 60px -18px rgba(38,33,27,.22);
  --scrim:rgba(38,33,27,.28);

  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease-out:cubic-bezier(.22,.72,.24,1);
  --ease-spring:cubic-bezier(.16,.9,.3,1.02);
  color-scheme:light;
}
/* Night paper: a warm desk under a lamp, not a black UI. Pastels become low-alpha tints with
   lifted inks; hard shadows keep their colour so ink-bordered things still "sit up". */
html[data-theme="dark"]{
  --paper:#15110D; --paper-2:#1B1712; --paper-3:#25201A; --card:#1F1A15;
  --ink:#F2EADC; --ink-2:#CDBFAB; --ink-3:#948876;
  --line:#2F271E; --line-2:#43382B;

  --peach:#E5A28A;  --peach-soft:rgba(255,178,148,.085); --peach-ink:#FFB49A; --peach-bd:rgba(255,178,148,.22);
  --sky:#8DB2EC;    --sky-soft:rgba(150,190,255,.085);   --sky-ink:#AACBFF;   --sky-bd:rgba(150,190,255,.22);
  --mint:#80CBA4;   --mint-soft:rgba(140,220,180,.08);   --mint-ink:#8FDDB6;  --mint-bd:rgba(140,220,180,.22);
  --butter:#E3BF66; --butter-soft:rgba(255,214,120,.08); --butter-ink:#F0CC72;--butter-bd:rgba(255,214,120,.22);
  --lilac:#A593EE;  --lilac-soft:rgba(180,160,255,.10);  --lilac-ink:#C4B6FF; --lilac-bd:rgba(180,160,255,.26);
  --rose:#E598B7;   --rose-soft:rgba(255,160,200,.08);   --rose-ink:#FFAACB;  --rose-bd:rgba(255,160,200,.22);

  --note-filter:brightness(.93) saturate(.85);
  --mark-op:.42;
  --wash-op:.9;
  --av-ink:rgba(22,18,14,.78);
  --sh-1:0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25);
  --sh-2:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -10px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.4), 0 26px 60px -18px rgba(0,0,0,.75);
  --scrim:rgba(5,4,2,.6);
  color-scheme:dark;
}

/* ---------- base ---------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .35s var(--ease-out), color .35s var(--ease-out);
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0; list-style:none}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--lilac-ink); outline-offset:2px; border-radius:6px}


.ic{width:18px; height:18px; flex:none}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.display{font-family:var(--display); font-weight:600; letter-spacing:-.028em}

/* highlighter behind a word — hand-drawn, slightly off-register */
.hi{position:relative; white-space:nowrap; z-index:0}
.hi::before{
  content:''; position:absolute; z-index:-1; left:-.12em; right:-.12em; bottom:.04em; height:.5em;
  background:var(--mark, var(--butter)); border-radius:.4em .55em .38em .6em;
  transform:rotate(-.8deg) scaleX(var(--mx,1)); transform-origin:left center; opacity:var(--mark-op);
  transition:transform .8s var(--ease-spring) .35s;
}
.boot .hi::before{--mx:0}

.eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:.7rem; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.eyebrow::before{content:''; width:18px; height:2px; border-radius:2px; background:var(--eb, var(--peach))}

/* buttons: ink pill with a hard pastel shadow that lifts on hover, presses on click */
.btn{
  --bg:var(--ink); --fg:var(--paper); --hs:var(--lilac);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 17px; border-radius:999px; border:1.5px solid var(--ink);
  background:var(--bg); color:var(--fg); font-weight:600; font-size:.88rem; letter-spacing:-.01em;
  box-shadow:2.5px 2.5px 0 var(--hs); white-space:nowrap; text-decoration:none;
  transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), background .2s, color .2s;
}
.btn:hover{transform:translate(-1.5px,-1.5px); box-shadow:4.5px 4.5px 0 var(--hs)}
.btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--hs)}
.btn .ic{width:15px; height:15px}
.btn--ghost{--bg:var(--card); --fg:var(--ink); --hs:var(--peach)}
.btn--soft{--bg:transparent; --fg:var(--ink-2); border-color:var(--line-2); box-shadow:none}
.btn--soft:hover{border-color:var(--ink-3); color:var(--ink); box-shadow:none; transform:translateY(-1px)}
.btn--sm{padding:6px 12px; font-size:.8rem; box-shadow:2px 2px 0 var(--hs)}
.btn--sm.btn--soft{box-shadow:none}

.pill{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
  font-size:.74rem; font-weight:600; white-space:nowrap;
  background:var(--p-bg, var(--paper-2)); color:var(--p-fg, var(--ink-2)); border:1px solid var(--p-bd, var(--line));
}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.t-peach{--p-bg:var(--peach-soft); --p-fg:var(--peach-ink); --p-bd:var(--peach-bd)}
.t-sky{--p-bg:var(--sky-soft); --p-fg:var(--sky-ink); --p-bd:var(--sky-bd)}
.t-mint{--p-bg:var(--mint-soft); --p-fg:var(--mint-ink); --p-bd:var(--mint-bd)}
.t-butter{--p-bg:var(--butter-soft); --p-fg:var(--butter-ink); --p-bd:var(--butter-bd)}
.t-lilac{--p-bg:var(--lilac-soft); --p-fg:var(--lilac-ink); --p-bd:var(--lilac-bd)}
.t-rose{--p-bg:var(--rose-soft); --p-fg:var(--rose-ink); --p-bd:var(--rose-bd)}

.avatar{
  width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-size:.68rem; font-weight:700; letter-spacing:-.02em; font-style:normal;
  background:var(--av, var(--lilac)); color:var(--av-ink); border:1.5px solid rgba(38,33,27,.08);
}
.avatar--sm{width:24px; height:24px; font-size:.6rem}
.avatar--ghost{background:transparent; border:1.5px dashed var(--line-2); color:var(--ink-3)}

kbd{font-family:var(--mono); font-size:.68rem; border:1px solid var(--line-2); border-radius:6px; padding:1px 6px; background:var(--paper-2); color:var(--ink-3)}
.iconbtn{width:34px; height:34px; flex:none; display:grid; place-items:center; border-radius:10px; border:1.5px solid transparent; background:none; color:var(--ink-3); transition:background .16s, color .16s, border-color .16s}
.iconbtn:hover{background:var(--card); color:var(--ink); border-color:var(--line)}
.iconbtn .ic{width:17px; height:17px; transition:transform .25s var(--ease-spring)}
/* briefing */
.brief{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:clamp(20px,4vw,56px); align-items:start}
.kick{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.kick .chip{padding:2px 9px; border-radius:999px; background:var(--card); border:1.5px solid var(--line-2); color:var(--ink-2)}
.greet{font-family:var(--display); font-weight:600; letter-spacing:-.032em; line-height:1.04; font-size:clamp(2.05rem,3.7vw,3.05rem); margin-top:14px; display:flex; flex-wrap:wrap; align-items:center; gap:0 .28em}
.wave{display:inline-block; width:.82em; height:.82em; color:var(--butter-ink); transform-origin:70% 85%}
.wave svg{width:100%; height:100%}
.boot .wave{animation:wave 1.6s var(--ease-out) .55s 1 both}
@keyframes wave{0%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(9deg)}100%{transform:rotate(0)}}
.digest{margin-top:14px; display:flex; gap:10px; align-items:flex-start; font-size:1.02rem; line-height:1.55; color:var(--ink-2); max-width:62ch}
.aichip{flex:none; display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--lilac-soft); border:1px solid var(--lilac-bd); color:var(--lilac-ink); font-size:.64rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; margin-top:3px}
.aichip .ic{width:9px; height:9px}
.toast{position:fixed; left:50%; bottom:76px; transform:translate(-50%,10px); z-index:80; padding:9px 15px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); box-shadow:3px 3px 0 var(--mint); font-size:.84rem; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s, transform .3s var(--ease-spring); display:flex; gap:8px; align-items:center}
.toast.on{opacity:1; transform:translate(-50%,0)}
.toast .ic{width:15px; height:15px; color:var(--mint-ink)}

/* paper burst */
.bit{position:fixed; z-index:90; width:9px; height:12px; border-radius:2px; pointer-events:none; animation:bit .9s var(--ease-out) forwards}
@keyframes bit{to{transform:translate(var(--x),var(--y)) rotate(var(--r)); opacity:0}}

/* entrance: reveal-and-swap, nothing perpetual */
[data-r]{opacity:1; transform:none; transition:opacity .6s var(--ease-out) var(--d,0ms), transform .8s var(--ease-spring) var(--d,0ms)}
.boot [data-r]{opacity:0; transform:translate3d(0,16px,0)}

/* composer: the form a quick action opens */
.cm-shade{position:fixed; inset:0; z-index:78; background:var(--scrim); display:grid; place-items:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s}
.cm-shade.open{opacity:1; pointer-events:auto}
.cm{
  width:min(480px,100%); max-height:calc(100vh - 32px); overflow:auto; background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r-lg);
  box-shadow:6px 6px 0 var(--tone, var(--lilac)); transform:translateY(12px) scale(.98); transition:transform .32s var(--ease-spring);
}
.cm-shade.open .cm{transform:none}
.cm-h{display:flex; align-items:center; gap:13px; padding:18px 20px 4px}
.cm-h .tile{width:42px; height:42px; border-radius:13px; transform:rotate(-4deg)}
.cm-h .tile .ic{width:20px; height:20px}
.cm-h p{font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.cm-h h3{font-family:var(--display); font-weight:600; font-size:1.3rem; letter-spacing:-.025em; line-height:1.15}
.cm-h .iconbtn{margin-left:auto; align-self:flex-start}
.cm-b{padding:14px 20px 4px; display:grid; gap:13px}
.cm-b > *{min-width:0}
.prov > span:last-child{min-width:0}
.cm-f{display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:16px 20px 18px}
.cm-f .note{margin-right:auto; font-size:.74rem; color:var(--ink-3); max-width:24ch; line-height:1.35}
.fld > span{display:block; font-size:.74rem; font-weight:600; color:var(--ink-2); margin-bottom:5px}
.inp{
  width:100%; padding:10px 13px; border-radius:var(--r-sm); border:1.5px solid var(--line-2); background:var(--paper);
  outline:none; font-size:.9rem; color:var(--ink); transition:border-color .15s, box-shadow .15s;
}
.inp:focus{border-color:var(--ink); box-shadow:2px 2px 0 var(--tone, var(--lilac))}
textarea.inp{resize:vertical; min-height:72px; line-height:1.45}
select.inp{appearance:none; -webkit-appearance:none; padding-right:34px; cursor:pointer;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size:5px 5px; background-repeat:no-repeat}
.amt-inp{position:relative}
.amt-inp::before{content:'$'; position:absolute; left:13px; top:50%; transform:translateY(-50%); font-family:var(--display); font-weight:600; color:var(--ink-3)}
.amt-inp .inp{padding-left:26px; font-family:var(--display); font-weight:600; font-size:1.05rem}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg span{display:inline-flex; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line-2); font-size:.8rem; font-weight:550; color:var(--ink-2); transition:background .15s, border-color .15s, color .15s}
.seg input:checked + span{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.seg input:focus-visible + span{outline:2px solid var(--lilac-ink); outline-offset:2px}
@keyframes fresh{0%,30%{background:var(--butter-soft); box-shadow:0 0 0 6px var(--butter-soft)} 100%{background:transparent; box-shadow:0 0 0 6px transparent}}
.cef.is-allday .t-only{display:none}
.cef.is-allday .a-only{display:contents}
.sw{display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-size:.82rem; font-weight:550; color:var(--ink-2)}
.sw input{position:absolute; opacity:0; pointer-events:none}
.sw .track{width:36px; height:21px; border-radius:999px; background:var(--paper-3); border:1.5px solid var(--line-2); position:relative; transition:background .2s, border-color .2s; flex:none}
.sw .track::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .25s var(--ease-spring)}

/* ---------- page frame --------------------------------------------------- */
.wrap{max-width:1200px; margin:0 auto; padding:clamp(26px,3.4vw,44px) clamp(16px,3vw,44px) 140px}
.brief{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end}
.brief .acts{display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end}
.sec{display:flex; align-items:baseline; gap:12px; margin:40px 0 16px}
.sec h2{font-family:var(--display); font-weight:600; font-size:1.35rem; letter-spacing:-.025em; white-space:nowrap}
.sec .rule{flex:1; height:1.5px; background:var(--line); min-width:20px; align-self:center}
.sec .cnt{font-family:var(--mono); font-size:.72rem; color:var(--ink-3); white-space:nowrap}
.sec .hint{font-size:.8rem; color:var(--ink-3)}
.tile{width:32px; height:32px; flex:none; border-radius:10px; display:grid; place-items:center; background:var(--p-bg); border:1.5px solid var(--p-bd); color:var(--p-fg)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:600; background:var(--p-bg, var(--paper-2)); color:var(--p-fg, var(--ink-2)); border:1px solid var(--p-bd, var(--line)); white-space:nowrap}
.chip .ic{width:12px; height:12px}

/* ---------- 1. the cash box ---------------------------------------------- */
.hero{margin-top:28px; display:grid; grid-template-columns:minmax(0,360px) minmax(0,1fr); gap:34px; align-items:center; padding:26px 30px; background:var(--card); border:1.5px solid var(--ink); border-radius:8px 18px 10px 16px; box-shadow:5px 5px 0 var(--butter)}
.hero.done{box-shadow:5px 5px 0 var(--mint)}
.hero.first{box-shadow:5px 5px 0 var(--lilac)}
.hero .tag{font-family:var(--mono); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--butter-ink)}
.hero.done .tag{color:var(--mint-ink)} .hero.first .tag{color:var(--lilac-ink)}
.hero h2{margin-top:6px; font-family:var(--display); font-weight:600; font-size:clamp(1.5rem,2.6vw,2rem); letter-spacing:-.034em; line-height:1.1}
.hero p.m{margin-top:10px; color:var(--ink-2); font-size:.94rem; line-height:1.55; max-width:52ch}
.hero p.m b{color:var(--ink)}
.hero .facts{margin-top:14px; display:flex; flex-wrap:wrap; gap:8px}
.hero .acts{margin-top:20px; display:flex; flex-wrap:wrap; gap:10px}
.box{display:block; width:100%; height:auto; overflow:visible}
.box .lid{fill:var(--paper-3); stroke:var(--ink); stroke-width:2}
.box .hinge{stroke:var(--ink); stroke-width:2; stroke-linecap:round}
.box .shell{fill:var(--card); stroke:var(--ink); stroke-width:2}
.box .tray{fill:var(--paper-2); stroke:var(--line-2); stroke-width:1.5}
.box .well{fill:var(--card); stroke:var(--line-2); stroke-width:1.4}
.box .well.empty{fill:none; stroke-dasharray:4 4}
.box .wl{font-family:var(--mono); font-size:11px; font-weight:600; fill:var(--ink-3); opacity:.6}
.box .bill{stroke:var(--ink); stroke-width:1.2}
.box .b20{fill:var(--mint)} .box .b10{fill:var(--sky)} .box .b5{fill:var(--lilac)} .box .b1{fill:var(--paper-3)}
.box .bl{font-family:var(--display); font-weight:700; font-size:12px; fill:var(--note-ink)}
.box .bseal{fill:none; stroke:var(--note-ink); stroke-width:1; opacity:.45}
.box .cnt{font-family:var(--mono); font-size:11px; font-weight:600; fill:var(--ink-2)}
.box .cup{fill:var(--card); stroke:var(--line-2); stroke-width:1.4}
.box .coin{fill:var(--butter); stroke:var(--ink); stroke-width:1.1}
.box .dig{fill:var(--sky-soft); stroke:var(--sky-ink); stroke-width:1.2; stroke-dasharray:3 2}
.box .digt{font-family:var(--mono); font-size:10px; font-weight:600; fill:var(--sky-ink)}
.box .note{fill:var(--butter); stroke:rgba(38,33,27,.15)}
.box .notet{font-family:var(--display); font-weight:700; font-size:15px; fill:var(--note-ink)}
.box .tape{fill:rgba(255,255,255,.6); stroke:rgba(38,33,27,.1)}
.box .stamp rect{fill:var(--card); fill-opacity:.9; stroke-width:3}
.box .stamp text{font-family:var(--mono); font-weight:700; letter-spacing:.14em}
.box .stamp{color:var(--mint-ink); transform-box:fill-box; transform-origin:center}
.box .stamp.slam{animation:slam .55s var(--ease-spring) both}
@keyframes slam{0%{transform:scale(1.8) rotate(-14deg); opacity:0} 60%{opacity:1} 100%{transform:scale(1) rotate(-8deg); opacity:.9}}
.box .stack{transition:transform .5s var(--ease-spring)}
.boot .box .stack{transform:translateY(14px); opacity:0}
.box.ghost .lid,.box.ghost .shell{stroke:var(--line-2); stroke-dasharray:6 5; fill:none}
.box.ghost .tray{fill:none; stroke-dasharray:4 4}

/* ---------- 2. coming up: event cards with the shift strip --------------- */
.up{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap:16px}
.ev{display:flex; flex-direction:column; padding:18px 18px 16px; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); min-width:0}
.ev.soon{border-color:var(--ink); box-shadow:4px 4px 0 var(--peach)}
.ev.fresh{animation:fresh 2.4s var(--ease-out)}
.ev-top{display:grid; grid-template-columns:52px minmax(0,1fr); gap:14px; align-items:start}
.cal{display:block; text-align:center; border:1.5px solid var(--ink); border-radius:11px; overflow:hidden; background:var(--card); line-height:1.05; transform:rotate(-2deg); box-shadow:2px 2px 0 var(--butter)}
.cal small{display:block; padding:3px 0 2px; background:var(--butter); color:var(--note-ink); filter:var(--note-filter); font-family:var(--mono); font-size:.56rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase}
.cal b{display:block; padding:4px 0 1px; font-family:var(--display); font-weight:600; font-size:1.35rem; letter-spacing:-.03em}
.cal i{display:block; padding-bottom:4px; font-style:normal; font-family:var(--mono); font-size:.56rem; color:var(--ink-3); text-transform:uppercase}
.ev.soon .cal small{background:var(--peach)} .ev.soon .cal{box-shadow:2px 2px 0 var(--peach)}
.ev h3{font-family:var(--display); font-weight:600; font-size:1.14rem; letter-spacing:-.024em; line-height:1.2}
.ev .meta{margin-top:4px; display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.78rem; color:var(--ink-3)}
.ev .meta span{display:inline-flex; align-items:center; gap:4px}
.ev .meta .ic{width:12px; height:12px}
.ev .tags{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px}
.sheet{margin-top:14px; padding:12px 12px 10px; border-radius:6px; background:var(--paper-2); border:1.5px dashed var(--line-2); position:relative}
.sheet::before{content:''; position:absolute; left:50%; top:-8px; width:58px; height:15px; transform:translateX(-50%) rotate(-2deg); background:rgba(255,255,255,.6); border:1px solid rgba(38,33,27,.08)}
html[data-theme="dark"] .sheet::before{background:rgba(255,255,255,.08)}
.sheet-h{display:flex; align-items:baseline; gap:8px; margin-bottom:8px}
.sheet-h b{font-family:var(--mono); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.sheet-h .n{margin-left:auto; font-family:var(--mono); font-size:.74rem; font-weight:600}
.sheet-h .n.short{color:var(--peach-ink)} .sheet-h .n.full{color:var(--mint-ink)}
.shift{display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; align-items:center; padding:4px 0}
.shift + .shift{border-top:1px dotted var(--line-2)}
.shift .t{font-family:var(--mono); font-size:.72rem; color:var(--ink-2); white-space:nowrap}
.seats{display:flex; flex-wrap:wrap; gap:6px}
.seat{width:32px; height:32px; border-radius:50%; padding:0; display:grid; place-items:center; border:1.5px dashed var(--line-2); background:transparent; color:var(--ink-3); cursor:pointer; transition:transform .18s var(--ease-spring), border-color .15s, background .15s}
.seat .ic{width:14px; height:14px}
.seat:hover{transform:scale(1.1); border-color:var(--ink); color:var(--ink); background:var(--card)}
.seat.open.hot{border-color:var(--peach-ink); color:var(--peach-ink); background:var(--peach-soft)}
.seat.taken{border:0; cursor:default}
.seat.taken .avatar{width:32px; height:32px; font-size:.64rem}
.seat.me{cursor:pointer}
.seat.me .avatar{box-shadow:0 0 0 2px var(--card), 0 0 0 3.5px var(--ink)}
.seat.pop{animation:pop .5s var(--ease-spring)}
@keyframes pop{0%{transform:scale(.4)} 100%{transform:scale(1)}}
.ev-foot{margin-top:auto; padding-top:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.ev-foot .float{font-size:.76rem; color:var(--ink-3); display:inline-flex; align-items:center; gap:5px; margin-right:auto}
.ev-foot .float .ic{width:13px; height:13px}
.ev-foot .tal{font-family:var(--mono); font-size:.74rem; color:var(--mint-ink); font-weight:600}
.ev-empty{padding:26px; border:1.5px dashed var(--line-2); border-radius:var(--r-lg); color:var(--ink-3); font-size:.9rem; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap}

/* ---------- 3. till receipts on a rail ----------------------------------- */
.rail-wrap{position:relative; overflow-x:auto; padding:0 4px 30px; margin:0 -4px}
.rail{position:relative; display:flex; gap:16px; align-items:flex-start; min-width:max-content; padding-top:16px}
.rail::before{content:''; position:absolute; left:0; right:0; top:4px; height:8px; border-radius:6px; background:var(--paper-3); border:1.5px solid var(--ink)}
.avg{position:absolute; left:0; right:0; height:0; border-top:1.5px dashed var(--butter-ink); z-index:2; pointer-events:none}
.avg span{position:absolute; right:0; top:-22px; font-family:var(--mono); font-size:.66rem; font-weight:600; color:var(--butter-ink); background:var(--paper); padding:1px 6px; border-radius:4px; white-space:nowrap}
.rc{position:relative; flex:none; width:158px; padding:14px 13px 22px; background:#FFFFFF; color:#26211B; border:0; text-align:left; font:inherit; cursor:pointer; transform-origin:top center; transition:transform .25s var(--ease-spring);
  -webkit-mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 7px repeat-x, linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat;
  mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 7px repeat-x, linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat}
html[data-theme="dark"] .rc{background:#EFE7D6}
.rcw{flex:none; display:block; filter:drop-shadow(0 0 .6px rgba(38,33,27,.55)) drop-shadow(0 6px 9px rgba(38,33,27,.14))}
html[data-theme="dark"] .rcw{filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.rc:hover{transform:rotate(-1.2deg) translateY(2px)}
.rc .pin{position:absolute; left:50%; top:-1px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:#26211B}
.rc .hd{font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:#8A7F71; text-align:center; margin-top:4px}
.rc .nm{min-height:2.3em; margin-top:4px; font-family:var(--display); font-weight:600; font-size:.98rem; line-height:1.15; letter-spacing:-.02em; text-align:center}
.rc hr{border:0; border-top:1.5px dashed #CDBFAB; margin:9px 0}
.rc .ln{display:flex; justify-content:space-between; gap:6px; font-family:var(--mono); font-size:.72rem; color:#544A3F}
.rc .ln b{color:#26211B; font-weight:600}
.rc .ln.net{margin-top:6px; padding-top:6px; border-top:3px double #26211B; font-size:.82rem}
.rc .ln.net b{font-size:.92rem}
.rc .rate{margin-top:10px; text-align:center; font-family:var(--display); font-weight:700; font-size:1.25rem; letter-spacing:-.03em; color:#1B815B}
.rc .rate small{display:block; font-family:var(--mono); font-size:.6rem; font-weight:600; letter-spacing:.08em; color:#8A7F71; text-transform:uppercase}
.rc .crew{margin-top:8px; display:flex; justify-content:center; flex-wrap:wrap; gap:1px; color:#544A3F}
.rc .crew .ic{width:11px; height:11px}
.rc .cz{display:block; margin:10px auto 0; width:max-content; max-width:100%; padding:2px 8px; border-radius:999px; font-size:.64rem; font-weight:600; border:1px solid currentColor; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rc .fill{flex:1}
.rc.fresh{animation:drop 1s var(--ease-spring)}
@keyframes drop{0%{transform:translateY(-40px); opacity:0} 100%{transform:none; opacity:1}}
.rc.ghost{background:transparent; border:1.5px dashed var(--line-2); filter:none; color:var(--ink-3); -webkit-mask:none; mask:none; border-radius:4px; cursor:default; width:200px}
.rc.ghost .nm{color:var(--ink-3)}

/* ---------- 4 + 5: two columns ------------------------------------------- */
.duo{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); min-width:0}
.card-h{display:flex; align-items:center; gap:11px; padding:16px 18px 6px}
.card-h h3{font-family:var(--display); font-size:1.12rem; font-weight:600; letter-spacing:-.022em}
.card-h small{margin-left:auto; font-family:var(--mono); font-size:.68rem; color:var(--ink-3); text-align:right}
.card-s{padding:0 18px; font-size:.82rem; color:var(--ink-3); line-height:1.45}
/* what pays */
.pays{padding:14px 18px 18px}
.pr{display:grid; grid-template-columns:118px minmax(0,1fr); gap:12px; align-items:center; padding:9px 0}
.pr + .pr{border-top:1px dotted var(--line-2)}
.pr .k{font-size:.84rem; font-weight:600; line-height:1.2}
.pr .k small{display:block; font-weight:400; font-size:.72rem; color:var(--ink-3); margin-top:2px}
.pr .bw{display:flex; align-items:center; gap:10px; min-width:0}
.pr .bar{position:relative; height:26px; flex:none; width:calc(var(--w) * 1%); max-width:calc(100% - 64px); min-width:8px; border:1.5px solid var(--ink); border-radius:4px 10px 10px 4px; background:repeating-linear-gradient(135deg, var(--c) 0 8px, color-mix(in srgb, var(--c) 80%, var(--ink)) 8px 10px); transform-origin:left; transition:transform .9s var(--ease-spring) var(--dl,0ms)}
.boot .pr .bar{transform:scaleX(0)}
.pr .v{font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:-.03em; white-space:nowrap}
.pr .v small{font-family:var(--mono); font-size:.66rem; font-weight:600; color:var(--ink-3); letter-spacing:0}
.pr .crew{grid-column:2; display:flex; flex-wrap:wrap; gap:1px; color:var(--ink-3); margin-top:-2px}
.pr .crew .ic{width:12px; height:12px}
.pr.top .k::after{content:'best use of time'; display:block; margin-top:3px; width:max-content; padding:1px 6px; border-radius:4px; background:var(--mint-soft); color:var(--mint-ink); font-family:var(--mono); font-size:.58rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.pays-ft{padding:0 18px 16px; font-size:.74rem; color:var(--ink-3)}
.wait{margin:14px 18px 18px; padding:18px; border:1.5px dashed var(--line-2); border-radius:var(--r-md); color:var(--ink-3); font-size:.86rem; line-height:1.5}
.wait .dots{margin-top:10px; display:flex; gap:6px}
.wait .dots i{width:14px; height:14px; border-radius:50%; border:1.5px dashed var(--line-2)}
.wait .dots i.on{border:1.5px solid var(--ink); background:var(--butter)}
/* jars */
.jars{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap:6px 14px; padding:12px 14px 16px}
.jr{min-width:0; display:grid; grid-template-columns:92px minmax(0,1fr); gap:12px; align-items:end; padding:8px 4px}
.jr h4{font-family:var(--display); font-weight:600; font-size:.98rem; letter-spacing:-.02em; line-height:1.2}
.jr .tot{margin-top:2px; font-family:var(--display); font-weight:700; font-size:1.35rem; letter-spacing:-.035em}
.jr .tot small{font-family:var(--sans); font-weight:500; font-size:.74rem; color:var(--ink-3); letter-spacing:0}
.jr ul{margin-top:6px; display:grid; gap:1px}
.jr li{min-width:0; display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--ink-2); padding:2px 4px; border-radius:5px; cursor:default}
.jr li i{width:10px; height:10px; flex:none; border-radius:2px; border:1px solid var(--ink); background:var(--lc)}
.jr li span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.jr li b{margin-left:auto; font-family:var(--mono); font-weight:600; color:var(--ink)}
.jr li.hl,.jr li:hover{background:var(--paper-2)}
.jar{display:block; width:100%; height:auto; overflow:visible}
.jar .glass{fill:var(--card)}
.jar .body{fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linejoin:round}
.jar .lid{fill:var(--lc0); stroke:var(--ink); stroke-width:1.8; filter:var(--note-filter)}
.jar .slot{fill:var(--ink)}
.jar .lay{stroke:var(--ink); stroke-width:1; transition:opacity .2s, transform 1s var(--ease-spring); transform-box:view-box}
.jar.dim .lay{opacity:.35} .jar.dim .lay.hl{opacity:1}
.boot .jar .lay{transform:translateY(112px)}
.jar .tg{stroke:var(--ink); stroke-width:1.4; stroke-dasharray:4 3}
.jar .tgt{font-family:var(--mono); font-size:9px; font-weight:600; fill:var(--ink-2)}
.jar .glare{fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; opacity:.55}
html[data-theme="dark"] .jar .glare{opacity:.12}
.jar.ghost .body{stroke:var(--line-2); stroke-dasharray:5 4} .jar.ghost .lid{fill:var(--paper-3); stroke:var(--line-2); filter:none}
.jr .stamp{display:inline-block; margin-top:6px; padding:1px 7px; border:2px solid var(--mint-ink); border-radius:4px; font-family:var(--mono); font-size:.58rem; font-weight:700; letter-spacing:.14em; color:var(--mint-ink); transform:rotate(-4deg)}
.jr .stamp.hold{border-color:var(--rose-ink); color:var(--rose-ink)}

/* ---------- 6. punch cards ----------------------------------------------- */
.punch{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap:12px}
.pc{position:relative; display:block; width:100%; text-align:left; padding:12px 14px 12px 16px; background:var(--card); border:1.5px solid var(--line-2); border-radius:6px 6px 6px 18px; font:inherit; color:inherit; cursor:pointer; transition:transform .18s var(--ease-spring), border-color .15s}
.pc::before{content:''; position:absolute; left:0; top:0; bottom:0; width:6px; border-radius:6px 0 0 18px; background:var(--av)}
.pc:hover{transform:translateY(-2px); border-color:var(--ink-3)}
.pc.open{border-color:var(--ink); box-shadow:3px 3px 0 var(--av)}
.pc-h{display:flex; align-items:center; gap:10px}
.pc-h b{font-size:.88rem; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pc-h .n{margin-left:auto; font-family:var(--mono); font-size:.72rem; color:var(--ink-3); white-space:nowrap}
.holes{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap}
.holes i{position:relative; width:17px; height:17px; border-radius:50%; border:1.5px dashed var(--line-2)}
.holes i.p{border:1.5px solid var(--ink); background:var(--paper-3); box-shadow:inset 0 2px 0 rgba(38,33,27,.18)}
.holes i.goal::after{content:''; position:absolute; left:50%; top:-7px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--butter-ink)}
.pc ul{margin-top:10px; padding-top:8px; border-top:1px dashed var(--line-2); display:grid; gap:3px}
.pc li{display:flex; gap:8px; font-size:.76rem; color:var(--ink-2)}
.pc li span:last-child{margin-left:auto; font-family:var(--mono); color:var(--ink-3)}

/* ---------- 7. count sheet ------------------------------------------------ */
.cm--count{width:min(940px,100%)}
.cs{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:22px; padding:12px 20px 4px}
.form{padding:16px 18px 14px; background:#FFFDF8; color:#26211B; border:1.5px solid #26211B; border-radius:3px; box-shadow:3px 3px 0 var(--butter); background-image:repeating-linear-gradient(transparent 0 33px, #D8E6F8 33px 34px); background-position:0 44px}
html[data-theme="dark"] .form{background-color:#EFE7D6}
.form .ft{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:9px; border-bottom:1.5px solid #26211B; background:#FFFDF8}
html[data-theme="dark"] .form .ft{background:#EFE7D6}
.form .ft b{font-family:var(--display); font-size:1rem; letter-spacing:-.02em}
.form .ft small{font-family:var(--mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:#8A7F71}
.fl{display:grid; grid-template-columns:72px 18px 64px minmax(0,1fr); align-items:center; gap:6px; height:34px; font-family:var(--mono); font-size:.86rem}
.fl .d{font-weight:600}
.fl .x{color:#8A7F71; text-align:center}
.fl input{width:100%; height:26px; padding:0 6px; border:0; border-bottom:1.5px solid #8A7F71; background:transparent; font:inherit; font-weight:600; color:#2A66C7; text-align:center; outline:none}
.fl input:focus{border-bottom-color:#26211B; background:rgba(255,229,160,.45)}
.fl .eq{text-align:right; font-weight:600}
.fl.wide{grid-template-columns:minmax(0,1fr) 110px}
.fl.wide input{text-align:right}
.fl.red{color:#C9542D}
.fl.red input{color:#C9542D}
.fl.cost{grid-template-columns:18px minmax(0,1fr) 90px 22px}
.fl.cost input.l{text-align:left; color:#C9542D}
.fl .rm{width:22px; height:22px; border:0; background:none; color:#8A7F71; cursor:pointer; padding:0; font-size:1rem; line-height:1}
.addc{margin:4px 0 0; padding:0; border:0; background:none; font-family:var(--mono); font-size:.74rem; color:#C9542D; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.form .net{margin-top:10px; padding-top:8px; border-top:4px double #26211B; display:flex; justify-content:space-between; align-items:baseline; background:#FFFDF8}
html[data-theme="dark"] .form .net{background:#EFE7D6}
.form .net span{font-weight:600; font-size:.9rem}
.form .net b{font-family:var(--display); font-size:1.6rem; letter-spacing:-.035em}
.form .net b.neg{color:#C9542D}
.cs-r{display:grid; gap:14px; align-content:start}
.xchk{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:12px; font-size:.84rem; line-height:1.45; background:var(--paper-2); color:var(--ink-2)}
.xchk .ic{width:16px; height:16px; flex:none; margin-top:2px}
.xchk.ok{background:var(--mint-soft); color:var(--mint-ink)}
.xchk.off{background:var(--peach-soft); color:var(--peach-ink)}
.xchk b{color:inherit}
.who-h{display:flex; align-items:baseline; gap:8px; font-size:.78rem; font-weight:600; color:var(--ink-2)}
.who-h small{margin-left:auto; font-family:var(--mono); font-weight:500; color:var(--ink-3)}
.who{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.who label{cursor:pointer; position:relative}
.who input{position:absolute; opacity:0; pointer-events:none}
.who span{display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 3px; border-radius:999px; border:1.5px solid var(--line-2); font-size:.78rem; font-weight:550; color:var(--ink-3); transition:all .15s}
.who span .avatar{width:22px; height:22px; font-size:.54rem; filter:grayscale(1); opacity:.55}
.who input:checked + span{border-color:var(--ink); color:var(--ink); background:var(--card)}
.who input:checked + span .avatar{filter:none; opacity:1}
.who input:focus-visible + span{outline:2px solid var(--lilac-ink); outline-offset:2px}

/* ---------- 8. the phone at the table ------------------------------------ */
.ph-shade{position:fixed; inset:0; z-index:85; background:var(--scrim); display:grid; place-items:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s}
.ph-shade.open{opacity:1; pointer-events:auto}
.phone{position:relative; width:min(370px,100%); height:min(760px, calc(100vh - 32px)); display:flex; flex-direction:column; background:var(--paper); border:2px solid var(--ink); border-radius:42px; box-shadow:7px 7px 0 var(--butter); overflow:hidden; transform:translateY(16px); transition:transform .35s var(--ease-spring)}
.ph-shade.open .phone{transform:none}
.phone .notch{position:absolute; left:50%; top:9px; width:96px; height:24px; margin-left:-48px; border-radius:999px; background:var(--ink); z-index:3}
.ph-top{padding:46px 20px 14px; text-align:center; border-bottom:1.5px dashed var(--line-2); position:relative}
.ph-top .x{position:absolute; right:12px; top:40px}
.ph-top p{font-family:var(--mono); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.ph-top h3{font-family:var(--display); font-weight:600; font-size:1.05rem; letter-spacing:-.02em}
.ph-top .ph-tot{color:var(--ink); text-transform:none; letter-spacing:-.05em; margin-top:10px; font-family:var(--display); font-weight:700; font-size:3rem; letter-spacing:-.05em; line-height:1}
.ph-top .ph-tot.bump{animation:bump .35s var(--ease-spring)}
@keyframes bump{40%{transform:scale(1.08)}}
.ph-top .ph-sub{text-transform:none; letter-spacing:0; margin-top:4px; font-family:var(--mono); font-size:.72rem; color:var(--ink-3)}
.spike{position:relative; height:74px; margin:12px 20px 0; display:flex; justify-content:center}
.spike .rod{position:absolute; left:50%; bottom:6px; width:3px; height:62px; margin-left:-1.5px; background:var(--ink); border-radius:2px}
.spike .base{position:absolute; left:50%; bottom:0; width:56px; height:8px; margin-left:-28px; background:var(--ink); border-radius:4px}
.spike .stub{position:absolute; left:50%; width:62px; height:20px; margin-left:-31px; background:#FFFDF8; border:1px solid rgba(38,33,27,.3); border-radius:3px; font-family:var(--mono); font-size:.58rem; font-weight:600; color:#26211B; display:grid; place-items:center; box-shadow:0 1px 1px rgba(38,33,27,.12)}
.tix{flex:1; overflow:auto; padding:14px 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start}
.tk{position:relative; padding:14px 12px 12px; border:1.5px solid var(--ink); border-radius:10px; background:var(--tk, var(--butter)); color:var(--note-ink); filter:var(--note-filter); text-align:left; font:inherit; cursor:pointer; transition:transform .12s var(--ease-spring)}
.tk::before,.tk::after{content:''; position:absolute; top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink)}
.tk::before{left:-8px} .tk::after{right:-8px}
.tk:active{transform:scale(.95)}
.tk b{display:block; font-family:var(--display); font-weight:600; font-size:.98rem; letter-spacing:-.02em; line-height:1.15}
.tk span{display:block; margin-top:4px; font-family:var(--mono); font-weight:600; font-size:.86rem}
.tk .c{position:absolute; right:10px; top:8px; min-width:22px; height:22px; padding:0 5px; border-radius:999px; background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:.7rem; font-weight:600; display:grid; place-items:center}
.tk.other{background:var(--card); border-style:dashed; filter:none; color:var(--ink)}
.flying{position:fixed; z-index:95; width:62px; height:20px; background:#FFFDF8; border:1px solid rgba(38,33,27,.3); border-radius:3px; font-family:var(--mono); font-size:.58rem; font-weight:600; color:#26211B; display:grid; place-items:center; pointer-events:none; transition:transform .45s cubic-bezier(.3,.7,.3,1), opacity .45s}
.ph-foot{padding:12px 16px 22px; border-top:1.5px dashed var(--line-2); display:flex; gap:8px}
.ph-foot .btn{flex:1}
.ph-other{display:flex; gap:8px; padding:0 16px 10px}
.ph-other input{flex:1}
.ph-other[hidden]{display:none}

/* ---------- plan sheet: live shift preview ------------------------------- */
.plan-pv{padding:12px; border-radius:8px; background:var(--paper-2); border:1.5px dashed var(--line-2)}
.plan-pv .sheet-h{margin-bottom:6px}
.kinds{display:flex; flex-wrap:wrap; gap:6px}
.kinds label{cursor:pointer; position:relative}
.kinds input{position:absolute; opacity:0; pointer-events:none}
.kinds span{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border:1.5px solid var(--line-2); border-radius:999px; font-size:.8rem; font-weight:550; color:var(--ink-2)}
.kinds span .ic{width:14px; height:14px}
.kinds input:checked + span{border-color:var(--ink); color:var(--ink); background:var(--butter-soft); box-shadow:2px 2px 0 var(--butter)}
.kinds input:focus-visible + span{outline:2px solid var(--lilac-ink); outline-offset:2px}
.cm--plan{width:min(560px,100%)}

/* ---------- receipt detail ----------------------------------------------- */
.det{display:grid; grid-template-columns:minmax(0,1fr) 200px; gap:20px; padding:12px 20px 4px; align-items:start}
.det .rc{width:100%; cursor:default}
.det .rc:hover{transform:none}
.det-l .row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dotted var(--line-2); font-size:.86rem; color:var(--ink-2)}
.det-l .row b{font-family:var(--mono); color:var(--ink)}
.det-l h5{margin:14px 0 6px; font-family:var(--mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.det-l .crewl{display:flex; flex-wrap:wrap; gap:6px}

/* ---------- mock bar ------------------------------------------------------ */
.mockbar{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:70; display:flex; align-items:center; gap:4px; padding:5px; border-radius:999px; background:var(--ink); box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.mockbar .lab{padding:0 8px 0 10px; font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; color:rgba(255,255,255,.55)}
html[data-theme="dark"] .mockbar .lab{color:rgba(0,0,0,.5)}
.mockbar button{border:0; background:none; color:var(--paper); padding:7px 12px; border-radius:999px; font-size:.8rem; font-weight:600; opacity:.75}
.mockbar button[aria-pressed="true"]{background:var(--butter); color:var(--note-ink); opacity:1}
.mockbar .sep{width:1px; height:18px; background:rgba(255,255,255,.2); margin:0 2px}
html[data-theme="dark"] .mockbar .sep{background:rgba(0,0,0,.2)}

@media (max-width:980px){
  .duo{grid-template-columns:minmax(0,1fr)}
  .cs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .brief{grid-template-columns:minmax(0,1fr)}
  .brief .acts{justify-content:flex-start}
  .hero{grid-template-columns:minmax(0,1fr); padding:20px 18px; gap:18px}
  .hero .bx{max-width:320px}
  .det{grid-template-columns:minmax(0,1fr)}
  .det .rc{max-width:220px}
}
@media (max-width:480px){
  .pr{grid-template-columns:minmax(0,1fr)}
  .pr .crew{grid-column:1}
  .jr{grid-template-columns:76px minmax(0,1fr)}
  .fl{grid-template-columns:56px 14px 54px minmax(0,1fr); font-size:.8rem}
  .sec .cnt,.sec .hint{display:none}
  .mockbar .lab{display:none}
}
</style>
</head>

      fl.className = "flying"; fl.textContent = m0(v); fl.style.left = (r.left + r.width / 2 - 31) + "px"; fl.style.top = (r.top + r.height / 2 - 10) + "px"; document.body.appendChild(fl);
      requestAnimationFrame(function () { fl.style.transform = "translate(" + (sp.left - r.left - r.width / 2 + 32) + "px," + (sp.top - r.top - r.height / 2 + 30) + "px) rotate(" + (Math.random() * 20 - 10) + "deg)"; fl.style.opacity = ".2"; });
      setTimeout(function () { fl.remove(); }, 480);
    }
    drawPhone(true);
  }

  /* ---------- events ---------------------------------------------------------------------------- */
  document.addEventListener("click", function (ev) {
    var m = ev.target.closest("[data-mock]");
    if (m) { S.mode = m.dataset.mock; try { localStorage.setItem("fe-mock-mode", S.mode); } catch (e) {} S.open = null; render(true); window.scrollTo(0, 0); return; }
    if (ev.target.closest("[data-theme-btn]")) { var r = document.documentElement, d = r.dataset.theme === "dark" ? "light" : "dark"; r.dataset.theme = d; try { localStorage.setItem("fe-mock-theme", d); } catch (e) {} $("[data-theme-btn]").textContent = d === "dark" ? "Day" : "Night"; return; }
    if (ev.target.closest("[data-close]") || ev.target.id === "cm") { closeSheet(); return; }
    if (ev.target.id === "ph") { $("#ph").classList.remove("open"); return; }
    var tk = ev.target.closest("[data-tap]"); if (tk) { tap(tk, +tk.dataset.tap, tk.dataset.lab); return; }
    var t = ev.target.closest("[data-a]"); if (!t) return;
    ev.preventDefault();
    var p = t.dataset.a.split(":"), cmd = p[0];
    switch (cmd) {
      case "plan": openPlan(); return;
      case "count": openCount(p[1]); return;
      case "rc": openRc(p[1]); return;
      case "run": openRun(p[1]); return;
      case "pc": S.open = S.open === p[1] ? null : p[1]; rerender(); return;
      case "take": case "drop":
        var e = evById(p[1]), x = e.shifts[+p[2]], j = +p[3];
        if (cmd === "take") {
          if (x.seats.indexOf(ME) > -1) { toast("You’re already on the " + x.t + " shift"); return; }
          x.seats[j] = ME; S.pop = p[1] + ":" + p[2] + ":" + j;
          var si = seatsInfo(e); var b = t.getBoundingClientRect(); if (si.f === si.n) burst(b.left + b.width / 2, b.top);
          rerender(); toast(si.f === si.n ? "You took " + x.t + " — " + e.name + " is fully staffed" : "You’re on " + e.name + ", " + x.t + " · " + (si.n - si.f) + " still open");
        } else { x.seats[j] = null; rerender(); toast("You dropped the " + x.t + " shift"); }
        return;
      case "addcost": csRead(); S.cs.costs.push(["", ""]); drawCosts(); csLive(); var li = $$("[data-cl]").slice(-1)[0]; if (li) li.focus(); return;
      case "rmcost": csRead(); S.cs.costs.splice(+p[1], 1); drawCosts(); csLive(); return;
      case "phclose": $("#ph").classList.remove("open"); $("#ph").setAttribute("aria-hidden", "true"); return;
      case "other": var o = $("[data-oth]"); o.hidden = !o.hidden; if (!o.hidden) $("#ph-amt").focus(); return;
      case "otherok": var v = r2(num($("#ph-amt").value)); if (!(v > 0)) { $("#ph-amt").focus(); return; } S.tally.taps.push(v); S.tally.labels.push(null); drawPhone(true); return;
      case "undo": S.tally.taps.pop(); S.tally.labels.pop(); drawPhone(true); return;
      case "phdone":
        var te = evById(S.tally.id); te.tally = S.tally.taps.slice(); $("#ph").classList.remove("open"); $("#ph").setAttribute("aria-hidden", "true");
        if (te.date <= TODAY()) { rerender(); setTimeout(function () { openCount(te.id); }, 200); }
        else { rerender(); toast("Tally saved — " + m0(tallySum(te)) + " rung up for " + te.name); }
        return;
    }
  });
  document.addEventListener("input", function (e) {
    var f = e.target.form;
    if (f && f.id === "cm-form" && f.dataset.kind === "count") csLive();
    if (f && f.id === "cm-form" && f.dataset.kind === "plan") planPv();
  });
  document.addEventListener("change", function (e) {
    var f = e.target.form;
    if (f && f.id === "cm-form" && f.dataset.kind === "count") csLive();
    if (f && f.id === "cm-form" && f.dataset.kind === "plan") planPv();
  });
  document.addEventListener("mouseover", function (e) {
    var li = e.target.closest("[data-hl]"), jr = e.target.closest(".jr");
    $$(".jar.dim").forEach(function (j) { if (!jr || !jr.contains(j)) j.classList.remove("dim"); });
    if (!li) { if (jr) { var jj = $(".jar", jr); jj.classList.remove("dim"); $$(".lay.hl", jr).forEach(function (l) { l.classList.remove("hl"); }); } return; }
    var j = $(".jar", jr); j.classList.add("dim"); $$(".lay", j).forEach(function (l) { l.classList.toggle("hl", l.dataset.l === li.dataset.hl); });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeSheet(); $("#ph").classList.remove("open"); } });
  document.addEventListener("submit", function (e) {
    e.preventDefault(); var f = e.target; if (f.id !== "cm-form") return;
    var g = function (n) { return (f.elements[n] && f.elements[n].value || "").trim(); };
    if (f.dataset.kind === "count") {
      var c = csRead(), ev = evById(S.cs.id);
      if (!cashOf(c) && !c.dig) { f.elements.b20.focus(); toast("Count something — a 0 in every line is fine if the box was empty"); return; }
      if (!S.cs.worked.length) { toast("Tick who worked — it’s how hours get credited"); return; }
      c.worked = S.cs.worked.slice(); ev.count = c;
      var b = f.querySelector(".cm-f .btn:not(.btn--soft)").getBoundingClientRect(); burst(b.left + b.width / 2, b.top);
      closeSheet(); S.justCounted = ev.id; var mm = money(ev);
      render(false); window.scrollTo({ top: 0, behavior: reduce.matches ? "auto" : "smooth" });
      toast(ev.name + " cleared " + m0(mm.net) + " — filed to Treasury"); return;
    }
    if (f.dataset.kind === "plan") {
      if (!g("name")) { f.elements.name.focus(); toast("Name the fundraiser"); return; }
      var ss = planShifts(f); if (!ss.length) { f.elements.end.focus(); toast("The end has to come after the start"); return; }
      var lab = function (v) { var h = +v.split(":")[0], m = v.split(":")[1]; return ((h % 12) || 12) + (m !== "00" ? ":" + m : "") + (h < 12 ? " AM" : " PM"); };
      var ne = { id: "n" + (++S.seq), name: g("name"), date: g("date") || plus(TODAY(), 7), time: lab(g("start")) + " – " + lab(g("end")), loc: g("loc") || "Add a place", kind: (f.querySelector('input[name="kind"]:checked') || {}).value || "food", cause: g("cause"), float: r2(num(g("float"))), shifts: ss, count: null };
      if (ne.date <= TODAY()) ne.date = plus(TODAY(), 1);
      EV().push(ne); closeSheet(); S.fresh = ne.id; rerender();
      setTimeout(function () { var el = $("#ev-" + ne.id); if (el) el.scrollIntoView({ block: "center", behavior: reduce.matches ? "auto" : "smooth" }); }, 60);
      toast("Planned “" + ne.name + "” — " + ss.reduce(function (a, x) { return a + x.seats.length; }, 0) + " seats open for sign-up"); return;
    }
    closeSheet();
  });
  window.addEventListener("resize", function () { requestAnimationFrame(placeAvg); });

  render(true);
})();
</script>
