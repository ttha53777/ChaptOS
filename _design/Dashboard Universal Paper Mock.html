<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens: lifted verbatim from app/paper-aesthetic.css (day + night) ───── */
:root{
  --pp-ease-out:cubic-bezier(.22,.72,.24,1);
  --pp-ease-spring:cubic-bezier(.16,.9,.3,1.02);
  --serif:"Bricolage Grotesque",system-ui,sans-serif;
  --sans:"Inter",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
:root,[data-theme="day"]{
  color-scheme:light;
  --pp-peach:#FFD5C4;--pp-peach-soft:#FFEDE5;--pp-peach-ink:#C9542D;--pp-peach-bd:#F8D2C2;
  --pp-sky:#CFE2FF;--pp-sky-soft:#EAF2FF;--pp-sky-ink:#2A66C7;--pp-sky-bd:#CCDFFB;
  --pp-mint:#C7EFDA;--pp-mint-soft:#E6F8EF;--pp-mint-ink:#1B815B;--pp-mint-bd:#BDE7D2;
  --pp-butter:#FFE5A0;--pp-butter-soft:#FFF6DC;--pp-butter-ink:#9C6B08;--pp-butter-bd:#F4DFA6;
  --pp-lilac:#E1D8FF;--pp-lilac-soft:#F1EDFF;--pp-lilac-ink:#6244CC;--pp-lilac-bd:#DCD2FB;
  --pp-rose:#FFD6E6;--pp-rose-soft:#FFEDF4;--pp-rose-ink:#C23C77;--pp-rose-bd:#F8CEE0;
  --pp-note-ink:#26211B;--pp-note-filter:none;--pp-mark-op:.85;
  --pp-sh-1:0 1px 2px rgba(38,33,27,.05),0 3px 10px rgba(38,33,27,.045);
  --pp-sh-2:0 1px 2px rgba(38,33,27,.05),0 10px 26px -8px rgba(38,33,27,.14);
  --pp-sh-3:0 2px 4px rgba(38,33,27,.05),0 26px 60px -18px rgba(38,33,27,.22);
  --paper:#FFFCF6;--paper-2:#FBF5EA;--card:#FFFFFF;--card-2:#FBF5EA;--card-3:#F4ECDD;
  --ink:#26211B;--ink-soft:#544A3F;--muted:#8A7F71;--faint:#998D7C;
  --line:#EBE1CF;--line-soft:#F4ECDD;--line-med:#DCD0B9;--scrim:rgba(38,33,27,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]){
    color-scheme:dark;
    --pp-peach:#E5A28A;--pp-peach-soft:rgba(255,178,148,.085);--pp-peach-ink:#FFB49A;--pp-peach-bd:rgba(255,178,148,.22);
    --pp-sky:#8DB2EC;--pp-sky-soft:rgba(150,190,255,.085);--pp-sky-ink:#AACBFF;--pp-sky-bd:rgba(150,190,255,.22);
    --pp-mint:#80CBA4;--pp-mint-soft:rgba(140,220,180,.08);--pp-mint-ink:#8FDDB6;--pp-mint-bd:rgba(140,220,180,.22);
    --pp-butter:#E3BF66;--pp-butter-soft:rgba(255,214,120,.08);--pp-butter-ink:#F0CC72;--pp-butter-bd:rgba(255,214,120,.22);
    --pp-lilac:#A593EE;--pp-lilac-soft:rgba(180,160,255,.10);--pp-lilac-ink:#C4B6FF;--pp-lilac-bd:rgba(180,160,255,.26);
    --pp-rose:#E598B7;--pp-rose-soft:rgba(255,160,200,.08);--pp-rose-ink:#FFAACB;--pp-rose-bd:rgba(255,160,200,.22);
    --pp-note-filter:brightness(.93) saturate(.85);--pp-mark-op:.42;
    --pp-sh-1:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.25);
    --pp-sh-2:0 1px 2px rgba(0,0,0,.4),0 12px 28px -10px rgba(0,0,0,.6);
    --pp-sh-3:0 2px 4px rgba(0,0,0,.4),0 26px 60px -18px rgba(0,0,0,.75);
    --paper:#15110D;--paper-2:#1B1712;--card:#1F1A15;--card-2:#25201A;--card-3:#2B251E;
    --ink:#F2EADC;--ink-soft:#CDBFAB;--muted:#948876;--faint:#7D7262;
    --line:#2F271E;--line-soft:#262019;--line-med:#43382B;--scrim:rgba(5,4,2,.6);
  }
}
:root[data-theme="night"]{
  color-scheme:dark;
  --pp-peach:#E5A28A;--pp-peach-soft:rgba(255,178,148,.085);--pp-peach-ink:#FFB49A;--pp-peach-bd:rgba(255,178,148,.22);
  --pp-sky:#8DB2EC;--pp-sky-soft:rgba(150,190,255,.085);--pp-sky-ink:#AACBFF;--pp-sky-bd:rgba(150,190,255,.22);
  --pp-mint:#80CBA4;--pp-mint-soft:rgba(140,220,180,.08);--pp-mint-ink:#8FDDB6;--pp-mint-bd:rgba(140,220,180,.22);
  --pp-butter:#E3BF66;--pp-butter-soft:rgba(255,214,120,.08);--pp-butter-ink:#F0CC72;--pp-butter-bd:rgba(255,214,120,.22);
  --pp-lilac:#A593EE;--pp-lilac-soft:rgba(180,160,255,.10);--pp-lilac-ink:#C4B6FF;--pp-lilac-bd:rgba(180,160,255,.26);
  --pp-rose:#E598B7;--pp-rose-soft:rgba(255,160,200,.08);--pp-rose-ink:#FFAACB;--pp-rose-bd:rgba(255,160,200,.22);
  --pp-note-filter:brightness(.93) saturate(.85);--pp-mark-op:.42;
  --pp-sh-1:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.25);
  --pp-sh-2:0 1px 2px rgba(0,0,0,.4),0 12px 28px -10px rgba(0,0,0,.6);
  --pp-sh-3:0 2px 4px rgba(0,0,0,.4),0 26px 60px -18px rgba(0,0,0,.75);
  --paper:#15110D;--paper-2:#1B1712;--card:#1F1A15;--card-2:#25201A;--card-3:#2B251E;
  --ink:#F2EADC;--ink-soft:#CDBFAB;--muted:#948876;--faint:#7D7262;
  --line:#2F271E;--line-soft:#262019;--line-med:#43382B;--scrim:rgba(5,4,2,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{width:16px;height:16px;flex:none}
::selection{background:var(--pp-lilac)}

/* tone helpers */
.t-peach{--p-bg:var(--pp-peach-soft);--p-fg:var(--pp-peach-ink);--p-bd:var(--pp-peach-bd);--p-solid:var(--pp-peach)}
.t-sky{--p-bg:var(--pp-sky-soft);--p-fg:var(--pp-sky-ink);--p-bd:var(--pp-sky-bd);--p-solid:var(--pp-sky)}
.t-mint{--p-bg:var(--pp-mint-soft);--p-fg:var(--pp-mint-ink);--p-bd:var(--pp-mint-bd);--p-solid:var(--pp-mint)}
.t-butter{--p-bg:var(--pp-butter-soft);--p-fg:var(--pp-butter-ink);--p-bd:var(--pp-butter-bd);--p-solid:var(--pp-butter)}
.t-lilac{--p-bg:var(--pp-lilac-soft);--p-fg:var(--pp-lilac-ink);--p-bd:var(--pp-lilac-bd);--p-solid:var(--pp-lilac)}
.t-rose{--p-bg:var(--pp-rose-soft);--p-fg:var(--pp-rose-ink);--p-bd:var(--pp-rose-bd);--p-solid:var(--pp-rose)}
.tile{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--p-bg);color:var(--p-fg);border:1.5px solid var(--p-bd)}
.tile .ic{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--p-bg);color:var(--p-fg);border:1px solid var(--p-bd);white-space:nowrap}

/* ── Shell ─────────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1.5px solid var(--line);background:var(--paper-2);padding:14px 12px}
.sb-org{display:flex;align-items:center;gap:11px;padding:4px 6px 14px;border-bottom:1.5px solid var(--line);margin:0 -12px;padding-left:18px;padding-right:18px}
.sb-logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:.82rem;background:var(--pp-butter);color:var(--pp-note-ink);transform:rotate(-3deg);box-shadow:2px 2px 0 var(--pp-peach);border:1.5px solid var(--pp-note-ink)}
.sb-org b{display:block;font-family:var(--serif);font-weight:600;font-size:.98rem;letter-spacing:-.02em;line-height:1.15}
.sb-org small{font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.06em}
.sb-org .ic{margin-left:auto;color:var(--muted)}
.sb-needs{margin:14px 0 6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--pp-sh-1);display:flex;align-items:center;gap:8px;font-weight:600;font-size:.86rem}
.sb-needs .ic{color:var(--pp-peach-ink)}
.sb-needs .n{margin-left:auto;min-width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:.68rem;background:var(--pp-peach-soft);color:var(--pp-peach-ink);border:1px solid var(--pp-peach-bd)}
.sb-grp{margin-top:12px;display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:.62rem;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sb-grp::before{content:"";width:12px;height:2px;border-radius:2px;background:var(--eb,var(--pp-peach))}
.sb-a{display:flex;align-items:center;gap:11px;height:38px;padding:0 11px;margin:2px 0;border-radius:12px;border:1.5px solid transparent;color:var(--ink-soft);font-size:.9rem;font-weight:500;text-decoration:none;transition:background .16s}
.sb-a:hover{background:var(--card-3)}
.sb-a.on{background:var(--card);border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:2.5px 2.5px 0 var(--pp-butter)}
.sb-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1.5px solid var(--line);margin-left:-12px;margin-right:-12px;padding-left:18px}
.sb-me b{display:block;font-size:.86rem}
.sb-me small{font-size:.74rem;color:var(--muted)}

.main{padding:34px clamp(16px,3.4vw,46px) 120px;max-width:1240px;width:100%}

/* mock strip */
.mock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:var(--pp-sh-3);font-size:.76rem;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.mock .lbl{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;opacity:.6;padding:0 6px 0 10px;white-space:nowrap}
.mock button{padding:6px 12px;border-radius:999px;white-space:nowrap;opacity:.75;font-weight:500}
.mock button:hover{opacity:1}
.mock button.on{background:var(--paper);color:var(--ink);opacity:1;font-weight:600}
.mock .sep{width:1px;height:18px;background:currentColor;opacity:.2;margin:0 4px;flex:none}

/* ── Header ───────────────────────────────────────────────────────────── */
.kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.kicker .today{padding:2px 9px;border-radius:999px;background:var(--card);border:1.5px solid var(--line-med);color:var(--ink-soft)}
h1.greet{font-family:var(--serif);font-weight:600;letter-spacing:-.032em;line-height:1.04;font-size:clamp(2.05rem,3.7vw,3.05rem);margin-top:14px}
h1.greet em{font-style:normal;position:relative;white-space:nowrap;z-index:0}
h1.greet em::before{content:"";position:absolute;z-index:-1;left:-.12em;right:-.12em;bottom:.04em;height:.5em;background:var(--pp-butter);border-radius:.4em .55em .38em .6em;transform:rotate(-.8deg);transform-origin:left center;opacity:var(--pp-mark-op)}
.first h1.greet em::before{animation:mark .8s var(--pp-ease-spring) .35s both}
@keyframes mark{from{transform:rotate(-.8deg) scaleX(0)}}
.wave{display:inline-block;width:.82em;height:.82em;margin-left:.28em;vertical-align:-.06em;color:var(--pp-butter-ink);transform-origin:70% 85%}
.first .wave{animation:wave 1.6s var(--pp-ease-out) .55s both}
.wave .ic{width:100%;height:100%}
@keyframes wave{0%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(9deg)}100%{transform:rotate(0)}}
.digest{margin-top:14px;display:flex;gap:10px;align-items:flex-start;max-width:64ch}
.digest .tag{flex:none;margin-top:4px;font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.08em;padding:2px 9px;border-radius:999px;background:var(--pp-lilac-soft);color:var(--pp-lilac-ink);border:1px solid var(--pp-lilac-bd)}
.digest p{font-size:1.02rem;line-height:1.55;color:var(--ink-soft)}
.digest p b{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

.btn{--bg:var(--card);--fg:var(--ink);--hs:var(--pp-peach);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:999px;border:1.5px solid var(--ink);background:var(--bg);color:var(--fg);font-weight:600;font-size:.88rem;letter-spacing:-.01em;box-shadow:2.5px 2.5px 0 var(--hs);white-space:nowrap;transition:transform .18s var(--pp-ease-spring),box-shadow .18s var(--pp-ease-spring),background .2s}
.btn:hover{transform:translate(-1.5px,-1.5px);box-shadow:4.5px 4.5px 0 var(--hs)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--hs)}
.btn .ic{width:15px;height:15px}
.btn.solid{--bg:var(--ink);--fg:var(--paper);--hs:var(--pp-lilac)}
.btn.sm{padding:6px 12px;font-size:.8rem;box-shadow:2px 2px 0 var(--hs)}
.btn.ghost{border-color:var(--line-med);box-shadow:none;color:var(--ink-soft)}
.btn.ghost:hover{transform:translateY(-1px);border-color:var(--muted);color:var(--ink)}

/* term card (top right) */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:clamp(20px,4vw,56px);align-items:start}
.term{position:relative;margin-top:6px;padding:16px 18px 14px;background:var(--card);border:1.5px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--pp-butter);transform:rotate(.6deg)}
.term::before{content:"";position:absolute;top:-9px;right:28px;width:70px;height:18px;transform:rotate(-4deg);background:var(--pp-lilac);opacity:.7;border-radius:2px}
.term-k{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.term-v{margin-top:6px;font-family:var(--serif);font-weight:600;font-size:1.9rem;letter-spacing:-.04em;line-height:1}
.term-v small{font-size:.95rem;color:var(--muted);margin-left:6px;letter-spacing:-.02em}
.term-sub{margin-top:5px;font-size:.82rem;color:var(--ink-soft)}
.term-sub b{color:var(--ink);font-weight:600}
.ruler{position:relative;display:flex;gap:3px;height:26px;margin-top:30px;align-items:flex-end}
.ruler i{flex:1;height:12px;border-radius:3px;background:var(--card-3);border:1px solid var(--line)}
.ruler i.past{background:var(--pp-butter);border-color:var(--pp-butter-bd)}
.ruler i.now{height:22px;background:var(--ink);border-color:var(--ink)}
.ruler .flag{position:absolute;top:-6px;transform:translateX(-30%);color:var(--p-fg)}
.ruler .flag .ic{width:15px;height:15px}
.ruler .you{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--mono);font-size:.56rem;font-weight:600;letter-spacing:.08em;white-space:nowrap;padding:1px 6px;border-radius:999px;background:var(--ink);color:var(--paper)}
.ms{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:5px}
.ms li{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-soft)}
.ms .dot{width:8px;height:8px;border-radius:50%;background:var(--p-fg);flex:none}
.ms .wk{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.ms li.done{opacity:.5;text-decoration:line-through}

/* ── Empty + day-one states ─────────────────────────────────────────── */
.m .v.unset{color:var(--muted)}
.meter.unset{background:none;border:1.5px dashed var(--line-med);height:8px}
.note-act{font-family:var(--sans);font-weight:600;color:var(--ink);border-bottom:1.5px solid var(--line-med);cursor:pointer}
.sb-needs.calm{color:var(--ink-soft);font-weight:500}
.sb-needs.calm .ic{color:var(--pp-mint-ink)}


.next.empty{border-style:dashed;border-color:var(--line-med);box-shadow:none}
.next.empty .stub{background:var(--card-2);color:var(--muted)}
.next.empty .stub .dd{color:var(--line-med)}
.next.empty .stub::before,.next.empty .stub::after{border-color:var(--line-med)}
.tk-hint{font-size:.9rem;color:var(--ink-soft);max-width:52ch}
/* Day one: warm, not empty */
.d1chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--pp-butter-soft);border:1.5px solid var(--pp-butter-bd);color:var(--pp-butter-ink)}
.d1chip .ic{width:11px;height:11px}
.m .v.say{font-size:1.3rem;letter-spacing:-.025em;margin-top:12px;line-height:1.1}
.seats{display:flex;gap:5px;margin-top:12px}
.seats i{width:12px;height:12px;border-radius:50%;border:1.5px dashed var(--line-med)}
.seats i.me{background:var(--p-fg);border:1.5px solid var(--p-fg)}
.next.empty .stub .dd.star{display:grid;place-items:center;width:58px;height:58px;margin:6px 0;border-radius:50%;background:var(--pp-butter);border:1.5px solid var(--pp-note-ink);color:var(--pp-note-ink);filter:var(--pp-note-filter);transform:rotate(-8deg)}
.next.empty .stub .dd.star .ic{width:28px;height:28px}
.next.empty .tk-top .pill .ic{width:11px;height:11px}
.empty-day.hello{display:flex;align-items:center;gap:10px;border-style:solid;border-color:var(--pp-butter-bd);background:var(--pp-butter-soft);color:var(--ink-soft)}
.empty-day.hello > .ic{width:18px;height:18px;flex:none;color:var(--pp-butter-ink)}
.empty-day.hello a{color:var(--ink);font-weight:600}
.seat-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seat-row .av.me{width:34px;height:34px;font-size:.72rem;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.seat{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line-med);background:none;color:var(--muted);cursor:pointer;transition:transform .18s var(--pp-ease-spring),border-color .15s,color .15s}
.seat:hover{border-color:var(--pp-sky-ink);color:var(--pp-sky-ink);border-style:solid;transform:translateY(-2px)}
.seat .ic{width:13px;height:13px}
@container (max-width:380px){.seat:nth-of-type(n+6){display:none}}
.seat-cap{font-size:.8rem;color:var(--muted);margin-top:-6px}
.inv-tape{position:relative;margin-top:6px;padding:16px;border-radius:18px;background:var(--pp-sky);color:var(--pp-note-ink);filter:var(--pp-note-filter);transform:rotate(.5deg);box-shadow:var(--pp-sh-2)}
.inv-tape::after{content:"";position:absolute;left:50%;top:-8px;width:58px;height:16px;transform:translateX(-50%) rotate(3deg);background:rgba(255,255,255,.5);border-inline:1px dashed rgba(38,33,27,.16)}
.inv-tape .k{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.inv-tape > b{display:block;margin-top:3px;font-family:var(--serif);font-weight:600;font-size:1.15rem;letter-spacing:-.022em}
.inv-tape .linkchip{margin-top:11px;display:flex;align-items:center;gap:8px;padding:5px 5px 5px 13px;border-radius:999px;border:1.5px solid var(--pp-note-ink);background:rgba(255,255,255,.65)}
.inv-tape .linkchip code{font-family:var(--mono);font-size:.74rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-tape .btn{--hs:rgba(38,33,27,.22);background:var(--pp-note-ink);color:#FFFCF6;border-color:var(--pp-note-ink);flex:none}
.share-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.share-pills button{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1.5px solid rgba(38,33,27,.25);background:rgba(255,255,255,.45);font:inherit;font-size:.78rem;font-weight:600;color:var(--pp-note-ink);cursor:pointer}
.share-pills button:hover{background:rgba(255,255,255,.75)}
.share-pills .ic{width:13px;height:13px}
.inv-tape .rv{margin-top:10px;display:flex;gap:7px;align-items:center;font-size:.76rem;opacity:.8}
.inv-tape .rv .ic{width:13px;height:13px;flex:none}
.act-hello{display:flex;gap:10px;align-items:flex-start;margin:6px 18px 8px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line-med);font-size:.82rem;color:var(--muted);line-height:1.45}
.act-hello .ic{width:15px;height:15px;flex:none;margin-top:2px;color:var(--pp-rose-ink)}
.hello-box{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--pp-peach-soft);border:1.5px solid var(--pp-peach-bd)}
.hello-box b{font-size:.92rem;font-weight:600}
.hello-box p{font-size:.8rem;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.note-card.draft .k{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em;opacity:.7}
.note-card.draft .k .ic{width:14px;height:14px}
.note-card.draft p{opacity:.8}
.note-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.note-acts .btn{--hs:rgba(38,33,27,.22);background:var(--pp-note-ink);color:#FFFCF6;border-color:var(--pp-note-ink)}
.note-acts .btn.ghost{background:rgba(255,255,255,.4);color:var(--pp-note-ink);border-color:rgba(38,33,27,.3);box-shadow:none}
.empty-in p b{color:var(--ink);font-weight:600}
.q-chips{display:flex;flex-direction:column;gap:6px;width:100%}
.q-chips button{text-align:left;padding:9px 12px;border-radius:12px;border:1.5px solid var(--pp-lilac-bd);background:var(--pp-lilac-soft);font:inherit;font-size:.84rem;font-weight:500;color:var(--ink);cursor:pointer;transition:transform .18s var(--pp-ease-spring),border-color .15s}
.q-chips button:hover{border-color:var(--pp-lilac-ink);transform:translateX(2px)}
button.chip{background:none;font:inherit;font-size:.78rem;cursor:pointer}
button.chip:hover{border-style:solid;border-color:var(--ink);color:var(--ink)}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.starter{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);font-size:.84rem;font-weight:600;box-shadow:2px 2px 0 var(--pp-sky);transition:transform .18s var(--pp-ease-spring),box-shadow .18s}
.starter:hover{transform:translate(-1px,-1px);box-shadow:3.5px 3.5px 0 var(--pp-sky)}
.starter .ic{width:13px;height:13px}
.starter.ghost{border-color:var(--line-med);box-shadow:none;color:var(--ink-soft);font-weight:500}
.faces-n.first{display:inline-flex;align-items:center;gap:7px;margin:0;color:var(--ink-soft)}
.faces-n.first .ic{width:15px;height:15px;color:var(--pp-butter-ink)}


.inv-mini{margin-top:14px;padding:12px;border-radius:14px;background:var(--pp-sky-soft);border:1.5px solid var(--pp-sky-bd)}
.inv-mini p{font-size:.82rem;color:var(--ink-soft);line-height:1.4}
.inv-mini.calm{background:none;border-style:dashed;border-color:var(--line-med)}
.inv-row{margin-top:10px;display:flex;align-items:center;gap:8px}
.inv-row code{flex:1;min-width:0;font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line)}

.plate-empty{padding:16px;border:1.5px dashed var(--line-med);border-radius:14px;color:var(--muted);font-size:.86rem;line-height:1.45}
.note-empty{padding:18px 20px 16px;border-radius:5px 14px 7px 12px;border:1.5px dashed var(--pp-butter-ink);background:var(--pp-butter-soft);transform:rotate(-.6deg)}
.note-empty .k{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em;color:var(--pp-butter-ink)}
.note-empty .k .ic{width:14px;height:14px}
.note-empty p{margin:8px 0 12px;font-size:.9rem;color:var(--ink-soft);line-height:1.45}
.empty-in{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.empty-in p{font-size:.86rem;color:var(--ink-soft);line-height:1.45}
.last-poll{width:100%;display:flex;flex-direction:column;gap:5px;padding:12px;border-radius:14px;border:1.5px dashed var(--line-med)}
.last-poll .pill{align-self:flex-start}
.last-poll b{font-family:var(--serif);font-weight:600;font-size:1rem;letter-spacing:-.02em}
.last-poll small{font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1.5px dashed var(--line-med);font-size:.78rem;color:var(--ink-soft)}
.chip .ic{width:12px;height:12px;color:var(--muted)}
.empty-day.calm{display:flex;align-items:center;gap:8px;border-style:solid;border-color:var(--line);color:var(--ink-soft)}
.empty-day.calm b{color:var(--ink);font-weight:600}
.empty-day .ic{color:var(--pp-butter-ink)}
.ms-empty{margin-top:12px;font-size:.78rem;color:var(--muted);line-height:1.4}

/* option B: numbers up top */
.pulse.in-hero{margin-top:6px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pulse.in-hero .m{padding:12px 13px 11px;border-radius:18px}
.pulse.in-hero .m .v{font-size:1.5rem;margin-top:6px}
.pulse.in-hero .m .note{font-size:.66rem}
.pulse.in-hero .meter,.pulse.in-hero .ticks{margin-top:9px;height:6px}
.hero:has(.in-hero){grid-template-columns:minmax(0,1fr) 400px}

/* option C: ask */
.ask{margin-top:6px;padding:16px;border-radius:20px;background:var(--pp-lilac-soft);border:1.5px solid var(--pp-lilac-bd)}
.ask-k{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.1em;color:var(--pp-lilac-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-k .ic{width:13px;height:13px}
.ask-in{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--pp-lilac);color:var(--muted);font-size:.9rem;text-align:left;transition:transform .18s var(--pp-ease-spring),box-shadow .18s}
.ask-in:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pp-lilac)}
.ask-in span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-in kbd{font-family:var(--mono);font-size:.66rem;padding:2px 6px;border-radius:6px;border:1px solid var(--line-med)}
.ask-q{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ask-q button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:.82rem;color:var(--ink-soft);text-align:left}
.ask-q button:hover{border-color:var(--pp-lilac-ink);color:var(--ink)}
.ask-q .ic{width:13px;height:13px;color:var(--muted);flex:none}

/* option D: invite */
.inv{margin-top:6px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center;padding:16px;border-radius:20px;background:var(--card);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--pp-sky);transform:rotate(-.5deg)}
.inv-qr{padding:8px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:#26211B}
.inv-qr svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.inv-t{margin-top:6px;font-family:var(--serif);font-weight:600;font-size:1.12rem;letter-spacing:-.025em;line-height:1.15}
.inv-link{margin-top:6px;font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-acts{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* option E: today desk pad */
.pad{margin-top:6px;border-radius:14px;background:var(--card);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--pp-peach);overflow:hidden;transform:rotate(.8deg)}
.pad-top{display:flex;justify-content:space-between;padding:7px 14px;background:var(--pp-peach);color:var(--pp-note-ink);font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.14em;border-bottom:1.5px solid var(--ink);filter:var(--pp-note-filter)}
.pad-b{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:14px 16px 14px;background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--line-soft) 25px 26px)}
.pad-d{display:flex;flex-direction:column;align-items:center;padding-right:14px;border-right:1.5px dashed var(--line-med)}
.pad-d .n{font-family:var(--serif);font-weight:700;font-size:3.6rem;letter-spacing:-.06em;line-height:.9}
.pad-d .w{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.pad-l{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:2px}
.pad-r{display:flex;align-items:baseline;gap:7px;font-size:.84rem;color:var(--ink-soft);min-width:0}
.pad-r b{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--ink);flex:none}
.pad-r .dot{width:7px;height:7px;border-radius:50%;background:var(--p-fg);flex:none;align-self:center}
.pad-r.quiet{color:var(--muted)}
.pad-tmr{margin-top:4px;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Pulse row ───────────────────────────────────────────────────────── */
.pulse{margin-top:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pulse.in-hero > .m-wrap:nth-child(3){grid-column:1/-1}
.m{text-align:left;padding:15px 16px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--pp-sh-1);transition:transform .2s var(--pp-ease-spring),box-shadow .2s,border-color .2s}
.m:hover{transform:translateY(-2px);box-shadow:var(--pp-sh-2);border-color:var(--line-med)}
.m .k{display:flex;align-items:center;gap:8px;font-size:.66rem;font-weight:700;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.m .k .ic{width:15px;height:15px;color:var(--p-fg)}
.m .v{margin-top:8px;font-family:var(--serif);font-weight:600;font-size:1.9rem;letter-spacing:-.04em;line-height:1}
.m .v small{font-size:.95rem;letter-spacing:-.02em;color:var(--muted);margin-left:3px}
.m .note{margin-top:6px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.m .note.good{color:var(--pp-mint-ink)} .m .note.warn{color:var(--pp-peach-ink)}
.meter{display:block;height:8px;margin-top:12px;border-radius:6px;background:var(--card-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--p-fg);transform-origin:left}
.first .meter i{animation:grow 1.2s var(--pp-ease-out) .45s both}
@keyframes grow{from{transform:scaleX(0)}}
.ticks{display:flex;gap:4px;margin-top:12px;height:8px}
.ticks i{flex:1;border-radius:3px;background:var(--card-3)}
.ticks i.f{background:var(--p-fg)}

/* ── Grid + cards ────────────────────────────────────────────────────── */
.grid{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--pp-sh-1);min-width:0}
.card-h{display:flex;align-items:center;gap:11px;padding:16px 18px 12px}
.card-h h2{font-family:var(--serif);font-weight:600;font-size:1.08rem;letter-spacing:-.022em}
.card-h .sub{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.card-h .lnk{text-decoration:none;margin-left:auto;font-size:.8rem;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
.card-h .lnk:hover{color:var(--ink)}
.card-h .lnk .ic{width:13px;height:13px}
.card-b{padding:0 18px 18px}
.foot{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-top:1.5px solid var(--line-soft);font-size:.8rem;color:var(--muted);background:var(--card-2);border-radius:0 0 20px 20px}
.foot a,.foot button{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.foot .ic{width:13px;height:13px}
.count{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--pp-peach-soft);color:var(--pp-peach-ink);border:1px solid var(--pp-peach-bd)}
.count::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.count.done{background:var(--pp-mint-soft);color:var(--pp-mint-ink);border-color:var(--pp-mint-bd)}

/* Up next: the ticket */
.next-band{margin-top:22px}
.next{display:grid;grid-template-columns:132px minmax(0,1fr);overflow:hidden;border-color:var(--ink);box-shadow:5px 5px 0 var(--tk,var(--pp-sky))}
.stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:22px 10px;background:var(--p-bg);color:var(--p-fg);border-right:2px dashed var(--line-med)}
.stub::before,.stub::after{content:"";position:absolute;right:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.stub::before{top:-11px} .stub::after{bottom:-11px}
.stub .dw{font-family:var(--mono);font-size:.74rem;font-weight:600;letter-spacing:.14em}
.stub .dd{font-family:var(--serif);font-size:3.4rem;font-weight:700;letter-spacing:-.05em;line-height:.95;color:var(--ink)}
.stub .dm{font-family:var(--mono);font-size:.74rem;font-weight:600;letter-spacing:.14em}
.stub .live{display:none;margin-top:8px;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.1em;padding:2px 7px;border-radius:999px;background:var(--card);border:1px solid var(--p-bd)}
.next.open .stub .live{display:inline-flex;align-items:center;gap:5px}
.next.open .stub .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pp-mint-ink);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tk-b{padding:20px 22px 20px 26px;min-width:0;display:flex;flex-direction:column;gap:12px}
.tk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-top .eyebrow{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.when{margin-left:auto;font-family:var(--mono);font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ink);background:var(--pp-butter);color:var(--pp-note-ink);transform:rotate(1.5deg)}
.tk-b h3{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:-.03em;line-height:1.08}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-soft);font-size:.9rem}
.facts span{display:inline-flex;align-items:center;gap:7px}
.facts .ic{width:15px;height:15px;color:var(--muted)}
.tk-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-top:4px}
.faces{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.64rem;font-weight:700;background:var(--p-solid);color:var(--pp-note-ink);border:2px solid var(--card);flex:none}
.faces .av{margin-left:-8px}
.faces .av:first-child{margin-left:0}
.faces-n{font-size:.84rem;color:var(--ink-soft);margin-left:10px}
.faces-n b{color:var(--ink)}
.tk-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.checkin-live{display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--pp-mint-soft);border:1.5px solid var(--pp-mint-bd);color:var(--pp-mint-ink);font-size:.86rem;font-weight:600}
.checkin-live .big{font-family:var(--serif);font-size:1.4rem;letter-spacing:-.03em;color:var(--ink)}
.next.open .checkin-live{display:flex}
.next.open .tk-row{display:none}
.checkin-live .btn{margin-left:auto}

/* This week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 18px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);transition:border-color .15s,transform .2s var(--pp-ease-spring)}
.day:hover{border-color:var(--line-med);transform:translateY(-1px)}
.day .dw{font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.day .dn{font-family:var(--serif);font-weight:600;font-size:1.3rem;letter-spacing:-.03em;line-height:1}
.day .dots{display:flex;gap:3px;height:7px}
.day .dots i{width:7px;height:7px;border-radius:50%;background:var(--p-fg)}
.day.today{background:var(--pp-butter-soft);border-color:var(--pp-butter-bd)}
.day.today .dw{color:var(--pp-butter-ink)}
.day.past .dn{color:var(--muted)}
.day.sel{border-color:var(--ink);box-shadow:2.5px 2.5px 0 var(--pp-butter)}
.day-list{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px}
.day-list .h{font-size:.78rem;font-weight:600;color:var(--muted);padding-left:2px}
.ev{display:grid;grid-template-columns:72px 4px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px}
.ev .tm{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft)}
.ev .bar{height:28px;border-radius:3px;background:var(--p-fg)}
.ev b{font-weight:600;font-size:.92rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-size:.78rem;color:var(--muted)}
.empty-day{padding:12px 14px;border:1.5px dashed var(--line-med);border-radius:14px;color:var(--muted);font-size:.86rem}


/* People */
.ppl-top{display:flex;align-items:center;gap:14px}
.ppl-top .big{font-family:var(--serif);font-weight:600;font-size:2.2rem;letter-spacing:-.045em;line-height:1}
.ppl-top p{font-size:.82rem;color:var(--ink-soft);line-height:1.35}
.ppl-top p b{color:var(--pp-mint-ink)}
.req{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.req-h{font-size:.72rem;font-weight:700;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.req-r{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1.5px solid var(--line);border-radius:14px}
.req-r .av{margin:0}
.req-r b{font-size:.88rem;font-weight:600;display:block}
.req-r small{font-size:.74rem;color:var(--muted)}
.req-r .btn{margin-left:auto}
.crew{container-type:inline-size;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.crew .inv-mini{margin-top:0}
.crew .inv-mini.calm p{display:flex;align-items:flex-start;gap:7px}.crew .inv-mini p .ic{width:14px;height:14px;flex:none;margin-top:2px;color:var(--pp-mint-ink)}
.stand{container-type:inline-size;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.stand .req-h .sub{text-transform:none;letter-spacing:0;font-weight:500;font-size:.74rem;color:var(--muted);margin-left:4px}
.st-seg{display:flex;height:28px;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:3px 3px 0 var(--line-med)}
.st-seg button{min-width:0;border:0;padding:0 10px;text-align:left;font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--pp-note-ink);background:var(--p-solid);cursor:pointer;transition:opacity .2s}
.st-seg button + button{border-left:1.5px solid var(--ink)}
.st-seg button.dim{opacity:.3}
.st-key{display:flex;flex-wrap:wrap;gap:8px;margin-top:-2px}
.st-key button{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font:inherit;font-size:.8rem;font-weight:550;color:var(--ink-soft);cursor:pointer}
.st-key button:hover{border-color:var(--muted)}
.st-key button.on{border-color:var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--p-solid)}
.st-key i{width:9px;height:9px;border-radius:3px;background:var(--p-solid);border:1.5px solid var(--p-fg)}
.st-key b{font-family:var(--mono);font-size:.7rem;font-weight:400;color:var(--muted)}
.st-faces{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:2px 2px 0}
.st-faces button{padding:0;border:0;background:none;border-radius:50%;cursor:pointer;transition:transform .18s var(--pp-ease-spring)}
.st-faces button:hover{transform:translateY(-3px) scale(1.1)}
.st-faces .av{width:30px;height:30px;margin:0;border:0;background:var(--paper-2);color:var(--ink-soft);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--sb)}
.st-faces .you .av{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--sb),0 0 0 5.5px var(--ink)}
.ph-good{--sb:color-mix(in srgb,var(--pp-mint-ink) 45%,var(--pp-mint))}.ph-watch{--sb:color-mix(in srgb,var(--pp-butter-ink) 45%,var(--pp-butter))}.ph-risk{--sb:color-mix(in srgb,var(--pp-peach-ink) 45%,var(--pp-peach))}
.st-more{font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:6px 9px;border-radius:999px;border:1.5px dashed var(--line-med)}
.st-look{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:13px;background:var(--pp-peach-soft);border:1.5px solid var(--pp-peach-bd);font-size:.82rem;color:var(--ink-soft)}
.st-look > .ic{width:15px;height:15px;color:var(--pp-peach-ink);flex:none}
.st-look span{flex:1;min-width:0}.st-look b{color:var(--ink);font-weight:600}
.st-look .btn{flex:none}
.st-foot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px dashed var(--line-med);font-size:.8rem;color:var(--muted);min-width:0}
.st-foot > .ic{width:14px;height:14px;color:var(--pp-mint-ink);flex:none}
.st-foot code{flex:1;min-width:0;font-family:var(--mono);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.st-foot .btn{flex:none}
@container (max-width:460px){.st-foot code{display:none}.st-foot .btn{margin-left:auto}}
.newest{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}

/* Your list */
.plate{display:flex;flex-direction:column;gap:8px;padding:0 18px 16px}
.todo{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;transition:opacity .3s,border-color .2s}
.todo:hover{border-color:var(--line-med)}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-med);display:grid;place-items:center;color:transparent;background:var(--card);transition:all .2s var(--pp-ease-spring)}
.chk .ic{width:14px;height:14px}
.chk:hover{border-color:var(--ink)}
.todo.done .chk{background:var(--pp-mint);border-color:var(--pp-note-ink);color:var(--pp-note-ink);transform:rotate(-6deg)}
.todo.done b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.todo.done{opacity:.6}
.todo b{font-weight:600;font-size:.88rem;display:block;line-height:1.3}
.todo small{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.todo small .late{color:var(--pp-peach-ink);font-weight:600}
.todo .go{font-size:.76rem;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:999px;border:1.5px solid var(--line-med)}
.todo .go:hover{border-color:var(--ink);color:var(--ink)}
.todo .go .ic{width:12px;height:12px}
.plate-done{padding:16px;border:1.5px dashed var(--pp-mint-bd);border-radius:14px;text-align:center;color:var(--pp-mint-ink);font-weight:600;font-size:.88rem;background:var(--pp-mint-soft)}

/* Pinned sticky note */
.note-card{position:relative;padding:18px 20px 16px;border-radius:5px 14px 7px 12px;background:var(--pp-butter);color:var(--pp-note-ink);filter:var(--pp-note-filter);transform:rotate(-.6deg);box-shadow:var(--pp-sh-2)}
.note-card::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.55);border:1px solid rgba(38,33,27,.08)}
.note-card .k{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em}
.note-card .k .ic{width:14px;height:14px}
.note-card p{margin-top:10px;font-family:var(--serif);font-size:1.08rem;font-weight:500;letter-spacing:-.015em;line-height:1.38}
.note-card .by{margin-top:12px;font-size:.76rem;opacity:.7;display:flex;justify-content:space-between}

/* Poll */
.opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:14px;text-align:left;font-size:.88rem;font-weight:500;overflow:hidden;transition:border-color .2s}
.opt:hover{border-color:var(--line-med)}
.opt .fill{position:absolute;inset:0;width:0;background:var(--pp-lilac-soft);transition:width .8s var(--pp-ease-out);z-index:0}
.opt > *:not(.fill){position:relative;z-index:1}
.opt .r{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-med);flex:none}
.opt .pc{margin-left:auto;font-family:var(--mono);font-size:.74rem;color:var(--muted);opacity:0;transition:opacity .3s}
.voted .opt .pc{opacity:1}
.voted .opt{cursor:default}
.opt.mine{border-color:var(--pp-lilac-ink)}
.opt.mine .r{background:var(--pp-lilac-ink);border-color:var(--pp-lilac-ink);box-shadow:inset 0 0 0 3px var(--card)}
.poll-q{font-family:var(--serif);font-weight:600;font-size:1.02rem;letter-spacing:-.02em;margin-bottom:4px}
.poll-m{font-size:.76rem;color:var(--muted);margin-bottom:12px}

/* Docs + activity */
.lst{display:flex;flex-direction:column}
.li{text-decoration:none;color:inherit;display:flex;align-items:center;gap:11px;padding:9px 18px;font-size:.86rem;transition:background .15s}
.li:hover{background:var(--card-2)}
.li .tile{width:28px;height:28px;border-radius:9px}
.li .tile .ic{width:14px;height:14px}
.li b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{font-size:.74rem;color:var(--muted)}
.li .t{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted);flex:none}
.li > div{min-width:0}
.act{padding-bottom:10px}
.act-g{padding:6px 18px 4px;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.act-g ~ .act-g{margin-top:6px;padding-top:10px;border-top:1.5px solid var(--line-soft)}
.act-r{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:11px;padding:7px 18px;font-size:.86rem;color:var(--ink-soft);line-height:1.35}
.act-r .tile{width:28px;height:28px;border-radius:9px}.act-r .tile .ic{width:14px;height:14px}
.act-r .t{font-family:var(--mono);font-size:.7rem;color:var(--muted)}

/* modules (opt-in widgets) */
.mod-money .bal{font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:-.045em;line-height:1}
.mod-money .io{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mod-money .io div{padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);font-size:.76rem;color:var(--muted)}
.mod-money .io b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--ink);letter-spacing:-.02em}
.mod-big{font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:-.045em;line-height:1}
.mod-big small{font-size:.9rem;color:var(--muted);margin-left:4px}
.mod-sub{font-size:.8rem;color:var(--ink-soft);margin-top:6px}

/* headline numbers: visuals + swap */
.pulse{position:relative}
.m-wrap{position:relative;display:flex;min-width:0}
.m-wrap > .m{flex:1;width:100%;position:relative;min-width:0}
.m-wrap.picking{z-index:40}
.m .spark{display:block;width:100%;height:28px;margin-top:8px}
.wk-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.wk-dots > span{display:flex;flex-direction:column;align-items:center;gap:4px}
.wk-dots i{display:block;width:100%;height:8px;border-radius:3px;background:var(--card-3)}
.wk-dots .f i{background:var(--p-fg)}
.wk-dots b{font-family:var(--mono);font-size:.56rem;font-weight:600;color:var(--muted);line-height:1}
.wk-dots .now b{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
.m-faces{display:flex;margin-top:10px}
.m-faces .av{width:24px;height:24px;font-size:.55rem;margin-left:-6px}.m-faces .av:first-child{margin-left:0}
.mini-hist{display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:10px}
.mini-hist i{flex:1;min-height:2px;border-radius:2px;background:var(--p-solid)}.mini-hist i.lo{background:var(--pp-peach)}
.m-swap{position:absolute;top:11px;right:11px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--pp-lilac-soft);border:1px solid var(--pp-lilac-bd);color:var(--pp-lilac-ink);font-size:.66rem;font-weight:600}
.m-swap .ic{width:11px;height:11px}
.editing .pulse .m{border-color:var(--pp-lilac-bd)}
.editing .pulse .m:hover{border-color:var(--pp-lilac-ink)}
.pick{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:min(260px,calc(100vw - 32px));padding:6px;border-radius:16px;background:var(--card);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--pp-lilac);animation:pop .18s var(--pp-ease-spring)}
.m-wrap:nth-child(3) .pick{left:auto;right:0}
.pick > p{padding:6px 8px 4px;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.pick button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:10px;font-size:.86rem;font-weight:500;text-align:left}
.pick button:hover{background:var(--card-2)}
.pick button.on{font-weight:600;background:var(--card-2)}
.pick .tile{width:24px;height:24px;border-radius:8px;border-width:1px}.pick .tile .ic{width:12px;height:12px}
.pick small{margin-left:auto;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.pick button > .ic{margin-left:auto;width:14px;height:14px;color:var(--pp-mint-ink)}
.pick .pick-n{text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:.74rem;font-weight:500;line-height:1.35;border-top:1px dashed var(--line);margin:4px 4px 0;padding:8px 4px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}

/* create menu */
.create{position:relative}
.create > .btn .ic:last-child{width:12px;height:12px;margin-left:-2px;opacity:.6}
.create-m{display:none;position:absolute;top:calc(100% + 10px);left:0;z-index:30;width:270px;padding:6px;border-radius:18px;background:var(--card);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--pp-sky)}
.create.open .create-m{display:block;animation:pop .2s var(--pp-ease-spring)}
.create-m button{display:flex;align-items:center;gap:11px;width:100%;padding:8px;border-radius:12px;text-align:left}
.create-m button:hover{background:var(--card-2)}
.create-m b{font-size:.88rem;font-weight:600;display:block}
.create-m small{font-size:.74rem;color:var(--muted);display:block}
.btn.ghost.on{border-color:var(--ink);color:var(--ink);background:var(--pp-lilac-soft)}

/* customize mode: chrome on every card */
.ed{display:none;position:absolute;top:10px;right:10px;z-index:6;align-items:center;gap:1px;padding:3px;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--pp-lilac)}
.editing .ed{display:flex}
.ed button,.ed-grip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft)}
.ed button:hover{background:var(--card-3);color:var(--ink)}
.ed .ic{width:13px;height:13px}
.ed-grip{cursor:grab;color:var(--muted)}
.ed .ed-x{margin-left:2px;border-left:1px solid var(--line)}
.ed .ed-x:hover{background:var(--pp-peach-soft);color:var(--pp-peach-ink)}
.pulse > .ed{top:-17px;right:16px}
.pinw > .ed{top:-6px;right:6px}
.editing .grid [data-w],.editing .shelf [data-w],.editing .pulse[data-w]{outline:2px dashed var(--line-med);outline-offset:5px}
.editing .grid [data-w]:hover,.editing .shelf [data-w]:hover{outline-color:var(--pp-lilac-ink)}
.editing [data-w][draggable]{cursor:grab}
.editing .card-h > .sub,.editing .card-h > .lnk,.editing .card-h > .count,.editing .next .when{visibility:hidden}
.editing .note-card{transform:none}
.editing .grid .col:empty{min-height:140px;border:2px dashed var(--line-med);border-radius:22px}
.editing .grid .col:empty::before{content:"Drop a card here";display:grid;place-items:center;height:136px;font-size:.84rem;color:var(--muted)}
.dragging{opacity:.35}
.grid .drop-b{box-shadow:0 -9px 0 -4px var(--pp-lilac-ink) !important}
.grid .drop-a{box-shadow:0 9px 0 -4px var(--pp-lilac-ink) !important}
.shelf .drop-b{box-shadow:-9px 0 0 -4px var(--pp-lilac-ink) !important}
.shelf .drop-a{box-shadow:9px 0 0 -4px var(--pp-lilac-ink) !important}
.col.drop-end{outline:2px dashed var(--pp-lilac-ink);outline-offset:8px;border-radius:22px}
.landed{animation:land .7s var(--pp-ease-spring)}
@keyframes land{0%{transform:scale(.97);box-shadow:0 0 0 4px var(--pp-lilac)}100%{transform:none}}
.edit-bar{display:none;margin-top:22px;padding:12px 14px 12px 12px;border-radius:18px;border:1.5px solid var(--ink);background:var(--pp-lilac-soft);box-shadow:4px 4px 0 var(--pp-lilac);align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:12px;z-index:25}
.editing .edit-bar{display:flex;animation:pop .25s var(--pp-ease-spring)}
.edit-bar p{font-size:.88rem;color:var(--ink-soft);flex:1;min-width:220px}
.edit-bar p b{color:var(--ink)}

/* extras shelf */
.shelf{margin-top:34px}
.shelf-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.shelf-h h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;letter-spacing:-.025em}
.shelf-h p{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.shelf-h .btn{margin-left:auto;align-self:center}
.shelf-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:22px;align-items:start}
.shelf-cta{margin-top:30px;width:100%;display:flex;align-items:center;gap:16px;padding:14px 18px;border:1.5px dashed var(--line-med);border-radius:20px;text-align:left;color:var(--ink-soft);font-size:.88rem;line-height:1.4;transition:border-color .2s,background .2s}
.shelf-cta:hover{border-color:var(--ink);background:var(--card)}
.shelf-cta .tiles{display:flex;flex:none;padding-left:6px}
.shelf-cta .tiles .tile{margin-left:-7px;box-shadow:0 0 0 2px var(--paper)}
.shelf-cta .tiles .tile:nth-child(odd){transform:rotate(-6deg)}.shelf-cta .tiles .tile:nth-child(even){transform:rotate(5deg)}
.shelf-cta b{color:var(--ink)}
.shelf-cta .cta-x{flex:1;min-width:0}
.shelf-cta .go{flex:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);padding:7px 13px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--pp-mint)}
.shelf-cta .go .ic{width:13px;height:13px}

/* extras: visuals */
.mod-big{font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:-.045em;line-height:1}
.mod-big small{font-size:.9rem;color:var(--muted);margin-left:5px;letter-spacing:-.01em;font-weight:500}
.mod-big.sm{font-size:1.6rem}
.mod-sub{font-size:.8rem;color:var(--ink-soft);margin-top:6px}
.mod-first{font-size:.86rem;color:var(--ink-soft);line-height:1.45;margin-bottom:12px}
.spark.lg{display:block;width:100%;height:54px;margin-top:12px}
.flow{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.flow > div{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.74rem;color:var(--muted)}
.flow i{display:block;height:8px;border-radius:5px}
.flow i.in{background:var(--pp-mint-ink)}.flow i.out{background:var(--line-med)}
.flow b{font-family:var(--serif);font-weight:600;font-size:.95rem;color:var(--ink);letter-spacing:-.02em;text-align:right;min-width:62px}
.ring-row{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:1.2rem;letter-spacing:-.03em;line-height:1}
.ring .c small{font-family:var(--mono);font-size:.56rem;color:var(--muted);letter-spacing:.08em;font-weight:600;margin-top:3px}
.owe{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-med);font-size:.8rem;color:var(--ink-soft)}
.owe .btn{margin-left:auto}
.owe .av{width:24px;height:24px;font-size:.55rem;margin-left:-7px}.owe .av:first-child{margin-left:0}
.goal{position:relative;height:12px;margin:24px 0 10px;border-radius:7px;background:var(--card-3)}
.goal > i{display:block;height:100%;border-radius:7px;background:var(--p-fg)}
.goal .pace{position:absolute;top:-5px;bottom:-5px;width:2.5px;margin-left:-1px;background:var(--ink);border-radius:2px}
.goal .pace em{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:.56rem;font-weight:600;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}
.on-pace{color:var(--pp-mint-ink);font-weight:600}.off-pace{color:var(--pp-peach-ink);font-weight:600}
.hist{position:relative;display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:22px}
.hist i{flex:1;min-height:3px;border-radius:4px 4px 2px 2px;background:var(--pp-lilac)}
.hist i.mid{background:var(--pp-butter)}.hist i.lo{background:var(--pp-peach)}
.hist .cut{position:absolute;top:-10px;bottom:0;border-left:1.5px dashed var(--ink-soft)}
.hist .cut em{position:absolute;top:-4px;left:5px;font-style:normal;font-family:var(--mono);font-size:.6rem;font-weight:600;color:var(--ink-soft)}
.hist-x{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.posts > div{position:relative;aspect-ratio:1;border-radius:12px;background:var(--p-bg);border:1.5px solid var(--p-bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--p-fg)}
.posts > div > .ic{width:20px;height:20px}
.posts small{font-size:.66rem;font-weight:600;color:var(--ink-soft)}
.posts .posted{opacity:.55}
.posts em{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--pp-mint);color:var(--pp-note-ink)}
.posts em .ic{width:10px;height:10px}
.wbars{display:flex;align-items:flex-end;gap:5px;height:54px;margin-top:14px}
.wbars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--p-bg);border:1.5px solid var(--p-bd)}
.wbars i.now{background:var(--p-fg);border-color:var(--p-fg)}

/* tray (sheet) */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
.tray{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--paper);border-left:1.5px solid var(--ink);z-index:71;transform:translateX(102%);transition:transform .35s var(--pp-ease-out);display:flex;flex-direction:column}
.tray-open .scrim{opacity:1;pointer-events:auto}
.tray-open .tray{transform:none}
.tray-h{padding:22px 22px 6px;display:flex;align-items:flex-start;gap:12px}
.tray-h h3{font-family:var(--serif);font-weight:600;font-size:1.5rem;letter-spacing:-.03em}
.tray-h p{font-size:.86rem;color:var(--ink-soft);margin-top:4px}
.tray-h .close{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line-med);display:grid;place-items:center;flex:none}
.tray-b{flex:1;padding:6px 22px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.tray-sec{display:flex;align-items:baseline;gap:8px;font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:14px}
.tray-sec span{text-transform:none;letter-spacing:0;font-weight:500;font-size:.76rem;color:var(--faint)}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.preset{text-align:left;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .18s var(--pp-ease-spring)}
.preset:hover{border-color:var(--line-med);transform:translateY(-1px)}
.preset.on{border-color:var(--ink);box-shadow:2.5px 2.5px 0 var(--pp-lilac)}
.preset b{font-size:.86rem;font-weight:600}
.preset small{font-size:.74rem;color:var(--muted);line-height:1.3}
.preset .pv{display:flex;gap:3px;margin-bottom:6px}
.preset .pv i{width:20px;height:20px;border-radius:6px;background:var(--p-bg);border:1px solid var(--p-bd);display:grid;place-items:center;color:var(--p-fg)}
.preset .pv .ic{width:11px;height:11px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gw{position:relative;text-align:left;border-radius:16px;border:1.5px solid var(--line);background:var(--card);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .18s var(--pp-ease-spring),box-shadow .18s}
.gw:hover{border-color:var(--line-med);transform:translateY(-1px)}
.gw.on{border-color:var(--ink);box-shadow:2.5px 2.5px 0 var(--p-solid)}
.gw .th{display:block;height:76px;padding:12px 16px;background:var(--p-bg);border-bottom:1.5px solid var(--line-soft)}
.gw .th svg{display:block;width:100%;height:100%}
.gw:not(.on) .th{filter:grayscale(.8);opacity:.55}
.gw .tx{display:block;padding:9px 12px 12px}
.gw b{font-size:.86rem;font-weight:600;display:block}
.gw small{font-size:.72rem;color:var(--muted);display:block;line-height:1.3;margin-top:2px}
.gw .sw{position:absolute;top:8px;right:8px}
.sw{display:block;width:40px;height:24px;border-radius:999px;background:var(--card-3);border:1.5px solid var(--line-med);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--card);border:1.5px solid var(--line-med);transition:transform .25s var(--pp-ease-spring)}
.sw.on{background:var(--pp-mint);border-color:var(--pp-note-ink)}
.sw.on::after{transform:translateX(16px);border-color:var(--pp-note-ink)}
.scope{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--card-3);gap:4px}
.scope button{padding:8px;border-radius:10px;border:1.5px solid transparent;font-size:.84rem;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px}
.scope button .ic{width:14px;height:14px}
.scope button.on{background:var(--card);color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--pp-lilac)}
.scope-n{font-size:.78rem;color:var(--muted);line-height:1.4}
.tray-f{padding:12px 22px;border-top:1.5px solid var(--line);display:flex;justify-content:space-between;gap:10px;background:var(--paper-2)}
@media (max-width:420px){.gal,.presets{grid-template-columns:1fr 1fr;gap:8px}.gw .th{height:62px;padding:10px}.gw small{display:none}}

/* toast */
.toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);opacity:0;z-index:80;padding:10px 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--pp-mint);font-size:.86rem;font-weight:600;transition:all .3s var(--pp-ease-spring);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* fade-in */
.first .rise{animation:fadeup .6s var(--pp-ease-out) both}
.first .col > .rise:nth-child(2){animation-delay:.06s}.first .col > .rise:nth-child(3){animation-delay:.12s}.first .col > .rise:nth-child(4){animation-delay:.18s}.first .col > .rise:nth-child(n+5){animation-delay:.24s}.first .shelf{animation-delay:.3s}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}

/* mobile top bar */
.mtop{display:none}

@media (max-width:1180px){
  .hero{grid-template-columns:minmax(0,1fr) 290px}
  .grid{grid-template-columns:minmax(0,1fr) 320px}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sb{display:none}
  .mtop{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1.5px solid var(--line);background:var(--paper-2);position:sticky;top:0;z-index:20}
  .mtop .sb-logo{width:30px;height:30px;font-size:.7rem}
  .mtop b{font-family:var(--serif);font-weight:600;font-size:.98rem;letter-spacing:-.02em}
  .mtop .ic{margin-left:auto}
  .grid{grid-template-columns:1fr}
  .pulse{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pulse > .m-wrap:nth-child(3){grid-column:1/-1}
  /* phone reading order: next → my list → week → note → poll → the rest */
  .grid{display:flex;flex-direction:column}
  .grid > .col{display:contents}
  .hero{grid-template-columns:minmax(0,1fr)}
  .term{transform:none;margin-top:4px}
  .term .ms{display:none}
  .hero:has(.in-hero){grid-template-columns:minmax(0,1fr)}
  .inv,.pad{transform:none}
  .grid [data-w]{width:100%}
  .edit-bar{top:66px}
  .m-wrap:nth-child(2) .pick{left:auto;right:0}.m-wrap:nth-child(3) .pick{left:0;right:auto}
}
@media (max-width:640px){
  .main{padding:22px 16px 110px}
  .pulse{gap:10px}
  .m{padding:12px 13px;border-radius:18px}
  .m .v{font-size:1.55rem}
  .next{grid-template-columns:86px minmax(0,1fr)}
  .stub .dd{font-size:2.4rem}
  .tk-b{padding:16px 16px 16px 20px}
  .tk-btns{margin-left:0;width:100%}
  .tk-btns .btn{flex:1}
  .week{gap:4px;padding:0 12px}
  .day{padding:8px 2px;border-radius:11px}
  .day .dn{font-size:1.05rem}
  .ev{grid-template-columns:56px 4px minmax(0,1fr)}
  .ev .go{display:none}
  .acts .btn{flex:1 1 auto}
  .chart{gap:5px}
}
</style>

/* Three kinds of nothing. Day one = never set up (invite, don't praise).
   Quiet = real org, nothing pending this week (the only kind that earns "all clear"). */
function derive(b){
  if (S.st==="quiet") {
    const tot = b.poll.opts.reduce((a,x)=>a+x[1],0);
    return {...b, quiet:true, plate:[], reqs:[], poll:null, pinned:null, week:[], tasks:{open:0,late:0},
      lastPoll:{q:b.poll.q, win:b.poll.opts[0][0], n:b.poll.opts[0][1], of:tot},
      next:{...b.next, day:9, dw:"WED", dd:28},
      digest:`Quiet week — nothing due and no one waiting on you. Next up is <b>${b.next.title}</b>, Wed Oct 28.`};
  }
  if (S.st==="day1") {
    const d = S.d1;
    const ev = d.event ? {title:d.event, tone:"sky", type:"Event", day:2, time:"7:00 PM", where:"Add a place", last:null, faces:[]} : null;
    const act = [];
    if (d.pinned) act.push(["now","You pinned a welcome note","Announcement","butter"]);
    if (ev) act.push(["now",`You added ${ev.title}`,"Events","sky"]);
    act.push(["now",`You opened ${b.name}. Welcome!`,"Day one","butter"]);
    return {...b, day1:true, members:1, newMonth:0, next:ev,
      week: ev?[[2,ev.title,"7:00 PM","sky","Add a place"]]:[], plate:[], poll:null, lastPoll:null, reqs:[], newest:[], docs:[],
      pinned: d.pinned?{text:`Welcome to ${b.name}! This is where we'll post what's coming up. Check the calendar, and say hi at the first one.`, by:b.me, when:"just now"}:null,
      activity:act, tasks:{open:0,late:0}, termInfo:{...b.termInfo, week:1, ms:[]},
      digest: ev ? `<b>${ev.title}</b> is on the calendar for Wednesday. Next, invite your ${b.many.toLowerCase()} so someone shows up.`
                 : `<b>${b.name}</b> is officially open. It's just you for now, and that's how every group starts. Pick a first event and share your link, and this page fills in around you.`};
  }
  return b;
}

/* Sparkline: area + line, stretches to its box. */
function spark(v, cls=""){
  const mn=Math.min(...v), mx=Math.max(...v), r=mx-mn||1, W=100, H=30;
  const d=v.map((y,i)=>(i?"L":"M")+(i/(v.length-1)*W).toFixed(1)+" "+(H-2-(y-mn)/r*(H-7)).toFixed(1)).join(" ");
  return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H} Z" fill="var(--p-solid)" fill-opacity=".28"/><path d="${d}" fill="none" stroke="var(--p-fg)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const growth = o => Array.from({length:8},(_,i)=>Math.round(o.members - o.newMonth*2*(7-i)/7 + (i%3===1?o.newMonth*.2:0)));

function statBody(k,o){

const CREATE = [["cal","sky","Event","A meeting, social, anything on a day"],["megaphone","butter","Announcement","Pinned at the top for everyone"],["box","peach","Task","For you or someone else"],["chat","lilac","Vote","Ask the group a quick question"]];

      <span class="tiles">${[["receipt","butter"],["heart","rose"],["wallet","mint"],["bars","sky"]].map(([ic,t])=>`<span class="tile t-${t}">${I(ic)}</span>`).join("")}</span>
      <span class="cta-x"><b>Track something specific?</b> Dues, service hours, money, miles. Add only what your ${NOUN[S.org]} actually counts.</span>

  <div class="acts">

    <button class="btn" style="--hs:var(--pp-butter)" data-act="d1pin">${I("megaphone")} Post a welcome</button>`

    <button class="btn ghost ${S.editing?"on":""}" data-act="edit">${I(S.editing?"check":"grip")} ${S.editing?"Done":"Customize"}</button>
  </div></div>
  ${S.tr==="term"?termCard(o):S.tr==="numbers"?`<div class="pulse in-hero rise">${pulseCells}</div>`:S.tr==="ask"?askCard(o):S.tr==="invite"?inviteCard(o):todayCard(o)}</div>

  <div class="edit-bar"><span class="tile t-lilac">${I("grip")}</span>
    <p><b>Arrange your dashboard.</b> Drag a card by its handle, tap a number to swap it, hide what you don't use.</p>
    <button class="btn sm" style="--hs:var(--pp-mint)" data-act="tray">${I("plus")} Widgets &amp; extras</button>

  <div class="grid">${["L","R"].map(c=>`<div class="col" data-col="${c}">${S.layout[c].map(k=>k==="next"||S.hidden.has(k)?"":WR[k](o)).join("")}</div>`).join("")}</div>
  ${shelf(o)}`;

  // phone: one column, interleaved so each column's top card stays near the top
  const mo = [], {L,R} = S.layout;

function askCard(o){
  const q = o.day1 ? ["What should I set up first?",`How do people join ${o.name}?`,"Make a weekly meeting for me"]
    : [`Who hasn't come in a month?`,`What's due ${o.next&&o.next.day<=6?"before "+DAYS[o.next.day][0]+DAYS[o.next.day].slice(1).toLowerCase():"this week"}?`,`Recap the last ${o.meetingWord.toLowerCase()}`];
  return `<aside class="ask rise" aria-label="Ask">
    <div class="ask-k">${I("spark")} ASK ABOUT ${o.name.toUpperCase()}</div>
    <button class="ask-in" data-act="toast" data-msg="Opens Ask Chapt">${I("search")}<span>Ask anything about your ${o.many.toLowerCase()}…</span><kbd>⌘K</kbd></button>
    <div class="ask-q">${q.map(x=>`<button data-act="toast" data-msg="Asks: ${x.replace(/"/g,"")}">${x} ${I("arrow-r")}</button>`).join("")}</div>
  </aside>`;
}

function inviteCard(o){
  const cells = Array.from({length:21*21},(_,i)=>{const x=i%21,y=(i/21)|0;
    const fin=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7&&(x===a||x===a+6||y===b||y===b+6||(x>=a+2&&x<=a+4&&y>=b+2&&y<=b+4));
    if(fin(0,0)||fin(14,0)||fin(0,14)) return `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) return "";
    return ((x*7+y*13+x*y*3+o.logo.charCodeAt(0))%5<2)?`<rect x="${x}" y="${y}" width="1" height="1"/>`:"";}).join("");
  return `<aside class="inv rise" aria-label="Invite">
    <div class="inv-qr"><svg viewBox="-1 -1 23 23" fill="currentColor">${cells}</svg></div>
    <div class="inv-b">
      <div class="term-k"><span>BRING PEOPLE IN</span></div>
      <div class="inv-t">Scan to join<br>${o.name}</div>
      <div class="inv-link">chaptos.com/join/${o.logo.toLowerCase().replace(/[^a-z]/g,"")||"lpe"}-7f2k</div>
      <div class="inv-acts"><button class="btn sm" style="--hs:var(--pp-sky)" data-act="toast" data-msg="Link copied">${I("copy")} Copy link</button>
      ${o.reqs.length?`<span class="count">${o.reqs.length} waiting</span>`:""}</div>
    </div>
  </aside>`;
}

function todayCard(o){
  const today = o.week.filter(e=>e[0]===TODAY), tmr = o.week.filter(e=>e[0]===TODAY+1);

  return `<aside class="pad rise" aria-label="Today">
    <div class="pad-top"><span>OCTOBER</span><span>2026</span></div>
    <div class="pad-b">
      <div class="pad-d"><span class="n">19</span><span class="w">Monday</span></div>

        ${due.map(p=>`<div class="pad-r t-peach"><span class="dot"></span><b>Due</b>${p[1]}</div>`).join("")}
        <div class="pad-tmr">Tomorrow · ${tmr.length?tmr.map(e=>e[1]).join(", "):"free"}</div>
      </div>
    </div>

function termCard(o){
  const t = o.termInfo, pos = w => ((w-.5)/t.of*100).toFixed(2);
  const ahead = t.ms.filter(m=>m[0]>=t.week);
  const nextM = ahead[0];
  const left = t.of - t.week;
  return `<aside class="term rise" aria-label="Term">
    <div class="term-k"><span>${o.term}</span><span>ends ${t.end}</span></div>
    <div class="term-v">Week ${t.week}<small>of ${t.of}</small></div>
    <div class="term-sub">${o.day1?`First week · ${left} to go`:`${left} weeks left`}${nextM?` · <b>${nextM[1]}</b> ${nextM[0]===t.week?"this week":`in ${nextM[0]-t.week} wk${nextM[0]-t.week>1?"s":""}`}`:""}</div>
    <div class="ruler">
      ${Array.from({length:t.of},(_,i)=>`<i class="${i<t.week-1?"past":i===t.week-1?"now":""}"></i>`).join("")}
      ${t.ms.map(([w,l,tn])=>`<span class="flag t-${tn}" style="left:${pos(w)}%" title="Week ${w}: ${l}">${I("flag")}</span>`).join("")}
      <span class="you" style="${t.week===1?"left:0;transform:none":`left:${pos(t.week)}%`}">YOU ARE HERE</span>
    </div>
    ${t.ms.length?"":`<p class="ms-empty">No big dates yet. Flag an event as a milestone and it lands on this ruler.</p>`}
    <ul class="ms">${t.ms.map(([w,l,tn])=>`<li class="t-${tn} ${w<t.week?"done":""}"><span class="dot"></span>${l}<span class="wk">wk ${w}</span></li>`).join("")}</ul>
  </aside>`;
}

const joinLink = o => `chaptos.com/join/${o.logo.toLowerCase().replace(/[^a-z]/g,"")||"lpe"}-7f2k`;
const linkRow = (o, loud) => `<div class="inv-row"><code>${joinLink(o)}</code><button class="btn sm ${loud?"":"ghost"}" style="--hs:var(--pp-sky)" data-act="d1invite">${I("copy")} Copy</button></div>`;

/* Nobody waiting to join: a compressed Standing from the members page.
   Same three bands and rings; attendance is the universal rule, extras add their own lines. */
const FIRST = ["Alex","Bri","Cole","Dana","Eli","Fay","Gabe","Hana","Ivan","Jade","Kofi","Lu","Mira","Nico","Oren","Pia","Quin","Rosa","Seth","Tess","Uma","Vik","Wren","Yara","Zed"];
const LAST = ["Ames","Bose","Cruz","Diaz","Eng","Frey","Gill","Hall","Iyer","Jain","Kerr","Lowe","Mora","Nash","Okoro","Pryce","Reyes","Shah","Tran","Vega"];
function standingFaces(o){
  const [g,w,r] = o.crew.stand, ok = o.members - g - w - r; // approved today start in good standing
  const atRisk = [...o.crew.away.map(([n,d])=>[n,`missed every event since ${d}`]), ...Array.from({length:Math.max(0,r-3)},(_,i)=>[`${FIRST[(i*7+3)%25]} ${LAST[(i*3+1)%20]}`,"missed the last 4"])].slice(0,r);
  const watch = Array.from({length:w},(_,i)=>[`${FIRST[(i*5+1)%25]} ${LAST[(i*7+4)%20]}`,`${72-i*2}% attendance`]);
  const good = [o.me, ...o.newest, ...o.next.faces, ...Array.from({length:g+ok},(_,i)=>`${FIRST[(i*11+6)%25]} ${LAST[(i*13+9)%20]}`)]
    .filter((n,i,a)=>a.indexOf(n)===i).slice(0,g+ok).map(n=>[n, n===o.me?"you":"on track"]);
  return {risk:atRisk.map(x=>[...x,"risk"]), watch:watch.map(x=>[...x,"watch"]), good:good.map(x=>[...x,"good"]), n:{good:g+ok,watch:w,risk:r}};
}
function standing(o){
  const f = standingFaces(o), bands = [["good","Good","mint"],["watch","Watch","butter"],["risk","At risk","peach"]];
  const rule = [`under 80% attendance`, S.mods.has("dues")&&"dues owed", S.mods.has("gpa")&&"GPA under 3.0", S.mods.has("service")&&"service under 10h"].filter(Boolean).join(", ").replace(/, ([^,]*)$/," or $1");
  const pool = S.band ? f[S.band] : [...f.risk, ...f.watch, ...f.good];   // worst first, so the ones to look at lead
  const MAX = 15, shown = pool.slice(0,MAX);
  return `<div class="stand">
    <div class="req-h">Standing <span class="sub">${rule} puts someone on watch</span></div>
    <div class="st-seg">${bands.filter(([k])=>f.n[k]).map(([k,l,t])=>`<button class="t-${t} ${S.band&&S.band!==k?"dim":""}" style="flex:${f.n[k]}" data-band="${k}" title="${l} · ${f.n[k]}">${f.n[k]>2?f.n[k]:""}</button>`).join("")}</div>
    <div class="st-key">${bands.map(([k,l,t])=>`<button class="t-${t} ${S.band===k?"on":""}" data-band="${k}"><i></i>${l}<b>${f.n[k]}</b></button>`).join("")}</div>
    <div class="st-faces">${shown.map(([n,why,k])=>`<button class="ph-${k} ${n===o.me?"you":""}" data-act="toast" data-msg="${n} · ${why}" title="${n} · ${why}"><span class="av">${initials(n)}</span></button>`).join("")}
      ${pool.length>MAX?`<a class="st-more" href="#">+${pool.length-MAX}</a>`:""}</div>
    ${f.n.risk && S.band!=="good" && S.band!=="watch" ? `<div class="st-look">${I("alert")}<span><b>${f.risk[0][0]}</b> ${f.risk[0][1]}${f.n.risk>1?` · and ${f.n.risk-1} more at risk`:""}</span><button class="btn sm" style="--hs:var(--pp-peach)" data-band="risk">${S.band==="risk"?"Showing":"See them"}</button></div>`:""}
    <div class="st-foot">${I("check")} No one waiting to join <code>${joinLink(o)}</code><button class="btn sm ghost" style="--hs:var(--pp-sky)" data-act="d1invite">${I("copy")} Copy</button></div>
  </div>`;
}

function pollBody(o){
  if (!o.poll) return `<div class="card-b"><div class="empty-in">
    ${o.lastPoll?`<div class="last-poll"><span class="pill t-lilac">Last vote</span><b>${o.lastPoll.q}</b><small>${o.lastPoll.win} won · ${o.lastPoll.n} of ${o.lastPoll.of} votes</small></div>`
      :`<p><b>Let everyone weigh in.</b> One tap to ask, one tap to answer. Try one of these:</p>
        <div class="q-chips">${["What night works best?",`${o.one==="member"?"Team":"Group"} shirt color?`,"Where should we meet?"].map(q=>`<button data-act="toast" data-msg="Starts a vote: ${q}">${q}</button>`).join("")}</div>`}
    <button class="btn sm" style="--hs:var(--pp-lilac)" data-act="toast" data-msg="Opens the poll composer">${I("plus")} ${o.day1?"Ask your own":"Start a vote"}</button></div></div>`;
  const p = o.poll, tot = p.opts.reduce((a,x)=>a+x[1],0) + (S.voted!==null?1:0);
  return `<div class="card-b ${S.voted!==null?"voted":""}"><div class="poll-q">${p.q}</div><div class="poll-m">${p.meta}</div>
    ${p.opts.map(([l,n],i)=>{const c=n+(S.voted===i?1:0);return `<button class="opt ${S.voted===i?"mine":""}" data-vote="${i}"><span class="fill" style="width:${S.voted!==null?c/tot*100:0}%"></span><span class="r"></span>${l}<span class="pc">${Math.round(c/tot*100)}%</span></button>`}).join("")}
