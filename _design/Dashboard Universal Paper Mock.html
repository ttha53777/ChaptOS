const DEF = {L:["next","week","people","activity"], R:["plate","pinned","poll","docs"]}, DEF_NUMS = ["members","week","tasks"];
function resetLayout(){
  S.layout = {L:[...DEF.L], R:[...DEF.R]}; S.nums = [...DEF_NUMS]; S.hidden = new Set(); S.preset = null; S.pick = null;
  S.mods = new Set(S.st==="day1"?[]:ORGS[S.org].modules);
}
let fpT;
function firstPaint(){ // entrance animations run once per org/state, never on an ordinary click
  const m = document.getElementById("main"); m.classList.add("first");
  clearTimeout(fpT); fpT = setTimeout(()=>m.classList.remove("first"), 2000);
}
function setOrg(k){
  S.org=k; S.ok=new Set(); S.band=null; S.sel=null; S.done=new Set(); S.voted=null; S.open=false; S.here=0; S.scope="me"; S.dirty=false;
  resetLayout(); S.d1={event:null,invited:false,pinned:false,extras:false}; clearInterval(S.timer);
  firstPaint(); render(); mock(); tray(); window.scrollTo({top:0});
}

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800); }

/* Layout moves */
const colOf = w => S.layout.L.includes(w) ? "L" : "R";
function nudge(w, dir){
  if (isMod(w)){ const a=[...S.mods], i=a.indexOf(w.slice(4)), j=i+(dir==="up"?-1:1); if(j<0||j>=a.length) return false; [a[i],a[j]]=[a[j],a[i]]; S.mods=new Set(a); return true; }
  const c = colOf(w), a = S.layout[c], i = a.indexOf(w);
  if (dir==="swap"){ const b = S.layout[c==="L"?"R":"L"]; a.splice(i,1); b.splice(Math.min(i,b.length),0,w); return true; }
  let j = i; do { j += dir==="up"?-1:1; } while (j>=0 && j<a.length && S.hidden.has(a[j])); // hop hidden cards so every nudge visibly moves
  if (j<0 || j>=a.length) return false;
  a.splice(i,1); a.splice(j,0,w); return true;
}
function dropMove(w, t, after, col){
  if (isMod(w)){ if(!t||!isMod(t)) return; const a=[...S.mods].filter(x=>x!==w.slice(4)); a.splice(a.indexOf(t.slice(4))+(after?1:0),0,w.slice(4)); S.mods=new Set(a); return; }
  S.layout.L = S.layout.L.filter(x=>x!==w); S.layout.R = S.layout.R.filter(x=>x!==w);
  if (t){ const a = S.layout[colOf(t)]; a.splice(a.indexOf(t)+(after?1:0),0,w); } else S.layout[col].push(w);
}
const changed = (w) => { S.dirty=true; S.preset=null; if(w) S.landed=w; render(); tray(); };

let dragW = null;
const clearDrop = () => document.querySelectorAll(".drop-b,.drop-a,.drop-end").forEach(x=>x.classList.remove("drop-b","drop-a","drop-end"));
function dropTarget(e){
  const mod = isMod(dragW), t = e.target.closest(mod?".shelf [data-w]":".grid [data-w]"), col = e.target.closest(mod?".shelf-g":".grid .col");
  if (!t && !col) return null;
  if (t && t.dataset.w===dragW) return {self:true};
  if (!t) return {col:col.dataset.col, colEl:col};
  const r = t.getBoundingClientRect(), after = mod ? e.clientX > r.left+r.width/2 : e.clientY > r.top+r.height/2;
  return {t:t.dataset.w, el:t, after};
}
document.addEventListener("dragstart", e=>{
  const c = S.editing && e.target.closest && e.target.closest("[data-w][draggable]"); if(!c) return;
  dragW = c.dataset.w; e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragW);
  requestAnimationFrame(()=>c.classList.add("dragging"));
});
document.addEventListener("dragover", e=>{
  if (!dragW) return; const d = dropTarget(e); if (!d) return;
  e.preventDefault(); clearDrop(); if (d.self) return;
  if (d.el) d.el.classList.add(d.after?"drop-a":"drop-b"); else if (d.colEl && !isMod(dragW)) d.colEl.classList.add("drop-end");
});
document.addEventListener("drop", e=>{
  if (!dragW) return; const d = dropTarget(e); e.preventDefault(); clearDrop();
  if (d && !d.self) { const w = dragW; dropMove(w, d.t, d.after, d.col); changed(w); }
});
document.addEventListener("dragend", ()=>{ clearDrop(); document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging")); dragW=null; });

document.addEventListener("click", e=>{
  const opener = e.target.closest('[data-act="create"]');
  document.querySelectorAll(".create.open").forEach(c=>{ if(!opener||!c.contains(opener)) c.classList.remove("open"); });
  if (S.pick!==null && !e.target.closest(".pick,[data-pick]")) { S.pick=null; render(); }
  const el = e.target.closest("button,a,[data-act]"); if(!el) return;
  if(el.tagName==="A" && el.getAttribute("href")==="#") e.preventDefault();
  const d = el.dataset;
  if(d.org){ setOrg(d.org); return; }
  if(d.tr){ S.tr=d.tr; S.pick=null; render(); mock(); return; }
  if(d.st){ S.st=d.st; S.ok=new Set(); S.band=null; S.d1={event:null,invited:false,pinned:false,extras:false}; S.sel=null; S.done=new Set(); S.voted=null; S.open=false; clearInterval(S.timer);
    resetLayout(); firstPaint(); render(); mock(); tray(); window.scrollTo({top:0}); return; }
  if(d.starter){ S.d1.event=d.starter; S.sel=2; render(); toast(`Added ${d.starter} · Wed 7:00 PM`); return; }
  if("themeT" in d){ const r=document.documentElement; r.dataset.theme = r.dataset.theme==="night"?"day":"night"; mock(); return; }
  if(d.day){ S.sel=+d.day; render(); return; }
  if(d.tick){ const i=+d.tick; S.done.has(i)?S.done.delete(i):S.done.add(i); render(); return; }
  if(d.vote && S.voted===null){ S.voted=+d.vote; render(); toast("Vote counted"); return; }
  if(d.mv){ if(nudge(d.mw,d.mv)) changed(d.mw); return; }
  if(d.hide){ if(isMod(d.hide)) S.mods.delete(d.hide.slice(4)); else S.hidden.add(d.hide); changed(); toast("Hidden · bring it back from Widgets & extras"); return; }
  if(d.core){ S.hidden.has(d.core)?S.hidden.delete(d.core):S.hidden.add(d.core); changed(S.hidden.has(d.core)?null:d.core); return; }
  if(d.mod){ const on=!S.mods.has(d.mod); on?S.mods.add(d.mod):S.mods.delete(d.mod); changed(on?"mod-"+d.mod:null); if(on) toast(`${MODS[d.mod].name} added · under What you track`); return; }
  if(d.preset){ const p=PRESETS.find(x=>x.k===d.preset);
    S.layout={L:[...(p.L||DEF.L)], R:[...(p.R||DEF.R)]}; S.hidden=new Set(p.hide||[]); S.mods=new Set(p.mods); S.nums=[...p.nums];
    S.dirty=true; S.preset=p.k; render(); tray(); toast(`Layout: ${p.name}`); return; }
  if(d.scope){ S.scope=d.scope; S.dirty=true; tray(); return; }
  if(d.pick!==undefined){ S.pick = S.pick===+d.pick?null:+d.pick; render(); return; }
  if(d.setnum){ const i=S.pick, j=S.nums.indexOf(d.setnum); if(j>-1) S.nums[j]=S.nums[i]; S.nums[i]=d.setnum; S.pick=null; S.dirty=true; S.preset=null; render(); return; }
  if(d.ok){ S.ok.add(d.ok); render(); toast(`${d.ok} is in · added to the roster`); return; }
  if(d.band){ S.band = S.band===d.band?null:d.band; render(); return; }
  if(d.go){ const t=document.querySelector(`[data-w="${d.go}"]`); t&&t.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  switch(d.act){
    case "toast": toast(d.msg); break;
    case "create": el.closest(".create").classList.toggle("open"); break;
    case "checkin":
      if(S.open) break;
      if(!document.querySelector('[data-w="next"]')){ toast("Opens check-in for the next event"); break; }
      S.open=true; S.here=0; render();
      document.querySelector('[data-w="next"]').scrollIntoView({behavior:"smooth",block:"center"});
      S.timer=setInterval(()=>{ S.here+=Math.ceil(Math.random()*3); const h=document.getElementById("here"); if(h) h.textContent=S.here; if(S.here>=O().members*.7) clearInterval(S.timer); },900);
      break;
    case "close": clearInterval(S.timer); toast(`Recorded · ${S.here} here`); S.open=false; render(); break;
    case "edit":
      S.editing=!S.editing; S.pick=null; document.getElementById("app").classList.toggle("editing",S.editing);
      if(!S.editing && S.dirty){ toast(S.scope==="all"?"Saved as everyone's default":"Layout saved · just for you"); S.dirty=false; }
      document.body.classList.remove("tray-open"); render(); break;
    case "reset": resetLayout(); S.dirty=true; render(); tray(); toast("Back to the standard layout"); break;
    case "tray": if(S.st==="day1"){S.d1.extras=true; render();} tray(); document.body.classList.add("tray-open"); break;
    case "d1invite": if(S.st==="day1"){S.d1.invited=true; render();} toast("Invite link copied"); break;
    case "d1pin": if(S.st==="day1"){S.d1.pinned=true; render();} toast("Welcome note pinned · edit it any time"); break;
    case "d1event": { const t=document.querySelector('[data-w="next"]'); t&&t.scrollIntoView({behavior:"smooth",block:"center"}); if(S.d1.event) toast("Opens the event form"); break; }
    case "tray-x": document.body.classList.remove("tray-open"); break;
  }
});
document.getElementById("scrim").addEventListener("click",()=>document.body.classList.remove("tray-open"));
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ document.body.classList.remove("tray-open"); document.querySelectorAll(".create.open").forEach(c=>c.classList.remove("open")); if(S.pick!==null){S.pick=null; render();} } });

if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme="night";
setOrg("robotics");
</script>
