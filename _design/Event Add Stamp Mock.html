}
/* the form condenses into a card on the timeline: the shell, the title and the meta each travel to
   their place. lift = how far the page will still scroll before the card arrives. */
function condenseInto(row, ev, { lift, D, kicker }) {
  const EASE = 'cubic-bezier(.6,0,.12,1)';
  const from = document.querySelector('#deck .panel').getBoundingClientRect();
  const titleEl = $(S.page === 2 ? 'p2Title' : 'title');
  const titleFrom = titleEl.getBoundingClientRect();
  const bigPx = parseFloat(getComputedStyle(titleEl).fontSize);
  const at = el => { const b = el.getBoundingClientRect(); return { left: b.left, top: b.top - lift, width: b.width, height: b.height }; };
  const to = at(row), tTo = at(row.querySelector('.t')), mTo = at(row.querySelector('.m .mt'));
  // a snapshot of the form rides inside the shrinking card and fades as it folds
  const snap = document.querySelector('#deck .panel').cloneNode(true);
  snap.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  snap.removeAttribute('id');
  snap.querySelectorAll('.cef-title, .p2-title h2, .kicker').forEach(el => el.style.visibility = 'hidden');
  // inputs lose their typed values in a clone; copy them across
  const live = document.querySelectorAll('#deck .panel input, #deck .panel textarea'), dead = snap.querySelectorAll('input, textarea');
  live.forEach((el, n) => { if (dead[n]) { dead[n].value = el.value; if (el.type === 'checkbox') dead[n].checked = el.checked; } });
  Object.assign(snap.style, { position: 'absolute', left: '-1.5px', top: '-1.5px', width: from.width + 'px', height: from.height + 'px', margin: '0', boxShadow: 'none', animation: 'none', borderColor: 'transparent', transformOrigin: '0 0' });

  // the form condenses into the card: the shell, the title and the meta each travel to their place
  const g = document.createElement('div');
  g.className = 'flyer';
  g.innerHTML = `<span class="k">${kicker}</span><div class="t">${esc(ev.title)}</div><div class="m">${metaOf(ev)}</div>`;
  g.prepend(snap);
  document.body.append(g);
  snap.style.transformOrigin = `${titleFrom.left - from.left}px ${titleFrom.top - from.top}px`;
  const sk = Math.max(to.width / from.width, .3);
  snap.animate([
    { opacity: 1, transform: 'none', filter: 'blur(0)' },
    { opacity: 0, filter: 'blur(2px)', offset: .4 },
    { opacity: 0, transform: `scale(${sk})`, filter: 'blur(2px)' },
  ], { duration: D, easing: EASE, fill: 'forwards' });
  const css = getComputedStyle(document.documentElement);
  const acc = css.getPropertyValue(S.page === 2 ? '--pp-butter' : '--pp-lilac').trim();
  const line = css.getPropertyValue('--line').trim(), ink = css.getPropertyValue('--ink').trim();
  g.animate([
    { left: from.left + 'px', width: from.width + 'px' },
    { left: to.left + 'px', width: to.width + 'px' },
  ], { duration: D, easing: 'cubic-bezier(.35,0,.1,1)', fill: 'forwards' });
  g.animate([
    { top: from.top + 'px', height: from.height + 'px' },
    { top: to.top + 'px', height: to.height + 'px' },
  ], { duration: D, easing: 'cubic-bezier(.75,0,.2,1)', fill: 'forwards' });
  g.animate([
    { borderRadius: '22px', boxShadow: `6px 6px 0 ${acc}`, borderColor: ink, transform: 'rotate(0)' },
    { offset: .5, borderRadius: '18px', transform: 'rotate(-1.4deg)' },
    { borderRadius: '14px', boxShadow: `0 0 0 ${acc}`, borderColor: line, transform: 'rotate(0)' },
  ], { duration: D, easing: EASE, fill: 'forwards' });
  const gt = g.querySelector(':scope > .t'), gk = g.querySelector(':scope > .k'), gm = g.querySelector(':scope > .m');
  [gt, gk, gm].forEach(el => { el.style.position = 'absolute'; el.style.left = '0'; el.style.top = '0'; el.style.transformOrigin = '0 0'; });
  // font-size would reflow every frame; scale the 1rem title up instead
  const k = bigPx / 16, B = 1.5; // B: the ghost's border, which the row's is too
  gt.animate([
    { transform: `translate(${titleFrom.left - from.left - B}px, ${titleFrom.top - from.top - B + 2}px) scale(${k})` },
    { transform: `translate(${tTo.left - to.left - B}px, ${tTo.top - to.top - B}px) scale(1)` },
  ], { duration: D, easing: EASE, fill: 'forwards' });
  gk.animate([
    { transform: `translate(${titleFrom.left - from.left - B}px, ${titleFrom.top - from.top - 26}px)`, opacity: 1 },
    { transform: `translate(${titleFrom.left - from.left - B}px, ${titleFrom.top - from.top - 40}px)`, opacity: 0, offset: .35 },
    { opacity: 0 },
  ], { duration: D, easing: EASE, fill: 'forwards' });
  gm.animate([
    { transform: `translate(${mTo.left - to.left - B}px, ${mTo.top - to.top - B + 6}px)`, opacity: 0 },
    { offset: .65, opacity: 0, transform: `translate(${mTo.left - to.left - B}px, ${mTo.top - to.top - B + 4}px)` },
    { transform: `translate(${mTo.left - to.left - B}px, ${mTo.top - to.top - B}px)`, opacity: 1 },
  ], { duration: D, easing: EASE, fill: 'forwards' });

  return g;
}

function save() {
  if (busy) return;
  if (!S.title.trim()) { go(1); $('title').focus(); return; }
  if (editing) return saveEdit();
  busy = true;
  clearErr();
  const plan = failPlan; failPlan = null;
  const draft = structuredClone(S);
  const ev = { title: S.title.trim(), cat: S.cat, date: S.date, start: S.start, allDay: S.allDay };
  const fields = S.fields.slice();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // place the row at its date; the rows after it part to make room
  const rows = [...$('tl').children];
  const s0 = scrollY;
  const before = new Map(rows.map(r => [r, r.getBoundingClientRect().top + s0]));
  const row = document.createElement('div');
  row.className = 'ev'; row.dataset.date = ev.date; row.style.setProperty('--d', `var(--c-${ev.cat})`);
  row.innerHTML = rowInner(ev, fields);
  row.style.visibility = 'hidden';
  Object.assign(row, { _ev: ev, _draft: draft, _t0: performance.now() });
  if (plan) setTimeout(() => failed(row, plan), plan.at * slow);
  insertAtDate(row, ev.date);
  const want = scrollPlan(row, true);

  document.body.classList.add('closed');
  $('deck').style.visibility = 'hidden';
  if (reduce) { scrollTo(0, want); row.style.visibility = ''; row.dataset.landed = 1; busy = false; return; }

  const D = 560 * slow, EASE = 'cubic-bezier(.6,0,.12,1)';

  b.innerHTML = `<span class="ic">!</span><div><b>Not added. Nothing was lost.</b><span class="w">${esc(why.why)}</span></div>`;
  $('title').after(b);
  $('form').classList.toggle('err-date', why.field === 'date');
  $('add1').textContent = $('add2').textContent = 'Try again';
}
function clearErr() {
  document.querySelector('.err-band')?.remove();
  $('form').classList.remove('err-date');
  editChrome();
}
function replayFail(kind) {
  const plans = {
    fast: { at: 1250, why: 'Dec 30 is outside this term (Aug 24 – Dec 18). Pick a date inside it, or start next term first.', field: 'date' },
    mid:  { at: 260,  why: "The server didn't answer. Check your connection and try again." },
    late: { at: 4200, why: "You're offline." },
  };
  failPlan = plans[kind];
  if (kind === 'fast') replay('2026-12-30', "New Year's Eve party", 'party');
  else replay();
}

function reopen() {
  document.querySelectorAll('.flyer, .stamp-ink, .fail-toast').forEach(e => e.remove());
  busy = false;
  document.body.classList.remove('closed');
  const deck = $('deck'); deck.style.visibility = '';
  resetAll();
  const panel = deck.querySelector('.panel'); panel.style.animation = 'none'; void panel.offsetWidth; panel.style.animation = '';
}
function replay(date, title, cat, fromBottom) {
  renderTL(); reopen(); loadExample();
  if (date) { Object.assign(S, { date, title, cat }); syncP1(); }
  scrollTo(0, fromBottom ? document.documentElement.scrollHeight : 0);
  setTimeout(save, 900 * slow);
}
function toggleSlow() {
  slow = slow === 1 ? 4 : 1;
  $('slowBtn').textContent = `Slow-mo: ${slow === 1 ? 'off' : '4×'}`;
}

/* ── Wiring ────────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target;
  const goBtn = t.closest('[data-go]'); if (goBtn) { go(+goBtn.dataset.go); return; }
  const catBtn = t.closest('[data-cat]');
  if (catBtn) { S.cat = catBtn.dataset.cat; if (cat().mandatoryDefault) S.mandatory = true; $('mandatory').checked = S.mandatory; renderCats(); return; }
  const jump = t.closest('[data-jump]'); if (jump) { go(2); setTimeout(() => jumpTo(jump.dataset.jump), 120); return; }
  const add = t.closest('[data-add]'); if (add) { addField(add.dataset.add); return; }

  const fld = t.closest('.fld'); if (!fld) return;
  const f = byId(fld.dataset.id);
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'rm') return removeField(f.id);
    if (a === 'up') return move(f.id, -1);
    if (a === 'down') return move(f.id, 1);
    if (a === 'del-row') { f.items.splice(+act.dataset.i, 1); return rerender(f); }
    if (a === 'del-opt') { e.stopPropagation(); const o = f.options.splice(+act.dataset.i, 1)[0]; if (f.value === o) f.value = ''; return rerender(f); }
    if (a === 'step') { f.cap = Math.max(1, (+f.cap || 0) + +act.dataset.d); fld.querySelector('[data-k="cap"]').value = f.cap; return refreshSum(f); }
  }
  if (t.closest('.fld-h') && !t.closest('button, input, select, label')) { openField(f.id); return; }
  if (t.closest('.fld-name input') && S.open !== f.id) { S.open = f.id; renderFields(); document.querySelector(`.fld[data-id="${f.id}"] .fld-name input`)?.focus(); return; }
  const set = t.closest('[data-set]');
  if (set) {
    let v = set.dataset.v;
    if ('bool' in set.dataset) v = v === 'true';
    if ('numv' in set.dataset) v = +v;
    const key = set.dataset.set;
    // tapping the chosen tag / answer again clears it
    f[key] = (key === 'pick' || (key === 'value' && f.type === 'custom')) && f[key] === v ? '' : v;
    if (key === 'kind') { f.value = ''; }
    rerender(f);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); return; }
  if (e.key === 'Escape' && S.page === 2) { go(1); return; }
  const nw = e.target.closest?.('[data-new]');
  if (nw && e.key === 'Enter') {
    e.preventDefault();
    const v = nw.value.trim(); if (!v) return;
    const f = byId(nw.closest('.fld').dataset.id), key = nw.dataset.new;
    if (key === 'checklist') f.items.push({ t: v, done: false });
    if (key === 'supplies') f.items.push({ item: v, who: '' });
    if (key === 'links') f.items.push({ label: v, url: '' });
    if (key === 'option') { if (!f.options.includes(v)) f.options.push(v); }
    if (key === 'budget') { const m = v.match(/^(.*?)[\s$]*([\d.,]+)$/); f.items.push(m ? { label: m[1].trim() || 'Item', amt: m[2].replace(/,/g, '') } : { label: v, amt: '' }); }
    rerender(f, key === 'links' ? '.lnks .row:last-of-type input.u' : '[data-new]');
    return;
  }
  if (e.target.closest?.('.choice') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.click(); }
});
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; ks.slice(0, -1).forEach(k => o = o[k]); o[ks.at(-1)] = val; }
document.addEventListener('input', e => {
  const t = e.target;
  // page 1
  const p1 = { title: 'title', date: 'date', start: 'start', end: 'end', location: 'location', notes: 'notes' }[t.id];
  if (p1) { S[p1] = t.value; if (p1 === 'notes') growNotes(); if (['date', 'start', 'end'].includes(p1)) renderWhen(); if (p1 === 'title') syncAdd(); return; }
  if (t.id === 'allday') { S.allDay = t.checked; renderWhen(); return; }
  if (t.id === 'mandatory') { S.mandatory = t.checked; return; }
  if (t.id === 'remember') { S.remember = t.checked; renderHead(); return; }
  // page 2
  const fld = t.closest('.fld'); if (!fld || !t.dataset.k) return;
  const f = byId(fld.dataset.id);
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if ('num' in t.dataset && v !== '') v = t.dataset.k === 'cap' ? Math.max(1, parseInt(v) || 1) : v.replace(/[^\d.]/g, '');
  setPath(f, t.dataset.k, v);
  if (t.type === 'checkbox' && t.dataset.k.endsWith('.done')) return rerender(f);
  if (t.tagName === 'SELECT') return rerender(f);
  refreshSum(f);
});

/* drag: drawer → page (add), grip → page (reorder) */
let drag = null;
document.addEventListener('dragstart', e => {
  const k = e.target.closest?.('.kind[draggable="true"]');
  if (k) { drag = { add: k.dataset.add }; e.dataTransfer.setData('text/plain', k.dataset.add); e.dataTransfer.effectAllowed = 'copy'; return; }
  const fld = e.target.closest?.('.fld[draggable="true"]');
  if (fld) { drag = { move: +fld.dataset.id }; e.dataTransfer.setData('text/plain', fld.dataset.id); e.dataTransfer.effectAllowed = 'move'; requestAnimationFrame(() => fld.classList.add('dragging')); }
});
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (g) g.closest('.fld').setAttribute('draggable', 'true');
});
document.addEventListener('pointerup', () => document.querySelectorAll('.fld[draggable]').forEach(f => f.removeAttribute('draggable')));
function dropIndex(y) {
  const els = [...document.querySelectorAll('#fields .fld')];
  for (let i = 0; i < els.length; i++) { const r = els[i].getBoundingClientRect(); if (y < r.top + r.height / 2) return i; }
  return els.length;
}
function showLine(i) {
  document.querySelector('.drop-line')?.remove();
  const els = [...document.querySelectorAll('#fields .fld')];
  if (!els.length) return;
  const line = document.createElement('div'); line.className = 'drop-line';
  if (i < els.length) els[i].before(line); else els.at(-1).after(line);
}
const sheet = $('sheet');
sheet.addEventListener('dragover', e => { if (!drag) return; e.preventDefault(); sheet.classList.add('drop-on'); showLine(dropIndex(e.clientY)); });
sheet.addEventListener('dragleave', e => { if (!sheet.contains(e.relatedTarget)) { sheet.classList.remove('drop-on'); document.querySelector('.drop-line')?.remove(); } });
sheet.addEventListener('drop', e => {
  e.preventDefault(); sheet.classList.remove('drop-on');
  const i = dropIndex(e.clientY); document.querySelector('.drop-line')?.remove();
  if (drag?.add) addField(drag.add, i);
  if (drag?.move) {
    const from = S.fields.findIndex(f => f.id === drag.move), [f] = S.fields.splice(from, 1);
    S.fields.splice(i > from ? i - 1 : i, 0, f); renderFields(); renderMore();
  }
  drag = null;
});
document.addEventListener('dragend', () => { drag = null; sheet.classList.remove('drop-on'); document.querySelector('.drop-line')?.remove(); document.querySelectorAll('.fld.dragging').forEach(f => f.classList.remove('dragging')); });

/* ── Mock controls ─────────────────────────────────────────────────────── */
function resetAll() { editing = null; clearErr?.(); S = blank(); $('saved').classList.remove('on'); S.page = 2; go(1); syncP1(); $('title').focus(); }
function openP2Empty() { resetAll(); S.title = 'Rush BBQ'; S.cat = 'program'; S.location = 'Back lawn'; syncP1(); go(2); }
function loadExample() {
  S = blank(); S.page = 1;
  Object.assign(S, { title: 'Homecoming Tailgate', date: '2026-10-24', start: '11:00', end: '15:00', cat: 'social', location: 'Lot 4, Memorial Stadium' });
  const c = make('checklist'); c.items = [{ t: 'Reserve the lot spot', done: true }, { t: 'Pick up grill from Jordan’s', done: false }, { t: 'Print the sign-in sheet', done: false }];
  const s = make('supplies'); s.items = [{ item: 'Grill + propane', who: 'Jordan Reyes' }, { item: 'Ice (6 bags)', who: '' }, { item: 'Cups & plates', who: 'Priya Nair' }];
  const d = make('dress'); d.pick = 'Theme'; d.note = 'Wear the school colors';
  const cap = make('capacity'); cap.cap = 80;
  const cu = make('custom'); cu.label = 'Shuttle running?'; cu.kind = 'yesno'; cu.value = true;
  S.fields = [c, s, d, cap, cu]; S.open = c.id;
  $('saved').classList.remove('on'); S.page = 2; go(1); syncP1();
}
function toggleTheme() { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'night' ? 'day' : 'night'; }

$('tl').addEventListener('click', e => { const r = e.target.closest('.ev'); if (r?._ev && document.body.classList.contains('closed') && !busy) openEdit(r); });
renderTL(); S = blank(); syncP1();
</script>
