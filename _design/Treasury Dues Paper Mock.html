<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasury Dues · Paper</title>
<!--
  Treasury → Dues tab. EXPLORATION — a hypothetical fifth tab on /[slug]/treasury.

  The page answers two questions and nothing else:
    1. "Who owes what?"   → the term strip (one square per member) + the dues tags wall.
    2. "Bill some people" → one sheet: WHO (everyone / by role / pick people), WHAT (name,
                            amount, due), and a live receipt that states the exact bill.

  Real-backend mapping (flag when porting):
    • handing out dues = one adjustDues(+delta, reason) per member, already exists.
    • a *charge* as a named, dated group (Fall dues · due Oct 1 · 52 people) does NOT exist —
      adjustDues has no chargeId / dueDate. Overdue, per-charge progress and "already billed
      for this" detection all need that grouping (DuesCharge + DuesChargeLine).
    • per-role rates read the member's role; real members can hold several roles, so the
      real form needs a precedence rule (mock: one dues tier per member).
    • Remind / notify toggle = no backend.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --paper-2:#FBF5EA; --paper-3:#F4ECDD; --card:#FFFFFF;
  --ink:#26211B; --ink-2:#544A3F; --ink-3:#8A7F71;
  --line:#EBE1CF; --line-2:#DCD0B9;
  --peach:#FFD5C4;  --peach-soft:#FFEDE5;  --peach-ink:#C9542D;  --peach-bd:#F8D2C2;
  --sky:#CFE2FF;    --sky-soft:#EAF2FF;    --sky-ink:#2A66C7;    --sky-bd:#CCDFFB;
  --mint:#C7EFDA;   --mint-soft:#E6F8EF;   --mint-ink:#1B815B;   --mint-bd:#BDE7D2;
  --butter:#FFE5A0; --butter-soft:#FFF6DC; --butter-ink:#9C6B08; --butter-bd:#F4DFA6;
  --lilac:#E1D8FF;  --lilac-soft:#F1EDFF;  --lilac-ink:#6244CC;  --lilac-bd:#DCD2FB;
  --rose:#FFD6E6;   --rose-soft:#FFEDF4;   --rose-ink:#C23C77;   --rose-bd:#F8CEE0;
  --note-ink:#26211B; --mark-op:.85;
  --av-ink:rgba(38,33,27,.72);
  --sh-2:0 1px 2px rgba(38,33,27,.05), 0 10px 26px -8px rgba(38,33,27,.14);
  --sh-3:0 2px 4px rgba(38,33,27,.05), 0 26px 60px -18px rgba(38,33,27,.22);
  --scrim:rgba(38,33,27,.28);
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease-out:cubic-bezier(.22,.72,.24,1);
  --ease-spring:cubic-bezier(.16,.9,.3,1.02);
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#15110D; --paper-2:#1B1712; --paper-3:#25201A; --card:#1F1A15;
  --ink:#F2EADC; --ink-2:#CDBFAB; --ink-3:#948876;
  --line:#2F271E; --line-2:#43382B;
  --peach:#E5A28A;  --peach-soft:rgba(255,178,148,.085); --peach-ink:#FFB49A; --peach-bd:rgba(255,178,148,.22);
  --sky:#8DB2EC;    --sky-soft:rgba(150,190,255,.085);   --sky-ink:#AACBFF;   --sky-bd:rgba(150,190,255,.22);
  --mint:#80CBA4;   --mint-soft:rgba(140,220,180,.08);   --mint-ink:#8FDDB6;  --mint-bd:rgba(140,220,180,.22);
  --butter:#E3BF66; --butter-soft:rgba(255,214,120,.08); --butter-ink:#F0CC72;--butter-bd:rgba(255,214,120,.22);
  --lilac:#A593EE;  --lilac-soft:rgba(180,160,255,.10);  --lilac-ink:#C4B6FF; --lilac-bd:rgba(180,160,255,.26);
  --rose:#E598B7;   --rose-soft:rgba(255,160,200,.08);   --rose-ink:#FFAACB;  --rose-bd:rgba(255,160,200,.22);
  --mark-op:.42; --av-ink:rgba(22,18,14,.78);
  --sh-2:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -10px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.4), 0 26px 60px -18px rgba(0,0,0,.75);
  --scrim:rgba(5,4,2,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55; letter-spacing:-.005em; -webkit-font-smoothing:antialiased; overflow-x:hidden; transition:background .35s var(--ease-out), color .35s var(--ease-out)}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0; list-style:none}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--lilac-ink); outline-offset:2px; border-radius:6px}
.ic{width:18px; height:18px; flex:none}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.hi{position:relative; white-space:nowrap; z-index:0}
.hi::before{content:''; position:absolute; z-index:-1; left:-.12em; right:-.12em; bottom:.04em; height:.5em; background:var(--mark, var(--butter)); border-radius:.4em .55em .38em .6em; transform:rotate(-.8deg); opacity:var(--mark-op)}
.eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:.7rem; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.eyebrow::before{content:''; width:18px; height:2px; border-radius:2px; background:var(--eb, var(--peach))}

.btn{--bg:var(--ink); --fg:var(--paper); --hs:var(--lilac); display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 17px; border-radius:999px; border:1.5px solid var(--ink); background:var(--bg); color:var(--fg); font-weight:600; font-size:.88rem; letter-spacing:-.01em; box-shadow:2.5px 2.5px 0 var(--hs); white-space:nowrap; transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), background .2s, color .2s, opacity .2s}
.btn:hover{transform:translate(-1.5px,-1.5px); box-shadow:4.5px 4.5px 0 var(--hs)}
.btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--hs)}
.btn .ic{width:15px; height:15px}
.btn[disabled]{opacity:.4; pointer-events:none}
.btn--ghost{--bg:var(--card); --fg:var(--ink); --hs:var(--peach)}
.btn--soft{--bg:transparent; --fg:var(--ink-2); border-color:var(--line-2); box-shadow:none}
.btn--soft:hover{border-color:var(--ink-3); color:var(--ink); box-shadow:none; transform:translateY(-1px)}
.btn--sm{padding:6px 12px; font-size:.8rem; box-shadow:2px 2px 0 var(--hs)}
.btn--sm.btn--soft{box-shadow:none}
.btn--lg{padding:13px 22px; font-size:.95rem; box-shadow:3.5px 3.5px 0 var(--hs)}
.link{border:0; background:none; padding:0; color:var(--ink-2); font-weight:600; font-size:.82rem; display:inline-flex; align-items:center; gap:5px; text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:3px}
.link:hover{color:var(--ink); text-decoration-color:var(--ink)}
.link .ic{width:13px; height:13px}

.avatar{width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:.66rem; font-weight:700; letter-spacing:-.02em; background:var(--av, var(--lilac)); color:var(--av-ink); border:1.5px solid rgba(38,33,27,.08)}
.avatar--sm{width:22px; height:22px; font-size:.56rem}
.avatar--lg{width:52px; height:52px; font-size:1rem; border:1.5px solid var(--ink)}
.stack{display:flex}
.stack .avatar{margin-left:-7px; border:2px solid var(--card)}
.stack .avatar:first-child{margin-left:0}
.stack .more{margin-left:-7px; height:22px; min-width:22px; padding:0 6px; border-radius:999px; display:grid; place-items:center; font-family:var(--mono); font-size:.6rem; font-weight:600; background:var(--paper-3); border:2px solid var(--card); color:var(--ink-2)}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh}
.sb{position:sticky; top:0; height:100vh; width:232px; flex:none; border-right:1.5px solid var(--line); background:color-mix(in srgb, var(--paper-2) 88%, transparent); display:flex; flex-direction:column; padding:0 10px}
.sb-org{display:flex; align-items:center; gap:10px; height:66px; padding:0 6px; border-bottom:1.5px solid var(--line); margin:0 -10px 10px; padding-left:16px}
.sb-org .lg{width:30px; height:30px; border-radius:9px; background:var(--peach); border:1.5px solid var(--ink); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:.8rem; color:var(--note-ink); box-shadow:2px 2px 0 var(--ink)}
.sb-org b{font-family:var(--display); font-size:1.02rem; letter-spacing:-.02em}
.sb-org small{display:block; font-size:.7rem; color:var(--ink-3); margin-top:-3px}
.sb a{display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:11px; color:var(--ink-2); text-decoration:none; font-size:.9rem; font-weight:500}
.sb a:hover{background:var(--paper-3); color:var(--ink)}
.sb a[aria-current]{background:var(--card); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1.5px var(--ink), 2px 2px 0 var(--butter)}
.sb a .ic{width:17px; height:17px}
.main{flex:1; min-width:0}
.wrap{max-width:1240px; margin:0 auto; padding:34px 36px 140px}
.mbar{display:none}

/* ---------- page head + folder tabs (same as Treasury in the dashboard mock) ---------- */
.ph{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.ph h1{font-family:var(--display); font-weight:600; font-size:2.5rem; letter-spacing:-.04em; line-height:1.05; margin-top:8px}
.ph p{color:var(--ink-3); font-size:.92rem; margin-top:6px}
.ph .act{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}
.tabs{margin-top:28px; display:flex; align-items:flex-end; gap:6px; padding:0 6px; box-shadow:inset 0 -1.5px 0 var(--ink); overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative; flex:none; display:inline-flex; align-items:center; gap:8px; margin-bottom:1.5px; padding:10px 16px 9px; border:1.5px solid var(--line-2); border-bottom:0; border-radius:13px 13px 0 0; background:var(--paper-2); color:var(--ink-3); font-weight:600; font-size:.86rem}
.tabs button::before{content:''; position:absolute; left:12px; right:12px; top:-1.5px; height:4px; border-radius:0 0 4px 4px; background:var(--tb); opacity:.9}
.tabs button .ic{width:15px; height:15px}
.tabs button:hover{color:var(--ink); background:var(--card)}
.tabs button[aria-selected="true"]{margin-bottom:0; padding:12px 18px 11px; background:var(--paper); color:var(--ink); border-color:var(--ink); z-index:1}
.tabs .n{font-family:var(--mono); font-size:.66rem; font-weight:600; min-width:19px; height:19px; padding:0 5px; border-radius:999px; display:inline-grid; place-items:center; background:var(--rose); color:var(--note-ink); border:1.5px solid var(--note-ink)}
.tabs .new{font-size:.58rem; letter-spacing:.1em; font-family:var(--mono); color:var(--lilac-ink); border:1px dashed var(--lilac-ink); border-radius:5px; padding:0 4px}
.elsewhere{margin-top:40px; padding:44px; text-align:center; border:1.5px dashed var(--line-2); border-radius:22px; color:var(--ink-3)}
.elsewhere b{display:block; color:var(--ink); font-family:var(--display); font-size:1.2rem; margin-bottom:4px}

/* ---------- top: the term at a glance ---------- */
.top{margin-top:28px; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:22px}
.hero{border-color:var(--ink); box-shadow:4px 4px 0 var(--butter); padding:24px 26px 22px; position:relative; display:flex; flex-direction:column}
.k{display:flex; align-items:center; gap:7px; font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.k .ic{width:14px; height:14px}
.big{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:8px}
.big b{font-family:var(--display); font-weight:600; font-size:3.1rem; letter-spacing:-.05em; line-height:1}
.big span{color:var(--ink-3); font-size:.98rem}
.big span em{font-style:normal; color:var(--ink); font-weight:600}

/* money bar: paid | not due yet | overdue, drawn on the billed total */
.mbarr{margin-top:20px; height:22px; border:1.5px solid var(--ink); border-radius:999px; overflow:hidden; display:flex; background:var(--paper-2)}
.mbarr i{display:block; height:100%; transition:flex-basis .9s var(--ease-spring)}
.mbarr i + i{border-left:1.5px solid var(--ink)}
.mbarr .p{background:var(--mint)}
.mbarr .d{background:repeating-linear-gradient(-45deg, var(--butter) 0 6px, var(--butter-soft) 6px 11px)}
.mbarr .o{background:repeating-linear-gradient(-45deg, var(--rose) 0 6px, var(--rose-soft) 6px 11px)}
.legend{display:flex; gap:8px 18px; flex-wrap:wrap; margin-top:12px; font-size:.82rem; color:var(--ink-2)}
.legend button{border:0; background:none; padding:3px 6px; margin:-3px -6px; border-radius:8px; display:inline-flex; align-items:center; gap:7px}
.legend button:hover{background:var(--paper-2)}
.legend button[aria-pressed="true"]{background:var(--paper-3); box-shadow:inset 0 0 0 1.5px var(--ink)}
.legend .sw{width:12px; height:12px; border-radius:4px; border:1.5px solid var(--ink)}
.legend b{font-family:var(--mono); font-weight:600; font-size:.8rem}

/* the punch strip: one square per member */
.strip-h{display:flex; align-items:baseline; justify-content:space-between; margin-top:22px; font-size:.78rem; color:var(--ink-3)}
.strip{margin-top:8px; display:grid; grid-template-columns:repeat(26, minmax(0,1fr)); gap:4px}
.strip button{aspect-ratio:1; border-radius:5px; border:1.5px solid var(--line-2); padding:0; background:var(--paper-2); position:relative; transition:transform .15s var(--ease-spring)}
.strip button:hover{transform:scale(1.35); z-index:2; border-color:var(--ink)}
.strip button[data-s="paid"]{background:var(--mint); border-color:var(--mint-ink)}
.strip button[data-s="due"]{background:var(--butter); border-color:var(--butter-ink)}
.strip button[data-s="over"]{background:var(--rose); border-color:var(--rose-ink)}
.strip button[data-s="none"]{background:transparent; border-style:dashed}
.strip.dim button:not(.on){opacity:.18}
.tip{position:fixed; z-index:90; pointer-events:none; background:var(--ink); color:var(--paper); padding:6px 10px; border-radius:9px; font-size:.76rem; font-weight:600; white-space:nowrap; transform:translate(-50%, calc(-100% - 10px)); opacity:0; transition:opacity .12s}
.tip.on{opacity:1}
.tip span{font-family:var(--mono); font-weight:500; opacity:.75; margin-left:6px}
.hero .cta{margin-top:auto !important; display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; padding-top:18px; border-top:1.5px dashed var(--line-2)}

/* charges: one ticket stub per bill handed out */
.charges{padding:20px 20px 16px; display:flex; flex-direction:column}
.charges-h{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 4px}
.charges-h h3{font-family:var(--display); font-weight:600; font-size:1.15rem; letter-spacing:-.03em}
.stubs{margin-top:12px; display:flex; flex-direction:column; gap:10px; flex:1}
.stub{--c:var(--sky); position:relative; display:grid; grid-template-columns:6px minmax(0,1fr) auto; gap:0 14px; align-items:center; text-align:left; width:100%; padding:12px 16px 12px 0; border:1.5px solid var(--line-2); border-radius:14px; background:var(--paper); transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), border-color .18s}
.stub > i{grid-row:1 / span 2; align-self:stretch; background:var(--c); border-radius:12px 0 0 12px; margin:-12px 0 -12px 0; border-right:1.5px dashed var(--ink-3)}
.stub:hover{transform:translate(-1px,-1px); border-color:var(--ink); box-shadow:3px 3px 0 var(--c)}
.stub[aria-pressed="true"]{border-color:var(--ink); background:var(--card); box-shadow:3px 3px 0 var(--c)}
.stub .nm{font-weight:600; font-size:.93rem; display:flex; align-items:center; gap:8px; min-width:0}
.stub .nm span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stub .meta{grid-column:2; font-size:.76rem; color:var(--ink-3); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.stub .meta .od{color:var(--rose-ink); font-weight:600}
.stub .amt{grid-row:1 / span 2; grid-column:3; text-align:right}
.stub .amt b{display:block; font-family:var(--mono); font-weight:600; font-size:.92rem}
.stub .amt small{font-size:.72rem; color:var(--ink-3); font-family:var(--mono)}
.stub .prog{display:block; margin-top:5px; width:84px; height:5px; border-radius:9px; background:var(--paper-3); overflow:hidden; margin-left:auto}
.stub .prog i{display:block; height:100%; background:var(--mint-ink); border-radius:9px}
.stub.fresh{animation:fresh 1.4s var(--ease-out)}
@keyframes fresh{0%{transform:translateY(-14px) rotate(-1.5deg); opacity:0; box-shadow:5px 5px 0 var(--c)} 40%{opacity:1}}
.chip-aud{font-size:.68rem; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--paper-3); color:var(--ink-2)}
.charges .foot{margin-top:12px; padding:10px 4px 0; border-top:1.5px dashed var(--line-2); font-size:.78rem; color:var(--ink-3); display:flex; justify-content:space-between; gap:10px}

/* ---------- the wall of dues tags ---------- */
.wall-h{margin-top:40px; display:flex; align-items:flex-end; gap:14px 20px; flex-wrap:wrap}
.wall-h h2{font-family:var(--display); font-weight:600; font-size:1.65rem; letter-spacing:-.035em; line-height:1.1}
.wall-h p{color:var(--ink-3); font-size:.86rem; margin-top:3px}
.wall-h .tools{margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; padding:3px; border:1.5px solid var(--line-2); border-radius:999px; background:var(--paper-2)}
.seg button{border:0; background:none; padding:6px 12px; border-radius:999px; font-size:.8rem; font-weight:600; color:var(--ink-3); display:inline-flex; align-items:center; gap:6px}
.seg button .ic{width:14px; height:14px}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.srch{display:flex; align-items:center; gap:8px; padding:7px 13px; border:1.5px solid var(--line-2); border-radius:999px; background:var(--card); width:210px}
.srch:focus-within{border-color:var(--ink)}
.srch input{border:0; outline:0; background:none; width:100%; font-size:.85rem}
.srch .ic{width:15px; height:15px; color:var(--ink-3)}
.filt{margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.fchip{display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border:1.5px solid var(--line-2); border-radius:999px; background:var(--card); font-size:.82rem; font-weight:600; color:var(--ink-2)}
.fchip .c{font-family:var(--mono); font-size:.72rem; color:var(--ink-3)}
.fchip .sw{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--ink)}
.fchip:hover{border-color:var(--ink-3)}
.fchip[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--paper)}
.fchip[aria-pressed="true"] .c{color:var(--paper); opacity:.7}
.filt .note{font-size:.8rem; color:var(--ink-3); display:inline-flex; align-items:center; gap:8px; margin-left:4px}

.lane{margin-top:26px}
.lane-h{display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1.5px solid var(--line)}
.lane-h .sw{width:14px; height:14px; border-radius:5px; border:1.5px solid var(--ink)}
.lane-h h3{font-weight:600; font-size:.98rem}
.lane-h .c{font-family:var(--mono); font-size:.76rem; color:var(--ink-3)}
.lane-h .sum{margin-left:auto; font-family:var(--mono); font-size:.82rem; font-weight:600}
.lane-h .link{margin-left:12px}
.tags{margin-top:14px; display:grid; grid-template-columns:repeat(auto-fill, minmax(178px, 1fr)); gap:12px}

/* a dues tag: punched hole, coloured edge by standing */
.tag{--c:var(--paper-3); --ci:var(--ink-3); position:relative; text-align:left; padding:13px 14px 12px 16px; border:1.5px solid var(--line-2); border-radius:12px 16px 16px 12px; background:var(--card); transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), border-color .18s; overflow:hidden}
.tag::before{content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c)}
.tag::after{content:''; position:absolute; right:12px; top:12px; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line-2); background:var(--paper)}
.tag:hover{transform:translate(-1.5px,-1.5px) rotate(-.4deg); border-color:var(--ink); box-shadow:3px 3px 0 var(--c)}
.tag[data-s="paid"]{--c:var(--mint); --ci:var(--mint-ink)}
.tag[data-s="due"]{--c:var(--butter); --ci:var(--butter-ink)}
.tag[data-s="over"]{--c:var(--rose); --ci:var(--rose-ink)}
.tag[data-s="none"]{border-style:dashed; background:transparent}
.tag .who{display:flex; align-items:center; gap:9px; padding-right:14px}
.tag .who b{display:block; font-size:.86rem; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag .who small{display:block; font-size:.7rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag .who > div{min-width:0}
.tag .owe{margin-top:11px; display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.tag .owe b{font-family:var(--display); font-weight:600; font-size:1.45rem; letter-spacing:-.04em; line-height:1}
.tag .owe .st{font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ci); white-space:nowrap}
.tag[data-s="paid"] .owe b{color:var(--mint-ink); font-size:1.05rem; display:flex; align-items:center; gap:5px}
.tag[data-s="paid"] .owe b .ic{width:16px; height:16px}
.tag[data-s="none"] .owe b{color:var(--ink-3); font-size:1rem}
.tag .bar{margin-top:9px; height:5px; background:var(--paper-3); border-radius:9px; overflow:hidden}
.tag .bar i{display:block; height:100%; background:var(--mint-ink); border-radius:9px}
.tag .sub{margin-top:5px; font-family:var(--mono); font-size:.66rem; color:var(--ink-3)}
.tag.bump{animation:bump .8s var(--ease-spring)}
@keyframes bump{30%{transform:translateY(-4px) rotate(-1deg); box-shadow:3px 5px 0 var(--c); border-color:var(--ink)}}

/* list view */
.tbl{margin-top:18px; border:1.5px solid var(--line); border-radius:18px; background:var(--card); overflow:hidden}
.tr{display:grid; grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) 90px 90px 100px 116px 92px; gap:12px; align-items:center; padding:10px 18px; border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr.th{background:var(--paper-2); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding-block:9px}
.tr .nm{display:flex; align-items:center; gap:10px; min-width:0; font-weight:600; font-size:.88rem}
.tr .nm span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr .rl{font-size:.82rem; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr .n{font-family:var(--mono); font-size:.84rem; text-align:right}
.tr .n.owe{font-weight:600}
.tr:not(.th){cursor:pointer}
.tr:not(.th):hover{background:var(--paper-2)}
.stp{display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--sp-bg); color:var(--sp-fg); border:1px solid var(--sp-bd)}
.stp[data-s="paid"]{--sp-bg:var(--mint-soft); --sp-fg:var(--mint-ink); --sp-bd:var(--mint-bd)}
.stp[data-s="due"]{--sp-bg:var(--butter-soft); --sp-fg:var(--butter-ink); --sp-bd:var(--butter-bd)}
.stp[data-s="over"]{--sp-bg:var(--rose-soft); --sp-fg:var(--rose-ink); --sp-bd:var(--rose-bd)}
.stp[data-s="none"]{--sp-bg:var(--paper-2); --sp-fg:var(--ink-3); --sp-bd:var(--line)}
.empty-f{padding:40px; text-align:center; color:var(--ink-3); border:1.5px dashed var(--line-2); border-radius:18px; margin-top:18px}

/* ---------- day one ---------- */
.d1{margin-top:30px; border:1.5px solid var(--ink); border-radius:26px; background:var(--card); box-shadow:5px 5px 0 var(--butter); padding:40px 40px 34px; text-align:center}
.d1 h2{font-family:var(--display); font-weight:600; font-size:2.1rem; letter-spacing:-.04em; line-height:1.1; margin-top:10px}
.d1 > p{color:var(--ink-3); max-width:520px; margin:10px auto 0}
.d1-ways{margin-top:28px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; text-align:left}
.way{--c:var(--sky); text-align:left; padding:20px 20px 18px; border:1.5px solid var(--line-2); border-radius:18px; background:var(--paper); transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), border-color .18s}
.way:hover{transform:translate(-2px,-2px); border-color:var(--ink); box-shadow:4px 4px 0 var(--c)}
.way .g{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--c); border:1.5px solid var(--note-ink); color:var(--note-ink)}
.way h4{font-family:var(--display); font-weight:600; font-size:1.12rem; letter-spacing:-.025em; margin-top:14px}
.way p{font-size:.84rem; color:var(--ink-3); margin-top:4px}
.way .eg{margin-top:12px; font-family:var(--mono); font-size:.72rem; color:var(--ink-2); padding:6px 9px; border-radius:8px; background:var(--paper-2); border:1px dashed var(--line-2)}
.d1-strip{margin:30px auto 0; max-width:640px}
.d1-strip .strip button{background:transparent; border-style:dashed}
.d1-strip p{font-size:.8rem; color:var(--ink-3); margin-top:10px}

/* ---------- sheets: scrim + right drawer (member) + centered sheet (hand out) ---------- */
.scrim{position:fixed; inset:0; z-index:60; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s var(--ease-out); backdrop-filter:blur(2px)}
.scrim.on{opacity:1; pointer-events:auto}
.x{width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line-2); background:var(--card); display:grid; place-items:center; flex:none}
.x:hover{border-color:var(--ink)}
.x svg{width:14px; height:14px}

.drawer{position:fixed; z-index:70; top:12px; right:12px; bottom:12px; width:min(440px, calc(100vw - 24px)); background:var(--paper); border:1.5px solid var(--ink); border-radius:24px; box-shadow:var(--sh-3); transform:translateX(calc(100% + 30px)); transition:transform .34s var(--ease-spring); display:flex; flex-direction:column; overflow:hidden}
.drawer.on{transform:none}
.dr-h{display:flex; align-items:flex-start; gap:14px; padding:22px 22px 18px; border-bottom:1.5px solid var(--line)}
.dr-h h3{font-family:var(--display); font-weight:600; font-size:1.4rem; letter-spacing:-.03em; line-height:1.15}
.dr-h p{font-size:.82rem; color:var(--ink-3)}
.dr-h .x{margin-left:auto}
.dr-b{flex:1; overflow:auto; padding:20px 22px 28px}
.acct{border:1.5px solid var(--ink); border-radius:18px; background:var(--card); padding:18px 18px 16px; box-shadow:3px 3px 0 var(--c, var(--paper-3))}
.acct .row1{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.acct .row1 b{font-family:var(--display); font-weight:600; font-size:2.3rem; letter-spacing:-.05em; line-height:1}
.acct .acts{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:16px}
.acct .acts button{display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 6px 9px; border:1.5px solid var(--line-2); border-radius:13px; background:var(--paper); font-size:.76rem; font-weight:600; color:var(--ink-2)}
.acct .acts button:hover{border-color:var(--ink); color:var(--ink)}
.acct .acts button .g{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--g); border:1.5px solid var(--note-ink); color:var(--note-ink)}
.acct .acts button .g .ic{width:15px; height:15px}
.sec-t{margin:24px 0 10px; font-size:.7rem; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.book{border:1.5px solid var(--line); border-radius:16px; background:var(--card); overflow:hidden;
  background-image:linear-gradient(90deg, transparent 52px, var(--rose-bd) 52px, var(--rose-bd) 53.5px, transparent 53.5px);}
.bk{display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 14px 10px 10px; border-top:1px solid var(--line); font-size:.85rem}
.bk:first-child{border-top:0}
.bk .d{font-family:var(--mono); font-size:.68rem; color:var(--ink-3); text-align:right}
.bk .t b{font-weight:600}
.bk .t small{display:block; font-size:.72rem; color:var(--ink-3)}
.bk .a{font-family:var(--mono); font-weight:600; font-size:.84rem}
.bk .a.neg{color:var(--mint-ink)}
.bk.tot{background:var(--paper-2); font-weight:600}
.bk.tot .a{font-size:.92rem}
.acct-bar{margin-top:14px; height:6px; background:var(--paper-3); border-radius:9px; overflow:hidden}
.acct-bar i{display:block; height:100%; background:var(--mint-ink); border-radius:9px}
.acct-sub{margin-top:5px; font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.inline-pay{margin-top:12px; border:1.5px dashed var(--ink-3); border-radius:14px; padding:14px; display:none}
.inline-pay.on{display:block}
.inline-pay .r{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px}

/* ---------- the Hand out dues sheet ---------- */
.sheet{position:fixed; z-index:70; left:50%; top:50%; width:min(1080px, calc(100vw - 32px)); max-height:calc(100vh - 40px); background:var(--paper); border:1.5px solid var(--ink); border-radius:26px; box-shadow:var(--sh-3); transform:translate(-50%, -46%) scale(.98); opacity:0; pointer-events:none; transition:transform .34s var(--ease-spring), opacity .2s; display:flex; flex-direction:column; overflow:hidden}
.sheet.on{transform:translate(-50%,-50%); opacity:1; pointer-events:auto}
.sh-h{display:flex; align-items:center; gap:14px; padding:18px 22px; border-bottom:1.5px solid var(--line); flex:none}
.sh-h .g{width:40px; height:40px; border-radius:12px; background:var(--butter); border:1.5px solid var(--note-ink); color:var(--note-ink); display:grid; place-items:center; box-shadow:2px 2px 0 var(--note-ink)}
.sh-h h3{font-family:var(--display); font-weight:600; font-size:1.35rem; letter-spacing:-.03em; line-height:1.1}
.sh-h p{font-size:.8rem; color:var(--ink-3)}
.sh-h .x{margin-left:auto}
.sh-b{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 360px}
.form{overflow:auto; padding:22px 26px 30px}
.side{border-left:1.5px solid var(--line); background:var(--paper-2); overflow:auto; padding:22px 22px 24px; display:flex; flex-direction:column}

.step{display:grid; grid-template-columns:30px minmax(0,1fr); gap:0 14px}
.step + .step{margin-top:26px}
.step .num{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; font-family:var(--mono); font-weight:600; font-size:.8rem; background:var(--card)}
.step.done .num{background:var(--ink); color:var(--paper)}
.step .rail{grid-column:1; justify-self:center; width:0; border-left:1.5px dashed var(--line-2); margin-top:6px}
.step h4{font-family:var(--display); font-weight:600; font-size:1.12rem; letter-spacing:-.025em; line-height:30px}
.step .body{grid-column:2}
.step .hint{font-size:.8rem; color:var(--ink-3); margin-top:-2px}

.modes{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-top:12px}
.mode{--c:var(--sky); text-align:left; padding:14px 14px 13px; border:1.5px solid var(--line-2); border-radius:16px; background:var(--card); display:flex; flex-direction:column; gap:3px; transition:transform .16s var(--ease-spring), box-shadow .16s var(--ease-spring), border-color .16s}
.mode:hover{border-color:var(--ink-3)}
.mode .g{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--paper-2); border:1.5px solid var(--line-2); color:var(--ink-2); margin-bottom:7px}
.mode .g .ic{width:16px; height:16px}
.mode > div{display:flex; flex-direction:column}
.mode b{font-size:.92rem}
.mode small{font-size:.74rem; color:var(--ink-3); line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--ink); box-shadow:3px 3px 0 var(--c); transform:translate(-1px,-1px)}
.mode[aria-pressed="true"] .g{background:var(--c); border-color:var(--note-ink); color:var(--note-ink)}

.who-panel{margin-top:14px}
.everyone{display:flex; align-items:center; gap:14px; padding:14px 16px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); flex-wrap:wrap}
.everyone b{font-size:.92rem}
.everyone small{display:block; font-size:.76rem; color:var(--ink-3)}
.excl{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:.8rem; color:var(--ink-3)}
.xchip{display:inline-flex; align-items:center; gap:6px; padding:3px 6px 3px 4px; border-radius:999px; background:var(--paper-3); color:var(--ink-2); font-weight:600; font-size:.76rem; border:0}
.xchip:hover{background:var(--rose-soft); color:var(--rose-ink)}
.xchip svg{width:10px; height:10px}

.rates{border:1.5px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden}
.rate{display:grid; grid-template-columns:26px minmax(0,1fr) auto 130px; gap:12px; align-items:center; padding:11px 14px; border-top:1px solid var(--line)}
.rate:first-child{border-top:0}
.rate.off{background:var(--paper-2)}
.rate.off .rn, .rate.off .stack{opacity:.45}
.rate .rn b{font-size:.9rem; display:block}
.rate .rn small{font-size:.74rem; color:var(--ink-3)}
.cb{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--ink-3); background:var(--card); display:grid; place-items:center; padding:0; color:var(--paper)}
.cb[aria-checked="true"]{background:var(--ink); border-color:var(--ink)}
.cb svg{width:13px; height:13px; opacity:0}
.cb[aria-checked="true"] svg{opacity:1}
.money{display:flex; align-items:center; gap:4px; padding:6px 10px; border:1.5px solid var(--line-2); border-radius:11px; background:var(--card)}
.money:focus-within{border-color:var(--ink); box-shadow:2px 2px 0 var(--butter)}
.money span{font-family:var(--mono); color:var(--ink-3); font-size:.9rem}
.money input{border:0; outline:0; background:none; width:100%; font-family:var(--mono); font-weight:600; font-size:.95rem; text-align:right}
.money.lg{padding:10px 14px; border-radius:14px; max-width:220px}
.money.lg span{font-size:1.3rem}
.money.lg input{font-size:1.6rem; text-align:left; font-family:var(--display); letter-spacing:-.03em}
.rate .money.dis{opacity:.4; pointer-events:none}

.pick-tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.pick-tools .srch{width:auto; flex:1; min-width:180px}
.pick{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:7px; max-height:250px; overflow:auto; padding:2px; margin:-2px}
.pk{display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border:1.5px solid var(--line); border-radius:999px; background:var(--card); text-align:left; font-size:.8rem; font-weight:600; min-width:0}
.pk span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1}
.pk:hover{border-color:var(--ink-3)}
.pk[aria-pressed="true"]{border-color:var(--ink); background:var(--sky-soft); box-shadow:2px 2px 0 var(--sky)}
.pk .tk{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line-2); display:grid; place-items:center; flex:none}
.pk[aria-pressed="true"] .tk{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.pk .tk svg{width:10px; height:10px; opacity:0}
.pk[aria-pressed="true"] .tk svg{opacity:1}
.pk .ow{width:8px; height:8px; border-radius:50%; background:var(--rose); border:1.5px solid var(--rose-ink); flex:none}

.fld{margin-top:14px}
.fld > label, .fld > .lb{display:block; font-size:.78rem; font-weight:600; color:var(--ink-2); margin-bottom:6px}
.txt{width:100%; padding:10px 14px; border:1.5px solid var(--line-2); border-radius:13px; background:var(--card); outline:0; font-size:.95rem}
.txt:focus{border-color:var(--ink); box-shadow:2px 2px 0 var(--butter)}
textarea.txt{resize:vertical; min-height:62px; font-size:.88rem}
.sugg{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.sg{padding:4px 11px; border:1.5px solid var(--line-2); border-radius:999px; background:var(--paper); font-size:.76rem; font-weight:600; color:var(--ink-2)}
.sg:hover{border-color:var(--ink); color:var(--ink)}
.sg[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--paper)}
.amt-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.split-note{font-size:.8rem; color:var(--ink-3)}
.split-note b{color:var(--ink); font-family:var(--mono)}
.dates{display:flex; gap:8px; flex-wrap:wrap}
.dt{display:flex; flex-direction:column; align-items:flex-start; padding:8px 13px; border:1.5px solid var(--line-2); border-radius:13px; background:var(--card); text-align:left; min-width:108px}
.dt b{font-size:.84rem}
.dt small{font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.dt:hover{border-color:var(--ink-3)}
.dt[aria-pressed="true"]{border-color:var(--ink); box-shadow:2px 2px 0 var(--peach)}
.dt input[type=date]{border:0; background:none; font-family:var(--mono); font-size:.72rem; color:var(--ink-2); padding:0; outline:0}
.tog{display:flex; align-items:center; gap:12px; margin-top:12px; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); text-align:left; width:100%}
.tog b{font-size:.86rem; display:block}
.tog small{font-size:.76rem; color:var(--ink-3)}
.sw-t{margin-left:auto; width:38px; height:22px; border-radius:999px; border:1.5px solid var(--ink-3); background:var(--paper-3); position:relative; flex:none; transition:background .2s}
.sw-t::after{content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:var(--card); border:1.5px solid var(--ink-3); transition:transform .2s var(--ease-spring)}
.tog[aria-checked="true"] .sw-t{background:var(--mint); border-color:var(--ink)}
.tog[aria-checked="true"] .sw-t::after{transform:translateX(16px); border-color:var(--ink)}

/* the live receipt */
.rcpt{position:relative; background:var(--card); border:1.5px solid var(--ink); border-bottom:0; border-radius:14px 14px 0 0; padding:18px 18px 22px; font-family:var(--mono); font-size:.78rem; color:var(--ink-2)}
.rcpt::after{content:''; position:absolute; left:-1.5px; right:-1.5px; bottom:-9px; height:10px; background:linear-gradient(-45deg, transparent 6px, var(--card) 6px) 0 0/12px 10px repeat-x, linear-gradient(45deg, transparent 6px, var(--card) 6px) 0 0/12px 10px repeat-x; filter:drop-shadow(0 1.5px 0 var(--ink))}
.rcpt .hd{text-align:center; border-bottom:1.5px dashed var(--line-2); padding-bottom:12px}
.rcpt .hd b{display:block; font-family:var(--display); font-size:1.15rem; letter-spacing:-.02em; color:var(--ink); font-weight:600; line-height:1.2; word-break:break-word}
.rcpt .hd span{font-size:.7rem; letter-spacing:.08em; text-transform:uppercase}
.rcpt .ln{display:flex; gap:8px; padding:5px 0; align-items:baseline}
.rcpt .ln .l{flex:1; min-width:0; display:flex; gap:6px; align-items:baseline}
.rcpt .ln .l span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rcpt .ln .l::after{content:''; flex:1; border-bottom:1.5px dotted var(--line-2); min-width:10px; transform:translateY(-3px)}
.rcpt .ln .v{color:var(--ink); font-weight:600}
.rcpt .lines{padding:8px 0; border-bottom:1.5px dashed var(--line-2); max-height:210px; overflow:auto}
.rcpt .tot{display:flex; justify-content:space-between; align-items:baseline; padding-top:12px}
.rcpt .tot b{font-family:var(--display); font-size:1.7rem; letter-spacing:-.04em; color:var(--ink); font-weight:600}
.rcpt .who-row{display:flex; align-items:center; gap:10px; margin-top:10px; font-family:var(--sans); font-size:.78rem}
.rcpt .zero{padding:22px 0; text-align:center; color:var(--ink-3); font-family:var(--sans); font-size:.84rem}
.stamp{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) rotate(-14deg) scale(2.4); opacity:0; padding:6px 16px; border:3px solid var(--mint-ink); color:var(--mint-ink); border-radius:10px; font-family:var(--display); font-weight:700; font-size:1.7rem; letter-spacing:.12em; pointer-events:none; background:color-mix(in srgb, var(--card) 70%, transparent)}
.stamp.on{animation:stamp .45s var(--ease-spring) forwards}
@keyframes stamp{to{opacity:.95; transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
.warn{margin-top:22px; padding:12px 14px; border-radius:14px; background:var(--butter-soft); border:1.5px solid var(--butter-bd); font-size:.8rem; color:var(--ink-2)}
.warn b{color:var(--butter-ink)}
.warn .r{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.side .go{margin-top:auto; padding-top:18px}
.side .go .btn{width:100%}
.side .go p{text-align:center; font-size:.74rem; color:var(--ink-3); margin-top:9px}
.mob-sum, .mob-only{display:none}

.toast{position:fixed; z-index:95; left:50%; bottom:76px; transform:translate(-50%, 30px); opacity:0; pointer-events:none; background:var(--ink); color:var(--paper); padding:10px 10px 10px 16px; border-radius:999px; display:flex; align-items:center; gap:14px; font-size:.86rem; font-weight:600; box-shadow:3px 3px 0 var(--mint); transition:transform .3s var(--ease-spring), opacity .2s; max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0); opacity:1; pointer-events:auto}
.toast button{border:1.5px solid color-mix(in srgb, var(--paper) 40%, transparent); background:none; color:var(--paper); border-radius:999px; padding:4px 12px; font-size:.78rem; font-weight:600}

.mockbar{position:fixed; z-index:80; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:6px; align-items:center; padding:6px 8px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); box-shadow:3px 3px 0 var(--lilac); font-size:.76rem}
.mockbar .lab{font-family:var(--mono); font-weight:600; letter-spacing:.1em; color:var(--lilac-ink); padding:0 6px}
.mockbar button{white-space:nowrap; border:0; background:none; padding:5px 11px; border-radius:999px; font-weight:600; color:var(--ink-3)}
.mockbar button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
body.modal .mockbar{opacity:0; pointer-events:none}
.mockbar{transition:opacity .2s}
.mockbar i{width:1.5px; height:16px; background:var(--line-2)}

/* ---------- Overview (mirrors the dashboard mock's Treasury overview; dues card is the new short one) ---------- */
.ov-top{margin-top:28px; display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:20px}
.ov-mid{margin-top:20px; display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,1fr) minmax(0,.92fr); gap:20px; align-items:start}
.card-h{display:flex; align-items:center; gap:11px; padding:18px 20px 12px}
.card-h h3{font-family:var(--display); font-weight:600; font-size:1.1rem; letter-spacing:-.025em}
.card-h .r{margin-left:auto}
.tile{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--t); border:1.5px solid var(--note-ink); color:var(--note-ink); flex:none}
.tile .ic{width:16px; height:16px}
.card-b{padding:0 20px 18px}
.card-f{display:flex; align-items:center; gap:8px; padding:12px 20px; border-top:1.5px dashed var(--line-2); font-size:.78rem; color:var(--ink-3)}
.card-f .ic{width:14px; height:14px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:700; white-space:nowrap; background:var(--p-bg); color:var(--p-fg); border:1px solid var(--p-bd)}
.t-mint{--p-bg:var(--mint-soft); --p-fg:var(--mint-ink); --p-bd:var(--mint-bd)}
.t-peach{--p-bg:var(--peach-soft); --p-fg:var(--peach-ink); --p-bd:var(--peach-bd)}
.t-rose{--p-bg:var(--rose-soft); --p-fg:var(--rose-ink); --p-bd:var(--rose-bd)}

.bal{padding:22px 24px 18px; border-color:var(--ink); box-shadow:4px 4px 0 var(--mint)}
.bal .big b{font-size:3rem}
.bal .dl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; font-size:.82rem; color:var(--ink-3)}
.chart{position:relative; margin-top:16px; height:170px; padding-left:44px}
.chart svg{width:100%; height:150px; overflow:visible}
.chart .grid line{stroke:var(--line); stroke-width:1; stroke-dasharray:3 4; vector-effect:non-scaling-stroke}
.chart .ln{fill:none; stroke:var(--ink); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round}
.chart .fl{fill:var(--mint-soft)}
.chart .fu{fill:none; stroke:var(--ink-3); stroke-width:1.6; stroke-dasharray:5 5; vector-effect:non-scaling-stroke}
.chart .yl{position:absolute; left:0; font-family:var(--mono); font-size:.64rem; color:var(--ink-3); transform:translateY(-50%)}
.chart .xl{position:absolute; bottom:0; font-family:var(--mono); font-size:.64rem; color:var(--ink-3); transform:translateX(-50%)}
.chart .dot{position:absolute; width:11px; height:11px; border-radius:50%; background:var(--mint); border:2px solid var(--ink); transform:translate(-50%,-50%)}
.chart .flag{position:absolute; transform:translate(-100%, -150%); background:var(--ink); color:var(--paper); font-size:.7rem; font-weight:600; padding:3px 8px; border-radius:7px; white-space:nowrap}
.io{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:12px; padding-top:14px; border-top:1.5px dashed var(--line-2); font-size:.8rem; color:var(--ink-3)}
.io b{display:block; font-family:var(--display); font-weight:600; font-size:1.25rem; letter-spacing:-.03em; color:var(--ink)}
.io .r{text-align:right}
.io .split{grid-column:1 / -1; display:flex; height:10px; border-radius:9px; overflow:hidden; border:1.5px solid var(--ink)}
.io .split i{display:block; height:100%}

.brk .seg{margin-left:auto}
.donut{display:flex; align-items:center; gap:18px; padding:4px 20px 6px}
.ring{width:128px; height:128px; flex:none; border-radius:50%; background:var(--g); border:1.5px solid var(--ink); display:grid; place-items:center}
.ring > div{width:76px; height:76px; border-radius:50%; background:var(--card); border:1.5px solid var(--ink); display:grid; place-items:center; text-align:center}
.ring b{display:block; font-family:var(--display); font-size:1.02rem; letter-spacing:-.03em; line-height:1}
.ring small{font-size:.64rem; color:var(--ink-3)}
.donut p{font-size:.84rem; color:var(--ink-2)}
.cats{padding:8px 20px 16px; display:flex; flex-direction:column; gap:7px}
.cat{display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:4px 10px; align-items:center; font-size:.83rem}
.cat .sw{width:12px; height:12px; border-radius:4px; background:var(--cc); border:1.5px solid var(--ink)}
.cat .v{font-family:var(--mono); font-size:.78rem; font-weight:600}
.cat .v small{font-weight:400; color:var(--ink-3); margin-left:6px}

/* the short dues card: a doorway into the Dues tab */
.dq{position:relative; display:block; width:100%; text-align:left; padding:0; border:1.5px solid var(--ink); border-radius:22px; background:var(--card); box-shadow:4px 4px 0 var(--butter); transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring); cursor:pointer}
.dq:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--butter)}
.dq:hover .go-ar{background:var(--ink); color:var(--paper); transform:translateX(2px)}
.dq .go-ar{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; margin-left:auto; transition:background .18s, color .18s, transform .18s var(--ease-spring)}
.dq .go-ar .ic{width:15px; height:15px}
.dq-sum{display:flex; align-items:baseline; gap:10px; padding:0 20px; flex-wrap:wrap}
.dq-sum b{font-family:var(--display); font-weight:600; font-size:2.3rem; letter-spacing:-.05em; line-height:1}
.dq-sum span{font-size:.82rem; color:var(--ink-3)}
.dq-sum span em{font-style:normal; color:var(--ink); font-weight:600}
.dq .strip{padding:0 20px; margin-top:14px; gap:3px}
.dq .strip button{border-radius:3px; border-width:1px; pointer-events:auto}
.dq .strip button:hover{transform:scale(1.5)}
.dq-rows{margin:14px 12px 0; display:flex; flex-direction:column}
.dq-row{display:grid; grid-template-columns:12px minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:8px 8px; border:0; background:none; border-radius:10px; text-align:left; font-size:.84rem; width:100%}
.dq-row:hover{background:var(--paper-2)}
.dq-row .sw{width:12px; height:12px; border-radius:4px; border:1.5px solid var(--ink)}
.dq-row .nm{min-width:0; display:flex; align-items:center; gap:8px}
.dq-row .nm b{font-weight:600; white-space:nowrap}
.dq-row .stack{flex:none}
.dq-row .c{font-family:var(--mono); font-size:.74rem; color:var(--ink-3)}
.dq-row .v{font-family:var(--mono); font-weight:600; font-size:.82rem; min-width:56px; text-align:right}
.dq-row .ch{width:13px; height:13px; color:var(--ink-3); opacity:0; transition:opacity .15s, transform .15s}
.dq-row:hover .ch{opacity:1; transform:translateX(2px)}
.dq-row{grid-template-columns:12px minmax(0,1fr) auto auto 13px}
.dq .card-f{margin-top:12px}
.dq .card-f b{color:var(--ink)}
.dq .card-f .open{margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--ink); font-size:.82rem}
.dq-d1{padding:2px 20px 4px}
.dq-d1 p{font-size:.86rem; color:var(--ink-2)}
.dq-d1 .strip{padding:0; margin-top:14px}
.dq-d1 .strip button{background:transparent; border-style:dashed}

.up{display:flex; flex-direction:column}
.u{display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.u:first-child{border-top:0}
.dd{display:flex; flex-direction:column; align-items:center; border:1.5px solid var(--ink); border-radius:9px; overflow:hidden; background:var(--card); line-height:1.1}
.dd small{font-size:.56rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:2px 0}
.dd small:first-child{background:var(--paper-3); width:100%; text-align:center; color:var(--ink-2)}
.dd b{font-family:var(--display); font-size:1.05rem}
.u .t{font-weight:600; font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.u .m{font-size:.72rem; color:var(--ink-3); display:flex; gap:6px; align-items:center}
.u .a{font-family:var(--mono); font-weight:600; font-size:.82rem}
.u .a.in{color:var(--mint-ink)}
.cpill{font-size:.66rem; font-weight:600; padding:1px 7px; border-radius:999px; background:color-mix(in srgb, var(--cc) 45%, transparent); color:var(--ink-2)}
.u.dues{cursor:pointer}
.u.dues:hover .t{text-decoration:underline; text-underline-offset:3px}

.ldr{display:flex; align-items:baseline; gap:8px; font-size:.86rem; padding:6px 0}
.ldr .dots{flex:1; border-bottom:1.5px dotted var(--line-2); transform:translateY(-3px)}
.ldr .v{font-family:var(--mono); font-weight:600; font-size:.84rem}
.ldr .v.in{color:var(--mint-ink)}
.ldr.tot{border-top:1.5px solid var(--ink); margin-top:4px; padding-top:9px; font-weight:600}
.ldr .note{font-size:.72rem; color:var(--ink-3)}

.sec-h{margin-top:38px; display:flex; align-items:center; gap:14px}
.sec-h h2{font-family:var(--display); font-weight:600; font-size:1.4rem; letter-spacing:-.03em}
.sec-h .rule{flex:1; height:1.5px; background:var(--line)}
.sec-h .cnt{font-size:.8rem; color:var(--ink-3)}
.ledger{margin-top:14px; border:1.5px solid var(--line); border-radius:18px; background:var(--card); overflow:hidden;
  background-image:linear-gradient(90deg, transparent 70px, var(--rose-bd) 70px, var(--rose-bd) 71.5px, transparent 71.5px)}
.lr{display:grid; grid-template-columns:58px minmax(0,1fr) 110px 110px; gap:14px; align-items:center; padding:11px 18px 11px 12px; border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lr.hd{font-size:.66rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); background:var(--paper-2); padding-block:8px}
.lr .ldt{text-align:center; line-height:1.05}
.lr .ldt b{display:block; font-family:var(--display); font-size:1.1rem}
.lr .ldt small{font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3)}
.lr .t{font-weight:600; font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lr .m{font-size:.72rem; color:var(--ink-3); display:flex; gap:7px; align-items:center; margin-top:1px}
.lr .n{font-family:var(--mono); font-size:.86rem; text-align:right; font-weight:600}
.lr .n.in{color:var(--mint-ink)}
.lr .n.run{color:var(--ink-3); font-weight:500}
.lr.dues{cursor:pointer}
.lr.dues:hover{background:var(--paper-2)}
.lf{display:flex; align-items:center; gap:8px; padding:11px 18px; border-top:1.5px dashed var(--line-2); font-size:.78rem; color:var(--ink-3); background:var(--paper)}
.lf .ic{width:14px; height:14px}
.tab-flash{animation:tabflash 1s var(--ease-out)}
@keyframes tabflash{0%{box-shadow:0 0 0 0 var(--butter)} 30%{box-shadow:0 0 0 6px var(--butter)} 100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:1100px){ .ov-top{grid-template-columns:minmax(0,1fr)} .ov-mid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .ov-mid > .dq{grid-column:1 / -1} }
@media (max-width:700px){ .ov-mid{grid-template-columns:minmax(0,1fr)} .lr{grid-template-columns:48px minmax(0,1fr) 92px} .lr > :nth-child(4){display:none} .donut{flex-direction:column; align-items:flex-start} .ledger{background-image:linear-gradient(90deg, transparent 60px, var(--rose-bd) 60px, var(--rose-bd) 61.5px, transparent 61.5px)} }

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .top{grid-template-columns:minmax(0,1fr)}
  .sh-b{grid-template-columns:minmax(0,1fr) 320px}
}
@media (max-width:900px){
  .sb{display:none}
  .mbar{display:flex; align-items:center; gap:10px; height:56px; padding:0 16px; border-bottom:1.5px solid var(--line); position:sticky; top:0; background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(8px); z-index:20}
  .mbar b{font-family:var(--display); font-size:1rem}
  .mbar .lg{width:26px; height:26px; border-radius:8px; background:var(--peach); border:1.5px solid var(--ink); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:.7rem; color:var(--note-ink)}
  .wrap{padding:22px 16px 130px}
  .ph h1{font-size:2rem}
  .ph .act{margin-left:0; width:100%}
  .tr{grid-template-columns:minmax(0,1fr) 84px 96px}
  .tr > :nth-child(2), .tr > :nth-child(3), .tr > :nth-child(4), .tr > :nth-child(7){display:none}
  .d1-ways{grid-template-columns:minmax(0,1fr)}
  .d1{padding:30px 20px 26px}
  /* the sheet becomes a full-height page; the receipt folds into a sticky footer */
  .sheet{left:0; top:0; width:100vw; max-height:none; height:100dvh; border-radius:0; border:0; transform:translateY(30px); }
  .sheet.on{transform:none}
  .sh-b{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mob-only{display:block}
  .mob-only .warn{margin-top:14px}
  .form{padding:20px 16px 30px}
  .mob-sum{display:flex; align-items:center; gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1.5px solid var(--ink); background:var(--card); flex:none}
  .mob-sum .t{flex:1; min-width:0}
  .mob-sum .t b{font-family:var(--display); font-size:1.35rem; letter-spacing:-.03em; display:block; line-height:1.1}
  .mob-sum .t small{font-size:.74rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
  .drawer{top:auto; left:0; right:0; bottom:0; width:100%; max-height:88dvh; border-radius:24px 24px 0 0; transform:translateY(105%)}
}
@media (max-width:640px){
  .strip{grid-template-columns:repeat(13, minmax(0,1fr))}
  .big b{font-size:2.5rem}
  .hero{padding:20px 18px 18px}
  .modes{grid-template-columns:minmax(0,1fr)}
  .mode{flex-direction:row; align-items:center; gap:12px}
  .mode .g{margin:0}
  .mode > div{display:flex; flex-direction:column}
  .rate{grid-template-columns:26px minmax(0,1fr) 108px}
  .rate .stack{display:none}
  .tags{grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
  .wall-h .tools{margin-left:0; width:100%}
  .srch{flex:1; width:auto}
  .mockbar{bottom:10px}
}
</style>

        '<div class="amt-row"><label class="money lg"><span>$</span><input id="famt" inputmode="decimal" placeholder="0" value="' + esc(F.split ? F.total : F.amt) + '"></label>' +
        (F.split ? '<span class="split-note">' + (n && num(F.total) ? money(num(F.total)) + ' ÷ ' + n + ' = <b>' + money(Math.floor(num(F.total) / n * 100) / 100, true) + '</b> each' : 'Pick who’s splitting it first') + '</span>'

    }
    h += '</div></div>';

    // 3 — when
    h += '<div class="step"><span class="num">3</span><h4>When’s it due?</h4><div></div><div class="body"><div class="dates" style="margin-top:8px">' +
      dateB("2w", "In two weeks", fmtD(addDays(TODAY, 14))) + dateB("eom", "End of month", "Oct 31") +
      '<button class="dt" data-a="due:custom" aria-pressed="' + (F.due === "custom") + '"><b>Pick a date</b><input type="date" id="fdate" value="' + F.custom + '" min="' + TODAY + '"></button>' +

      '<button class="tog" role="switch" aria-checked="' + F.notify + '" data-a="notify"><span>' + ic("envelope") + '</span><span><b>Tell them</b><small>Each person gets a note with their amount and the due date</small></span><span class="sw-t"></span></button>' +
      '</div></div>';
    return h;
  }
  function modeB(k, i, t, s, c) { return '<button class="mode" style="--c:' + c + '" data-a="who:' + k + '" aria-pressed="' + (F.who === k) + '"><span class="g">' + ic(i) + '</span><div><b>' + t + '</b><small>' + s + '</small></div></button>'; }
  function dateB(k, t, s) { return '<button class="dt" data-a="due:' + k + '" aria-pressed="' + (F.due === k) + '"><b>' + t + '</b><small>' + s + '</small></button>'; }
  function stackH(ms, max) {

      '<button class="btn" data-a="submit"' + (s.ok ? '' : ' disabled') + '>' + ic("send") + 'Bill them</button>';

  function submit() {

    var aud = F.who === "all" ? (F.excl.length ? "Everyone but " + F.excl.length : "Everyone") : F.who === "role" ? (TIERS.filter(function (t) { return F.roles[t.id].on; }).length === 1 ? TIERS.filter(function (t) { return F.roles[t.id].on; })[0].l : "By role") : plural(s.t.length, "person", "people");

  /* ---------- plumbing ---------- */

  document.addEventListener("click", function (e) {

    var a = b.getAttribute("data-a"), p = a.split(":"), k = p[0], v = p.slice(1).join(":");

    if (t.id === "xq") {

      if (hit) { F.excl.push(hit.id); F.xq = ""; refresh(true); var n4 = $("xq"); if (n4) n4.focus(); }
