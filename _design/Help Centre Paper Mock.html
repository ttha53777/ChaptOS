<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Centre · Paper</title>
<!--
  /help, redesigned in the in-app Paper language (_design/Dashboard Paper Mock.html → app/paper-aesthetic.css):
  cream paper, brown ink, pastel triplets, 1.5px warm hairlines, hard pastel offset shadows, highlighter,
  washi tape, sticky notes. Light + night ("a warm desk under a lamp"). Icons are the app's own sprite,
  injected verbatim from app/components/paper/PaperIcon.tsx.

  The idea: SHOW, then tell. Every article opens with a figure — a small, faithful replica of the real
  screen it's about, built from the real labels (verified against the components), with numbered pins
  that match the numbered steps below it. Facts that people hunt for (where it lives, who's allowed)
  sit in a strip above the figure instead of being buried in prose.

  Index = a desk: a ⌘K-style search card, "who are you" filter (everyone / members / officers / org
  admins), three sticky-note doors, a term journey, and the category shelf. The app's sidebar becomes
  the help navigation.

  Content is the verified rewrite from _design/Help Centre Rewrite Mock.html (same Block schema as
  app/help/content.ts), plus label corrections found while building the figures (semester gate tabs are
  "Extend it / Start new", self-service writ cards say "Submit", dues drawer says "Record payment / Waive
  some", check-in closes with "Close & record attendance").

  MOCK bar: Light / Dark, Sources (per-article "checked against"), What changed. No backend; names fictional.
-->
<script>
  (function(){ var t="light"; try{ t=localStorage.getItem("help-paper-theme")||"light"; }catch(e){} document.documentElement.dataset.theme=t; })();
</script>

<style>
/* ---------- tokens (verbatim from the Paper mock) ---------- */
:root{
  --paper:#FFFCF6; --paper-2:#FBF5EA; --paper-3:#F4ECDD; --card:#FFFFFF;
  --ink:#26211B; --ink-2:#544A3F; --ink-3:#8A7F71;
  --line:#EBE1CF; --line-2:#DCD0B9;
  --peach:#FFD5C4;  --peach-soft:#FFEDE5;  --peach-ink:#C9542D;  --peach-bd:#F8D2C2;
  --sky:#CFE2FF;    --sky-soft:#EAF2FF;    --sky-ink:#2A66C7;    --sky-bd:#CCDFFB;
  --mint:#C7EFDA;   --mint-soft:#E6F8EF;   --mint-ink:#1B815B;   --mint-bd:#BDE7D2;
  --butter:#FFE5A0; --butter-soft:#FFF6DC; --butter-ink:#9C6B08; --butter-bd:#F4DFA6;
  --lilac:#E1D8FF;  --lilac-soft:#F1EDFF;  --lilac-ink:#6244CC;  --lilac-bd:#DCD2FB;
  --rose:#FFD6E6;   --rose-soft:#FFEDF4;   --rose-ink:#C23C77;   --rose-bd:#F8CEE0;
  --note-ink:#26211B; --note-filter:none; --mark-op:.85;
  --c-chapter:#2A66C7; --c-party:#C23C77; --c-deadline:#C9542D; --c-service:#1F8A80; --c-fundy:#9C6B08;
  --sh-1:0 1px 2px rgba(38,33,27,.05), 0 3px 10px rgba(38,33,27,.045);
  --sh-2:0 1px 2px rgba(38,33,27,.05), 0 10px 26px -8px rgba(38,33,27,.14);
  --sh-3:0 2px 4px rgba(38,33,27,.05), 0 26px 60px -18px rgba(38,33,27,.22);
  --scrim:rgba(38,33,27,.28);
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease-out:cubic-bezier(.22,.72,.24,1); --spring:cubic-bezier(.16,.9,.3,1.02);
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#15110D; --paper-2:#1B1712; --paper-3:#25201A; --card:#1F1A15;
  --ink:#F2EADC; --ink-2:#CDBFAB; --ink-3:#948876;
  --line:#2F271E; --line-2:#43382B;
  --peach:#E5A28A;  --peach-soft:rgba(255,178,148,.085); --peach-ink:#FFB49A; --peach-bd:rgba(255,178,148,.22);
  --sky:#8DB2EC;    --sky-soft:rgba(150,190,255,.085);   --sky-ink:#AACBFF;   --sky-bd:rgba(150,190,255,.22);
  --mint:#80CBA4;   --mint-soft:rgba(140,220,180,.08);   --mint-ink:#8FDDB6;  --mint-bd:rgba(140,220,180,.22);
  --butter:#E3BF66; --butter-soft:rgba(255,214,120,.08); --butter-ink:#F0CC72;--butter-bd:rgba(255,214,120,.22);
  --lilac:#A593EE;  --lilac-soft:rgba(180,160,255,.10);  --lilac-ink:#C4B6FF; --lilac-bd:rgba(180,160,255,.26);
  --rose:#E598B7;   --rose-soft:rgba(255,160,200,.08);   --rose-ink:#FFAACB;  --rose-bd:rgba(255,160,200,.22);
  --note-filter:brightness(.93) saturate(.85); --mark-op:.42;
  --c-chapter:#8DB2EC; --c-party:#E598B7; --c-deadline:#FFB49A; --c-service:#6FC9BD; --c-fundy:#F0CC72;
  --sh-1:0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25);
  --sh-2:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -10px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.4), 0 26px 60px -18px rgba(0,0,0,.75);
  --scrim:rgba(5,4,2,.6);
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55; letter-spacing:-.005em; -webkit-font-smoothing:antialiased; overflow-x:hidden; transition:background .35s var(--ease-out), color .35s var(--ease-out)}
h1,h2,h3,h4,h5,p,ul,ol,figure{margin:0}
ul,ol{padding:0; list-style:none}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--lilac-ink); outline-offset:2px; border-radius:6px}
.ic{width:18px; height:18px; flex:none}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.hi{position:relative; z-index:0}
.hi::before{content:''; position:absolute; z-index:-1; left:-.1em; right:-.1em; bottom:.06em; height:.46em; background:var(--mark, var(--butter)); border-radius:.4em .55em .38em .6em; transform:rotate(-.8deg); opacity:var(--mark-op)}
kbd{font-family:var(--mono); font-size:.68rem; border:1px solid var(--line-2); border-radius:6px; padding:1px 6px; background:var(--paper-2); color:var(--ink-3)}
.t-peach{--p-bg:var(--peach-soft); --p-fg:var(--peach-ink); --p-bd:var(--peach-bd); --p:var(--peach)}
.t-sky{--p-bg:var(--sky-soft); --p-fg:var(--sky-ink); --p-bd:var(--sky-bd); --p:var(--sky)}
.t-mint{--p-bg:var(--mint-soft); --p-fg:var(--mint-ink); --p-bd:var(--mint-bd); --p:var(--mint)}
.t-butter{--p-bg:var(--butter-soft); --p-fg:var(--butter-ink); --p-bd:var(--butter-bd); --p:var(--butter)}
.t-lilac{--p-bg:var(--lilac-soft); --p-fg:var(--lilac-ink); --p-bd:var(--lilac-bd); --p:var(--lilac)}
.t-rose{--p-bg:var(--rose-soft); --p-fg:var(--rose-ink); --p-bd:var(--rose-bd); --p:var(--rose)}
.tile{width:34px; height:34px; flex:none; border-radius:11px; display:grid; place-items:center; background:var(--p-bg); border:1.5px solid var(--p-bd); color:var(--p-fg)}
.tile .ic{width:17px; height:17px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:.74rem; font-weight:600; white-space:nowrap; background:var(--p-bg, var(--paper-2)); color:var(--p-fg, var(--ink-2)); border:1px solid var(--p-bd, var(--line))}
.pill .ic{width:12px; height:12px}
.btn{--bg:var(--ink); --fg:var(--paper); --hs:var(--lilac); display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 17px; border-radius:999px; border:1.5px solid var(--ink); background:var(--bg); color:var(--fg); font-weight:600; font-size:.88rem; box-shadow:2.5px 2.5px 0 var(--hs); white-space:nowrap; text-decoration:none; transition:transform .18s var(--spring), box-shadow .18s var(--spring)}
.btn:hover{transform:translate(-1.5px,-1.5px); box-shadow:4.5px 4.5px 0 var(--hs)}
.btn .ic{width:15px; height:15px}
.btn--ghost{--bg:var(--card); --fg:var(--ink); --hs:var(--peach)}

/* ---------- app frame + sidebar (the app's own) ---------- */
.app{display:flex; min-height:100vh}
.main{flex:1; min-width:0}
.sb{position:sticky; top:0; height:100vh; width:262px; flex:none; z-index:30; display:flex; flex-direction:column; background:color-mix(in srgb, var(--paper-2) 88%, transparent); border-right:1.5px solid var(--line)}
.sb-org{display:flex; align-items:center; gap:11px; height:66px; flex:none; padding:0 14px; border-bottom:1.5px solid var(--line); text-decoration:none}
.orglogo{width:36px; height:36px; flex:none; border-radius:11px; display:grid; place-items:center; background:var(--butter); border:2px solid var(--note-ink); color:var(--note-ink); font-family:var(--display); font-weight:700; font-size:1rem; transform:rotate(-3deg); box-shadow:2px 2px 0 var(--peach); filter:var(--note-filter)}
.sb-org b{display:block; font-family:var(--display); font-weight:600; font-size:1rem; letter-spacing:-.022em; line-height:1.15}
.sb-org small{display:block; font-family:var(--mono); font-size:.64rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin-top:2px}
.sb-scroll{flex:1; overflow-y:auto; padding:12px 10px 16px; scrollbar-width:thin}
.sb-search{display:flex; align-items:center; gap:9px; width:100%; margin:0 0 14px; padding:9px 11px; border-radius:12px; border:1.5px solid var(--line-2); background:var(--card); color:var(--ink-3); font-size:.86rem; text-align:left}
.sb-search:hover{border-color:var(--ink-3); color:var(--ink)}
.sb-search .ic{width:16px; height:16px}
.sb-search kbd{margin-left:auto}
.grp + .grp{margin-top:14px}
.grp-h{display:flex; align-items:center; gap:8px; padding:0 10px 6px; font-size:.64rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.grp-h::before{content:''; width:12px; height:2px; border-radius:2px; background:var(--eb, var(--peach))}
.item{display:flex; align-items:center; gap:11px; min-height:38px; padding:0 11px; margin:2px 0; border-radius:12px; border:1.5px solid transparent; text-decoration:none; color:var(--ink-2); font-size:.9rem; font-weight:500; transition:background .16s, color .16s, border-color .16s, box-shadow .2s var(--spring)}
.item .ic{color:var(--ink-3); transition:transform .3s var(--spring), color .16s}
.item:hover{background:var(--card); color:var(--ink)}
.item:hover .ic{color:var(--ink); transform:rotate(-6deg) scale(1.06)}
.item[aria-current="page"]{background:var(--card); color:var(--ink); font-weight:600; border-color:var(--ink); box-shadow:2.5px 2.5px 0 var(--butter)}
.item[aria-current="page"] .ic{color:var(--ink)}
.item .lbl{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .n{font-family:var(--mono); font-size:.68rem; color:var(--ink-3)}
.sub{margin:2px 0 8px 22px; padding-left:12px; border-left:1.5px dashed var(--line-2); display:grid; gap:1px}
.sub a{display:block; padding:5px 9px; border-radius:9px; font-size:.82rem; color:var(--ink-3); text-decoration:none; line-height:1.35}
.sub a:hover{background:var(--card); color:var(--ink)}
.sub a[aria-current="page"]{color:var(--ink); font-weight:600; background:var(--card); box-shadow:inset 2px 0 0 var(--ink)}
.sb-foot{display:flex; align-items:center; gap:8px; padding:10px 12px 12px; border-top:1.5px solid var(--line)}
.seg{display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:var(--card); border:1.5px solid var(--line)}
.seg button{display:flex; align-items:center; gap:6px; border:0; background:none; padding:5px 10px; border-radius:999px; font-size:.76rem; font-weight:600; color:var(--ink-3)}
.seg button .ic{width:14px; height:14px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.sb-human{margin-left:auto; font-size:.78rem; font-weight:600; color:var(--ink-2); text-decoration:none; display:flex; align-items:center; gap:6px}
.sb-human .ic{width:15px; height:15px}
.mbar{display:none}
.shade{display:none}
@media (max-width:1023px){
  .sb{position:fixed; left:0; top:0; bottom:0; height:auto; width:min(300px,86vw); transform:translateX(-102%); background:var(--paper-2); box-shadow:var(--sh-3); transition:transform .26s var(--spring)}
  .sb.open{transform:none}
  .shade{display:block; position:fixed; inset:0; z-index:25; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .2s; border:0}
  .shade.open{opacity:1; pointer-events:auto}
  .mbar{display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:20; padding:10px 14px; background:color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter:blur(12px); border-bottom:1.5px solid var(--line)}
  .mbar b{font-family:var(--display); font-weight:600; flex:1}
  .iconbtn{width:36px; height:36px; display:grid; place-items:center; border-radius:10px; border:1.5px solid var(--line); background:var(--card)}
}

/* ---------- page ---------- */
.wrap{max-width:1120px; margin:0 auto; padding:clamp(26px,3.4vw,44px) clamp(16px,3vw,44px) 120px}
.kick{display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.kick .chip{padding:2px 9px; border-radius:999px; background:var(--card); border:1.5px solid var(--line-2); color:var(--ink-2)}
.kick a{color:var(--ink-3); text-decoration:none}
.kick a:hover{color:var(--ink)}
.greet{font-family:var(--display); font-weight:600; letter-spacing:-.034em; line-height:1.03; font-size:clamp(2.1rem,4vw,3.2rem); margin-top:14px; max-width:20ch; font-variation-settings:"opsz" 96}
.lede{margin-top:14px; max-width:60ch; font-size:1.04rem; line-height:1.6; color:var(--ink-2)}

/* search card — the ⌘K card */
.find{margin-top:26px; max-width:720px; position:relative; z-index:5}
.find-box{display:flex; align-items:center; gap:12px; padding:6px 8px 6px 18px; background:var(--card); border:1.5px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--lilac); transition:transform .18s var(--spring), box-shadow .18s var(--spring)}
.find-box:focus-within{transform:translate(-1.5px,-1.5px); box-shadow:6px 6px 0 var(--lilac)}
.find-box .ic{color:var(--ink-3)}
.find-box input{flex:1; min-width:0; border:0; outline:0; background:transparent; padding:12px 0; font-size:1.02rem}
.find-box input::placeholder{color:var(--ink-3)}
.find-res{margin-top:10px; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-2); padding:6px; display:grid; gap:2px}
.find-res a{display:flex; gap:12px; align-items:flex-start; padding:10px 10px; border-radius:12px; text-decoration:none}
.find-res a:hover,.find-res a.on{background:var(--paper-2)}
.find-res .t{font-weight:600; font-size:.92rem}
.find-res .b{font-size:.82rem; color:var(--ink-3); line-height:1.4; margin-top:1px}
.find-res .tile{width:30px; height:30px; border-radius:9px}
.find-none{padding:18px; font-size:.9rem; color:var(--ink-2)}

/* who filter */
.tabs{display:inline-flex; gap:3px; padding:3px; border-radius:20px; background:var(--paper-2); border:1.5px solid var(--line); flex-wrap:wrap}
.tabs button{border:0; background:none; padding:6px 13px; border-radius:999px; font-size:.82rem; font-weight:600; color:var(--ink-3); display:flex; gap:6px; align-items:center}
.tabs button .n{font-family:var(--mono); font-size:.68rem; opacity:.7}
.tabs button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 0 0 1.5px var(--ink), 2px 2px 0 var(--butter)}
.who{margin-top:34px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.who > span{font-size:.82rem; color:var(--ink-3); font-weight:500}

/* sticky-note doors */
.sec-h{display:flex; align-items:baseline; gap:12px; margin:46px 0 16px}
.sec-h h2{font-family:var(--display); font-weight:600; font-size:1.3rem; letter-spacing:-.024em}
.sec-h .rule{flex:1; height:1.5px; background:var(--line)}
.sec-h small{font-size:.8rem; color:var(--ink-3)}
.doors{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; padding:6px 4px 0}
.door{position:relative; display:block; padding:20px 20px 18px; text-decoration:none; color:var(--note-ink); background:var(--p); filter:var(--note-filter); border-radius:6px 16px 8px 14px; box-shadow:var(--sh-2); transform:rotate(var(--r,-1.2deg)); transition:transform .25s var(--spring), box-shadow .25s var(--spring)}
.door:nth-child(2){--r:.9deg}
.door:nth-child(3){--r:-.6deg}
.door:hover{transform:rotate(0) translateY(-3px); box-shadow:var(--sh-3)}
.door::after{content:''; position:absolute; left:50%; top:-8px; width:58px; height:16px; transform:translateX(-50%) rotate(-3deg); background:rgba(255,255,255,.55); border-inline:1px dashed rgba(38,33,27,.16)}
.door .ic{width:22px; height:22px}
.door b{display:block; font-family:var(--display); font-weight:600; font-size:1.14rem; letter-spacing:-.02em; margin-top:12px}
.door span{display:block; font-size:.86rem; line-height:1.45; margin-top:5px; opacity:.82}
.door i{display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-style:normal; font-size:.8rem; font-weight:600}
.door i .ic{width:14px; height:14px}

/* journey */
.journey{position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; padding-top:26px}
.journey::before{content:''; position:absolute; left:12px; right:12px; top:12px; height:0; border-top:2px dashed var(--line-2)}
.stop{position:relative}
.stop::before{content:''; position:absolute; left:2px; top:-21px; width:16px; height:16px; border-radius:50%; background:var(--p); border:2px solid var(--ink)}
.stop h3{font-family:var(--display); font-weight:600; font-size:1rem; letter-spacing:-.02em}
.stop p{font-size:.8rem; color:var(--ink-3); margin-top:2px}
.stop ul{margin-top:10px; display:grid; gap:5px}
.stop a{display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:11px; background:var(--card); border:1.5px solid var(--line); font-size:.83rem; font-weight:500; text-decoration:none; color:var(--ink-2); transition:border-color .15s, transform .18s var(--spring)}
.stop a:hover{border-color:var(--ink); color:var(--ink); transform:translateX(2px)}
.stop a .ic{width:14px; height:14px; color:var(--p-fg)}

/* shelf */
.shelf{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); min-width:0}
.cat{display:flex; flex-direction:column; scroll-margin-top:90px}
.cat-h{display:flex; align-items:center; gap:11px; padding:16px 18px 6px}
.cat-h h3{font-family:var(--display); font-weight:600; font-size:1.06rem; letter-spacing:-.022em}
.cat-h .n{margin-left:auto; font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.cat > p{padding:0 18px; font-size:.82rem; color:var(--ink-3); line-height:1.45}
.cat ul{padding:10px 8px 10px; display:grid; gap:1px; flex:1}
.cat li a{display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:10px; font-size:.86rem; color:var(--ink-2); text-decoration:none; line-height:1.3}
.cat li a:hover{background:var(--paper-2); color:var(--ink)}
.cat li a .ic{width:14px; height:14px; color:var(--ink-3)}
.cat li a .lk{margin-left:auto; color:var(--ink-3); opacity:.7}
.cat li.dim{display:none}
.cat-empty{padding:4px 18px 18px; font-size:.8rem; color:var(--ink-3); font-style:italic}

.stuck{margin-top:46px; display:flex; gap:22px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:22px 24px; background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r-lg); box-shadow:5px 5px 0 var(--butter)}
.stuck h3{font-family:var(--display); font-weight:600; font-size:1.24rem; letter-spacing:-.022em}
.stuck p{margin-top:6px; color:var(--ink-2); font-size:.92rem; max-width:56ch}

/* ---------- article ---------- */
.art{display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:clamp(28px,4vw,56px); align-items:start}
.art-main{min-width:0; max-width:760px}
.art h1{font-family:var(--display); font-weight:600; letter-spacing:-.034em; line-height:1.05; font-size:clamp(1.9rem,3.4vw,2.7rem); margin-top:14px; font-variation-settings:"opsz" 96}
.facts{margin-top:22px; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:10px}
.fact{padding:12px 14px; border-radius:14px; background:var(--paper-2); border:1.5px solid var(--line)}
.fact .k{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.fact .k .ic{width:13px; height:13px}
.fact .v{margin-top:6px; font-size:.86rem; color:var(--ink); font-weight:500; line-height:1.45}
.path{display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.path span{padding:2px 9px; border-radius:8px; background:var(--card); border:1.5px solid var(--line-2); font-size:.8rem; font-weight:600}
.path span:last-child{border-color:var(--ink); box-shadow:2px 2px 0 var(--butter)}
.path i{font-style:normal; color:var(--ink-3); font-size:.8rem}

/* figure */
.fig{margin-top:22px; position:relative; padding:22px; background:var(--paper-2); border:1.5px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.fig::before{content:''; position:absolute; inset:0; background-image:radial-gradient(var(--line-2) 1px, transparent 1px); background-size:18px 18px; opacity:.5; pointer-events:none}
.fig > *{position:relative}
.fig-cap{display:flex; align-items:center; gap:8px; margin-top:16px; font-size:.8rem; color:var(--ink-3)}
.fig-cap b{font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; color:var(--ink-2); padding:2px 7px; border-radius:6px; background:var(--card); border:1px solid var(--line-2)}

/* mini-UI kit used inside figures */
.scr{background:var(--card); border:1.5px solid var(--line-2); border-radius:14px; box-shadow:var(--sh-2); overflow:hidden; min-width:0}
.scr-h{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1.5px solid var(--line); background:var(--paper-2); font-family:var(--mono); font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.scr-h .ic{width:13px; height:13px}
.scr-b{padding:14px}
.u-t{font-family:var(--display); font-weight:600; letter-spacing:-.022em; font-size:1.02rem; line-height:1.2}
.u-s{font-size:.78rem; color:var(--ink-3); line-height:1.4}
.u-lb{display:block; font-size:.7rem; font-weight:600; color:var(--ink-3); margin:0 0 4px}
.u-in{display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:10px; border:1.5px solid var(--line-2); background:var(--card); font-size:.8rem; color:var(--ink); min-height:34px}
.u-in.ph{color:var(--ink-3)}
.u-in .ic{width:14px; height:14px; color:var(--ink-3)}
.u-btn{--hs:var(--lilac); display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); font-size:.76rem; font-weight:600; box-shadow:2px 2px 0 var(--hs); white-space:nowrap}
.u-btn .ic{width:13px; height:13px}
.u-btn.g{background:var(--card); color:var(--ink); --hs:var(--peach)}
.u-btn.s{background:transparent; color:var(--ink-2); border-color:var(--line-2); box-shadow:none}
.u-btn.r{background:var(--card); color:var(--rose-ink); border-color:var(--rose-ink); --hs:var(--rose)}
.u-row{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line-2); font-size:.82rem; min-width:0}
.u-row:last-child{border-bottom:0}
.u-row .grow{flex:1; min-width:0}
.u-row b{display:block; font-size:.84rem; font-weight:600}
.u-tog{width:30px; height:18px; flex:none; border-radius:999px; background:var(--line-2); position:relative}
.u-tog::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.2)}
.u-tog.on{background:var(--ink)}
.u-tog.on::after{left:14px}
.u-chk{width:16px; height:16px; flex:none; border-radius:5px; border:1.5px solid var(--line-2); display:grid; place-items:center; background:var(--card)}
.u-chk.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.u-chk .ic{width:11px; height:11px}
.av{width:28px; height:28px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:.64rem; font-weight:700; background:var(--av, var(--lilac)); color:rgba(38,33,27,.72); border:1.5px solid rgba(38,33,27,.08)}
.u-tabs{display:inline-flex; flex-wrap:wrap; gap:2px; padding:3px; border-radius:999px; background:var(--paper-2); border:1.5px solid var(--line)}
.u-tabs span{padding:4px 10px; border-radius:999px; font-size:.72rem; font-weight:600; color:var(--ink-3)}
.u-tabs span.on{background:var(--card); color:var(--ink); box-shadow:0 0 0 1.5px var(--ink)}
.u-stat{padding:10px; border-radius:12px; background:var(--paper-2); border:1.5px solid var(--line)}
.u-stat .k{font-size:.66rem; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em}
.u-stat .v{font-family:var(--display); font-weight:600; font-size:1.2rem; letter-spacing:-.02em; margin-top:2px}
.u-pop{background:var(--card); border:1.5px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--hs, var(--lilac)); padding:6px}
.u-pop .r{display:flex; align-items:flex-start; gap:10px; padding:8px 9px; border-radius:10px; font-size:.82rem; color:var(--ink-2)}
.u-pop .r .ic{width:15px; height:15px; color:var(--ink-3); margin-top:1px}
.u-pop .r small{display:block; font-size:.72rem; color:var(--ink-3)}
.u-pop .r.on{background:var(--paper-2); color:var(--ink)}
.u-pop .r.danger{color:var(--rose-ink)}
.u-pop .r.danger .ic{color:var(--rose-ink)}
.u-pop hr{border:0; border-top:1px dashed var(--line-2); margin:4px}
.stamp{display:inline-block; font-family:var(--mono); font-weight:600; font-size:.7rem; letter-spacing:.14em; padding:5px 10px; border:2px solid currentColor; border-radius:6px; transform:rotate(-6deg); color:var(--p-fg, var(--mint-ink)); opacity:.9}
.note-s{position:relative; padding:12px 14px; color:var(--note-ink); background:var(--p); filter:var(--note-filter); border-radius:5px 12px 7px 10px; box-shadow:var(--sh-2); font-size:.8rem; line-height:1.4; transform:rotate(-1deg)}
.tape{position:relative}
.tape::after{content:''; position:absolute; left:50%; top:-8px; width:52px; height:15px; transform:translateX(-50%) rotate(-3deg); background:rgba(255,255,255,.55); border-inline:1px dashed rgba(38,33,27,.16)}
html[data-theme="dark"] .tape::after{background:rgba(255,255,255,.14)}

/* pins: the numbered markers shared by figures and steps */
.pin{display:inline-grid; place-items:center; width:21px; height:21px; flex:none; border-radius:50%; background:var(--ink); color:var(--paper); font-family:var(--mono); font-style:normal; font-size:.68rem; font-weight:600; box-shadow:2px 2px 0 var(--butter); vertical-align:middle; line-height:1}
.pin.abs{position:absolute; z-index:2}

/* figure layouts */
.f-row{display:flex; gap:14px; align-items:stretch; flex-wrap:wrap}
.f-grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px}
.f-grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.flow{display:flex; align-items:stretch; gap:6px; flex-wrap:wrap}
.flow > .st{flex:1 1 140px; min-width:0}
.flow > .ar{flex:none; align-self:center; color:var(--ink-3); width:22px}
.flow > .ar .ic{width:20px; height:20px}
.st{position:relative; padding:12px 12px 12px; border-radius:14px; background:var(--card); border:1.5px solid var(--line-2); box-shadow:var(--sh-1)}
.st .pin{position:absolute; top:-9px; left:-7px}
.st .k{font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--p-fg, var(--ink-3))}
.st b{display:block; font-size:.88rem; margin-top:3px; line-height:1.25}
.st p{font-size:.76rem; color:var(--ink-3); line-height:1.4; margin-top:4px}
.st.hl{border-color:var(--ink); box-shadow:3px 3px 0 var(--p, var(--butter))}
.st.ghost{border-style:dashed; background:transparent; box-shadow:none}
.lbl-m{font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.x-out{text-decoration:line-through; text-decoration-thickness:1.5px; color:var(--ink-3)}

/* ruler (standing) */
.ruler{position:relative; height:34px; border-radius:10px; overflow:hidden; display:flex; border:1.5px solid var(--ink)}
.ruler > span{display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; color:var(--note-ink); filter:var(--note-filter)}
.ruler-ticks{position:relative; height:18px; margin-top:4px; font-family:var(--mono); font-size:.66rem; color:var(--ink-3)}
.ruler-ticks span{position:absolute; transform:translateX(-50%)}

/* body blocks */
.body{margin-top:26px}
.body > *:first-child{margin-top:0}
.body h2{font-family:var(--display); font-weight:600; font-size:1.22rem; letter-spacing:-.022em; margin-top:34px; scroll-margin-top:24px; display:flex; align-items:center; gap:10px}
.body h2::before{content:''; width:14px; height:2.5px; border-radius:2px; background:var(--eb, var(--peach))}
.body > p{margin-top:14px; color:var(--ink-2); line-height:1.68}
.body b{color:var(--ink); font-weight:600}
.body a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--lilac-ink); text-decoration-thickness:1.5px; text-underline-offset:3px}
.body a.ext{text-decoration-style:dotted; text-decoration-color:var(--line-2)}
.body code{font-family:var(--mono); font-size:.84em; padding:1px 6px; background:var(--paper-3); border-radius:6px; color:var(--ink-2); overflow-wrap:anywhere}
.steps{margin-top:16px; display:grid; gap:10px}
.steps li{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:14px; background:var(--card); border:1.5px solid var(--line); line-height:1.55; color:var(--ink-2)}
.steps li .pin{margin-top:1px}
.list{margin-top:14px; display:grid; gap:9px}
.list li{position:relative; padding-left:22px; color:var(--ink-2); line-height:1.62}
.list li::before{content:''; position:absolute; left:2px; top:.66em; width:11px; height:2.5px; border-radius:2px; background:var(--line-2); transform:rotate(-4deg)}
.list.check li::before{content:'✓'; width:auto; height:auto; background:none; top:0; left:1px; color:var(--mint-ink); font-weight:700; transform:none}
.list.no li::before{content:'✕'; width:auto; height:auto; background:none; top:0; left:1px; color:var(--peach-ink); font-weight:700; font-size:.88em; transform:none}
.note{margin-top:18px; display:flex; gap:12px; padding:14px 16px; border-radius:14px; background:var(--sky-soft); border:1.5px solid var(--sky-bd)}
.note .ic{width:18px; height:18px; color:var(--sky-ink); margin-top:2px}
.note h5{font-size:.86rem; font-weight:700; color:var(--ink)}
.note p{margin-top:3px; color:var(--ink-2); font-size:.9rem; line-height:1.58}
.sticky{margin:26px 6px 4px; position:relative; padding:16px 18px 15px; color:var(--note-ink); background:var(--p); filter:var(--note-filter); border-radius:6px 16px 8px 14px; box-shadow:var(--sh-2); transform:rotate(var(--r,-.6deg))}
.sticky:nth-of-type(even){--r:.5deg}
.sticky::after{content:''; position:absolute; left:50%; top:-8px; width:58px; height:16px; transform:translateX(-50%) rotate(-3deg); background:rgba(255,255,255,.55); border-inline:1px dashed rgba(38,33,27,.16)}
.sticky h5{display:flex; align-items:center; gap:7px; font-family:var(--display); font-size:1rem; font-weight:600; letter-spacing:-.018em}
.sticky h5 .ic{width:16px; height:16px}
.sticky p{margin-top:5px; font-size:.9rem; line-height:1.55}
.sticky a,.sticky b{color:var(--note-ink)}
.sticky code{background:rgba(255,255,255,.5)}
.tw{margin-top:16px; overflow-x:auto; border:1.5px solid var(--line); border-radius:16px; background:var(--card)}
table{width:100%; border-collapse:collapse; font-size:.88rem; min-width:440px}
th,td{text-align:left; padding:11px 14px; vertical-align:top; line-height:1.5; border-bottom:1.5px solid var(--line)}
thead th{background:var(--paper-2); font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
tbody tr:last-child > *{border-bottom:0}
tbody th{font-weight:600; width:30%; min-width:120px}
td{color:var(--ink-2)}
.where{margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 12px; border-radius:12px; border:1.5px dashed var(--line-2)}

/* rail */
.rail{position:sticky; top:24px; display:grid; gap:18px}
.rail h5{font-family:var(--mono); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px}
.toc{display:grid; gap:1px; border-left:1.5px solid var(--line); padding-left:2px}
.toc a{display:block; padding:5px 10px; font-size:.82rem; color:var(--ink-3); text-decoration:none; border-left:2px solid transparent; margin-left:-3.5px}
.toc a:hover{color:var(--ink); border-left-color:var(--ink)}
.rail .note-s{transform:rotate(1.2deg)}
.rail .note-s b{display:block; font-family:var(--display); font-size:.96rem}
.rail .note-s a{display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-weight:600; color:var(--note-ink)}

.pn{margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pn a{display:block; padding:14px 16px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); text-decoration:none; transition:border-color .15s, transform .18s var(--spring), box-shadow .18s var(--spring)}
.pn a:hover{border-color:var(--ink); box-shadow:3px 3px 0 var(--butter); transform:translate(-1px,-1px)}
.pn a.nx{text-align:right}
.pn small{font-family:var(--mono); font-size:.64rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.pn b{display:block; margin-top:3px; font-size:.92rem}

/* mock-only review */
.review{display:none; margin-top:30px; padding:16px 18px; border:1.5px dashed var(--lilac-ink); border-radius:16px; background:var(--lilac-soft)}
body.rv .review{display:block}
.review .lbl-m{color:var(--lilac-ink)}
.review ul{margin-top:8px; display:grid; gap:6px; font-size:.84rem; color:var(--ink-2)}
.review ul li{padding-left:14px; position:relative}
.review ul li::before{content:'›'; position:absolute; left:0; color:var(--lilac-ink)}
.review .src{margin-top:10px; display:flex; flex-wrap:wrap; gap:5px}
.review .src code{font-family:var(--mono); font-size:.7rem; padding:2px 7px; border-radius:6px; background:var(--card); color:var(--lilac-ink); border:1px solid var(--lilac-bd)}
.mock{position:fixed; right:16px; bottom:16px; z-index:50; display:flex; gap:6px; align-items:center; padding:6px; background:var(--ink); color:var(--paper); border-radius:999px; box-shadow:var(--sh-3); font-size:.78rem}
.mock b{font-family:var(--mono); font-size:.64rem; letter-spacing:.12em; padding:0 6px 0 10px; color:var(--butter)}
.mock button{border:0; font-weight:600; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.12); color:inherit}
html[data-theme="dark"] .mock button{background:rgba(0,0,0,.08)}
.mock button[aria-pressed="true"]{background:var(--paper); color:var(--ink)}
.sheet{position:fixed; inset:0; z-index:60; display:none; background:var(--scrim); padding:clamp(12px,4vw,48px); overflow:auto}
.sheet.open{display:block}
.sheet .pane{max-width:820px; margin:0 auto; background:var(--paper); border:1.5px solid var(--ink); border-radius:var(--r-lg); box-shadow:6px 6px 0 var(--lilac); padding:clamp(20px,3.4vw,34px)}
.sheet h2{font-family:var(--display); font-weight:600; font-size:1.5rem; letter-spacing:-.024em}
.sheet h3{margin-top:24px; font-family:var(--display); font-size:1.04rem}
.sheet p{margin-top:6px; color:var(--ink-2); font-size:.9rem}
.sheet ol{margin-top:10px; display:grid; gap:8px}
.sheet li{padding:10px 14px; border-radius:12px; background:var(--card); border:1.5px solid var(--line); font-size:.86rem; color:var(--ink-2); line-height:1.5}
.sheet li b{color:var(--ink)}
.sheet code{font-family:var(--mono); font-size:.76rem; background:var(--paper-3); padding:1px 5px; border-radius:5px}

/* responsive */
@media (max-width:1180px){ .art{grid-template-columns:minmax(0,1fr)} .rail{display:none} }
@media (max-width:980px){ .shelf{grid-template-columns:1fr 1fr} .journey{grid-template-columns:1fr 1fr; row-gap:34px} .journey::before{display:none} .stop::before{top:-20px} }
@media (max-width:720px){
  .doors{grid-template-columns:1fr; gap:24px}
  .shelf{grid-template-columns:1fr}
  .journey{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .f-grid2,.f-grid3{grid-template-columns:1fr}
  .fig{padding:16px}
  .flow > .ar{transform:rotate(90deg); margin:0 auto}
  .flow > .st{flex-basis:100%}
  .pn{grid-template-columns:1fr}
  table{min-width:360px}
  .mock b{display:none}
}
</style>
</head>

  { slug:"set-up-your-org", label:"I'm setting one up", hint:"From nothing to a workspace your board will open.", icon:"plant", tint:"butter" },
  { slug:"join-an-org", label:"I was sent a link", hint:"What the invite does, and why you wait for approval.", icon:"hand", tint:"sky" },
  { slug:"first-term", label:"It won't let me past a screen", hint:"Almost always the term. Here's the thirty-second fix.", icon:"clock", tint:"peach" },
];
const JOURNEY = [
  { t:"Day one", s:"Getting the org standing", tint:"butter", items:["set-up-your-org","invite-people","join-requests","roles-and-permissions"] },
  { t:"Every week", s:"The rhythm of a term", tint:"sky", items:["meetings-and-minutes","attendance","dues","tasks-and-polls"] },
  { t:"When it's stuck", s:"Walls that aren't bugs", tint:"peach", items:["first-term","member-limit","ask-got-it-wrong","signing-in"] },
  { t:"End of term", s:"Handing it on", tint:"mint", items:["ending-a-term","remove-someone","export-your-data","activity-log"] },
];
const APP_ISSUES = [
  "<b>No way for an org to make a second org admin.</b> <code>PATCH /api/auth/accounts/[id]</code> is platform-admin only.",
  "<b>No way to restore an archived member</b> after the Undo toast.",
  "<b>Settings → Workflows lede</b> still says Chapter is always on.",
  "<b><code>app/for/content.ts:306</code></b> still says removing a member with history needs support.",
  "<b>Roles screen copy</b>: Roster says “…and dues”, but dues are Treasury-only.",
  "<b>Party expenses never reach the balance</b> while door revenue does (<code>lib/treasury-balance.ts</code>).",
  "<b>Ask Chapt ignores org vocabulary</b> (<code>lib/ai-prompt.ts:161</code>).",
  "<b>SemesterGate's header comment</b> calls the tabs “Extend current / Create new”; the UI says “Extend it / Start new”.",
  "<s>Receipts silently dropped</s> — fixed. <s>Settings saves admin-only</s> — fixed.",
];

/* =========================================================================
   RENDER
   ========================================================================= */
const BY = new Map(ARTICLES.map(a => [a.slug, a]));
const CAT = new Map(CATEGORIES.map(c => [c.id, c]));
const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, l, href) => {
    const m = href.match(/^\/help\/([a-z0-9-]+)/);
    return m ? `<a href="#/a/${m[1]}">${l}</a>` : `<a class="ext" href="#ext" title="${href} — outside the mock">${l}</a>`;
  });
  return h;
}
const NOTE = { warn:["butter","alert"], flag:["peach","flag"], good:["mint","check"] };
let stepN = 0;
function block(b){
  switch (b.k){
    case "p": return `<p>${inline(b.t)}</p>`;
    case "h": return `<h2 id="${slugify(b.t)}">${inline(b.t)}</h2>`;
    case "steps": return `<ol class="steps">${b.items.map((x,i)=>`<li>${P(i+1)}<span>${inline(x)}</span></li>`).join("")}</ol>`;
    case "list": return `<ul class="list ${b.tone||""}">${b.items.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`;
    case "note": {
      const n = NOTE[b.tone];
      if (n) return `<div class="sticky t-${n[0]}"><h5>${I(n[1])}${inline(b.h)}</h5><p>${inline(b.t)}</p></div>`;
      return `<div class="note">${I("chat")}<div><h5>${inline(b.h)}</h5><p>${inline(b.t)}</p></div></div>`;
    }
    case "table": return `<div class="tw"><table><thead><tr><th>${esc(b.head[0])}</th><th>${esc(b.head[1])}</th></tr></thead><tbody>${b.rows.map(r=>`<tr><th>${inline(r[0])}</th><td>${inline(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
    case "where": return `<div class="where"><span class="lbl-m">${I("pin","ic")}</span>${pathHTML(b.path)}</div>`;
  }
  return "";
}
const pathHTML = p => `<span class="path">${p.map(x=>`<span>${esc(x)}</span>`).join("<i>›</i>")}</span>`;
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function hiTitle(a){
  const t = esc(a.title);
  if (!a.hi) return t;
  const i = a.title.lastIndexOf(a.hi);
  if (i < 0) return t;
  return esc(a.title.slice(0,i)) + `<span class="hi" style="--mark:var(--${CAT.get(a.categoryId).tint})">${esc(a.hi)}</span>` + esc(a.title.slice(i+a.hi.length));
}

/* sidebar */
function renderNav(currentSlug){
  const cur = currentSlug ? BY.get(currentSlug) : null;
  const nav = document.getElementById("sb-nav");
  nav.innerHTML = `
    <button class="sb-search" id="sb-find">${I("search")}Search help<kbd>/</kbd></button>
    <div class="grp" style="--eb:var(--butter)"><div class="grp-h"><span>Start here</span></div>
      <a class="item" href="#/" ${!cur?'aria-current="page"':""}>${I("home")}<span class="lbl">All of it</span><span class="n">${ARTICLES.length}</span></a>
    </div>
    <div class="grp" style="--eb:var(--lilac)"><div class="grp-h"><span>Topics</span></div>
      ${CATEGORIES.map(c => {
        const list = ARTICLES.filter(a=>a.categoryId===c.id);
        const open = cur && cur.categoryId === c.id;
        return `<a class="item" href="#/a/${list[0].slug}" ${open?'aria-current="page"':""}>${I(c.icon)}<span class="lbl">${c.title}</span><span class="n">${list.length}</span></a>
          ${open?`<div class="sub">${list.map(a=>`<a href="#/a/${a.slug}" ${a.slug===currentSlug?'aria-current="page"':""}>${esc(a.title)}</a>`).join("")}</div>`:""}`;
      }).join("")}
    </div>`;
  document.getElementById("sb-find").onclick = () => { if (location.hash && location.hash !== "#/") { pendingFocus = true; location.hash = "#/"; } else focusFind(); closeDrawer(); };
}

/* index */
let who = "all", query = "", pendingFocus = false;
const AUD = [["all","Everything"],["member","Members"],["officer","Officers"],["admin","Org admins"]];
const match = a => who === "all" || a.aud.includes(who);
function renderIndex(){
  renderNav(null);
  app.innerHTML = `<div class="wrap">
    <div class="kick"><span class="chip">Help centre</span>${ARTICLES.length} articles · each one checked against the app</div>
    <h1 class="greet">What are you <span class="hi">trying to do</span>?</h1>
    <p class="lede">Every article opens with a picture of the real screen it's about, with numbered pins that match the steps. Where something is half-built or has a sharp edge, it says so on a sticky note.</p>
    <div class="find">
      <label class="find-box">${I("search")}<input id="q" type="search" autocomplete="off" placeholder="Try “dues”, “join request”, “check-in”, “receipt”…" value="${esc(query)}" aria-label="Search the help centre"><kbd>/</kbd></label>
      <div id="res"></div>
    </div>
    <div class="who"><span>Show me what's for</span><div class="tabs" role="group" aria-label="Filter by role">${AUD.map(([k,l])=>`<button data-who="${k}" aria-pressed="${who===k}">${l}<span class="n">${k==="all"?ARTICLES.length:ARTICLES.filter(a=>a.aud.includes(k)).length}</span></button>`).join("")}</div></div>

    <div class="sec-h"><h2>Start here</h2><span class="rule"></span></div>
    <div class="doors">${QUICK.map(q=>`<a class="door t-${q.tint}" href="#/a/${q.slug}">${I(q.icon)}<b>${q.label}</b><span>${q.hint}</span><i>Read it ${I("arrow-r")}</i></a>`).join("")}</div>

    <div class="sec-h"><h2>Through a term</h2><span class="rule"></span><small>the articles you'll need, in roughly the order you'll need them</small></div>
    <div class="journey">${JOURNEY.map(j=>`<div class="stop t-${j.tint}"><h3>${j.t}</h3><p>${j.s}</p><ul>${j.items.map(s=>{const a=BY.get(s); return `<li><a href="#/a/${s}">${I(a.icon)}${esc(a.title)}</a></li>`;}).join("")}</ul></div>`).join("")}</div>

    <div class="sec-h"><h2>Everything, by topic</h2><span class="rule"></span></div>
    <div class="shelf" id="shelf"></div>

    <div class="stuck"><div><h3>Still stuck?</h3><p>There's no ticket queue and no bot on the other end — it's one person, and that person reads everything. Tell them what you were doing and what happened instead.</p></div><a class="btn" href="#ext">Talk to a human ${I("arrow-r")}</a></div>
  </div>`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { query = q.value; renderRes(); });
  q.addEventListener("keydown", e => {
    const links = [...document.querySelectorAll("#res a")];
    if (e.key === "Enter" && links[0]) location.hash = links[0].getAttribute("href");
    if (e.key === "Escape") { query = ""; q.value = ""; renderRes(); }
  });
  document.querySelectorAll("[data-who]").forEach(b => b.onclick = () => { who = b.dataset.who; document.querySelectorAll("[data-who]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); renderShelf(); });
  renderRes(); renderShelf();
  if (pendingFocus){ pendingFocus = false; focusFind(); }
}
function renderShelf(){
  document.getElementById("shelf").innerHTML = CATEGORIES.map(c => {
    const all = ARTICLES.filter(a=>a.categoryId===c.id);
    const shown = all.filter(match);
    return `<section class="card cat" id="${c.id}">
      <div class="cat-h"><span class="tile t-${c.tint}">${I(c.icon)}</span><h3>${c.title}</h3><span class="n">${shown.length}/${all.length}</span></div>
      <p>${c.blurb}</p>
      ${shown.length ? `<ul>${all.map(a=>`<li class="${match(a)?"":"dim"}"><a href="#/a/${a.slug}">${I(a.icon)}<span>${esc(a.title)}</span>${a.aud.includes("admin")&&!a.aud.includes("member")?`<span class="lk" title="Org admin">${I("lock","ic")}</span>`:""}</a></li>`).join("")}</ul>` : `<p class="cat-empty">Nothing here is specific to this role.</p>`}
    </section>`;
  }).join("");
}
const INDEX = ARTICLES.map(a => ({ a,
  head:[a.title,a.blurb,a.keywords.join(" "),CAT.get(a.categoryId).title].join(" ").toLowerCase(),
  body:[a.lede, a.who, ...a.body.map(b=>JSON.stringify(b))].join(" ").toLowerCase() }));
function renderRes(){
  const el = document.getElementById("res"); if (!el) return;
  const t = query.trim().toLowerCase();
  if (!t){ el.innerHTML = ""; return; }
  const words = t.split(/\s+/);
  const hits = INDEX.map(r => { let s=0; for (const w of words){ if (r.head.includes(w)) s+=3; else if (r.body.includes(w)) s+=1; else return null; } return {r,s}; }).filter(Boolean).sort((x,y)=>y.s-x.s).slice(0,7);
  el.innerHTML = `<div class="find-res">${hits.length ? hits.map(({r},i)=>{const c=CAT.get(r.a.categoryId); return `<a href="#/a/${r.a.slug}" class="${i===0?"on":""}"><span class="tile t-${c.tint}">${I(r.a.icon)}</span><span><span class="t">${esc(r.a.title)}</span><span class="b" style="display:block">${esc(r.a.blurb)}</span></span></a>`;}).join("") : `<div class="find-none">Nothing matches “${esc(query)}”. If it isn't here, it probably isn't written yet — and that's worth telling us.</div>`}</div>`;
}
function focusFind(){ const q = document.getElementById("q"); if (q){ q.focus(); q.scrollIntoView({block:"center"}); } }

/* article */
function renderArticle(slug){
  const a = BY.get(slug); if (!a){ location.hash = "#/"; return; }
  renderNav(slug);
  const c = CAT.get(a.categoryId);
  const list = ARTICLES.filter(x=>x.categoryId===c.id);
  const idx = ARTICLES.indexOf(a), prev = ARTICLES[idx-1], next = ARTICLES[idx+1];
  let body = a.body.slice();
  let where = null;
  if (body[0] && body[0].k === "where"){ where = body[0].path; body = body.slice(1); }
  const heads = body.filter(b=>b.k==="h");
  app.innerHTML = `<div class="wrap"><div class="art">
    <div class="art-main" style="--eb:var(--${c.tint})">
      <div class="kick"><a href="#/">Help</a><span>/</span><a href="#/a/${list[0].slug}">${c.title}</a></div>
      <h1>${hiTitle(a)}</h1>
      <p class="lede">${inline(a.lede)}</p>
      <div class="facts" style="${where?"":"grid-template-columns:1fr"}">
        ${where?`<div class="fact"><span class="k">${I("pin")}Where it lives</span><div class="v">${pathHTML(where)}</div></div>`:""}
        <div class="fact"><span class="k">${I("key")}Who can</span><div class="v">${esc(a.who)}</div></div>
      </div>
      <figure class="fig">${a.fig()}<figcaption class="fig-cap"><b>FIG</b>${esc(a.cap)}</figcaption></figure>
      <div class="body">${body.map(block).join("")}</div>
      <div class="review"><span class="lbl-m">Checked against</span><ul>${a.review.changes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="src">${a.review.sources.map(s=>`<code>${esc(s)}</code>`).join("")}</div></div>
      <nav class="pn">${prev?`<a href="#/a/${prev.slug}"><small>← Previous</small><b>${esc(prev.title)}</b></a>`:"<span></span>"}${next?`<a class="nx" href="#/a/${next.slug}"><small>Next →</small><b>${esc(next.title)}</b></a>`:""}</nav>
    </div>
    <aside class="rail">
      ${heads.length?`<div><h5>On this page</h5><div class="toc">${heads.map(h=>`<a href="#/a/${slug}" data-jump="${slugify(h.t)}">${esc(h.t)}</a>`).join("")}</div></div>`:""}
      <div><h5>In ${c.title}</h5><div class="toc">${list.filter(x=>x!==a).map(x=>`<a href="#/a/${x.slug}">${esc(x.title)}</a>`).join("")}</div></div>
      <div class="note-s t-lilac tape"><b>This didn't answer it</b>Write to a person, with this page already named in the draft.<br><a href="#ext">Talk to a human ${I("arrow-r","ic")}</a></div>
    </aside>
  </div></div>`;
  document.querySelectorAll("[data-jump]").forEach(l => l.onclick = e => { e.preventDefault(); document.getElementById(l.dataset.jump)?.scrollIntoView({behavior:"smooth", block:"start"}); });
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash || "#/";
  closeDrawer();
  if (h === "#ext"){ history.back(); return; }
  const m = h.match(/^#\/a\/([a-z0-9-]+)/);
  if (m) return renderArticle(m[1]);
  renderIndex(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* drawer */
const sb = document.getElementById("sb"), shade = document.getElementById("shade");
function closeDrawer(){ sb.classList.remove("open"); shade.classList.remove("open"); }
document.getElementById("menu").onclick = () => { sb.classList.add("open"); shade.classList.add("open"); };
shade.onclick = closeDrawer;

/* theme */
function setTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem("help-paper-theme", t); }catch(e){} document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.themeSet===t))); }
document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => setTheme(b.dataset.themeSet));
setTheme(document.documentElement.dataset.theme || "light");

/* keyboard: / focuses search */
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); if (location.hash && location.hash !== "#/"){ pendingFocus = true; location.hash = "#/"; } else focusFind(); }
  if (e.key === "Escape") document.getElementById("sheet").classList.remove("open");
});

/* mock controls */
const tgRv = document.getElementById("tg-rv");
tgRv.onclick = () => { const on = document.body.classList.toggle("rv"); tgRv.setAttribute("aria-pressed", String(on)); };
const sheet = document.getElementById("sheet");
document.getElementById("tg-ch").onclick = () => {
  const n = s => ARTICLES.filter(a=>a.status===s).length;
  document.getElementById("sheet-pane").innerHTML = `
    <button class="btn btn--ghost" style="float:right" data-close>Close</button>
    <h2>What changed</h2>
    <p>Redesigned in the in-app Paper language. Same verified content as the rewrite mock, plus label fixes found while drawing the figures. ${n("new")} new · ${n("rewritten")} rewritten · ${n("updated")} updated · ${n("kept")} kept · Budget removed.</p>
    <h3>Label corrections made while building figures</h3>
    <ol><li>Semester gate tabs are <b>Extend it / Start new</b>; buttons <b>Extend &amp; reactivate / Create &amp; activate</b>; field <b>Run it through</b>.</li>
    <li>Self-service Ask Chapt cards say <b>Submit</b>, not Approve.</li>
    <li>Dues drawer buttons are <b>Record payment</b>, <b>Waive some</b>, <b>Take off</b>.</li>
    <li>Check-in closes with <b>Close &amp; record attendance</b>; <b>Reopen check-in</b> exists.</li>
    <li>Join page: <b>Request to join</b>, “Waiting on …”, “Your request wasn't approved”, <b>Go to</b> the org.</li></ol>
    <h3>Still open in the app</h3><ol>${APP_ISSUES.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  sheet.classList.add("open");
};
sheet.onclick = e => { if (e.target === sheet || e.target.closest("[data-close]")) sheet.classList.remove("open"); };

route();
</script>
</body>
</html>
