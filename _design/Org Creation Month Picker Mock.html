<!doctype html>
<html lang="en" data-crf-theme="ivory">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Normal Month Picker</title>
<!--
  The /create interview's "a normal month" beat, as it ships today (InterviewStep
  stage "month", lib/onboarding/activities.ts), with ONE change: every tile turns on
  exactly one page.

  Today "Fundraisers or programs" turns on Programming + Fundraisers + Treasury, so a
  club that runs workshops but no fundraisers can't get the right pages. Here it is
  split into two tiles, and Treasury is left to the money beat that follows:

    meetings   → Meetings (+ attendance, as today)
    socials    → Parties
    programs   → Programming          (new tile)
    fundraise  → Fundraisers          (no longer pulls in Programming or Treasury)
    service    → Service
    tasks      → Tasks
    online     → Instagram

  Everything else is the shipped markup and copy, on the shipped stylesheet
  (../app/create/create-paper.css is linked, not copied). T flips paper.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/create/create-paper.css">
<script>
  try { if (localStorage.getItem("month-mock-theme") === "dusk") document.documentElement.dataset.crfTheme = "dusk"; } catch (e) {}
</script>
<style>
html,body{margin:0}
/* create-paper.css reads the next/font variables landingFontClass puts on <html> */
html{--font-inter:'Inter'; --font-bricolage:'Bricolage Grotesque'; --font-plex-mono:'IBM Plex Mono'}
/* ---- the month picker: each tile is a sticker that names the page it pins ---- */
.ocp .acts.mp{gap:12px; margin-top:8px}
.ocp .mp .act{grid-template-columns:42px minmax(0,1fr) 22px; gap:13px; padding:12px 14px 12px 12px; border-radius:6px 16px 12px 14px}
.ocp .mp .act .tile{width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
  background:var(--p-bg); color:var(--p-fg); border:1.5px solid var(--p-bd);
  transition:transform .35s var(--ease-spring), background .2s, border-color .2s, color .2s, box-shadow .2s}
.ocp .mp .act .tile .ic{width:19px; height:19px}
.ocp .mp .act:hover .tile{transform:rotate(-5deg) scale(1.05)}
.ocp .mp .act[aria-pressed="true"] .tile{background:var(--p-hs); border-color:var(--ink); color:var(--note-ink); transform:rotate(-6deg); box-shadow:2px 2px 0 var(--ink); filter:var(--note-filter)}
.ocp .mp .act .lb{display:block; color:var(--ink); font-weight:600; line-height:1.3}
/* the page it pins: a dashed slip while off, inked in the tile's colour once ticked */
.ocp .mp .act .to{display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:2px 9px 2px 7px; border-radius:999px; border:1.5px dashed var(--line-2);
  font-family:var(--mono); font-size:.62rem; font-weight:500; letter-spacing:.02em; color:var(--ink-3); transition:all .2s var(--ease-out)}
.ocp .mp .act .to .ic{width:11px; height:11px; transition:transform .3s var(--ease-spring)}
.ocp .mp .act:hover .to{border-color:var(--p-fg); color:var(--p-fg)}
.ocp .mp .act:hover .to .ic{transform:translateX(2px)}
.ocp .mp .act[aria-pressed="true"] .to{border-style:solid; border-color:var(--p-fg); background:var(--card); color:var(--p-fg); font-weight:600}
.ocp .mp .act .bx{width:22px; height:22px; border-radius:7px}
.ocp .mp .act[aria-pressed="true"] .bx .ic{animation:tick .35s var(--ease-spring) both}
@keyframes tick{from{transform:scale(.3) rotate(-20deg)} to{transform:none}}
.ocp .mp .acts-go{margin-top:8px}
.ocp .mp .acts-go .note{display:flex; align-items:center; gap:8px; font-size:.8rem}
.ocp .mp .acts-go .note .n{font-family:var(--mono); font-size:.66rem; font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:999px; border:1.5px solid var(--ink); background:var(--butter); color:var(--note-ink); filter:var(--note-filter)}
.ocp .mp .acts-go .note .n.zero{border-color:var(--line-2); background:none; color:var(--ink-3); filter:none}

/* ---- the charter's pages wear the colour of the tile that pinned them ---- */
.ocp .chip.pin{background:var(--p-bg); border-color:var(--p-bd); color:var(--ink)}
.ocp .chip.pin .ic{color:var(--p-fg)}
.ocp .chip.ghost{background:none; border-style:dashed; border-color:var(--p-fg); color:var(--p-fg); opacity:.85; animation:chipin .3s var(--ease-spring) both}
.ocp .chip.ghost .ic{color:var(--p-fg)}
.ocp .chip.lit{background:var(--p-bg); border-color:var(--p-fg); box-shadow:2px 2px 0 var(--p-hs); transform:translate(-1px,-1px); transition:all .18s var(--ease-spring)}

@media (max-width:960px){
  .ocp .split{grid-template-columns:minmax(0,1fr)}
  .ocp .slot{position:static}
}
</style>
</head>

<div class="ocp">
  <div class="shell">
    <header class="top">
      <a class="wm" href="#" aria-label="Chapt home">
        <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="2.5" y="4.5" width="35" height="31" rx="9" fill="#FFE5A0" stroke="#26211B" stroke-width="2.4"/><path d="M12 21.5c2.2 3.4 5 5 8.4 5 3.2 0 5.9-1.5 8-4.6" fill="none" stroke="#26211B" stroke-width="2.4" stroke-linecap="round"/><circle cx="14.6" cy="16" r="1.9" fill="#26211B"/><circle cx="25.4" cy="16" r="1.9" fill="#26211B"/></svg>

      <div class="top-r">

<script>
(function () {
  var ic = function (n) { return '<svg class="ic"><use href="#d-' + n + '"/></svg>'; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var listy = function (a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; };

  var ORG = "LIGA";

  /* ACTIVITY_OPTIONS + ACTIVITY_META, with "fundraise" split so each tile is one page. */
  var OPTS = [
    { id: "meetings",  icon: "gavel",  tone: "sky",    label: "Chapter meetings",              word: "chapter",      wf: ["meetings", "attendance"] },
    { id: "socials",   icon: "note",   tone: "rose",   label: "Social events or parties",      word: "parties",      wf: ["parties"] },
    { id: "programs",  icon: "board",  tone: "lilac",  label: "Programs or workshops",         word: "programs",     wf: ["events"] },
    { id: "fundraise", icon: "jar",    tone: "butter", label: "Fundraisers",                   word: "fundraisers",  wf: ["fundraisers"] },
    { id: "service",   icon: "heart",  tone: "mint",   label: "Service or volunteering",       word: "service",      wf: ["service"] },
    { id: "tasks",     icon: "box",    tone: "peach",  label: "Handing out tasks & deadlines", word: "deadlines",    wf: ["tasks"] },
    { id: "online",    icon: "camera", tone: "rose",   label: "Posting content online",        word: "posting",      wf: ["communications"] }
  ];
  /* [workflow, page, icon, tone, the tile that pins it] */
  var PAGES = [
    ["meetings", "Chapter", "gavel", "sky", "meetings"], ["parties", "Parties", "note", "rose", "socials"],
    ["events", "Programming", "board", "lilac", "programs"], ["fundraisers", "Fundraisers", "jar", "butter", "fundraise"],
    ["service", "Service", "heart", "mint", "service"], ["tasks", "Tasks", "box", "peach", "tasks"],
    ["communications", "Instagram", "camera", "rose", "online"]
  ];
  var pageOf = function (id) { return PAGES.filter(function (r) { return r[4] === id; })[0]; };

  var S = { picks: [], said: null, reply: null, done: false, hover: null, flash: false };
  var picked = function () { return OPTS.filter(function (o) { return S.picks.indexOf(o.id) >= 0; }); };
  function onWf() {
    var w = {};
    picked().forEach(function (o) { o.wf.forEach(function (x) { w[x] = 1; }); });
    return w;
  }

  /* readActivities(), with the split keywords. */
  var KW = [
    ["meetings",  /\bmeet|chapter|assembly|weekly|general body|gbm/],
    ["socials",   /part(y|ies)|social|mixer|formal|tailgate|date night/],
    ["programs",  /program|workshop|speaker|panel|info session|seminar|rush|recruit/],
    ["fundraise", /fundrais|bake sale|raffle|merch/],
    ["service",   /service|volunteer|philanthrop|charity|community/],
    ["tasks",     /task|deadline|assign|committee|to-?do/],
    ["online",    /instagram|insta\b|social media|\bpost|announce|newsletter|online/]
  ];
  var CLAUSE = /[,.;!?]+|\b(?:but|though|although|however)\b/;
  var FLIP = /\b(?:except|excepting|besides|other than|apart from|aside from|minus|without|no longer)\b/;
  var NEG = /\b(?:no|not|none|never|nope|nah|neither|nor|hardly|rarely|barely|stopped|quit|dropped|skip)\b|n['’]t\b/;
  var ALL = /\b(?:all|everything|every one)\b/;
  var NONE = /\b(?:none|nothing|neither|nope|nah)\b|\bnot really\b/;
  var IDS = OPTS.map(function (o) { return o.id; });
  function read(text) {
    var on = {}, off = {}, all = false, none = false;
    text.toLowerCase().split(CLAUSE).forEach(function (cl) {
      if (!cl || !cl.trim()) return;
      cl.split(FLIP).forEach(function (part, i) {
        if (!part.trim()) return;
        var neg = NEG.test(part) !== (i % 2 === 1), hit = false;
        KW.forEach(function (k) { if (k[1].test(part)) { hit = true; (neg ? off : on)[k[0]] = 1; } });
        if (hit) return;
        if (NONE.test(part)) none = true; else if (ALL.test(part) && !neg) all = true;
      });
    });
    var nOn = Object.keys(on).length, nOff = Object.keys(off).length;
    if (none && !all && !nOn && !nOff) return { ids: [], off: [], sure: true };
    var base = all ? IDS : Object.keys(on);
    if (nOn || all) return { ids: IDS.filter(function (id) { return base.indexOf(id) >= 0 && !off[id]; }), off: Object.keys(off), sure: true };
    if (nOff) return { ids: IDS.filter(function (id) { return !off[id]; }), off: Object.keys(off), sure: false };
    return null;
  }

  function words(ids) { return OPTS.filter(function (o) { return ids.indexOf(o.id) >= 0; }).map(function (o) { return o.word; }); }
  /* monthReply() */
  function reply(ids) {
    if (!ids.length) return "A quiet one — that’s fine. We’ll keep it to a roster and a timeline, and you can switch pages on whenever you need them.";
    var w = listy(words(ids));
    if (ids.length >= 4) return "A full calendar: " + w + ". Each one gets its own page; the rest stay off.";
    return w.charAt(0).toUpperCase() + w.slice(1) + " — each gets its own page. Nothing else clutters the sidebar.";
  }

  function thread() {
    var n = "<em>" + ORG + "</em>";
    var L = [
      ["q", "Hi — I’ll get " + n + " set up while we talk. Takes about two minutes. First, who am I talking to?"],
      ["me", "Priya"],
      ["bot", "Nice to meet you, <b>Priya</b>."],
      ["q", "So what is " + n + "? What kind of group are we setting up?"],
      ["me", "A cultural club"],
      ["q", "And you’re " + n + "’s…?"],
      ["me", "President"],
      ["q", "Picture a normal month at " + n + ". Which of these actually happen?"]
    ];
    if (S.said) L.push(["me", esc(S.said), 1]);
    if (S.reply) L.push(["bot", S.reply, 1]);
    document.getElementById("thread").innerHTML = L.map(function (m) {
      var nw = m[2] ? " new" : "";
      if (m[0] === "me") return '<div class="msg me' + nw + '"><p>' + m[1] + "</p></div>";
      return '<div class="msg ' + m[0] + nw + '">' + (m[0] === "q" ? '<span class="chapt">' + ic("spark") + "</span>" : '<span class="sp"></span>') + "<p>" + m[1] + "</p></div>";
    }).join("");
  }

  function widget() {
    var el = document.getElementById("widget");
    var compose = '<form class="compose' + (S.done ? " off" : "") + '" autocomplete="off" data-compose><input id="say" aria-label="Your answer" maxlength="300" placeholder="Or describe a normal month in your own words…"' + (S.done ? " disabled" : "") + '><button class="send" type="submit" aria-label="Send">' + ic("send") + "</button></form>";
    if (S.done) {
      el.innerHTML = '<div class="donebar" style="margin:6px 0 0 43px"><button type="button" class="btn btn--soft btn--sm" data-redo>Change this answer</button></div>' + compose;
      return;
    }
    var n = S.picks.length;
    el.innerHTML = '<div class="acts mp">' + OPTS.map(function (o) {
      var on = S.picks.indexOf(o.id) >= 0;
      return '<button type="button" class="act t-' + o.tone + '" data-id="' + o.id + '" aria-pressed="' + on + '" style="--p-hs:var(--' + o.tone + ')">' +
        '<span class="tile">' + ic(o.icon) + '</span><span style="min-width:0"><span class="lb">' + esc(o.label) + '</span>' +
        '<span class="to">' + ic("arrow-r") + esc(pageOf(o.id)[1]) + ' page</span></span><span class="bx">' + ic("check") + "</span></button>";
    }).join("") +
      '<div class="acts-go"><button type="button" class="btn" data-go>' + (n ? "That’s our month" : "None of these, really") + ic("arrow-r") + "</button>" +
      '<span class="note"><span class="n' + (n ? "" : " zero") + '">' + (n ? "+" + n + (n === 1 ? " page" : " pages") : "no pages yet") + "</span>Money comes next — that’s where Treasury gets decided.</span></div></div>" + compose;
  }

  var prev = [];
  function charter() {
    var w = onWf();
    var on = PAGES.filter(function (r) { return w[r[0]]; });
    var chips = [["Dashboard", "home"], ["Timeline", "timeline"], ["Members", "people"]].map(function (b) {
      return '<span class="chip lock">' + ic(b[1]) + esc(b[0]) + "</span>";
    }).join("") + PAGES.map(function (r) {
      var tone = ' t-' + r[3] + '" style="--p-hs:var(--' + r[3] + ')';
      if (w[r[0]]) return '<span class="chip pin' + (prev.indexOf(r[0]) < 0 ? " new" : "") + (S.hover === r[4] ? " lit" : "") + tone + '">' + ic(r[2]) + esc(r[1]) + "</span>";
      if (S.hover === r[4] && !S.done) return '<span class="chip ghost' + tone + '">' + ic(r[2]) + esc(r[1]) + "</span>";
      return "";
    }).join("");
    prev = on.map(function (r) { return r[0]; });
    document.getElementById("charter").innerHTML =
      '<div class="ch-hd"><p class="ch-k">Charter<span class="st">Draft · no account yet</span></p>' +
      '<div class="ch-org"><span class="mark" style="--mk:var(--lilac);--mks:var(--sky)">LI</span><div><b>' + ORG + "</b><small>chaptos.com/liga</small></div></div></div>" +
      '<div class="ch-sec' + (S.flash ? " flash" : "") + '" data-sec="pages"><h6><span>Pages</span><i>' + (3 + on.length) + '</i></h6><div class="chips">' + chips + "</div></div>" +
      '<div class="ch-sec"><h6><span>Tracking</span>' + (w.attendance ? "<i>1 per member</i>" : "") + "</h6>" +
      (w.attendance ? '<div class="chips"><span class="chip">' + ic("bars") + "Attendance</span></div>" : '<p class="ch-pend">Attendance, GPA, dues — whatever you’ll actually check.</p>') + "</div>" +
      '<div class="ch-ft"><div class="sig"><span class="ln">Priya</span><small>Founder · President</small></div><span class="date">Drafted October 27, 2026</span></div>';
    S.flash = false;
  }

  function render() {
    thread(); widget(); charter();
    document.getElementById("themeBtn").innerHTML = ic(document.documentElement.dataset.crfTheme === "dusk" ? "sun" : "moon");
  }

  function answer(ids, said) {
    S.picks = ids; S.said = said; S.reply = reply(ids); S.done = true; S.hover = null; S.flash = true; render();
  }
  function typed(v) {
    var r = read(v);
    if (!r) { S.said = v; S.reply = "I didn’t catch which of these happen — tick them, or tell me in a few words."; return render(); }
    if (!r.sure) {
      S.picks = r.ids; S.said = v;
      S.reply = "So everything except " + listy(words(r.off)) + "? Untick anything that’s off, then tap <b>That’s our month</b>.";
      return render();
    }
    answer(r.ids, v);
  }

  function flip() {
    var d = document.documentElement.dataset.crfTheme === "dusk" ? "ivory" : "dusk";
    document.documentElement.dataset.crfTheme = d;
    try { localStorage.setItem("month-mock-theme", d); } catch (e) {}
    document.getElementById("themeBtn").innerHTML = ic(d === "dusk" ? "sun" : "moon");
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "themeBtn") return flip();
    if (t.dataset.id) {
      var id = t.dataset.id, i = S.picks.indexOf(id);
      if (i >= 0) S.picks.splice(i, 1); else S.picks.push(id);
      widget(); charter(); return;
    }
    if ("go" in t.dataset) {
      var ids = IDS.filter(function (id) { return S.picks.indexOf(id) >= 0; });
      return answer(ids, ids.length ? picked().map(function (o) { return o.label; }).join(", ") : "None of these, really");
    }
    if ("redo" in t.dataset) { S.done = false; S.said = S.reply = null; return render(); }
  });
  /* Hovering a tile previews its page on the charter: a dashed ghost if it's off, a lift if it's on. */
  document.addEventListener("mouseover", function (e) {
    var t = e.target.closest && e.target.closest(".mp .act");
    var id = t ? t.dataset.id : null;
    if (id !== S.hover) { S.hover = id; charter(); }
  });
  document.addEventListener("submit", function (e) {
    if (!e.target.matches("[data-compose]")) return;
    e.preventDefault(); var v = document.getElementById("say").value.trim(); if (v) typed(v);
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "t" || e.key === "T") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) flip();
  });

  render();
})();
</script>
</body>
</html>
