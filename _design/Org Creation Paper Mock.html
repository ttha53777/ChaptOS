<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Org Creation · Paper</title>
<!--
  The whole org-creation layer (app/create/* → provisionOrg → first frame) in the Dashboard
  Paper Mock's language: cream paper, brown ink, pastel triplets, 1.5px warm hairlines, hard
  pastel offset shadows on ink-bordered things, a highlighter behind one word, taped notes,
  the same hand-drawn doodle sprite. Tokens, base, sidebar and sprite are spliced verbatim
  from `Dashboard Paper Mock.html` so the two can't drift.

  The metaphor: you are drafting a CHARTER. A punched loose-leaf sheet assembles on the right
  while you answer (the real BlueprintSheet), seats are name badges with ability stickers,
  timeline categories are strips of washi tape, signing in seals the charter, and the build
  ends with a rubber stamp — then you land in the Paper Mock's day-one dashboard.

  Steps mirror the shipped flow: Name → Interview (scripted beats: who, kind, a normal month,
  your role, a normal month, where docs live, per-member tracking, current term → recap) → Roles → Timeline → Charter
  (address, pages, words, this term, tracking) → Sign in → Build → first frame.
  Real constraints kept: no fake app chrome before creation, no colour picker (deterministic
  monogram), seats are plain-language abilities never bitfields, invites are reviewed joins.
  The MOCK strip flips: fresh / resumed draft / already signed in, and forces the two real
  build failures (address claimed during OAuth, server error). ←/→ step, T flips the paper.
  All records fictional. No backend.
-->
<script>
  (function () {
    var pref = "light";
    try { pref = localStorage.getItem("paper-mock-theme") || "light"; } catch (e) {}
    var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --pct{syntax:'<number>'; inherits:false; initial-value:0}
/* ===== spliced from Dashboard Paper Mock.html: tokens + base ===== */
/* ---------- tokens ------------------------------------------------------- */
:root{
  --paper:#FFFCF6; --paper-2:#FBF5EA; --paper-3:#F4ECDD; --card:#FFFFFF;
  --ink:#26211B; --ink-2:#544A3F; --ink-3:#8A7F71;
  --line:#EBE1CF; --line-2:#DCD0B9;

  --peach:#FFD5C4;  --peach-soft:#FFEDE5;  --peach-ink:#C9542D;  --peach-bd:#F8D2C2;
  --sky:#CFE2FF;    --sky-soft:#EAF2FF;    --sky-ink:#2A66C7;    --sky-bd:#CCDFFB;
  --mint:#C7EFDA;   --mint-soft:#E6F8EF;   --mint-ink:#1B815B;   --mint-bd:#BDE7D2;
  --butter:#FFE5A0; --butter-soft:#FFF6DC; --butter-ink:#9C6B08; --butter-bd:#F4DFA6;
  --lilac:#E1D8FF;  --lilac-soft:#F1EDFF;  --lilac-ink:#6244CC;  --lilac-bd:#DCD2FB;
  --rose:#FFD6E6;   --rose-soft:#FFEDF4;   --rose-ink:#C23C77;   --rose-bd:#F8CEE0;

  /* sticky notes are physical paper: same pastel and dark ink in both themes */
  --note-ink:#26211B; --note-filter:none;
  --mark-op:.85;
  --wash-op:.55;
  --av-ink:rgba(38,33,27,.72);

  --sh-1:0 1px 2px rgba(38,33,27,.05), 0 3px 10px rgba(38,33,27,.045);
  --sh-2:0 1px 2px rgba(38,33,27,.05), 0 10px 26px -8px rgba(38,33,27,.14);
  --sh-3:0 2px 4px rgba(38,33,27,.05), 0 26px 60px -18px rgba(38,33,27,.22);
  --scrim:rgba(38,33,27,.28);

  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease-out:cubic-bezier(.22,.72,.24,1);
  --ease-spring:cubic-bezier(.16,.9,.3,1.02);
  color-scheme:light;
}
/* Night paper: a warm desk under a lamp, not a black UI. Pastels become low-alpha tints with
   lifted inks; hard shadows keep their colour so ink-bordered things still "sit up". */
html[data-theme="dark"]{
  --paper:#15110D; --paper-2:#1B1712; --paper-3:#25201A; --card:#1F1A15;
  --ink:#F2EADC; --ink-2:#CDBFAB; --ink-3:#948876;
  --line:#2F271E; --line-2:#43382B;

  --peach:#E5A28A;  --peach-soft:rgba(255,178,148,.085); --peach-ink:#FFB49A; --peach-bd:rgba(255,178,148,.22);
  --sky:#8DB2EC;    --sky-soft:rgba(150,190,255,.085);   --sky-ink:#AACBFF;   --sky-bd:rgba(150,190,255,.22);
  --mint:#80CBA4;   --mint-soft:rgba(140,220,180,.08);   --mint-ink:#8FDDB6;  --mint-bd:rgba(140,220,180,.22);
  --butter:#E3BF66; --butter-soft:rgba(255,214,120,.08); --butter-ink:#F0CC72;--butter-bd:rgba(255,214,120,.22);
  --lilac:#A593EE;  --lilac-soft:rgba(180,160,255,.10);  --lilac-ink:#C4B6FF; --lilac-bd:rgba(180,160,255,.26);
  --rose:#E598B7;   --rose-soft:rgba(255,160,200,.08);   --rose-ink:#FFAACB;  --rose-bd:rgba(255,160,200,.22);

  --note-filter:brightness(.93) saturate(.85);
  --mark-op:.42;
  --wash-op:.9;
  --av-ink:rgba(22,18,14,.78);
  --sh-1:0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25);
  --sh-2:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -10px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.4), 0 26px 60px -18px rgba(0,0,0,.75);
  --scrim:rgba(5,4,2,.6);
  color-scheme:dark;
}

/* ---------- base ---------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .35s var(--ease-out), color .35s var(--ease-out);
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0; list-style:none}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--lilac-ink); outline-offset:2px; border-radius:6px}

/* the paper itself: soft fixed washes (as on the landing page) */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:var(--wash-op);
  background:
    radial-gradient(60vw 50vh at 18% 0%,  var(--butter-soft), transparent 62%),
    radial-gradient(52vw 48vh at 98% 18%, var(--sky-soft),    transparent 60%),
    radial-gradient(48vw 46vh at 20% 74%, var(--lilac-soft),  transparent 62%),
    radial-gradient(56vw 50vh at 94% 96%, var(--peach-soft),  transparent 62%);
}

.ic{width:18px; height:18px; flex:none}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.display{font-family:var(--display); font-weight:600; letter-spacing:-.028em}

/* highlighter behind a word — hand-drawn, slightly off-register */
.hi{position:relative; white-space:nowrap; z-index:0}
.hi::before{
  content:''; position:absolute; z-index:-1; left:-.12em; right:-.12em; bottom:.04em; height:.5em;
  background:var(--mark, var(--butter)); border-radius:.4em .55em .38em .6em;
  transform:rotate(-.8deg) scaleX(var(--mx,1)); transform-origin:left center; opacity:var(--mark-op);
  transition:transform .8s var(--ease-spring) .35s;
}
.boot .hi::before{--mx:0}

.eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:.7rem; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.eyebrow::before{content:''; width:18px; height:2px; border-radius:2px; background:var(--eb, var(--peach))}

/* buttons: ink pill with a hard pastel shadow that lifts on hover, presses on click */
.btn{
  --bg:var(--ink); --fg:var(--paper); --hs:var(--lilac);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 17px; border-radius:999px; border:1.5px solid var(--ink);
  background:var(--bg); color:var(--fg); font-weight:600; font-size:.88rem; letter-spacing:-.01em;
  box-shadow:2.5px 2.5px 0 var(--hs); white-space:nowrap; text-decoration:none;
  transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), background .2s, color .2s;
}
.btn:hover{transform:translate(-1.5px,-1.5px); box-shadow:4.5px 4.5px 0 var(--hs)}
.btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--hs)}
.btn .ic{width:15px; height:15px}
.btn--ghost{--bg:var(--card); --fg:var(--ink); --hs:var(--peach)}
.btn--soft{--bg:transparent; --fg:var(--ink-2); border-color:var(--line-2); box-shadow:none}
.btn--soft:hover{border-color:var(--ink-3); color:var(--ink); box-shadow:none; transform:translateY(-1px)}
.btn--sm{padding:6px 12px; font-size:.8rem; box-shadow:2px 2px 0 var(--hs)}
.btn--sm.btn--soft{box-shadow:none}

.pill{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
  font-size:.74rem; font-weight:600; white-space:nowrap;
  background:var(--p-bg, var(--paper-2)); color:var(--p-fg, var(--ink-2)); border:1px solid var(--p-bd, var(--line));
}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.t-peach{--p-bg:var(--peach-soft); --p-fg:var(--peach-ink); --p-bd:var(--peach-bd)}
.t-sky{--p-bg:var(--sky-soft); --p-fg:var(--sky-ink); --p-bd:var(--sky-bd)}
.t-mint{--p-bg:var(--mint-soft); --p-fg:var(--mint-ink); --p-bd:var(--mint-bd)}
.t-butter{--p-bg:var(--butter-soft); --p-fg:var(--butter-ink); --p-bd:var(--butter-bd)}
.t-lilac{--p-bg:var(--lilac-soft); --p-fg:var(--lilac-ink); --p-bd:var(--lilac-bd)}
.t-rose{--p-bg:var(--rose-soft); --p-fg:var(--rose-ink); --p-bd:var(--rose-bd)}

.avatar{
  width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-size:.68rem; font-weight:700; letter-spacing:-.02em; font-style:normal;
  background:var(--av, var(--lilac)); color:var(--av-ink); border:1.5px solid rgba(38,33,27,.08);
}
.avatar--sm{width:24px; height:24px; font-size:.6rem}
.avatar--ghost{background:transparent; border:1.5px dashed var(--line-2); color:var(--ink-3)}

kbd{font-family:var(--mono); font-size:.68rem; border:1px solid var(--line-2); border-radius:6px; padding:1px 6px; background:var(--paper-2); color:var(--ink-3)}

/* ===== spliced: app frame + sidebar (used by the first frame) ===== */
/* ---------- app frame ---------------------------------------------------- */
.app{position:relative; z-index:1; display:flex; min-height:100vh}
.main{flex:1; min-width:0; position:relative}

/* ---------- sidebar ------------------------------------------------------ */
.sb{
  position:sticky; top:0; height:100vh; width:252px; flex:none; z-index:30;
  display:flex; flex-direction:column;
  background:color-mix(in srgb, var(--paper-2) 88%, transparent);
  border-right:1.5px solid var(--line);
  transition:width .24s var(--ease-spring), background .35s, transform .26s var(--ease-spring);
}
.sb-org{
  display:flex; align-items:center; gap:11px; width:100%; height:66px; flex:none;
  padding:0 12px 0 14px; border:0; background:none; text-align:left;
  border-bottom:1.5px solid var(--line); transition:background .18s;
}
.sb-org:hover{background:var(--paper-3)}
.orglogo{
  width:36px; height:36px; flex:none; border-radius:11px; display:grid; place-items:center;
  background:var(--butter); border:2px solid var(--note-ink); color:var(--note-ink);
  font-family:var(--display); font-weight:700; font-size:.82rem; letter-spacing:-.02em;
  transform:rotate(-3deg); box-shadow:2px 2px 0 var(--peach); filter:var(--note-filter);
}
.orglogo--b{background:var(--mint); transform:rotate(2deg); box-shadow:2px 2px 0 var(--sky)}
.sb-org-txt{min-width:0; flex:1}
.sb-org-name{display:block; font-family:var(--display); font-weight:600; font-size:1rem; letter-spacing:-.022em; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sb-org-term{display:block; font-family:var(--mono); font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); margin-top:2px}
.sb-chev{width:15px; height:15px; color:var(--ink-3)}

.sb-scroll{flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 10px 16px; scrollbar-width:thin}

/* the officer queue */
.needs{
  margin:2px 2px 16px; padding:11px 12px 8px; background:var(--card);
  border:1.5px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-1);
}
.needs-h{display:flex; align-items:center; gap:8px; width:100%; border:0; background:none; padding:0 0 6px; text-align:left}
.needs-h .ic{width:16px; height:16px; color:var(--peach-ink)}
.needs-h b{font-size:.86rem; font-weight:600; flex:1}
.needs-n{font-family:var(--mono); font-size:.7rem; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--peach-soft); color:var(--peach-ink); border:1px solid var(--peach-bd)}
.needs-row{display:flex; align-items:center; gap:9px; padding:6px 4px; border-radius:9px; font-size:.82rem; color:var(--ink-2); text-decoration:none; transition:background .15s, color .15s}
.needs-row:hover{background:var(--paper-2); color:var(--ink)}
.needs-row .c{font-family:var(--mono); font-size:.68rem; font-weight:600; width:20px; height:20px; display:grid; place-items:center; border-radius:7px; background:var(--p-bg); color:var(--p-fg); border:1px solid var(--p-bd); flex:none}
.needs-row .pg{margin-left:auto; font-size:.68rem; color:var(--ink-3)}

/* day-one: a small "first week" progress note instead of the queue */
.firstweek{
  margin:2px 2px 16px; padding:12px 13px; border-radius:6px 14px 8px 12px; position:relative;
  background:var(--butter); color:var(--note-ink); filter:var(--note-filter);
  transform:rotate(-1.2deg); box-shadow:var(--sh-2); border:0; text-align:left; width:calc(100% - 4px); display:block;
  transition:transform .25s var(--ease-spring);
}
.firstweek:hover{transform:rotate(0deg) translateY(-1px)}
.firstweek::after{content:''; position:absolute; left:50%; top:-7px; width:46px; height:14px; transform:translateX(-50%) rotate(-3deg); background:rgba(255,255,255,.5); border-inline:1px dashed rgba(38,33,27,.16)}
.firstweek .k{display:block; font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; opacity:.7}
.firstweek .t{display:block; font-family:var(--display); font-weight:600; font-size:.98rem; letter-spacing:-.02em; margin-top:3px; line-height:1.2}
.firstweek .bar{display:flex; gap:4px; margin-top:9px}
.firstweek .bar i{flex:1; height:5px; border-radius:3px; background:rgba(38,33,27,.14)}
.firstweek .bar i.on{background:var(--note-ink)}
.firstweek .nx{margin-top:8px; font-size:.76rem; display:flex; align-items:center; gap:5px; font-weight:500}
.firstweek .nx .ic{width:13px; height:13px}

.grp{margin-top:6px}
.grp + .grp{margin-top:14px}
.grp-h{display:flex; align-items:center; gap:8px; padding:0 10px 6px; font-size:.64rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.grp-h::before{content:''; width:12px; height:2px; border-radius:2px; background:var(--eb)}
.item{
  position:relative; display:flex; align-items:center; gap:11px; height:38px; padding:0 11px; margin:2px 0;
  border-radius:12px; border:1.5px solid transparent; text-decoration:none;
  color:var(--ink-2); font-size:.9rem; font-weight:500;
  transition:background .16s, color .16s, border-color .16s, box-shadow .2s var(--ease-spring), transform .2s var(--ease-spring);
}
.item .ic{color:var(--ink-3); transition:color .16s, transform .3s var(--ease-spring)}
.item:hover{background:var(--card); color:var(--ink)}
.item:hover .ic{color:var(--ink); transform:rotate(-6deg) scale(1.06)}
.item[aria-current="page"]{
  background:var(--card); color:var(--ink); font-weight:600; border-color:var(--ink);
  box-shadow:2.5px 2.5px 0 var(--butter);
}
.item[aria-current="page"] .ic{color:var(--ink)}
.item .lbl{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .dot{width:7px; height:7px; border-radius:50%; background:var(--p-fg); box-shadow:0 0 0 3px var(--p-bg); flex:none}

.sb-foot{display:flex; align-items:center; gap:6px; padding:10px 10px 12px; border-top:1.5px solid var(--line); position:relative}
.me{display:flex; align-items:center; gap:10px; flex:1; min-width:0; padding:6px 8px; border-radius:12px; border:1.5px solid transparent; background:none; text-align:left; transition:background .16s, border-color .16s}
.me:hover,.me[aria-expanded="true"]{background:var(--card); border-color:var(--line)}
.me-txt{min-width:0}
.me-txt b{display:block; font-size:.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.me-txt span{display:block; font-size:.72rem; color:var(--ink-3)}
.iconbtn{width:34px; height:34px; flex:none; display:grid; place-items:center; border-radius:10px; border:1.5px solid transparent; background:none; color:var(--ink-3); transition:background .16s, color .16s, border-color .16s}
.iconbtn:hover{background:var(--card); color:var(--ink); border-color:var(--line)}
.iconbtn .ic{width:17px; height:17px; transition:transform .25s var(--ease-spring)}
/* ===== spliced: mock bar + toast ===== */
/* mock bar (not part of the product) */
.mockbar{
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:45;
  display:flex; align-items:center; gap:6px; padding:5px 5px 5px 13px; border-radius:999px;
  background:#26211B; color:#FFFCF6; box-shadow:0 12px 30px -10px rgba(0,0,0,.45);
  font-size:.78rem; white-space:nowrap;
}
html[data-theme="dark"] .mockbar{background:#F2EADC; color:#26211B}
.mockbar .lab{font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.12em; opacity:.6; margin-right:4px}
.mockbar button{border:0; background:none; color:inherit; padding:6px 12px; border-radius:999px; font-weight:600; font-size:.78rem; opacity:.7; transition:background .18s, opacity .18s}
.mockbar button:hover{opacity:1}
.mockbar button[aria-pressed="true"]{background:#FFE5A0; color:#26211B; opacity:1}

.toast{position:fixed; left:50%; bottom:76px; transform:translate(-50%,10px); z-index:80; padding:9px 15px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); box-shadow:3px 3px 0 var(--mint); font-size:.84rem; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s, transform .3s var(--ease-spring); display:flex; gap:8px; align-items:center}
.toast.on{opacity:1; transform:translate(-50%,0)}
.toast .ic{width:15px; height:15px; color:var(--mint-ink)}

/* =====================================================================================
   ORG CREATION — everything below is this mock's own; everything above is spliced.
   ===================================================================================== */

/* ---------- chrome: wordmark · step rail · tag + paper toggle ---------------------- */
.shell{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column}
.top{
  position:sticky; top:0; z-index:40; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:18px;
  height:66px; padding:0 clamp(16px,3vw,32px);
  background:color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter:blur(12px); border-bottom:1.5px solid var(--line);
}
.wm{display:flex; align-items:center; gap:11px; font-family:var(--display); font-weight:700; font-size:1.06rem; letter-spacing:-.025em; text-decoration:none}
.wm .orglogo{width:32px; height:32px; border-radius:10px; font-size:.86rem}
.rail{justify-self:center; display:flex; gap:3px; padding:3px; border-radius:999px; background:var(--paper-2); border:1.5px solid var(--line); max-width:100%; overflow-x:auto; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none; display:inline-flex; align-items:center; gap:7px; padding:4px 12px 4px 4px; border:0; border-radius:999px; background:none; font-size:.8rem; font-weight:550; color:var(--ink-3); transition:background .18s, color .18s, box-shadow .18s}
.rail button:hover:not(:disabled){color:var(--ink)}
.rail .n{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:.64rem; font-weight:600; border:1.5px solid var(--line-2); background:var(--card); transition:background .2s, border-color .2s, color .2s}
.rail .n .ic{width:11px; height:11px}
.rail button.done .n{background:var(--mint-soft); border-color:var(--mint-bd); color:var(--mint-ink)}
.rail button[aria-current="step"]{background:var(--card); color:var(--ink); box-shadow:var(--sh-1); font-weight:600}
.rail button[aria-current="step"] .n{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.rail button:disabled{opacity:.42; cursor:not-allowed}
.top-r{display:flex; align-items:center; gap:10px}
.tag{font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); padding:3px 9px; border:1.5px solid var(--line-2); border-radius:7px; white-space:nowrap}
.iconbtn.theme .ic{width:17px; height:17px}

/* resume bar: a taped strip, not a banner */
.resume{
  position:relative; margin:18px auto 0; width:min(760px, calc(100% - 32px)); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 12px 10px 16px; border-radius:5px 12px 7px 11px; background:var(--butter); color:var(--note-ink); filter:var(--note-filter);
  transform:rotate(-.4deg); box-shadow:var(--sh-2); font-size:.9rem;
}
.resume::after{content:''; position:absolute; left:40px; top:-8px; width:54px; height:16px; transform:rotate(-4deg); background:rgba(255,255,255,.5); border-inline:1px dashed rgba(38,33,27,.16)}
.resume .k{font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; padding:2px 7px; border-radius:6px; border:1.5px solid rgba(38,33,27,.35)}
.resume p{flex:1; min-width:180px}
.resume .btn{--bg:transparent; --fg:var(--note-ink); border-color:var(--note-ink); --hs:rgba(38,33,27,.18)}
.resume .x{width:28px; height:28px; border:0; background:none; border-radius:8px; display:grid; place-items:center; color:var(--note-ink); opacity:.6}
.resume .x:hover{opacity:1; background:rgba(255,255,255,.35)}
.resume .x .ic{width:14px; height:14px}

/* ---------- stage ---------------------------------------------------------- */
.stage{flex:1; width:100%; max-width:1240px; margin:0 auto; padding:clamp(28px,4vw,54px) clamp(16px,3vw,40px) 140px}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,430px); gap:clamp(26px,4.4vw,68px); align-items:start}
.split--name{transition:grid-template-columns .6s var(--ease-spring)}
.split--name[data-named="0"]{grid-template-columns:minmax(0,1fr) minmax(0,0px); gap:0}
.split--name[data-named="0"] .ask{max-width:680px; margin:clamp(20px,8vh,90px) auto 0}
.split--name .slot{transition:opacity .45s var(--ease-out) .12s, transform .6s var(--ease-spring) .12s}
.split--name[data-named="0"] .slot{opacity:0; transform:translateX(40px) rotate(2deg); pointer-events:none; overflow:hidden}
.slot{position:sticky; top:92px; min-width:0}

.kick{display:inline-flex; align-items:center; gap:9px; font-family:var(--mono); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.kick .chip{padding:2px 9px; border-radius:999px; background:var(--card); border:1.5px solid var(--line-2); color:var(--ink-2); letter-spacing:.06em}
.q{margin-top:14px; font-family:var(--display); font-weight:600; letter-spacing:-.034em; line-height:1.05; font-size:clamp(2.1rem,4vw,3.3rem); text-wrap:balance}
.q--sm{font-size:clamp(1.9rem,3.3vw,2.7rem)}
.lede{margin-top:14px; font-size:1.02rem; line-height:1.55; color:var(--ink-2); max-width:58ch; text-wrap:pretty}
.lede b{color:var(--ink); font-weight:600}
.foot{margin-top:28px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.foot .note{font-size:.8rem; color:var(--ink-3)}
.foot .note kbd{margin:0 2px}
.btn:disabled{opacity:.4; pointer-events:none}
.btn--lg{padding:12px 20px; font-size:.95rem}

/* ---------- name ------------------------------------------------------------ */
.namein{
  display:block; width:100%; margin-top:30px; padding:4px 0 12px; border:0; border-bottom:2px dashed var(--line-2); background:none; outline:none;
  font-family:var(--display); font-weight:600; font-size:clamp(2rem,3.6vw,2.9rem); letter-spacing:-.035em; color:var(--ink);
  transition:border-color .2s;
}
.namein::placeholder{color:var(--line-2)}
.namein:focus{border-bottom-color:var(--ink)}
.slugline{margin-top:12px; font-family:var(--mono); font-size:.78rem; color:var(--ink-3); min-height:1.3em; transition:opacity .25s}
.slugline b{color:var(--ink); font-weight:600}
.slugline .res{display:inline-flex; align-items:center; gap:5px; margin-left:6px; color:var(--mint-ink)}
.slugline .res .ic{width:12px; height:12px}
.idrow{margin-top:28px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:center; padding:16px; border:1.5px dashed var(--line-2); border-radius:var(--r-md); background:color-mix(in srgb, var(--paper-2) 70%, transparent)}
.markbtn{position:relative; border:0; background:none; padding:0}
.mark{
  width:66px; height:66px; border-radius:19px; display:grid; place-items:center; overflow:hidden;
  background:var(--mk, var(--butter)); color:var(--note-ink); border:2px solid var(--note-ink); filter:var(--note-filter);
  font-family:var(--display); font-weight:700; font-size:1.45rem; letter-spacing:-.04em;
  transform:rotate(-4deg); box-shadow:3px 3px 0 var(--mks, var(--peach)); transition:transform .3s var(--ease-spring), background .3s;
}
.mark img{width:100%; height:100%; object-fit:cover}
.mark.empty{background:var(--paper-3); border-style:dashed; border-color:var(--line-2); color:var(--ink-3); box-shadow:none}
.markbtn:hover .mark{transform:rotate(2deg) scale(1.04)}
.markbtn .ed{position:absolute; right:-8px; bottom:-6px; padding:1px 7px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); font-family:var(--mono); font-size:.58rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink)}
.idrow p{font-size:.88rem; color:var(--ink-2); line-height:1.5}
.idrow p b{color:var(--ink)}
.linkbtn{border:0; background:none; padding:0; font:inherit; color:var(--ink); font-weight:600; border-bottom:1.5px solid var(--line-2)}
.linkbtn:hover{border-bottom-color:var(--ink)}
.second{margin-top:16px; display:flex; align-items:center; gap:10px; font-size:.84rem; color:var(--ink-2)}
.second .avatar{width:26px; height:26px; font-size:.6rem}

/* ---------- the charter (live blueprint sheet) -------------------------------------- */
.charter{
  position:relative; background:var(--card); border:1.5px solid var(--ink); border-radius:6px 18px 10px 16px;
  box-shadow:5px 5px 0 var(--butter); overflow:hidden;
}
.charter::before{content:''; position:absolute; left:16px; top:0; bottom:0; width:16px; z-index:1;
  background:radial-gradient(circle 6px at 8px 52px, var(--paper-3) 5px, var(--line-2) 5.5px, transparent 6.5px), radial-gradient(circle 6px at 8px 50%, var(--paper-3) 5px, var(--line-2) 5.5px, transparent 6.5px), radial-gradient(circle 6px at 8px calc(100% - 52px), var(--paper-3) 5px, var(--line-2) 5.5px, transparent 6.5px)}
.charter::after{content:''; position:absolute; left:42px; top:0; bottom:0; width:1.5px; background:var(--rose); opacity:.55}
.ch-hd{position:relative; padding:16px 18px 14px 58px; border-bottom:1.5px solid var(--line)}
.ch-k{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.6rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.ch-k .st{margin-left:auto; padding:1px 7px; border-radius:6px; border:1px dashed var(--line-2)}
.ch-k .st.ok{border-style:solid; border-color:var(--mint-bd); background:var(--mint-soft); color:var(--mint-ink)}
.ch-org{margin-top:12px; display:flex; align-items:center; gap:13px; min-width:0}
.ch-org .mark{width:46px; height:46px; border-radius:14px; font-size:1rem; box-shadow:2px 2px 0 var(--mks, var(--peach))}
.ch-org b{display:block; font-family:var(--display); font-weight:600; font-size:1.3rem; letter-spacing:-.03em; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ch-org small{display:block; margin-top:2px; font-family:var(--mono); font-size:.68rem; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ch-org > div{min-width:0}
.ch-sec{position:relative; padding:13px 18px 14px 58px; border-bottom:1px dashed var(--line-2)}
.ch-sec:last-of-type{border-bottom:0}
.ch-sec h6{display:flex; align-items:center; gap:8px; margin:0 0 8px; font-family:var(--mono); font-size:.6rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.ch-sec h6 i{font-style:normal; margin-left:auto; color:var(--ink-3); letter-spacing:.04em}
.ch-sec.flash{animation:secflash 1.1s var(--ease-out)}
.ch-sec.flash h6 span{position:relative; z-index:0}
.ch-sec.flash h6 span::before{content:''; position:absolute; z-index:-1; left:-4px; right:-4px; bottom:0; height:.75em; background:var(--butter); border-radius:3px; transform:rotate(-1deg); transform-origin:left; animation:hisweep .7s var(--ease-out) both}
@keyframes secflash{0%{background:var(--butter-soft)} 100%{background:transparent}}
@keyframes hisweep{from{transform:scaleX(0) rotate(-1deg)} to{transform:scaleX(1) rotate(-1deg)}}
.ghostln{display:block; height:8px; border-radius:4px; background:var(--paper-3); width:var(--w,70%)}
.ghostln + .ghostln{margin-top:7px}
.ch-pend{font-size:.76rem; color:var(--ink-3); font-style:italic; margin-top:8px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; border:1.5px solid var(--line-2); background:var(--card); font-size:.76rem; font-weight:550; color:var(--ink-2); white-space:nowrap}
.chip .ic{width:12px; height:12px; color:var(--ink-3)}
.chip.lock{background:var(--paper-2); border-color:var(--line)}
.chip.new{animation:chipin .5s var(--ease-spring) both}
@keyframes chipin{from{opacity:0; transform:translateY(5px) scale(.9)} to{opacity:1; transform:none}}
.chip.tp::before{content:''; width:8px; height:8px; border-radius:2px; background:var(--tc); transform:rotate(-8deg)}
.words{font-size:.86rem; color:var(--ink-2); line-height:1.65}
.words b{color:var(--ink); font-weight:600; background:linear-gradient(transparent 58%, color-mix(in srgb, var(--butter) 70%, transparent) 58%); padding:0 2px}
.seatln{display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:9px; align-items:center; padding:4px 0; font-size:.84rem}
.seatln .sw2{width:10px; height:10px; border-radius:3px; background:var(--sc); border:1.5px solid var(--note-ink); transform:rotate(-8deg); filter:var(--note-filter)}
.seatln b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seatln small{font-family:var(--mono); font-size:.66rem; color:var(--ink-3); white-space:nowrap}
.ch-ft{position:relative; padding:14px 18px 16px 58px; border-top:1.5px solid var(--line); background:var(--paper-2); display:flex; align-items:flex-end; gap:12px}
.sig{flex:1; min-width:0}
.sig .ln{display:block; font-family:var(--display); font-style:italic; font-weight:500; font-size:1.05rem; letter-spacing:-.01em; color:var(--ink); padding:0 2px 3px; border-bottom:1.5px solid var(--ink-3); min-height:1.6em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sig .ln.empty{color:var(--line-2)}
.sig small{display:block; margin-top:4px; font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.ch-ft .date{font-family:var(--mono); font-size:.68rem; color:var(--ink-3); text-align:right; white-space:nowrap}

/* the rubber stamp */
.stamp{
  position:absolute; right:18px; top:58px; z-index:3; pointer-events:none;
  padding:9px 14px 8px; border:3px solid var(--rose-ink); border-radius:10px; color:var(--rose-ink);
  font-family:var(--mono); text-transform:uppercase; text-align:center; line-height:1.1;
  transform:rotate(-11deg); opacity:.88; mix-blend-mode:multiply; background:color-mix(in srgb, var(--rose-soft) 40%, transparent);
  box-shadow:inset 0 0 0 2px var(--card), inset 0 0 0 3.5px var(--rose-ink);
}
html[data-theme="dark"] .stamp{mix-blend-mode:normal}
.stamp b{display:block; font-size:1.22rem; font-weight:700; letter-spacing:.14em}
.stamp small{display:block; font-size:.58rem; font-weight:600; letter-spacing:.12em; margin-top:3px}
.stamp.slam{animation:slam .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slam{0%{opacity:0; transform:rotate(-24deg) scale(2.3)} 60%{opacity:.95; transform:rotate(-9deg) scale(.94)} 100%{opacity:.88; transform:rotate(-11deg) scale(1)}}

/* mobile: the charter rides in a drawer */
.peek{display:none}

/* ---------- interview ----------------------------------------------------------- */
.thread{margin-top:26px; display:grid; gap:14px}
.msg{display:grid; grid-template-columns:32px minmax(0,1fr); gap:11px; align-items:start}
.msg.new, .thread > .new{animation:msgin .45s var(--ease-spring) both}
@keyframes msgin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.chapt{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--lilac-soft); border:1.5px solid var(--lilac-bd); color:var(--lilac-ink); transform:rotate(-4deg)}
.chapt .ic{width:15px; height:15px}
.msg .sp{width:32px}
.msg.q p{font-family:var(--display); font-weight:500; font-size:1.2rem; letter-spacing:-.02em; line-height:1.35; color:var(--ink); padding-top:3px; text-wrap:pretty}
.msg.q p em{font-style:normal; font-weight:600}
.msg.bot p{font-size:.94rem; color:var(--ink-2); line-height:1.5; padding-top:5px}
.msg.bot p b{color:var(--ink); font-weight:600}
.msg.me{display:flex; justify-content:flex-end}
.msg.me p{
  max-width:min(78%, 420px); padding:8px 14px 9px; border-radius:5px 13px 7px 12px;
  background:var(--butter); color:var(--note-ink); filter:var(--note-filter); box-shadow:var(--sh-1);
  font-size:.92rem; font-weight:550; line-height:1.4; transform:rotate(.9deg);
}
.msg.me:nth-of-type(4n) p{background:var(--sky); transform:rotate(-.7deg)}
.msg.me:nth-of-type(4n+2) p{background:var(--mint); transform:rotate(.5deg)}
.typing{display:inline-flex; gap:4px; padding:12px 14px; border-radius:12px; background:var(--card); border:1.5px solid var(--line); width:max-content}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--ink-3); animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.25; transform:none} 30%{opacity:1; transform:translateY(-2px)}}

.opts{margin:4px 0 0 43px; display:flex; flex-wrap:wrap; gap:8px}
.opt{
  --hs:var(--lilac);
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--ink);
  background:var(--card); color:var(--ink); font-size:.86rem; font-weight:600; box-shadow:2px 2px 0 var(--hs);
  transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), background .18s;
}
.opt:hover{transform:translate(-1.5px,-1.5px); box-shadow:3.5px 3.5px 0 var(--hs)}
.opt:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--hs)}
.opt .ic{width:14px; height:14px}
.opt.soft{border-color:var(--line-2); box-shadow:none; color:var(--ink-2); font-weight:550}
.opt.soft:hover{border-color:var(--ink-3); color:var(--ink); transform:translateY(-1px)}
.opt[aria-pressed="true"]{background:var(--mint-soft); --hs:var(--mint)}
.opt[aria-pressed="true"]::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--mint-ink)}

.acts{margin:4px 0 0 43px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.act{
  position:relative; display:grid; grid-template-columns:34px minmax(0,1fr) 20px; gap:11px; align-items:center; padding:11px 12px; text-align:left;
  border-radius:var(--r-md); border:1.5px solid var(--line-2); background:var(--card); color:var(--ink-2); font-size:.88rem; font-weight:550;
  transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), border-color .18s, background .18s;
}
.act:hover{border-color:var(--ink-3); color:var(--ink)}
.act .tile{width:34px; height:34px; border-radius:10px}
.act .bx{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-2); display:grid; place-items:center; color:transparent; transition:background .18s, border-color .18s, color .18s}
.act .bx .ic{width:12px; height:12px}
.act[aria-pressed="true"]{border-color:var(--ink); background:var(--p-bg); color:var(--ink); transform:translate(-1.5px,-1.5px); box-shadow:3px 3px 0 var(--p-hs)}
.act[aria-pressed="true"] .bx{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.act small{display:block; font-family:var(--mono); font-size:.62rem; font-weight:500; color:var(--ink-3); margin-top:1px; letter-spacing:.02em}
.acts-go{grid-column:1/-1; display:flex; align-items:center; gap:12px; margin-top:4px}
.acts-go .note{font-size:.78rem; color:var(--ink-3)}
.addm{display:flex; gap:8px; align-items:center; margin:10px 0 0 43px}
.addm input{flex:1; min-width:0; max-width:300px; padding:7px 12px; border-radius:999px; border:1.5px dashed var(--line-2); background:transparent; outline:none; font-size:.84rem}
.addm input:focus{border-style:solid; border-color:var(--ink-3)}

.compose{
  position:sticky; bottom:74px; z-index:5; margin-top:26px; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 16px;
  border-radius:999px; border:1.5px solid var(--ink); background:var(--card); box-shadow:3px 3px 0 var(--lilac);
}
.compose input{flex:1; min-width:0; border:0; background:none; outline:none; font-size:.92rem; padding:6px 0}
.compose input::placeholder{color:var(--ink-3)}
.compose .send{width:36px; height:36px; flex:none; border-radius:50%; border:0; background:var(--ink); color:var(--paper); display:grid; place-items:center; transition:transform .18s var(--ease-spring), opacity .18s}
.compose .send:disabled{opacity:.3}
.compose .send:hover:not(:disabled){transform:rotate(-12deg) scale(1.06)}
.compose .send .ic{width:15px; height:15px}
.compose.off{opacity:.5; pointer-events:none; box-shadow:none; border-color:var(--line-2)}
.donebar{margin:10px 0 0 43px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* ---------- roles: seats are name badges -------------------------------------------- */
.seats{margin-top:30px; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%,270px),1fr)); gap:26px 22px; align-items:start}
.badge{
  position:relative; background:var(--card); border:1.5px solid var(--ink); border-radius:12px 12px 18px 18px; box-shadow:4px 4px 0 var(--sc);
  transform:rotate(var(--rot,0deg)); transition:transform .25s var(--ease-spring), box-shadow .25s var(--ease-spring);
}
.badge:hover{transform:rotate(0deg) translateY(-2px)}
.badge::before{content:''; position:absolute; left:50%; top:9px; width:38px; height:9px; transform:translateX(-50%); border-radius:6px; background:var(--paper); border:1.5px solid var(--note-ink); z-index:2; opacity:.85}
.bd-top{padding:26px 16px 12px; background:var(--sc); color:var(--note-ink); filter:var(--note-filter); border-radius:10px 10px 0 0; border-bottom:1.5px solid var(--ink)}
.bd-top .k{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
.bd-top .k .del{margin-left:auto; width:26px; height:26px; border-radius:8px; border:0; background:transparent; color:var(--note-ink); display:grid; place-items:center; opacity:.7}
.bd-top .k .del:hover{opacity:1; background:rgba(255,255,255,.4)}
.bd-top .k .del .ic{width:14px; height:14px}
.bd-title{display:block; width:100%; margin-top:4px; border:0; border-bottom:1.5px dashed rgba(38,33,27,.3); background:none; outline:none; color:var(--note-ink);
  font-family:var(--display); font-weight:600; font-size:1.42rem; letter-spacing:-.03em; padding:2px 0 4px}
.bd-title.long{font-size:1.08rem; padding:7px 0 6px}
.bd-title:focus{border-bottom-color:var(--note-ink)}
.bd-b{padding:13px 16px 14px}
.bd-b .k2{font-size:.64rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px}
.abs{display:flex; flex-wrap:wrap; gap:6px}
.ab{display:inline-flex; align-items:center; gap:6px; padding:5px 11px 5px 9px; border-radius:999px; border:1.5px dashed var(--line-2); background:transparent; font-size:.8rem; font-weight:600; color:var(--ink-3);
  transition:background .15s, border-color .15s, color .15s, box-shadow .2s var(--ease-spring), transform .2s var(--ease-spring)}
.ab .ic{width:13px; height:13px}
.ab:hover{border-color:var(--ink-3); color:var(--ink)}
.ab[aria-pressed="true"]{border-style:solid; border-color:var(--ink); background:var(--p-bg); color:var(--ink); box-shadow:2px 2px 0 var(--p-hs)}
.ab:disabled{cursor:default}
.ab:disabled:hover{border-color:var(--ink)}
.can{margin-top:11px; font-size:.82rem; color:var(--ink-2); line-height:1.45; min-height:2.9em}
.can b{color:var(--ink); font-weight:600}
.can.none{color:var(--peach-ink)}
.bd-f{display:flex; align-items:center; gap:9px; padding:10px 16px 12px; border-top:1px dashed var(--line-2); font-size:.78rem; color:var(--ink-3)}
.bd-f b{color:var(--ink); font-weight:600}
.bd-f .avatar{width:24px; height:24px; font-size:.58rem}
details.fine{margin-top:10px}
details.fine summary{cursor:pointer; list-style:none; font-size:.74rem; font-weight:600; color:var(--ink-3); display:inline-flex; align-items:center; gap:5px}
details.fine summary::-webkit-details-marker{display:none}
details.fine summary .ic{width:11px; height:11px; transition:transform .2s}
details.fine[open] summary .ic{transform:rotate(90deg)}
details.fine ul{margin-top:7px; display:grid; gap:4px}
details.fine li{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:.68rem; color:var(--ink-2)}
details.fine li::before{content:''; width:5px; height:5px; border-radius:50%; background:var(--mint-ink)}
.badge--add{border:1.5px dashed var(--line-2); box-shadow:none; background:color-mix(in srgb, var(--paper-2) 60%, transparent); padding:18px 16px}
.badge--add::before{display:none}
.badge--add h4{font-family:var(--display); font-weight:600; font-size:1.05rem; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.badge--add h4 .ic{width:16px; height:16px}
.badge--add p{font-size:.8rem; color:var(--ink-3); margin-top:3px}
.pool{margin-top:12px; display:grid; gap:7px}
.pool button{display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:9px; align-items:center; text-align:left; padding:8px 11px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); font-size:.84rem}
.pool button:hover{border-color:var(--ink)}
.pool button i{width:10px; height:10px; border-radius:3px; background:var(--sc); border:1.5px solid var(--note-ink); transform:rotate(-8deg)}
.pool button b{font-weight:600}
.pool button small{font-size:.72rem; color:var(--ink-3)}
.pool .own{display:flex; gap:7px; margin-top:3px}
.pool .own input{flex:1; min-width:0; padding:7px 11px; border-radius:999px; border:1.5px dashed var(--line-2); background:var(--card); outline:none; font-size:.84rem}
.pool .own input:focus{border-style:solid; border-color:var(--ink-3)}

/* ---------- timeline: categories are washi tape -------------------------------------- */
.types{margin-top:28px; display:grid; gap:9px}
.ty{display:grid; grid-template-columns:54px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 12px 10px 10px; border-radius:var(--r-md); border:1.5px solid var(--line); background:var(--card); transition:border-color .18s, opacity .25s}
.ty:hover{border-color:var(--line-2)}
.tape{position:relative; width:48px; height:20px; border:0; padding:0; background:color-mix(in srgb, var(--tc) 55%, var(--card)); transform:rotate(-5deg); border-radius:2px;
  -webkit-mask:linear-gradient(90deg, transparent 0 1.5px, #000 1.5px calc(100% - 1.5px), transparent calc(100% - 1.5px)), repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 4px);
  -webkit-mask-composite:source-over; transition:transform .25s var(--ease-spring)}
.tape::after{content:''; position:absolute; inset:0; background:repeating-linear-gradient(-45deg, transparent 0 5px, rgba(255,255,255,.22) 5px 7px)}
.tape:hover{transform:rotate(3deg) scale(1.06)}
.ty-l{min-width:0}
.ty-l input{width:100%; border:0; background:none; outline:none; font-size:.94rem; font-weight:600; color:var(--ink); padding:2px 0; border-bottom:1.5px solid transparent}
.ty-l input:focus{border-bottom-color:var(--line-2)}
.ty-l small{display:block; font-family:var(--mono); font-size:.64rem; color:var(--ink-3); letter-spacing:.02em}
.ty-r{display:flex; align-items:center; gap:6px}
.mini{border:1.5px solid var(--line-2); background:var(--card); border-radius:999px; padding:4px 11px; font-size:.76rem; font-weight:600; color:var(--ink-2); white-space:nowrap; display:inline-flex; align-items:center; gap:5px}
.mini .ic{width:12px; height:12px}
.mini:hover{border-color:var(--ink); color:var(--ink)}
.ty.ghost{border-style:dashed; background:transparent; opacity:.62}
.ty.ghost .tape{filter:grayscale(.7); opacity:.6}
.ty.ghost:hover{opacity:.9}
.ty-add{display:flex; gap:8px; align-items:center; margin-top:4px; padding:8px 8px 8px 12px; border-radius:var(--r-md); border:1.5px dashed var(--line-2)}
.ty-add .ic{width:15px; height:15px; color:var(--ink-3)}
.ty-add input{flex:1; min-width:0; border:0; background:none; outline:none; font-size:.9rem}
.ty-cap{font-family:var(--mono); font-size:.68rem; color:var(--ink-3); margin-top:8px}
.palette{display:flex; gap:5px; margin-top:7px}
.palette button{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-2); background:color-mix(in srgb, var(--tc) 60%, var(--card)); padding:0}
.palette button[aria-pressed="true"]{border-color:var(--ink); box-shadow:2px 2px 0 var(--tc)}

.week{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); overflow:hidden}
.week-h{display:flex; align-items:center; gap:10px; padding:14px 16px 11px; border-bottom:1.5px solid var(--line)}
.week-h b{font-family:var(--display); font-weight:600; font-size:1.02rem; letter-spacing:-.02em}
.week-h small{margin-left:auto; font-family:var(--mono); font-size:.66rem; color:var(--ink-3)}
.day{display:grid; grid-template-columns:52px minmax(0,1fr); gap:10px; padding:8px 14px; border-bottom:1px solid var(--paper-3); min-height:44px; align-items:start}
.day:last-child{border-bottom:0}
.day .d{font-family:var(--mono); font-size:.66rem; color:var(--ink-3); line-height:1.2; padding-top:5px}
.day .d b{display:block; font-family:var(--display); font-size:1.05rem; color:var(--ink); letter-spacing:-.02em}
.day .evs{display:grid; gap:5px}
.ev{display:flex; align-items:center; gap:8px; padding:5px 10px; border-radius:9px; border-left:3.5px solid var(--tc); background:color-mix(in srgb, var(--tc) 11%, var(--card)); font-size:.8rem; font-weight:550; animation:chipin .45s var(--ease-spring) both}
.ev small{margin-left:auto; font-family:var(--mono); font-size:.64rem; color:var(--ink-3)}
.day.today .d b{color:var(--peach-ink)}
.week-f{padding:10px 16px; border-top:1.5px solid var(--line); background:var(--paper-2); font-size:.76rem; color:var(--ink-3)}

/* ---------- charter step: the full document ------------------------------------------ */
.doc{margin-top:30px; position:relative; background:var(--card); border:1.5px solid var(--ink); border-radius:6px 22px 12px 18px; box-shadow:6px 6px 0 var(--butter)}
.doc::before{content:''; position:absolute; left:20px; top:0; bottom:0; width:16px; background:radial-gradient(circle 6px at 8px 60px, var(--paper-3) 5px, var(--line-2) 5.5px, transparent 6.5px), radial-gradient(circle 6px at 8px 50%, var(--paper-3) 5px, var(--line-2) 5.5px, transparent 6.5px), radial-gradient(circle 6px at 8px calc(100% - 60px), var(--paper-3) 5px, var(--line-2) 5.5px, transparent 6.5px)}
.doc::after{content:''; position:absolute; left:46px; top:0; bottom:0; width:1.5px; background:var(--rose); opacity:.55}
.doc-hd{padding:22px 26px 18px 66px; border-bottom:1.5px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.doc-hd .mark{width:58px; height:58px; font-size:1.2rem; border-radius:17px}
.doc-hd h2{font-family:var(--display); font-weight:600; font-size:1.8rem; letter-spacing:-.035em; line-height:1.05}
.doc-hd .ch-k{margin-bottom:5px}
.doc-hd > div{min-width:0; flex:1}
.doc-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dsec{padding:18px 26px 20px 66px; border-bottom:1px dashed var(--line-2); min-width:0}
.doc-grid .dsec.r{padding-left:26px; border-left:1px dashed var(--line-2)}
.dsec.wide{grid-column:1/-1}
.dsec-h{display:flex; align-items:baseline; gap:10px; margin-bottom:11px}
.dsec-h h3{font-family:var(--display); font-weight:600; font-size:1.1rem; letter-spacing:-.022em}
.dsec-h .n{font-family:var(--mono); font-size:.62rem; color:var(--ink-3); letter-spacing:.08em}
.dsec-h .go{margin-left:auto; border:0; background:none; padding:2px 0; font-size:.76rem; font-weight:600; color:var(--ink-3); border-bottom:1.5px solid var(--line-2)}
.dsec-h .go:hover{color:var(--ink); border-bottom-color:var(--ink)}
.dsec p.hint{font-size:.8rem; color:var(--ink-3); margin-top:8px; line-height:1.45}
.dsec p.hint b{color:var(--ink-2)}

.addr{display:flex; align-items:center; border:1.5px solid var(--line-2); border-radius:12px; background:var(--paper); overflow:hidden; transition:border-color .18s, box-shadow .18s}
.addr:focus-within{border-color:var(--ink); box-shadow:2px 2px 0 var(--lilac)}
.addr .host{padding:9px 2px 9px 12px; font-family:var(--mono); font-size:.84rem; color:var(--ink-3); white-space:nowrap}
.addr input{flex:1; min-width:0; border:0; background:none; outline:none; padding:9px 8px 9px 0; font-family:var(--mono); font-size:.84rem; font-weight:600; color:var(--ink)}
.addr .st{margin-right:6px}
.addr.bad{border-color:var(--rose-ink)}
.sugs{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.sugs button{font-family:var(--mono); font-size:.72rem; padding:3px 9px; border-radius:999px; border:1.5px solid var(--line-2); background:var(--card); color:var(--ink-2)}
.sugs button:hover{border-color:var(--ink); color:var(--ink)}
.claimed{margin-top:10px; display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border-radius:10px; background:var(--rose-soft); border:1px solid var(--rose-bd); color:var(--rose-ink); font-size:.8rem; font-weight:550}
.claimed .ic{width:15px; height:15px; margin-top:1px}

.pgs{display:flex; flex-wrap:wrap; gap:7px}
.pg{display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 10px; border-radius:999px; border:1.5px dashed var(--line-2); background:transparent; font-size:.82rem; font-weight:600; color:var(--ink-3);
  transition:background .15s, border-color .15s, color .15s, box-shadow .2s var(--ease-spring), transform .2s var(--ease-spring)}
.pg .ic{width:14px; height:14px}
.pg:hover{border-color:var(--ink-3); color:var(--ink)}
.pg[aria-pressed="true"]{border-style:solid; border-color:var(--ink); background:var(--card); color:var(--ink); box-shadow:2px 2px 0 var(--hs, var(--sky))}
.pg.lock{border-style:solid; border-color:var(--line); background:var(--paper-2); color:var(--ink-2); cursor:default; box-shadow:none}
.pg.lock:hover{border-color:var(--line)}

.vsent{font-size:1rem; line-height:2.1; color:var(--ink-2)}
.blank{display:inline-block; min-width:4ch; border:0; border-bottom:1.5px dashed var(--ink-3); background:linear-gradient(transparent 60%, color-mix(in srgb, var(--butter) 60%, transparent) 60%); outline:none;
  font:inherit; font-weight:600; color:var(--ink); padding:0 4px; text-align:center; field-sizing:content}
.blank:focus{border-bottom-style:solid; border-bottom-color:var(--ink)}

.segs{display:inline-flex; gap:3px; padding:3px; border-radius:999px; background:var(--paper-2); border:1.5px solid var(--line); flex-wrap:wrap}
.segs button{border:0; background:none; padding:5px 12px; border-radius:999px; font-size:.8rem; font-weight:550; color:var(--ink-3)}
.segs button:hover{color:var(--ink)}
.segs button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:var(--sh-1); font-weight:600}
.terms{margin-top:11px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.term{position:relative; text-align:left; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line-2); background:var(--paper); transition:border-color .18s, box-shadow .2s var(--ease-spring), transform .2s var(--ease-spring)}
.term b{display:block; font-family:var(--display); font-weight:600; font-size:.98rem; letter-spacing:-.02em}
.term small{display:block; font-family:var(--mono); font-size:.64rem; color:var(--ink-3); margin-top:2px}
.term .now{position:absolute; top:-8px; right:8px; font-family:var(--mono); font-size:.56rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:1px 6px; border-radius:5px; background:var(--peach); color:var(--note-ink); border:1px solid var(--note-ink)}
.term:hover{border-color:var(--ink-3)}
.term[aria-pressed="true"]{border-color:var(--ink); background:var(--card); box-shadow:3px 3px 0 var(--mint); transform:translate(-1.5px,-1.5px)}
.dates{margin-top:11px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:.82rem; color:var(--ink-3)}
.dates input{padding:6px 9px; border-radius:9px; border:1.5px solid var(--line-2); background:var(--card); font-family:var(--mono); font-size:.76rem; color:var(--ink); outline:none}
.dates input:focus{border-color:var(--ink)}
.mets{display:flex; flex-wrap:wrap; gap:7px}
.doc-ft{display:flex; align-items:flex-end; gap:20px; padding:20px 26px 22px 66px; background:var(--paper-2); border-radius:0 0 12px 18px; flex-wrap:wrap}
.doc-ft .sig{min-width:220px}
.doc-ft .sp{margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:8px}
.doc-ft .blocked{font-size:.78rem; color:var(--rose-ink); font-weight:600}

/* ---------- sign in: a ticket to the build --------------------------------------------- */
.signwrap{display:grid; place-items:center; padding-top:clamp(10px,4vh,40px)}
.ticket{position:relative; width:min(460px,100%); background:var(--card); border:1.5px solid var(--ink); border-radius:20px; box-shadow:6px 6px 0 var(--lilac)}
.tk-top{padding:28px 28px 22px; text-align:center}
.tk-top .mark{margin:0 auto; width:62px; height:62px; font-size:1.3rem}
.tk-top .ch-k{justify-content:center; margin-top:16px}
.tk-top h2{margin-top:8px; font-family:var(--display); font-weight:600; font-size:1.75rem; letter-spacing:-.034em; line-height:1.1; text-wrap:balance}
.tk-top p{margin-top:8px; font-size:.92rem; color:var(--ink-2)}
.perf{position:relative; height:0; border-top:2px dashed var(--line-2); margin:0 18px}
.perf::before,.perf::after{content:''; position:absolute; top:-12px; width:22px; height:22px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink)}
.perf::before{left:-31px; clip-path:inset(0 0 0 50%)}
.perf::after{right:-31px; clip-path:inset(0 50% 0 0)}
.tk-b{padding:22px 28px 24px; display:grid; gap:12px}
.gbtn{display:flex; align-items:center; justify-content:center; gap:11px; width:100%; padding:12px 18px; border-radius:999px; border:1.5px solid var(--ink); background:#fff; color:#26211B; font-weight:600; font-size:.95rem; box-shadow:3px 3px 0 var(--sky); transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring)}
.gbtn:hover{transform:translate(-1.5px,-1.5px); box-shadow:4.5px 4.5px 0 var(--sky)}
.gbtn svg{width:18px; height:18px}
.who{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; background:var(--paper-2); border:1.5px solid var(--line)}
.who b{display:block; font-size:.88rem}
.who small{display:block; font-size:.74rem; color:var(--ink-3)}
.who .sw3{margin-left:auto; font-size:.74rem; font-weight:600; color:var(--ink-3); border:0; background:none; border-bottom:1.5px solid var(--line-2); padding:0}
.fine{font-size:.76rem; color:var(--ink-3); text-align:center; line-height:1.5}
.fine b{color:var(--ink-2); font-weight:600}
.fine a{color:var(--ink-2)}
.tk-back{justify-self:center; border:0; background:none; font-size:.8rem; font-weight:600; color:var(--ink-3); display:inline-flex; gap:5px; align-items:center}
.tk-back:hover{color:var(--ink)}
.tk-back .ic{width:13px; height:13px}
.price{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border:1.5px solid var(--line); border-radius:12px; overflow:hidden}
.price div{padding:9px 12px; font-size:.78rem; color:var(--ink-3)}
.price div + div{border-left:1.5px dashed var(--line-2)}
.price b{display:block; font-family:var(--display); font-weight:600; font-size:1.05rem; color:var(--ink); letter-spacing:-.02em}

/* ---------- build ---------------------------------------------------------------- */
.bld{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,430px); gap:clamp(26px,4.4vw,68px); align-items:center; max-width:1060px; margin:0 auto; padding-top:clamp(0px,3vh,30px)}
.bld .q{font-size:clamp(2rem,3.6vw,3rem)}
.lines{margin-top:24px; display:grid; gap:9px}
.ln2{display:grid; grid-template-columns:24px minmax(0,1fr); gap:10px; align-items:center; font-family:var(--mono); font-size:.82rem; color:var(--ink-3); opacity:0; transform:translateY(6px); transition:opacity .3s, transform .4s var(--ease-spring), color .3s}
.ln2.show{opacity:1; transform:none; color:var(--ink-2)}
.ln2 .tk{width:22px; height:22px; border-radius:50%; border:1.5px dashed var(--line-2); display:grid; place-items:center; color:transparent; transition:background .25s, border-color .25s, color .25s}
.ln2 .tk .ic{width:11px; height:11px}
.ln2.show .tk{border-color:var(--ink-3); animation:spin 1.2s linear infinite}
.ln2.done{color:var(--ink)}
.ln2.done .tk{animation:none; border-style:solid; border-color:var(--mint-ink); background:var(--mint-soft); color:var(--mint-ink)}
.ln2.fail{color:var(--rose-ink)}
.ln2.fail .tk{animation:none; border-style:solid; border-color:var(--rose-ink); background:var(--rose-soft); color:var(--rose-ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.oops{margin-top:22px; padding:16px 18px; border-radius:var(--r-md); background:var(--card); border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--rose)}
.oops b{display:block; font-family:var(--display); font-weight:600; font-size:1.1rem; letter-spacing:-.02em}
.oops p{margin-top:4px; font-size:.88rem; color:var(--ink-2)}
.oops .row2{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}

/* ---------- first frame (post-creation, real app chrome is allowed now) ------------------ */
.app{animation:fadein .6s var(--ease-out) both}
@keyframes fadein{from{opacity:0} to{opacity:1}}
.main .wrap{max-width:1080px; margin:0 auto; padding:clamp(26px,3.4vw,44px) clamp(16px,3vw,44px) 130px}
.greet{font-family:var(--display); font-weight:600; letter-spacing:-.032em; line-height:1.04; font-size:clamp(2.05rem,3.7vw,3.05rem); margin-top:14px; display:flex; flex-wrap:wrap; align-items:center; gap:0 .28em}
.wave{display:inline-block; width:.82em; height:.82em; color:var(--butter-ink); transform-origin:70% 85%; animation:wave 1.6s var(--ease-out) .55s 1 both}
.wave svg{width:100%; height:100%}
@keyframes wave{0%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(9deg)}100%{transform:rotate(0)}}
.digest{margin-top:14px; font-size:1.02rem; line-height:1.55; color:var(--ink-2); max-width:62ch}
.digest b{color:var(--ink); font-weight:600}
.fe-grid{margin-top:30px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,380px); gap:22px; align-items:start}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); min-width:0}
.card-h{display:flex; align-items:center; gap:11px; padding:16px 18px 12px}
.card-h h3{font-family:var(--display); font-size:1.08rem; font-weight:600; letter-spacing:-.022em}
.card-h .sp{margin-left:auto}
.tile{width:32px; height:32px; flex:none; border-radius:10px; display:grid; place-items:center; background:var(--p-bg); border:1.5px solid var(--p-bd); color:var(--p-fg)}
.tile .ic{width:16px; height:16px}
.card-b{padding:0 18px 18px}
.fw{display:grid; gap:8px}
.fw li{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--r-md)}
.fw li .tk{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:1.5px dashed var(--line-2); color:var(--ink-3); font-family:var(--mono); font-size:.68rem; font-weight:600}
.fw li .tk .ic{width:12px; height:12px}
.fw li.done{background:var(--mint-soft); border-color:var(--mint-bd)}
.fw li.done .tk{border-style:solid; border-color:var(--mint-ink); background:var(--card); color:var(--mint-ink)}
.fw li.done .t{text-decoration:line-through; text-decoration-color:var(--mint-ink); color:var(--ink-2)}
.fw li.next{border-color:var(--ink); box-shadow:3px 3px 0 var(--butter)}
.fw .t{font-size:.92rem; font-weight:600; line-height:1.3}
.fw .m{font-size:.78rem; color:var(--ink-3); margin-top:2px}
.inv{position:relative; padding:18px; border-radius:var(--r-lg); background:var(--sky); color:var(--note-ink); filter:var(--note-filter); transform:rotate(.6deg); box-shadow:var(--sh-2)}
.inv::after{content:''; position:absolute; left:50%; top:-8px; width:58px; height:16px; transform:translateX(-50%) rotate(3deg); background:rgba(255,255,255,.5); border-inline:1px dashed rgba(38,33,27,.16)}
.inv .k{font-family:var(--mono); font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.7}
.inv h4{margin-top:4px; font-family:var(--display); font-weight:600; font-size:1.25rem; letter-spacing:-.025em; line-height:1.15}
.inv p{margin-top:6px; font-size:.86rem; line-height:1.5; opacity:.85}
.linkchip{margin-top:13px; display:flex; align-items:center; gap:8px; padding:5px 5px 5px 13px; border-radius:999px; border:1.5px solid var(--note-ink); background:rgba(255,255,255,.65)}
.linkchip code{font-family:var(--mono); font-size:.76rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.linkchip .btn{--bg:var(--note-ink); --fg:#FFFCF6; border-color:var(--note-ink); --hs:rgba(38,33,27,.22)}
.inv .rv{margin-top:12px; display:flex; gap:8px; align-items:flex-start; font-size:.78rem; line-height:1.45; opacity:.8}
.inv .rv .ic{width:14px; height:14px; margin-top:2px; flex:none}
.out{margin-top:18px; display:flex; flex-direction:column; gap:8px}
.out a{display:flex; align-items:center; gap:9px; padding:11px 14px; border-radius:var(--r-md); border:1.5px dashed var(--line-2); text-decoration:none; font-size:.86rem; font-weight:600; color:var(--ink-2)}
.out a:hover{border-style:solid; border-color:var(--ink); color:var(--ink)}
.out a .ic{width:15px; height:15px}
.out a .ic:last-child{margin-left:auto}


/* interview v2: recap card */
.tsm{font-family:var(--mono); font-size:.66rem; font-weight:500; color:var(--ink-3); margin-left:4px}
.recap{position:relative; margin:4px 0 0 43px; padding:16px 18px 18px 46px; background:var(--card); border:1.5px solid var(--ink); border-radius:6px 16px 10px 14px; box-shadow:4px 4px 0 var(--mint)}
.recap::before{content:''; position:absolute; left:32px; top:0; bottom:0; width:1.5px; background:var(--rose); opacity:.55}
.rk-h{display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:600; font-size:1.12rem; letter-spacing:-.022em; padding-bottom:8px; border-bottom:1.5px solid var(--sky-bd)}
.rk-h .ic{width:16px; height:16px; color:var(--mint-ink)}
.recap ol{counter-reset:rc}
.recap li{counter-increment:rc; position:relative; display:flex; align-items:center; gap:10px; min-height:40px; padding:7px 0; border-bottom:1px solid var(--sky-bd); font-size:.9rem; color:var(--ink-2); line-height:1.35}
.recap li::before{content:counter(rc, decimal-leading-zero); position:absolute; left:-36px; font-family:var(--mono); font-size:.62rem; color:var(--ink-3)}
.recap li b{color:var(--ink); font-weight:600}
.recap .rt{flex:1; min-width:0}
.rc{flex:none; border:0; background:none; padding:2px 0; font-size:.74rem; font-weight:600; color:var(--ink-3); border-bottom:1.5px solid var(--line-2); opacity:.55; transition:opacity .15s, color .15s}
.recap li:hover .rc,.rc:focus-visible{opacity:1}
.rc:hover{color:var(--ink); border-bottom-color:var(--ink)}
.recap-go{margin-top:14px}
@media (max-width:640px){ .recap{margin-left:0} .recap{padding-left:40px} .recap::before{left:26px} .recap li::before{left:-32px} .rc{opacity:1} }

/* toast lives above the mock bar */
.toast{bottom:80px}

/* mockbar: grouped */
.mockbar{max-width:calc(100vw - 24px); overflow-x:auto; scrollbar-width:none}
.mockbar .sep{width:1px; height:18px; background:currentColor; opacity:.25; margin:0 4px; flex:none}
.mockbar button.tog[aria-pressed="true"]{background:#FFD6E6}

/* ---------- responsive ----------------------------------------------------------- */
@media (max-width:1100px){
  .rail button:not([aria-current="step"]) .lb{display:none}
  .rail button:not([aria-current="step"]){padding-right:4px}
}
@media (max-width:960px){
  .split, .bld{grid-template-columns:minmax(0,1fr)}
  .split--name[data-named="0"]{grid-template-columns:minmax(0,1fr)}
  .split > .slot{display:none}
  .peek{display:flex; position:fixed; right:16px; bottom:72px; z-index:46; align-items:center; gap:8px; padding:8px 14px 8px 8px; border-radius:999px; border:1.5px solid var(--ink); background:var(--card); box-shadow:3px 3px 0 var(--butter); font-size:.84rem; font-weight:600}
  .peek .mark{width:28px; height:28px; border-radius:8px; font-size:.62rem; border-width:1.5px; box-shadow:none}
  .peek[hidden]{display:none}
  .drawer{position:fixed; inset:0; z-index:70; background:var(--scrim); display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s}
  .drawer.open{opacity:1; pointer-events:auto}
  .drawer > div{width:100%; max-height:86vh; overflow-y:auto; padding:22px 12px 20px; background:var(--paper); border-top:1.5px solid var(--ink); border-radius:24px 24px 0 0; transform:translateY(30px); transition:transform .3s var(--ease-spring)}
  .drawer.open > div{transform:none}
  .bld .slot{position:static}
  .doc-grid{grid-template-columns:minmax(0,1fr)}
  .doc-grid .dsec.r{padding-left:66px; border-left:0}
  .fe-grid{grid-template-columns:minmax(0,1fr)}
  .top .tag{display:none}
}
@media (min-width:961px){ .drawer{display:none} }
@media (max-width:1023px){
  .app .sb{display:none}
}
@media (max-width:640px){
  .top{grid-template-columns:auto minmax(0,1fr) auto; gap:10px; padding:0 12px}
  .wm .wt{display:none}
  .acts{grid-template-columns:minmax(0,1fr); margin-left:0}
  .opts, .addm, .donebar{margin-left:0}
  .msg.q p{font-size:1.08rem}
  .terms{grid-template-columns:minmax(0,1fr)}
  .dsec, .doc-grid .dsec.r, .doc-hd, .doc-ft{padding-left:50px; padding-right:16px}
  .doc::before{left:12px} .doc::after{left:36px}
  .ch-sec, .ch-hd, .ch-ft{padding-left:52px}
  .tk-top, .tk-b{padding-left:20px; padding-right:20px}
  .seats{gap:24px}
  .kick .chip{display:none}
  .compose{bottom:70px}
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

  }
  function founderName() { return D.founder === "" ? GOOGLE.name : (D.founder || ""); }
  function firstName() { return (founderName() || GOOGLE.name).split(" ")[0]; }
  function slugState() {
    var s = D.slug;
    if (D.slugClaimed) return { k: "taken", t: "Claimed", cls: "t-rose" };
    if (U.checking) return { k: "checking", t: "Checking…", cls: "" };

  }
  function slugSugs() {

  }
  function seatTone(i) { return TONES[i % TONES.length]; }
  function seatAreas(s) { return s.all ? AREAS.filter(function (a) { return a.gate(); }).map(function (a) { return a.id; }) : s.areas.filter(function (a) { return AREA[a].gate(); }); }
  function canLine(s) {
    if (s.all) return "<b>Everything.</b> Full authority — it's the founder's seat, and it's yours.";

  }
  function activeTypes() { return typeRows().filter(function (r) { return r.active; }); }
  function pagesOn() { return PAGES.filter(function (p) { return p.lock || on(p.id); }); }
  function metricsOn() {
    var m = METRICS.filter(function (x) { return D.metrics[x[0]]; }).map(function (x) { return x[1]; });
    return m.concat(D.custom);
  }
  function termSugs(model) {
    var y = 2026;
    if (model === "year-round") return [[String(y), y + "-01-01", y + "-12-31"], [String(y + 1), (y + 1) + "-01-01", (y + 1) + "-12-31"]];
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    var laid = [];
    [y, y + 1].forEach(function (yy) { WINDOWS[model].forEach(function (w) { laid.push([w[0] + " " + yy, yy + "-" + pad(w[1][0]) + "-" + pad(w[1][1]), yy + "-" + pad(w[2][0]) + "-" + pad(w[2][1])]); }); });
    var from = 0; for (var i = 0; i < laid.length; i++) { if (TODAY <= laid[i][2]) { from = i; break; } }

  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------- applying answers -------------------------------------------------------
     Every answer lands in D.ans; applyAll() re-derives pages, metrics and the founder seat
     from ALL of them. That's what lets the recap re-ask one question (even "what kind of
     org?") without the later answers silently falling off the charter. */
  var TITLE_ALTS = { fraternity: ["Founder", "VP Operations"], sorority: ["Founder", "VP Operations"], club: ["Founder", "Director"], team: ["Coach", "Manager"], service: ["Director", "Coordinator"], honor: ["Director", "Founder"], arts: ["President", "Music Director"], other: ["Founder", "President"] };

  function applyKind(kind, typed) {
    var k = KINDS[kind];
    D.kind = kind; D.variant = null;
    D.vocab = Object.assign({}, k.vocab);
    D.seats = k.seats.map(function (s, i) { return { title: s[0], all: !s[1], areas: (s[1] || []).slice(), tone: seatTone(i), id: "s" + i }; });
    D.types = k.starters.map(function (s) { return { slug: s[0], label: s[1], tone: s[2], wf: "events", starter: true }; });
    D.typeOv = {};
    D.kindMetrics = Object.assign({}, k.metrics);
    if (typed && k.variants) {
      k.variants.forEach(function (v) {
        if (D.variant || !v[1].test(typed.toLowerCase())) return;
        D.variant = v[2];
        var m = v[3];
        if (m.remove) D.seats = D.seats.filter(function (s) { return m.remove.indexOf(s.title) < 0; });
        (m.add || []).forEach(function (a) { D.seats.push({ title: a[0], areas: a[1].slice(), tone: seatTone(D.seats.length), id: "s" + D.seats.length + "v" }); });
        if (m.metrics) Object.keys(m.metrics).forEach(function (x) { D.kindMetrics[x] = m.metrics[x]; });
        if (m.vocab) Object.assign(D.vocab, m.vocab);
      });
    }
    D.founderSeat = D.seats[0].title;
    applyAll();
  }
  function applyAll() {
    var A = D.ans;
    D.wf = ["members"];
    ACTIVITIES.forEach(function (a) { if ((A.acts || []).indexOf(a.id) >= 0) a.wf.forEach(function (w) { setWf(w, true); }); });
    if (A.money) setWf("finance", A.money !== "none");
    if (A.docs) setWf("docs", A.docs !== "none");
    D.acts = (A.acts || []).slice();
    // tracking: what they ticked wins; until then the kind's defaults, minus what their pages rule out
    D.metrics = {};
    METRICS.forEach(function (m) { D.metrics[m[0]] = A.metrics ? A.metrics[m[0]] : (D.kindMetrics ? D.kindMetrics[m[0]] : 0); });
    if (!on("finance")) D.metrics.duesOwed = 0;   // nothing to owe without a ledger
    if (!A.metrics && !on("service")) D.metrics.serviceHours = 0;
    if (D.seats[0]) D.seats[0].title = A.title || D.founderSeat;
    var tm = A.term || { model: D.kind ? KINDS[D.kind].term : "semester", pick: 0 };
    setTerm(tm.model, tm.pick);
  }

  /* ---------- reading typed answers (the chips are primary; these stop a typed answer dead-ending) */
  function kindFromText(t) {
    t = t.toLowerCase();
    if (/soror/.test(t)) return "sorority";
    if (/frat|greek/.test(t)) return "fraternity";
    if (/team|sport|league|club sport|intramural/.test(t)) return "team";
    if (/honou?r|academic society/.test(t)) return "honor";
    if (/theat|a ?cappella|dance|band|choir|music|arts|ensemble|improv/.test(t)) return "arts";
    if (/service|volunteer|charity/.test(t)) return "service";
    if (/club|student org|society|association|group/.test(t)) return "club";
    return "other";
  }
  function readActs(t) {
    t = t.toLowerCase();
    if (/\b(all|everything)\b/.test(t) && !/except|but not|besides/.test(t)) return ACTIVITIES.map(function (a) { return a.id; });
    var out = [];
    t.split(/[,.;]|\bbut\b/).forEach(function (clause) {
      var neg = /\b(no|not|never|don'?t|without|except)\b/.test(clause);
      ACTIVITIES.forEach(function (a) { if (a.re.test(clause) && !neg && out.indexOf(a.id) < 0) out.push(a.id); });
    });
    return out;
  }
  function readDocs(t) {
    t = t.toLowerCase();
    if (/scatter|everywhere|all over|messy|mess|random/.test(t)) return "scattered";
    if (/^(no|nope|nah)\b|not really|none|nothing|don'?t/.test(t)) return "none";
    return "yes";
  }
  function readMoney(t) {
    t = t.toLowerCase();
    if (/^(no|nope|nah)\b|no money|not really|none|nothing|free|don'?t/.test(t)) return "none";
    if (/sometimes|now and then|occasional|a little|bit|rarely|fees?\b/.test(t)) return "some";
    return "yes";
  }
  function readTerm(t) {
    t = t.toLowerCase();
    var model = /quarter|trimester/.test(t) ? "quarter" : /season/.test(t) ? "season" : /year|round|rolling|annual|no term|don'?t reset/.test(t) ? "year-round" : (D.kind ? KINDS[D.kind].term : "semester");
    var sugs = termSugs(model), pick = 0;
    sugs.forEach(function (s, i) { var w = s[0].toLowerCase().split(" ")[0]; if (t.indexOf(w) >= 0) pick = i; });
    return { model: model, pick: pick };
  }

  /* ---------- the interview: one conversation, every question earns its place ----------------- */
  var BEATS = ["intro", "kind", "role", "month", "money", "docs", "metrics", "term"];
  function beats() { return BEATS; }
  function meetPhrase() { var m = V("Meetings"); return m === "Chapter" ? "chapter" : m.toLowerCase(); }
  function nounPl(n) { return n === "society" ? "societies" : n === "company" ? "companies" : n + "s"; }
  function listy(a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }
  function monthWords(ids) {

    return ids.map(function (id) { return m[id]; });
  }

  function say(kind, html) { D.thread.push({ k: kind, h: html }); }
  function ask(stage) {
    D.stage = stage;
    var n = '<em>' + esc(orgName()) + '</em>', mem = esc(V("Member").toLowerCase());
    if (stage === "intro") say("q", "Hi — I’ll get " + n + " set up while we talk. Takes about two minutes. First, who am I talking to?");
    if (stage === "kind") say("q", "So what is " + n + "? What kind of group are we setting up?");
    if (stage === "role") say("q", "And you’re " + n + "’s…?");
    if (stage === "month") say("q", "Picture a normal month at " + n + ". Which of these actually happen?");
    if (stage === "money") say("q", "Does " + n + " handle any money — " + esc(V("Dues").toLowerCase()) + ", event fees, paying people back?");

    }

  }
  function respond(beat, userText, reply, flash) {
    say("me", esc(userText));

  }

  function answer(beat, val, label) {

      if (A.title && A.title === D.founderSeat) A.title = null;

      k = KINDS[val];
      var seats = D.seats.slice(1).map(function (s) { return s.title; });
      var who = D.vocab.Member !== "Member" ? "it’s <b>" + esc(pl(D.vocab.Member)) + "</b>" + (D.vocab.Meetings !== "Meetings" ? " and <b>" + esc(D.vocab.Meetings) + "</b>" : "") + " from here on" : "";
      respond(beat, label, (D.variant ? (/^[aeiou]/i.test(D.variant) ? "An " : "A ") + esc(D.variant.toLowerCase()) + " " + esc(k.noun) : esc(k.label.replace(/^(an?) /i, function (m) { return m.charAt(0).toUpperCase() + m.slice(1); }))) +
        (who ? " — so " + who : "") + "." + (seats.length ? " I’ll start you with the offices " + esc(nounPl(k.noun)) + " like yours usually elect: " + esc(listy(seats)) + "." : ""), "words");

        some: "<b>Treasury</b> is on for whatever does come in and go out — it stays quiet otherwise.",

    }
  }

  /* ---------- rendering: chrome ----------------------------------------------------------- */
  function gate(step) {
    var idx = STEPS.map(function (s) { return s[0]; }).indexOf(step);
    if (idx >= 2 && !D.kind) return "interview";
    if (step === "timeline" && !D.interviewDone) return "interview";
    if (step === "build" && !D.name.trim()) return "name";
    return null;
  }
  function stepDone(step) {

    var order = STEPS.map(function (s) { return s[0]; }), cur = D.step === "building" ? "build" : D.step;
    return order.indexOf(step) < order.indexOf(cur) && !gate(step);

  function chrome() {

      '<a class="wm" href="#" data-a="home"><span class="orglogo">C</span><span class="wt">ChaptOS</span></a>';

      h += '<nav class="rail" aria-label="Steps">';

        h += '<button data-go="' + s[0] + '"' + (cur ? ' aria-current="step"' : "") + (locked ? " disabled" : "") + ' class="' + (stepDone(s[0]) && !cur ? "done" : "") + '" title="' + s[1] + '">' +
          '<span class="n">' + (stepDone(s[0]) && !cur ? ic("check") : locked ? ic("lock") : i + 1) + '</span><span class="lb">' + (s[0] === "build" && (U.mock === "signedin" || U.signedIn) ? "Build" : s[1]) + '</span></button>';

  /* ---------- the charter (BlueprintSheet) ---------------------------------------------- */

      (pending ? '<span class="ghostln" style="--w:72%"></span><span class="ghostln" style="--w:48%"></span><p class="ch-pend">' + pending + '</p>' : body) + '</div>';
  }
  function charterHTML(opts) {

      '<div class="ch-org">' + markHTML() + '<div><b>' + (D.name.trim() ? esc(D.name.trim()) : '<span style="color:var(--line-2)">Your org</span>') + '</b><small>' + HOST + "/" + esc(D.slug || "…") + '</small></div></div></div>';

      (D.kind && !D.ans.acts ? '<p class="ch-pend">The rest arrive with “a normal month”.</p>' : ""),

      D.kind ? null : "Fills in when you say what kind of org this is.");

      mets.length ? '<div class="chips">' + mets.map(function (m) { return '<span class="chip">' + ic("bars") + esc(m) + '</span>'; }).join("") + '</div>' : '<p class="ch-pend">Nothing tracked per member yet.</p>',
      D.kind ? null : "Attendance, GPA, dues — whatever you’ll actually check.");

      D.kind ? null : "A founder seat, plus the offices your kind of org usually elects.");

    }

  function flashSec(id) {

  function refreshCharter() {

  /* ---------- steps --------------------------------------------------------------------- */
  function nameStep() {
