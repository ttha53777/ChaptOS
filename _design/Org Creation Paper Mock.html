  document.addEventListener("change", function (e) {
    if (e.target.dataset.voc || e.target.dataset.title != null) { if (D.step === "charter") { render(); } }
  });
  document.addEventListener("keydown", function (e) {
    var tag = e.target.tagName;
    if (e.target.id === "namein" && e.key === "Enter" && D.name.trim()) { go("interview"); return; }
    if (tag === "INPUT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    if (e.key === "t" || e.key === "T") return toggleTheme();
    if (e.key === "Escape") $("#drawer").classList.remove("open");
    var order = STEPS.map(function (s) { return s[0]; }), i = order.indexOf(D.step);
    if (i < 0) return;
    if (e.key === "ArrowRight" && i < order.length - 1 && !gate(order[i + 1])) go(order[i + 1]);
    if (e.key === "ArrowLeft" && i > 0) go(order[i - 1]);
  });
  function toggleTheme() {
    var dark = document.documentElement.dataset.theme !== "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    try { localStorage.setItem("paper-mock-theme", dark ? "dark" : "light"); } catch (e) {}
    var b = $(".theme"); if (b) b.innerHTML = ic(dark ? "sun" : "moon");
  }
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "compose") {
      var inp = $("#cin"), v = inp.value.trim(); if (!v) return;
      inp.value = ""; f.querySelector(".send").disabled = true;
      ivTyped(v);
    }
    if (f.dataset.form === "ownseat") {
      var i2 = f.querySelector("input"), tt = i2.value.trim(); if (!tt) return;
      D.seats.push({ title: tt, areas: [], tone: seatTone(D.seats.length), id: "c" + Date.now() }); render();
      var last = $$(".badge:not(.badge--add)").pop(); if (last) last.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    }
    if (f.dataset.form === "addtype") {
      var i3 = f.querySelector("input"), lb = i3.value.trim(); if (!lb) return;
      var slug = slugify(lb) || "type", taken = typeRows().map(function (r) { return r.slug; }), s2 = slug, n = 2;
      while (taken.indexOf(s2) >= 0) s2 = slug + "-" + n++;
      D.types.push({ slug: s2, label: lb, tone: TONES[D.types.length % TONES.length], wf: null });
      render(); var a = $('.ty-add input'); if (a) a.focus();
    }
  });
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-iv],[data-go],[data-a],[data-met],[data-cust],[data-ab],[data-pool],[data-tape],[data-rmtype],[data-pgon],[data-pg],[data-model],[data-term],[data-sug],[data-mock],[data-fail]");
    if (!el) { if (e.target.id === "drawer") $("#drawer").classList.remove("open"); return; }
    var d = el.dataset;
    if (d.go) { e.preventDefault(); if (d.go === "build" && el.closest(".doc-ft") && U.signedIn) {} return go(d.go); }
    if (d.iv) { if (D.stage === "typing") return; return ivClick(el); }
    if (d.met) { D.metrics[d.met] = D.metrics[d.met] ? 0 : 1; render(); return; }
    if (d.cust != null) { D.custom.splice(+d.cust, 1); render(); return; }
    if (d.ab) {
      var s = D.seats[+d.i], k = s.areas.indexOf(d.ab);
      if (k >= 0) s.areas.splice(k, 1); else s.areas.push(d.ab);
      render(); return;
    }
    if (d.pool != null) { var p = KINDS[D.kind].pool[+d.pool]; D.seats.push({ title: p[0], areas: p[2].slice(), tone: seatTone(D.seats.length), id: "p" + d.pool }); render(); return; }
    if (d.tape) {
      var r = D.types.filter(function (x) { return x.slug === d.tape; })[0];
      var cur = r ? r.tone : (D.typeOv[d.tape] && D.typeOv[d.tape].tone) || BUILTIN_TYPES.filter(function (b) { return b[0] === d.tape; })[0][2];
      var nx = TONES[(TONES.indexOf(cur) + 1) % TONES.length];
      if (r) r.tone = nx; else { D.typeOv[d.tape] = D.typeOv[d.tape] || {}; D.typeOv[d.tape].tone = nx; }
      el.style.setProperty("--tc", "var(--" + nx + "-ink)");
      $("#slot-week").innerHTML = weekHTML(); return;
    }
    if (d.rmtype != null) { D.types.splice(+d.rmtype, 1); render(); return; }
    if (d.pgon) { setWf(d.pgon, true); if (d.pgon === "meetings") setWf("attendance", true); render(); toast(esc(PAGE[d.pgon].l()) + " is on"); return; }
    if (d.pg) { setWf(d.pg, !on(d.pg)); if (d.pg === "meetings") setWf("attendance", on("meetings")); render(); return; }
    if (d.model) { setTerm(d.model, 0); D.ans.term = { model: d.model, pick: 0 }; render(); return; }
    if (d.term != null) { setTerm(D.term.model, +d.term); D.ans.term = { model: D.term.model, pick: +d.term }; render(); return; }
    if (d.sug) { D.slug = d.sug; D.slugEdited = true; D.slugClaimed = false; render(); return; }
    if (d.mock) { preset(d.mock); return; }
    if (d.fail) { U.fail[d.fail] = !U.fail[d.fail]; syncMock(); toast(U.fail[d.fail] ? "Next build will fail: " + el.textContent.toLowerCase() : "Build failure cleared"); return; }
    var a = d.a;
    if (a === "home") { e.preventDefault(); return go("name"); }
    if (a === "theme") return toggleTheme();
    if (a === "restart") { e.preventDefault(); return preset(U.mock === "resumed" ? "fresh" : U.mock); }
    if (a === "closeresume") { U.resumeBar = false; $(".resume").remove(); return; }
    if (a === "logo") return $("#logo-file").click();
    if (a === "unlogo") { D.logo = null; return render(); }
    if (a === "google") { el.innerHTML = '<span class="ln2 show" style="opacity:1;transform:none;display:inline-grid"><span class="tk"></span></span>Opening Google…'; later(function () { U.signedIn = true; if (D.founder === "") D.founder = GOOGLE.name; runBuild(); }, 1100); return; }
    if (a === "build" || a === "retry") return runBuild();
    if (a === "signout") { U.mock = "fresh"; U.signedIn = false; render(); return; }
    if (a === "copy") { toast("Invite link copied"); return; }
    if (a === "toDash") { try { localStorage.setItem("paper-mock-mode", "empty"); } catch (x) {} return; }
    if (a === "peek") { $("#drawer-b").innerHTML = charterHTML({ types: D.interviewDone }); $("#drawer").classList.add("open"); return; }
  });
  $("#logo-file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 2e6) { toast("That image is over 2 MB — try a smaller one"); return; }
    var rd = new FileReader(); rd.onload = function () { D.logo = String(rd.result); render(); }; rd.readAsDataURL(f);
    e.target.value = "";
  });

  U.picks = [];
  preset("fresh");
})();
</script>
