// ── math ──
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// decaying hit shake, deterministic per hit

// camera: zoom z about focus (fx,fy), then translate; returns css + a point mapper
function cam(z, fx, fy, dx = 0, dy = 0) {
  return { css: `translate(${dx}px,${dy}px) translate(${fx}px,${fy}px) scale(${z}) translate(${-fx}px,${-fy}px)`, map: (x, y) => [dx + fx + (x - fx) * z, dy + fy + (y - fy) * z] };
}
// ───────────────────────── seek ─────────────────────────

  if (L.parts.length && stagger) L.parts.forEach((p, i) => { const u = E.outExpo(P(t, t0 + i * stagger, t0 + i * stagger + dur)); tf(p, `translateY(${(1 - u) * 110}%)`); });
  else { const u = E.outExpo(P(t, t0, t0 + dur)); tf(L.inner, `translateY(${(1 - u) * 110}%)`); }
}
function sink(L, t, t0, dur = 0.25) { const u = E.inExpo(P(t, t0, t0 + dur)); if (u > 0) tf(L.inner, `translateY(${-u * 115}%)`); }

    const u01 = spring(t - C.pill, 2.4, 0.55), u12 = spring(t - C.enter, 2.8, 0.6), u23 = spring(t - C.answer, 2.8, 0.6);
    const w = lerp(LAY.pillW, W1, u01);
    const h = lerp(lerp(lerp(ph, 340 * kp, u01), 435.8 * kp, u12), 609.5 * kp, u23);
    const on = t >= C.pill;
    show(panel, on);
    if (on) {
      Object.assign(panel.style, { width: w + "px", height: h + "px", borderRadius: lerp(ph / 2, 20 * kp, cl(u01)) + "px" });
      tf(panel, `translate(${LAY.pcx - w / 2}px,${LAY.pcy - h / 2}px)`);
      frameWin(pnPill, DR.launcher, w, h); pnPill.style.opacity = 1 - P(t, C.pill, C.pill + 0.12);
      // which real frame is on screen
      let src, spot;
      if (t < C.typeA) { src = ASKF.welcome; spot = SPOT.welcome; }
      else if (t < C.enter) { src = ASKF.type[Math.min(9, Math.floor(P(t, C.typeA, C.typeB) * 10))]; spot = SPOT.welcome; }
      else if (t < C.answer) { src = ASKF.think[Math.min(10, Math.floor(P(t, C.enter + 0.04, C.thinkEnd) * 11))]; spot = SPOT.think; }
      else { src = ASKF.answer; spot = SPOT.answer; }
      pnFrame.style.backgroundImage = `url(${APP + src})`;
      frameWin(pnFrame, spot, W1);
      const offY = (h - spot[3] * kp) / 2, offX = (w - W1) / 2;
      pnFrame.style.opacity = P(t, C.pill + 0.03, C.pill + 0.16);
      place(pnFrame, 0, 0);
      // panel camera: lean into the bar while typing, into the verdict when it lands
      // three push-ins, each onto the part that matters: the bar, the ledger, the verdict
      const zt = E.inOutCubic(P(t, C.typeA - 0.1, C.typeA + 0.2)) * (1 - E.inOutCubic(P(t, C.enter - 0.05, C.enter + 0.15)));
      const zl = E.inOutCubic(P(t, C.enter + 0.1, C.enter + 0.4)) * (1 - E.inOutCubic(P(t, C.answer - 0.1, C.answer + 0.1)));
      const za = E.inOutCubic(P(t, C.answer + 0.12, C.answer + 0.45)) * (1 - E.inOutCubic(P(t, 11.45, 11.75)));
      const zf = 1 + 0.36 * zt + 0.55 * zl + 0.16 * za;
      const fx = (zt * 366 + zl * 30 + za * 20) / Math.max(1e-3, zt + zl + za) * kp, fy = (zt * 297 + zl * 230 + za * 230) / Math.max(1e-3, zt + zl + za) * kp;
      tf(pnCam, `translate(${offX}px,${offY}px) translate(${fx}px,${fy}px) scale(${zf}) translate(${-fx}px,${-fy}px)`);
      // the answer rows re-deal, then a marker lands under the number
      const ans = t >= C.answer;
      show(ansCover, ans); Object.assign(ansCover.style, { left: ANS.cover[0] * kp + "px", top: ANS.cover[1] * kp + "px", width: ANS.cover[2] * kp + "px", height: ANS.cover[3] * kp + "px" });
      ansRows.forEach((d, i) => { const r = ANS.rows[i]; frameWin(d, [354 + r[0], 141.3 + r[1], r[2], r[3]], r[2] * kp); place(d, r[0] * kp, r[1] * kp); const sp = spring(t - C.rows4[i], 3, 0.45); show(d, t >= C.rows4[i]); tf(d, `translateY(${(1 - sp) * 40}px) scale(${0.96 + 0.04 * sp})`); });
      Object.assign(ansHL.style, { left: ANS.hl[0] * kp + "px", top: ANS.hl[1] * kp + "px", width: ANS.hl[2] * kp + "px", height: ANS.hl[3] * kp + "px" });
      show(ansHL, t >= C.hl4); tf(ansHL, `scaleX(${E.outExpo(P(t, C.hl4, C.hl4 + 0.2))})`);
    }
    rise(LAB4, t, C.lab4, 0.3, 0.03);
    { const u = E.inCubic(P(t, C.lab4b - 0.14, C.lab4b)); LAB4.wrap.style.opacity = 1 - u; LAB4.wrap.style.transform = `translateY(${-u * 50}px)`; }
    rise(LAB4b[0], t, C.lab4b, 0.3, 0.018); rise(LAB4b[1], t, C.lab4b + 0.08, 0.3, 0.018);
  }

  // ── 5 roll
  vis(s5, 11.85, 15.05, t);
  if (t >= 11.85 && t < 15.05) {
    const wi = E.outExpo(P(t, 11.85, 12.2));
    tf(s5, `translateY(${(1 - wi) * H * 1.1}px)`);
    rise(LAB5[0], t, C.lines5[0], 0.3, 0.025); rise(LAB5[1], t, C.lines5[1], 0.3); rise(LAB5[2], t, C.lines5[2], 0.3);
    LAB5.slice(1).forEach((L, i) => { L.num.textContent = Math.round(L.max * E.outCubic(P(t, C.lines5[i + 1], C.lines5[i + 1] + 0.5))); });
    chipCovers.forEach((c, i) => { const u = E.outBack(P(t, C.chips[i], C.chips[i] + 0.14)); tf(c, `scale(${Math.max(0, 1 - u)})`); show(c, u < 1); });
    // camera: whole card, then push in on the excuse + Approve
    const zu = E.inOutCubic(P(t, C.zoom5[0], C.zoom5[1]));
    const z = lerp(pick(1.12, 1.1, 1.0), pick(1.8, 1.7, 1.55), zu);
    const R = LAY.roll;
    const fx = lerp(R.x0 + 355 * k5, R.x0 + 470 * k5, zu), fy = lerp(R.y0 + 225 * k5, R.y0 + 239 * k5, zu);
    // keep the focus point centred in the window as we zoom
    const ox = lerp(0, win5.w / 2 - fx, zu), oy = lerp(0, win5.h / 2 - fy, zu);
    tf(cam5, `translate(${ox}px,${oy}px) translate(${fx}px,${fy}px) scale(${z}) translate(${-fx}px,${-fy}px)`);
    const ax = R.x0 + 629.3 * k5, ay = R.y0 + 239 * k5;
    LAY.approve = { x: win5.x + ox + fx + (ax - fx) * z, y: win5.y + oy + fy + (ay - fy) * z + (1 - wi) * H * 1.1 };
    // flood from the click
    const fu = E.inOutCubic(P(t, C.flood, 14.875));
    show(flood, fu > 0 && t < 15.05);
  }
  // flood (global, sits above scene 5)
  {
    const fu = E.inOutCubic(P(t, C.flood, 14.875));
    const on = fu > 0 && t < C.morph + 0.02;
    show(flood, on);
    if (on) {
      const ap = LAY.approve || { x: W / 2, y: H / 2 };
      const R = Math.hypot(Math.max(ap.x, W - ap.x), Math.max(ap.y, H - ap.y)) * 1.05 * fu;
      Object.assign(flood.style, { width: 2 * R + "px", height: 2 * R + "px" });
      tf(flood, `translate(${ap.x - R}px,${ap.y - R}px)`);
      flood.style.zIndex = 1;
    }
    stage.style.background = t >= 14.9 && t < C.morph ? BUTTER : PAPER;
  }

  // ── 6 metric
  vis(s6, 14.95, 17.6, t);
  s6.style.zIndex = 2;
  if (t >= 14.95 && t < 17.6) {
    const out = E.inExpo(P(t, C.out6, C.out6 + 0.25));
    tf(s6, `translateY(${-out * H * 0.7}px)`);
    const draw = E.outExpo(P(t, C.digits[0] - 0.05, C.digits[0] + 0.25));
    ringTrack.setAttribute("stroke-dashoffset", CIRC * (1 - draw));
    let prog = 0; C.digits.forEach(d => { prog += 0.2 * E.outBack(P(t, d, d + 0.22), 1.4); });
    ringArc.setAttribute("stroke-dashoffset", CIRC * (1 - Math.min(prog, 1)) + (prog <= 0.001 ? 1 : 0));
    ringArc.setAttribute("stroke-width", SW6 * (1 + 0.5 * Math.exp(-Math.max(0, t - C.digits[4]) * 8) * (t >= C.digits[4] ? 1 : 0)));
    const hD = numSize * 0.86;
    DIG.forEach((d, i) => {
      const a = C.digits[i], b = C.digits[i + 1] ?? 99;
      const uin = E.outExpo(P(t, a, a + 0.2)), uout = E.inExpo(P(t, b - 0.06, b + 0.06));
      show(d, t >= a - 0.01 && t < b + 0.07);
      tf(d, `translateY(${(1 - uin) * hD - uout * hD}px)`);
    });
    const punch = t >= C.digits[4] ? 1 + 0.14 * Math.exp(-(t - C.digits[4]) * 9) * Math.cos((t - C.digits[4]) * 30) : 1;
    digWin.style.transformOrigin = "50% 60%"; tf(digWin, `scale(${punch})`);
    rise(SEC, t, C.digits[0] + 0.1, 0.3);
    L6.forEach((L, i) => rise(L, t, C.lines6[i], 0.32));
    const rs = spring(t - C.digits[0] + 0.12, 2.2, 0.5);
    ring.style.transformOrigin = "50% 50%"; tf(ring, `scale(${0.6 + 0.4 * rs}) rotate(${(1 - rs) * -40}deg)`);
  }

  // ── morph: the butter field collapses into the mark
  {
    const mu = E.inOutCubic(P(t, C.morph, C.mark));
    const on = t >= C.morph && t < C.mark + 0.02;
    show(morph, on);
    if (on) {
      const w = lerp(W * 1.1, MS, mu), h = lerp(H * 1.1, mh, mu);
      const cx = lerp(W / 2, lock.mx, mu), cy = lerp(H / 2, lock.my + (MS * 40) / 35 * 0.0 + (mh * 0) , mu);
      Object.assign(morph.style, { width: w + "px", height: h + "px", borderRadius: lerp(0, mrad, mu) + "px", borderWidth: mstroke * E.outCubic(P(mu, 0.86, 1)) + "px" });
      tf(morph, `translate(${cx - w / 2}px,${cy - h / 2}px)`);
      morph.style.zIndex = 1;
    }
  }

  // ── 7 logo
  vis(s7, C.mark - 0.02, 21, t);
  s7.style.zIndex = 3;
  if (t >= C.mark - 0.02) {
    const ms = spring(t - C.mark, 3, 0.32);
    mark.style.transformOrigin = "50% 55%";
    const md = Math.max(0, t - C.mark);
    tf(mark, `scale(${1 + 0.1 * Math.sin(md * 26) * Math.exp(-md * 7)})`);
    eyes.forEach((e, i) => {
      const s = spring(t - C.eyes[i], 4, 0.34);
      const bl = P(t, C.blink, C.blink + 0.12); const sy = 1 - 0.9 * Math.sin(Math.PI * bl);
      e.setAttribute("transform", `translate(${e.getAttribute("cx")} ${e.getAttribute("cy")}) scale(${s} ${s * sy}) translate(${-e.getAttribute("cx")} ${-e.getAttribute("cy")})`);
    });
    const SL = 22; smile.setAttribute("stroke-dasharray", SL); smile.setAttribute("stroke-dashoffset", SL * (1 - E.outCubic(P(t, C.smile, C.smile + 0.22))));
    rise(WORD, t, C.word, 0.34, 0.035);
    const sb = spring(t - C.btn, 2.8, 0.4);
    show(btn.el, t >= C.btn); btn.el.style.transformOrigin = "50% 50%";
    const press = t >= C.click4 ? 1 - 0.05 * Math.sin(Math.PI * P(t, C.click4, C.click4 + 0.16)) : 1;
    tf(btn.el, `scale(${Math.max(0, sb) * press})`);
    rise(URL_, t, C.url, 0.32);
  }

  // ── cursor
  const curPath = [
    [C.cur1, C.cur1At, C.click1, () => [LAY.circle?.x ?? W / 2, LAY.circle?.y ?? H / 2], C.collapse + 0.3],
    [99, 99, 99, () => [0, 0], 99],
    [C.cur3, C.cur3At, C.click3, () => [LAY.approve.x, LAY.approve.y], C.flood + 0.2],
    [C.cur4, C.cur4At, C.click4, () => [LAY.btn.x + 60, LAY.btn.y + 10], 99],
  ];
  let cv = null;
  curPath.forEach(([a, b, c, tgt, end], i) => {
    if (t < a || t >= end || !LAY.approve && i === 2) return;
    const [tx, ty] = tgt();
    const sx = W + 80, sy = H * pick(0.86, 0.9, 0.9);
    const u = E.inOutCubic(P(t, a, b));
    const arc = Math.sin(Math.PI * u) * pick(-140, -90, -120);
    let x = lerp(sx, tx, u), y = lerp(sy, ty, u) + arc;
    // leave: slide away after the action
    const lu = E.inCubic(P(t, end - 0.25, end));
    if (i < 3) { x += lu * 300; y += lu * 260; }
    const press = 1 - 0.18 * Math.sin(Math.PI * P(t, c - 0.04, c + 0.1));
    cv = { x, y, press };
  });
  show(cursor, !!cv);
  if (cv) tf(cursor, `translate(${cv.x - 2 * CUR}px,${cv.y - 2 * CUR}px) scale(${cv.press})`);
  cursor.style.zIndex = 5; ripLayer.style.zIndex = 4;
  // ripples
  [[C.click1, () => [LAY.circle?.x, LAY.circle?.y]], [99, () => [0, 0]], [C.click3, () => [LAY.approve?.x, LAY.approve?.y]], [C.click4, () => [LAY.btn.x + 60, LAY.btn.y + 10]]].forEach(([c, at], i) => {
    const r = RIPS[i], u = P(t, c, c + 0.4);
    const on = t >= c && u < 1;
    show(r, on);
    if (on) { const [x, y] = at(); const R = lerp(10, pick(90, 70, 80), E.outCubic(u)); Object.assign(r.style, { width: 2 * R + "px", height: 2 * R + "px", opacity: 1 - u }); tf(r, `translate(${x - R}px,${y - R}px)`); }
  });
}

// ───────────────────────── boot ─────────────────────────
window.READY = (async () => {
  await Promise.all([document.fonts.load("800 100px Brico"), document.fonts.load("700 100px Brico"), document.fonts.load("500 40px InterL")]);
  await document.fonts.ready;
  // decode one at a time — two dozen 2880×1800 frames in parallel can reject in Chromium
  for (const i of [...document.images, ...PRE]) { let ok = false; for (let k = 0; k < 3 && !ok; k++) { try { await i.decode(); ok = true; } catch {} } if (!ok && !i.complete) throw new Error("img " + i.src); }
  Object.values(IMGS).flat().forEach(i => { i.style.width = (i.naturalWidth / 3) * +i.dataset.k + "px"; });
  layout();
  paint(0);
  return { W, H, FMT };
})();
const BEAT_OFF = (window.BEATS && window.BEATS.offset) || 0; // measured grid from beats.json
window.seek = t => paint(t - BEAT_OFF);
// preview only (never in render): ?play=1 drives seek from the clock
if (q.get("play")) window.READY.then(() => { const t0 = performance.now(); const tick = () => { paint(((performance.now() - t0) / 1000) % TL.dur); requestAnimationFrame(tick); }; tick(); });
</script>
</body>
