function render(){if(view==='agenda')monthOffset=(date(addDays('2026-09-07',week*7)).getFullYear()-2026)*12+date(addDays('2026-09-07',week*7)).getMonth()-8;let [start,end]=period();let list=filtered().filter(e=>filter==='Overdue'||e.date>=start&&e.date<=end).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('#range').textContent=view==='month'?fmt(start,{month:'long',year:'numeric'}):`${fmt(start)} – ${fmt(end,{day:'numeric',...(start.slice(0,7)!==end.slice(0,7)?{month:'short'}:{})})}, ${date(start).getFullYear()}`;$('#summary').textContent=`${list.length} items · ${list.filter(e=>e.required).length} required${week===0&&view==='agenda'?' · This week':''}`;$('#agenda').classList.toggle('on',view==='agenda');$('#month').classList.toggle('on',view==='month');$('#agenda').setAttribute('aria-pressed',view==='agenda');$('#month').setAttribute('aria-pressed',view==='month');$('#attention').innerHTML=`<button id="overdue"><span class="alerticon">${overdue().length?'!':'✓'}</span><span><b>${overdue().length?`${overdue().length} overdue deadline`:'Deadlines are up to date'}</b><small>${overdue().length?esc(overdue()[0].title)+' · Due Sep 4':'You’re all caught up. View upcoming deadlines.'}</small></span><span class="arrow">↗</span></button><button id="review"><span class="alerticon">${requests.length||'✓'}</span><span><b>${requests.length?`${requests.length} excuse requests to review`:'All excuse requests reviewed'}</b><small>Chapter attendance · Officer review</small></span><span class="arrow">↗</span></button>`;$('#overdue').onclick=()=>{filter=overdue().length?'Overdue':'Deadlines';query='';$('#search').value='';render()};$('#review').onclick=review;

if(!list.length)$('#schedule').innerHTML='<div class="empty"><h3>No items in this view</h3><p>Try a different week or clear your filters.</p><button id="clear">Reset to this week</button></div>';else if(view==='month'&&filter!=='Overdue'){let offset=(date(start).getDay()+6)%7;$('#schedule').innerHTML=`<div class="monthgrid">${['M','T','W','T','F','S','S'].map(d=>`<div class="monthcell" style="min-height:30px;text-align:center">${d}</div>`).join('')}${Array.from({length:offset},()=>'<div class="monthcell"></div>').join('')}${Array.from({length:date(end).getDate()},(_,i)=>{let d=addDays(start,i);return `<div class="monthcell ${d==='2026-09-07'?'today':''}"><b>${i+1}</b>${list.filter(e=>e.date===d).map(e=>`<button style="--cat:${colors[e.cat]}" data-event="${e.id}">${esc(e.title)}</button>`).join('')}</div>`}).join('')}</div>`}else{$('#schedule').innerHTML=[...new Set(list.map(e=>e.date))].map(d=>`<div class="daygroup"><div class="date ${d==='2026-09-07'?'today':''}"><span>${fmt(d,{weekday:'short'}).toUpperCase()}</span><b>${date(d).getDate()}</b></div><div class="dayevents">${d==='2026-09-07'?'<div class="daynote">Today · Monday, September 7</div>':''}${list.filter(e=>e.date===d).map(e=>`<button class="event ${selected===e.id?'selected':''} ${e.done?'completed':''}" data-event="${e.id}" style="--cat:${colors[e.cat]}" aria-pressed="${selected===e.id}"><div class="content"><div class="title">${esc(e.title)}</div><div class="meta"><span style="color:${colors[e.cat]}">${e.cat}</span><span>·</span><span>${esc(e.cat==='Deadline'||e.cat==='Instagram'?e.owner:e.location)}</span></div></div><div class="end"><time>${e.cat==='Deadline'?'By ':''}${time(e.time)}</time>${e.done?'<span class="tag green">✓ Complete</span>':e.required?'<span class="tag">Required</span>':e.date<'2026-09-07'&&e.cat==='Deadline'?'<span class="tag red">Overdue</span>':e.cat==='Service'?'<span class="tag green">Service hours</span>':'<span class="muted small">↗</span>'}</div></button>`).join('')}</div></div>`).join('')};if($('#clear'))$('#clear').onclick=resetView;document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.event);lastFocus=b;render();if(innerWidth<=900){$('#railinner').setAttribute('tabindex','-1');$('#railinner').focus()}});renderRail()}
function resetView(){filter='All';query='';week=0;monthOffset=0;$('#search').value='';render()}
function renderRail(){let e=events.find(e=>e.id===selected);attendance=attendanceByEvent[selected]??null;$('#rail').classList.toggle('has-detail',!!e);if(e){$('#railinner').innerHTML=`<div class="detail"><div class="row between"><span class="eyebrow">Event details</span><button class="close" id="closeDetail" aria-label="Close event details">✕</button></div><div style="margin-top:20px"><span class="tag" style="color:${colors[e.cat]}">${e.cat}</span> ${e.required?'<span class="tag">Required</span>':''}</div><h2>${esc(e.title)}</h2><p>${esc(e.description)}</p><dl><dt>WHEN</dt><dd>${fmt(e.date,{weekday:'long',month:'long',day:'numeric'})}<br>${time(e.time)}${e.cat==='Chapter'?' – 8 PM':''}</dd><dt>${e.cat==='Deadline'?'SOURCE':'WHERE'}</dt><dd>${esc(e.location)}</dd><dt>${e.cat==='Deadline'?'ASSIGNED TO':'ORGANIZED BY'}</dt><dd>${esc(e.owner)}</dd></dl>${e.cat==='Chapter'?`<section><h3>Meeting agenda</h3><ul><li>Recruitment plans & upcoming events</li><li>Committee updates</li><li>Budget approvals & open floor</li></ul><p class="small">${attendance===null?'Attendance hasn’t been recorded.':`Attendance saved · ${attendance} present in demo roster.`}</p></section>`:''}${e.cat==='Service'?'<section><h3>Make your hours count</h3><p style="margin-top:8px">Hours are recorded after the event. Check in with the service chair when you arrive.</p></section>':''}${e.cat==='Instagram'?'<section><h3>Post checklist</h3><ul><li>Creative approved</li><li>Caption ready</li><li>Publish and record the post link</li></ul></section>':''}${e.cat==='Deadline'?`<button class="primary" id="complete">${e.done?'Reopen deadline':'✓ Mark complete'}</button>`:e.cat==='Chapter'?'<button class="primary" id="attendance">Record attendance</button><button class="ghost" id="excuse">Request an excuse</button>':e.cat==='Instagram'?`<button class="primary" id="complete">${e.done?'Reopen post':'Mark as published'}</button>`:''}<button class="ghost" id="edit">Edit ${e.cat==='Deadline'?'deadline':'event'}</button></div>`;$('#closeDetail').onclick=()=>{let id=selected;selected=null;render();document.querySelector(`[data-event="${id}"]`)?.focus()};$('#edit').onclick=()=>composer(e);if($('#complete'))$('#complete').onclick=()=>{e.done=!e.done;render();notify(e.done?'Saved as complete in this mock.':'Item reopened.')};if($('#attendance'))$('#attendance').onclick=recordAttendance;if($('#excuse'))$('#excuse').onclick=requestExcuse;return}
let [start,end]=period();let m=new Date(2026,8+monthOffset,1),offset=(m.getDay()+6)%7,days=new Date(2026,9+monthOffset,0).getDate();$('#railinner').innerHTML=`<div class="calendar"><div class="row between"><h3>${m.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><span class="tag violet">Fall term</span></div><div class="calgrid">${['M','T','W','T','F','S','S'].map(d=>`<span class="dow">${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=iso(new Date(2026,8+monthOffset,i+1));return `<button data-date="${d}" aria-label="Show week of ${fmt(d,{month:'long',day:'numeric'})}" class="${d=== '2026-09-07'?'today':d>=start&&d<=end?'week':''}">${i+1}${events.some(e=>e.date===d)?'<i></i>':''}</button>`}).join('')}</div></div><div class="insight"><div class="eyebrow">Your week at a glance</div><h3>${events.filter(e=>e.date>=start&&e.date<=end&&e.required).length} required events</h3><p class="small muted">Required events count toward chapter attendance. Open an event for details or to request an excuse.</p></div><div class="insight"><div class="row between"><span class="eyebrow">Fall term</span><span class="small muted">Week 3 of 15</span></div><h3>Finding our rhythm.</h3><p class="small muted">Recruitment is this week. Keep committee plans moving before Thursday’s kickoff.</p><div class="progress"><span style="width:20%"></span></div><div class="row between small muted"><span>Aug 24</span><span>Dec 6</span></div></div><div class="eyebrow">Connected across your chapter</div><div class="legend">${Object.entries(colors).map(([c,color])=>`<span><i class="dot" style="color:${color}"></i>${c}</span>`).join('')}</div>`;document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{week=Math.floor((date(b.dataset.date)-date('2026-09-07'))/604800000);view='agenda';render()})}
function openModal(content){lastFocus=document.activeElement;$('#modal').innerHTML=content;$('#modal').showModal();$('#modal').querySelector('[data-cancel]')?.addEventListener('click',()=>$('#modal').close())}$('#modal').addEventListener('close',()=>lastFocus?.isConnected&&lastFocus.focus());
function composer(e){openModal(`<h2 id="modalTitle">${e?'Edit item':'Add to the timeline'}</h2><p class="muted small" style="margin-top:8px">Keep the chapter in the loop.</p><form id="compose"><label for="title">Title</label><input id="title" name="title" required maxlength="100" value="${esc(e?.title||'')}" placeholder="e.g. Recruitment planning session"><div class="formrow"><div><label for="category">Type</label><select id="category" name="cat">${Object.keys(colors).map(c=>`<option ${e?.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="eventDate">Date</label><input id="eventDate" type="date" name="date" value="${e?.date||'2026-09-09'}" min="2026-08-24" max="2026-12-06" required></div></div><div class="formrow"><div><label for="eventTime">Time</label><input id="eventTime" type="time" name="time" value="${e?.time||'18:00'}" required></div><div><label for="owner">Owner / assignee</label><input id="owner" name="owner" required value="${esc(e?.owner||'Jordan Lee')}"></div></div><label for="location">Location or source</label><input id="location" name="location" required value="${esc(e?.location||'')}" placeholder="e.g. Chapter house"><label for="description">Details</label><textarea id="description" name="description">${esc(e?.description||'')}</textarea><label class="check"><input type="checkbox" name="required" ${e?.required?'checked':''}> Required attendance</label><div class="dialogfooter"><button type="button" data-cancel>Cancel</button><button class="primary" type="submit">${e?'Save changes':'Add item'}</button></div></form>`);$('#compose').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),data=Object.fromEntries(f);if(!data.title.trim()||!data.owner.trim()||!data.location.trim()){notify('Please enter a title, owner, and location.');return}let item={...data,required:f.has('required'),id:e?.id||Date.now(),done:e?.done||false};if(e)Object.assign(e,item);else events.push(item);week=Math.floor((date(item.date)-date('2026-09-07'))/604800000);monthOffset=date(item.date).getMonth()-8;filter='All';query='';$('#search').value='';selected=item.id;$('#modal').close();render();notify(e?'Changes saved in this mock.':'Added to the timeline.')}}
function review(){openModal(`<h2 id="modalTitle">Excuse requests</h2><p class="small muted" style="margin-top:8px">Review requests for required chapter events.</p><div id="requests">${requests.length?requests.map((r,i)=>`<div class="request"><b>${esc(r.name)}</b><div class="small muted">${esc(r.eventTitle||'Weekly chapter meeting')} · ${fmt(r.eventDate||'2026-09-07')}</div><p>${esc(r.reason)}</p><div class="row"><button class="primary" data-approve="${i}">Approve</button><button data-reject="${i}">Reject</button></div></div>`).join(''):'<p style="padding:30px 0;color:var(--green)">All caught up. No requests waiting for review.</p>'}</div><div class="dialogfooter"><button data-cancel>Done</button></div>`);document.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.onclick=()=>{let approved=b.hasAttribute('data-approve'),i=Number(approved?b.dataset.approve:b.dataset.reject);requests.splice(i,1);$('#modal').close();render();review();notify(approved?'Excuse approved.':'Excuse rejected.')})}
let present=new Set(['Alex Morgan','Sam Rivera','Chris Patel','Taylor Brooks','Jordan Lee','Liam Davis']);function recordAttendance(){openModal(`<h2 id="modalTitle">Record attendance</h2><p class="small muted" style="margin-top:8px">${esc(events.find(e=>e.id===selected).title)} · Sample of 6 members</p><form id="attForm">${['Alex Morgan','Sam Rivera','Chris Patel','Taylor Brooks','Jordan Lee','Liam Davis'].map(n=>`<label class="check"><input type="checkbox" name="present" value="${n}" ${present.has(n)?'checked':''}>${n}</label>`).join('')}<div class="dialogfooter"><button type="button" data-cancel>Cancel</button><button class="primary">Save attendance</button></div></form>`);$('#attForm').onsubmit=ev=>{ev.preventDefault();present=new Set(new FormData(ev.target).getAll('present'));attendance=present.size;attendanceByEvent[selected]=attendance;$('#modal').close();render();notify(`Attendance saved: ${attendance} of 6 present.`)}}
function requestExcuse(){openModal(`<h2 id="modalTitle">Request an excuse</h2><p class="small muted" style="margin-top:8px">${esc(events.find(e=>e.id===selected).title)} · Jordan Lee</p><form id="excForm"><label for="reason">Reason for missing this event</label><textarea id="reason" name="reason" required placeholder="Give the reviewing officer a little context…"></textarea><p class="small muted" style="margin-top:10px">Your request will be pending until another officer reviews it.</p><div class="dialogfooter"><button type="button" data-cancel>Cancel</button><button class="primary">Submit request</button></div></form>`);$('#excForm').onsubmit=ev=>{ev.preventDefault();let reason=new FormData(ev.target).get('reason').trim();if(!reason)return;requests.push({name:'Jordan Lee',reason,eventTitle:events.find(e=>e.id===selected).title,eventDate:events.find(e=>e.id===selected).date});$('#modal').close();render();notify('Excuse request submitted for review.')}}
$('#add').onclick=()=>composer();$('#prev').onclick=()=>{view==='agenda'?week--:monthOffset--;selected=null;render()};$('#next').onclick=()=>{view==='agenda'?week++:monthOffset++;selected=null;render()};$('#today').onclick=()=>{selected=null;resetView()};$('#agenda').onclick=()=>{if(view==='month'){week=Math.floor((new Date(2026,8+monthOffset,monthOffset===0?7:1,12)-date('2026-09-07'))/604800000)}view='agenda';render()};$('#month').onclick=()=>{view='month';monthOffset=date(addDays('2026-09-07',week*7)).getMonth()-8;render()};$('#search').oninput=e=>{query=e.target.value;render()};document.addEventListener('keydown',e=>{if(e.key==='Tab'&&innerWidth<=900&&selected&&!$('#modal').open){const els=[...$('#railinner').querySelectorAll('button,input,textarea,select')];const first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#railinner'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if(e.key==='Escape'&&!$('#modal').open&&selected){selected=null;render()}});render();
</script></body></html>
